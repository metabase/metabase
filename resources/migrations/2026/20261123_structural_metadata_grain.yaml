## The grain of a table: what one row is, as a noun, e.g. order line.

databaseChangeLog:
  - changeSet:
      id: wq326t
      author: metatyb
      comment: Add grain to metabase_table
      changes:
        - addColumn:
            tableName: metabase_table
            columns:
              - column:
                  name: grain
                  type: varchar(254)
                  remarks: "What one row of the table is, as a noun, e.g. order line"

  - changeSet:
      id: lheiut
      author: metatyb
      comment: Add grain to metabase_table_user_settings
      changes:
        - addColumn:
            tableName: metabase_table_user_settings
            columns:
              - column:
                  name: grain
                  type: varchar(254)
                  remarks: "User-set grain for the Table"

  - changeSet:
      id: 8l2tad
      author: metatyb
      comment: Add grain_set to metabase_table_user_settings
      changes:
        - addColumn:
            tableName: metabase_table_user_settings
            columns:
              - column:
                  name: grain_set
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: "Whether the user set grain, so a NULL grain overrides the sync value"
                  constraints:
                    nullable: false
