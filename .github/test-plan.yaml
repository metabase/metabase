# TEST PLAN SYNTAX
#  - overrides ALWAYS take precedence over workflow level settings
#  - IF workflow condition matches, THEN check job conditions
#  - default: `condition: all` for skip and run blocks
#    for example: a label `skip-all` AND this is a PR == this job is skipped
#  - optionally can specify `condition: any` in which case if any of label,
#    event, branch, or path matches skip/run will execute
#  - if run and skip both match, run ALWAYS takes precedence and the job/workflow will run
#  - force-skip ALWAYS takes precedence over run and skips the job or workflow
#  - a workflow condition can only hold jobs back, never compel one to run, so it
#    must be at least as wide as the widest job under it or it will mask one

overrides:
  # The global verdict from run-tests.yml's `should-run` job, in the same
  # order, since the order is the rule: force-run is checked before force-skip.
  - id: protected-branch
    reason: master and release branches test everything
    run:
      condition: any
      branch:
        - master
        - release-x.*

  - id: force-run-label
    reason: the ci:run-all label asks for everything
    run:
      labels:
        - ci:run-all

  - id: skip-label
    reason: the ci:skip label holds the whole run back
    skip:
      labels:
        - ci:skip

workflows:
  run-tests:
    jobs:
      should-run:
      create-test-plan:
        run:
          event:
            - pull_request
      upload-affected-tests-stats:
      uberjar:
        calls: uberjar
        run:
          condition: any
          paths:
            - backend_all
            - frontend_all
            - e2e_all
      containerize:
        calls: containerize-jar
        run:
          condition: any
          branch:
            - master
          labels:
            - build-docker-uberjar
      e2e-cljs:
        run:
          paths:
            - e2e_all
      static-viz-files-changed:
      backend-tests:
        calls: backend
      semantic-search-tests:
        calls: semantic-search
      app-db-tests:
        calls: app-db
      driver-tests:
        calls: drivers
      frontend-tests:
        calls: frontend
      loki-tests:
        calls: loki
      e2e-tests:
        calls: e2e-tests
      embedding-sdk-package:
        calls: embedding-sdk-package-build
      sdk-tests:
        calls: embedding-sdk
      build-scripts-tests:
        calls: build-scripts
      bundle-size:
        calls: bundle-size

  uberjar:
    jobs:
      setup:
      build:

  containerize-jar:
    jobs:
      containerize:
      verify-docker-pull-amd64:
        force-skip:
          event:
            - push
            - pull_request
            - workflow_dispatch
      verify-docker-pull-arm:
        force-skip:
          event:
            - push
            - pull_request
            - workflow_dispatch

  backend:
    run:
      condition: any
      paths:
        - backend_all
        - project_backend_checks
        - project_migration_checks
        - project_ratchet_checks
    jobs:
      project-checks:
        run:
          condition: any
          paths:
            - project_backend_checks
            - project_migration_checks
            - project_ratchet_checks
      project-tests:
        run:
          condition: any
          paths:
            - project_backend_checks
            - project_migration_checks
            - project_ratchet_checks
      be-linter-clj-kondo:
        run:
          paths:
            - backend_all
      be-linter-eastwood:
        run:
          paths:
            - backend_all
      be-linter-eastwood-test:
        run:
          condition: any
          branch:
            - master
            - release-x.*
          labels:
            - ci:run-all
      be-linter-eastwood-test-changed:
        run:
          paths:
            - backend_all
          event:
            - pull_request
      be-tests:
        run:
          paths:
            - backend_all
      be-check:
        run:
          paths:
            - backend_all
      be-cljfmt:
        run:
          paths:
            - backend_all
      be-tests-result:
        run:
          paths:
            - backend_all

  semantic-search:
    run:
      paths:
        - backend_all
    jobs:
      semantic-search-tests-h2:
        run:
          labels:
            - ci:run-semantic-search-tests
      semantic-search-tests-mariadb:
        run:
          labels:
            - ci:run-semantic-search-tests
      semantic-search-tests-mysql:
        run:
          labels:
            - ci:run-semantic-search-tests
      semantic-search-tests-postgres:
      semantic-search-tests-appdb-mode:
        run:
          labels:
            - ci:run-semantic-search-tests
      semantic-search-tests-result:

  app-db:
    run:
      paths:
        - backend_all
    jobs:
      app-db-matrix:
      be-tests-mariadb:
      be-tests-mysql:
      be-tests-postgres:
      app-db-tests-result:

  drivers:
    run:
      paths:
        - backend_all
    jobs:
      determine-driver-skips:
      be-tests-athena-ee:
      be-tests-bigquery-cloud-sdk-ee:
      be-tests-bigquery-transforms-python-ee:
      be-tests-clickhouse-ee:
      be-tests-druid-jdbc-ee:
      be-tests-databricks-ee:
      be-tests-h2:
      be-tests-h2-oss:
      be-tests-mysql-mariadb:
      be-tests-mongo:
      be-tests-mongo-ssl:
      be-tests-mongo-sharded-cluster-ee:
      be-tests-oracle:
      be-tests-postgres:
      be-tests-presto-jdbc-ee:
      be-tests-redshift-ee:
      be-tests-snowflake-ee:
      be-tests-sparksql-ee:
      be-tests-sqlite-ee:
      be-tests-sqlserver:
      login-to-ecr:
      be-tests-vertica-ee:
      drivers-tests-result:

  frontend:
    run:
      condition: any
      paths:
        - frontend_all
        - e2e_all
        - ci_scripts
        - custom_viz_all
    jobs:
      fe-lint:
        # The lint covers the e2e specs as well as the app.
        run:
          condition: any
          paths:
            - frontend_all
            - e2e_all
      fe-type-check:
        run:
          paths:
            - frontend_all
      fe-tests-unit:
        run:
          paths:
            - frontend_all
      fe-tests-timezones:
        run:
          paths:
            - frontend_all
      fe-tests-ci-scripts:
        run:
          paths:
            - ci_scripts
      fe-custom-viz:
        run:
          paths:
            - custom_viz_all
      fe-tests-result:
        run:
          paths:
            - frontend_all

  loki:
    run:
      paths:
        - frontend_loki_all
    jobs:
      story-selection:
      visual-test:
      loki-tests-result:

  e2e-tests:
    run:
      paths:
        - e2e_all
    jobs:
      e2e-matrix-builder:
        calls: e2e-matrix-builder
      reset-e2e-test-comment:
        run:
          event:
            - pull_request
      e2e-tests:
        calls: e2e-test
      collect-timings:
        run:
          branch:
            - master
      e2e-tests-result:

  e2e-matrix-builder:
    run:
      paths:
        - e2e_all
    jobs:
      build-matrix:

  e2e-test:
    run:
      paths:
        - e2e_all
    jobs:
      e2e-tests:

  embedding-sdk-package-build:
    run:
      condition: any
      paths:
        - embedding_sdk_components
        - frontend_sources
        - embedding_documentation
        - embedding_sdk_ci
        - embedding_sdk_host_sample_apps
    jobs:
      build-sdk-package:

  embedding-sdk:
    run:
      condition: any
      paths:
        - embedding_sdk_components
        - frontend_sources
        - embedding_documentation
        - embedding_sdk_host_sample_apps
    jobs:
      embedding-sdk-cli-snippets-type-check:
        run:
          paths:
            - frontend_sources
      embedding-sdk-docs-snippets-type-check:
        run:
          paths:
            - embedding_documentation
      embedding-sdk-api-documentation-generation-validation:
        run:
          paths:
            - frontend_sources
      embedding-sdk-component-tests:
        calls: embedding-sdk-component-tests
      not-required-embedding-sdk-apps-compatibility-tests:
        calls: embedding-sdk-host-sample-apps-tests
      embedding-sdk-tests-result:

  embedding-sdk-component-tests:
    run:
      paths:
        - embedding_sdk_components
    jobs:
      sdk-component-tests:
      decide-target-ref:
      sdk-component-tests-backward-compatibility:

  embedding-sdk-host-sample-apps-tests:
    run:
      paths:
        - embedding_sdk_host_sample_apps
    jobs:
      get-sample-apps-data:
      e2e-sample-apps-tests:
      e2e-shoppy-tests:
        # The shoppy suites only run against master.
        run:
          branch:
            - master
      e2e-shoppy-synthetic-tests:
        run:
          branch:
            - master
      e2e-host-apps-tests:

  build-scripts:
    jobs:
      test-embedder-plugin:
        run:
          paths:
            - embedder_plugin
      test-build-scripts:
        run:
          paths:
            - build_scripts

  bundle-size:
    run:
      paths:
        - frontend_sources
      event:
            - pull_request
    jobs:
      bundle-size-check:
