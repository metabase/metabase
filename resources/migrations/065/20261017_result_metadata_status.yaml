## Records, for each entity whose result columns MBQL cards read, the version of the entity its dependents were last
## re-derived from, so the dependencies module re-derives them when the entity changes, analogous to dependency_status.

databaseChangeLog:
  - changeSet:
      id: v65.upols4
      author: ranquild
      comment: Create result_metadata_status for re-deriving the result metadata of dependent cards
      changes:
        - createTable:
            tableName: result_metadata_status
            remarks: The version of each entity the MBQL cards depending on it were last re-derived from, analogous to dependency_status
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_type
                  type: varchar(254)
                  remarks: The type of the entity (card, measure, table)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: int
                  remarks: The ID of the entity
                  constraints:
                    nullable: false
              - column:
                  name: seen_updated_at
                  type: ${timestamp_type}
                  remarks: The latest updated_at of the entity and the rows it is made of when its dependents were re-derived, or null to re-derive them again
              - column:
                  name: seen_count
                  type: int
                  remarks: The number of rows the entity is made of when its dependents were re-derived
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last written, which guards recording a version over a row written again meanwhile
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: result_metadata_status

  - changeSet:
      id: v65.2n6p0h
      author: ranquild
      comment: Unique constraint to prevent duplicate result_metadata_status entries
      changes:
        - addUniqueConstraint:
            tableName: result_metadata_status
            columnNames: entity_type, entity_id
            constraintName: idx_unique_result_metadata_status
      rollback:
        - dropUniqueConstraint:
            tableName: result_metadata_status
            constraintName: idx_unique_result_metadata_status
