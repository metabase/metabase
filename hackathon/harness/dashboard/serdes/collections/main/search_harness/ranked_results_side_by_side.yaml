dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH r AS (
        SELECT coalesce(rank, 1) AS rank, engine,
               CASE WHEN rank IS NULL THEN '∅ no results'
                    ELSE CASE grade WHEN 2 THEN '✓✓ ' WHEN 1 THEN '✓ ' ELSE '' END
                         || coalesce(name, model || ' ' || entity_id) || '  ·'
                         -- n/a, not 0, when the engine reported no non-zero score for this question (in-place): BL-24
                         || CASE WHEN bool_or(score <> 0) OVER (PARTITION BY engine) THEN round(score::numeric, 2)::text ELSE 'n/a' END
               END AS result
        FROM harness_ranked_result
        WHERE corpus_id = {{corpus}} AND scenario_id = {{scenario}} AND (rank IS NULL OR rank <= 10)
          AND embedding_text = {{variant}}
          AND text_strategy = {{strategy}}
          [[AND (data_scale = {{scale}} OR data_scale IS NULL)]]
          [[AND embedder = {{embedder}}]]
      )
      SELECT rank AS "Rank",
             max(result) FILTER (WHERE engine = 'semantic') AS "semantic",
             max(result) FILTER (WHERE engine = 'semantic-pure') AS "semantic-pure",
             max(result) FILTER (WHERE engine = 'semantic-vector') AS "semantic-vector",
             max(result) FILTER (WHERE engine = 'sqlite-vec1') AS "sqlite-vec1",
             max(result) FILTER (WHERE engine = 'sqlite-vec1-pure') AS "sqlite-vec1-pure",
             max(result) FILTER (WHERE engine = 'lucene') AS "lucene",
             max(result) FILTER (WHERE engine = 'lucene-pure') AS "lucene-pure",
             max(result) FILTER (WHERE engine = 'appdb') AS "appdb",
             max(result) FILTER (WHERE engine = 'in-place') AS "in-place"
      FROM r
      GROUP BY 1
      ORDER BY 1
    template-tags:
    - default: baseline
      display-name: Embedding text
