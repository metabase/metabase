name: Containerize Uberjar
run-name: Containerize ${{ inputs.edition }} ${{ inputs.tag }} Uberjar

on:
  workflow_call:
    inputs:
      edition:
        description: Metabase edition (ee or oss)
        type: string
        required: true
      repo:
        description: Docker owner and repo, e.g. "metabase/metabase".
        type: string
      tag:
        description: Docker tag, e.g. v1.87.2.
        type: string
      commit:
        type: string
      release:
        type: boolean
        default: false
      build-args:
        type: string
  workflow_dispatch:
    inputs:
      edition:
        description: Metabase edition (ee or oss)
        type: choice
        options:
          - ee
          - oss
        required: true
      repo:
        description: Docker owner and repo, e.g. "metabase/metabase".
        type: string
      tag:
        description: Docker tag, e.g. v1.87.2.
        type: string
      commit:
        description: the full commit hash
        type: string
      release:
        description: Whether this is a release artifact (uses metabase-release- prefix)
        type: boolean
        default: false

jobs:
  containerize:
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    outputs:
      platforms: ${{ steps.platforms.outputs.result }}
      repo: ${{ steps.image.outputs.repo }}
      tag: ${{ steps.image.outputs.tag }}
      full_image: ${{ steps.image.outputs.full_image }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
      # we want the dockerfile from the commit we're building
    - run: |
        git fetch --depth=1 origin ${{ inputs.commit }}
        git checkout ${{ inputs.commit }} -- bin/docker
    - name: Retrieve uberjar artifact
      uses: ./.github/actions/fetch-artifact
      with:
        commit: ${{ inputs.commit }}
        edition: ${{ inputs.edition }}
        release: ${{ inputs.release }}
    - name: Prepare release scripts
      uses: ./.github/actions/prepare-release-scripts
    # Release callers pass repo/tag explicitly; everyone else gets the branch-derived pair.
    - name: Get Docker Info
      id: docker-info
      if: ${{ !inputs.repo || !inputs.tag }}
      uses: ./.github/actions/get-docker-info
      with:
        edition: ${{ inputs.edition }}
    - name: Resolve image name
      id: image
      env:
        REPO: ${{ inputs.repo || steps.docker-info.outputs.repo }}
        TAG: ${{ inputs.tag || steps.docker-info.outputs.tag }}
      run: | # bash
        if [ -z "$REPO" ] || [ -z "$TAG" ]; then
          echo "Could not resolve a docker repo/tag (repo='$REPO' tag='$TAG')"
          exit 1
        fi
        {
          echo "repo=$REPO"
          echo "tag=$TAG"
          echo "full_image=$REPO:$TAG"
        } >> "$GITHUB_OUTPUT"
    - name: Get platforms
      id: platforms
      uses: actions/github-script@v9
      with:
        result-encoding: string
        script: | # js
          const { getBuildRequirements, isValidVersionString} = require('${{ github.workspace }}/release/dist/index.cjs');
          const version = "${{ steps.image.outputs.tag }}".split('-')[0];

          if (!isValidVersionString(version)) {
            return "linux/amd64,linux/arm64";
          }
          // versions before 53 need to be handled differently
          const buildInfo = getBuildRequirements(version);
          return buildInfo.platforms;
    - name: Move the Uberjar to the context dir
      run: mv ./metabase.jar bin/docker/.
    - name: Login to Docker Hub
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        username: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_USERNAME || secrets.DOCKERHUB_USERNAME }}
        password: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_TOKEN || secrets.DOCKERHUB_TOKEN }}
    - name: Set up QEMU
      if: contains(steps.platforms.outputs.result, 'arm')
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
    - name: Set up Docker Buildx
      if: contains(steps.platforms.outputs.result, 'arm')
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
    - name: Build multi-arch container
      if: contains(steps.platforms.outputs.result, 'arm')
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: bin/docker/.
        platforms: ${{ steps.platforms.outputs.result }}
        network: host
        tags: ${{ steps.image.outputs.full_image }}
        no-cache: true
        push: true
        build-args: ${{ inputs.build-args }}

    # we need to do this to get the nice fallback behavior of the legacy manifest file
    - name: Build container (x86 only)
      if: contains(steps.platforms.outputs.result, 'arm') == false
      env:
        BUILD_ARGS: ${{ inputs.build-args }}
        FULL_IMAGE: ${{ steps.image.outputs.full_image }}
      run: | # bash
        args=()
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--build-arg "$line")
        done <<< "$BUILD_ARGS"

        docker build \
          -t "$FULL_IMAGE" \
          "${args[@]}" \
          --network=host \
          --push \
          bin/docker/.

  verify-docker-pull:
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    needs: containerize
    timeout-minutes: 15
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        username: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_USERNAME || secrets.DOCKERHUB_USERNAME }}
        password: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_TOKEN || secrets.DOCKERHUB_TOKEN }}
    - name: Pull the container image
      run: docker pull ${{ needs.containerize.outputs.full_image }}
    - name: Launch container
      run: docker run --rm -dp 3000:3000 ${{ needs.containerize.outputs.full_image }}
      timeout-minutes: 5
    - name: Wait for Metabase to start
      run: while ! curl -s 'http://localhost:3000/api/health' | grep '{"status":"ok"}'; do sleep 1; done
      timeout-minutes: 5

  verify-docker-pull-arm:
    runs-on: arm-ubuntu-24-2core
    needs: containerize
    if: contains(needs.containerize.outputs.platforms, 'linux/arm64')
    timeout-minutes: 15
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        username: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_USERNAME || secrets.DOCKERHUB_USERNAME }}
        password: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_TOKEN || secrets.DOCKERHUB_TOKEN }}
    - name: Pull the container image
      run: docker pull ${{ needs.containerize.outputs.full_image }}
    - name: Launch container
      run: docker run --rm -dp 3000:3000 ${{ needs.containerize.outputs.full_image }}
      timeout-minutes: 5
    - name: Wait for Metabase to start
      run: while ! curl -s 'http://localhost:3000/api/health' | grep '{"status":"ok"}'; do sleep 1; done
      timeout-minutes: 5

  post-docker-info-comment:
    needs: [containerize, verify-docker-pull, verify-docker-pull-arm]
    # Only post a comment if all the steps pass and this is a PR.
    if: |
      !cancelled() &&
      !failure() &&
      !inputs.release &&
      github.event_name == 'pull_request'
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    name: Post PR comment
    steps:
    - name: Post PR comment
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
      with:
        header: docker-build-status-${{ inputs.edition }}
        message: |
          ✅ Docker build completed for commit ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}

          The uberjar has been built and containerized successfully.

          **Branch:** `${{ github.head_ref || github.ref_name }}`
          **Docker Image:** `${{ needs.containerize.outputs.full_image }}`
          **Docker Hub:** [View on Docker Hub](https://hub.docker.com/r/${{ needs.containerize.outputs.repo }}/tags?name=${{ needs.containerize.outputs.tag }})
          **Triggered by:** @${{ github.actor }}

          Pull the image:
          ```bash
          docker pull ${{ needs.containerize.outputs.full_image }}
          ```
