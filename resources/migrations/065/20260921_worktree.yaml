  - changeSet:
      id: v65.2026-09-22T10:26:00
      author: ranquild
      comment: Drop the global unique constraint on entity_id everywhere a worktree checks content out - each is replaced by a per-worktree one below. The constraints were declared inline, so postgres and mysql named them after the table and the column while h2 picked a name of its own that has to be looked up
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE collection DROP CONSTRAINT collection_entity_id_key;
              ALTER TABLE report_card DROP CONSTRAINT report_card_entity_id_key;
              ALTER TABLE report_dashboard DROP CONSTRAINT report_dashboard_entity_id_key;
              ALTER TABLE report_dashboardcard DROP CONSTRAINT report_dashboardcard_entity_id_key;
              ALTER TABLE dashboard_tab DROP CONSTRAINT dashboard_tab_entity_id_key;
              ALTER TABLE document DROP CONSTRAINT document_entity_id_key;
              ALTER TABLE timeline DROP CONSTRAINT timeline_entity_id_key;
              ALTER TABLE native_query_snippet DROP CONSTRAINT native_query_snippet_entity_id_key;
              ALTER TABLE measure DROP CONSTRAINT measure_entity_id_key;
              ALTER TABLE segment DROP CONSTRAINT segment_entity_id_key;
              ALTER TABLE dimension DROP CONSTRAINT dimension_entity_id_key;
              ALTER TABLE glossary DROP CONSTRAINT uq_glossary_entity_id;
              ALTER TABLE transform DROP CONSTRAINT transform_entity_id_key;
              ALTER TABLE transform_tag DROP CONSTRAINT transform_tag_entity_id_key;
              ALTER TABLE transform_transform_tag DROP CONSTRAINT transform_transform_tag_entity_id_key;
              ALTER TABLE transform_test DROP CONSTRAINT transform_test_entity_id_key;
              ALTER TABLE python_library DROP CONSTRAINT unique_python_library_entity_id;
        - sql:
            dbms: mysql,mariadb
            splitStatements: true
            sql: |
              ALTER TABLE collection DROP INDEX entity_id;
              ALTER TABLE report_card DROP INDEX entity_id;
              ALTER TABLE report_dashboard DROP INDEX entity_id;
              ALTER TABLE report_dashboardcard DROP INDEX entity_id;
              ALTER TABLE dashboard_tab DROP INDEX entity_id;
              ALTER TABLE document DROP INDEX entity_id;
              ALTER TABLE timeline DROP INDEX entity_id;
              ALTER TABLE native_query_snippet DROP INDEX entity_id;
              ALTER TABLE measure DROP INDEX entity_id;
              ALTER TABLE segment DROP INDEX entity_id;
              ALTER TABLE dimension DROP INDEX entity_id;
              ALTER TABLE glossary DROP INDEX uq_glossary_entity_id;
              ALTER TABLE transform DROP INDEX entity_id;
              ALTER TABLE transform_tag DROP INDEX entity_id;
              ALTER TABLE transform_transform_tag DROP INDEX entity_id;
              ALTER TABLE transform_test DROP INDEX entity_id;
              ALTER TABLE python_library DROP INDEX unique_python_library_entity_id;
        - sql:
            dbms: h2
            splitStatements: true
            sql: |
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE COLLECTION DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
                  ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND kcu.TABLE_NAME = tc.TABLE_NAME
                WHERE tc.TABLE_NAME = 'COLLECTION'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'ENTITY_ID'
              );
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE REPORT_CARD DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
                  ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND kcu.TABLE_NAME = tc.TABLE_NAME
                WHERE tc.TABLE_NAME = 'REPORT_CARD'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'ENTITY_ID'
              );
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE REPORT_DASHBOARD DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
                  ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND kcu.TABLE_NAME = tc.TABLE_NAME
                WHERE tc.TABLE_NAME = 'REPORT_DASHBOARD'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'ENTITY_ID'
              );
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE REPORT_DASHBOARDCARD DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
                  ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND kcu.TABLE_NAME = tc.TABLE_NAME
                WHERE tc.TABLE_NAME = 'REPORT_DASHBOARDCARD'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'ENTITY_ID'
              );
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE DASHBOARD_TAB DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
                  ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND kcu.TABLE_NAME = tc.TABLE_NAME
                WHERE tc.TABLE_NAME = 'DASHBOARD_TAB'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'ENTITY_ID'
              );
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE DOCUMENT DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
                  ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND kcu.TABLE_NAME = tc.TABLE_NAME
                WHERE tc.TABLE_NAME = 'DOCUMENT'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'ENTITY_ID'
              );
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE TIMELINE DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
                  ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND kcu.TABLE_NAME = tc.TABLE_NAME
                WHERE tc.TABLE_NAME = 'TIMELINE'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'ENTITY_ID'
              );
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE NATIVE_QUERY_SNIPPET DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
                  ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND kcu.TABLE_NAME = tc.TABLE_NAME
                WHERE tc.TABLE_NAME = 'NATIVE_QUERY_SNIPPET'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'ENTITY_ID'
              );
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE MEASURE DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
                  ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND kcu.TABLE_NAME = tc.TABLE_NAME
                WHERE tc.TABLE_NAME = 'MEASURE'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'ENTITY_ID'
              );
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE SEGMENT DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
