name: Loki Visual Regression Testing

on:
  workflow_call:
    inputs:
      skip:
        type: boolean
        default: false
      story-files:
        description: "JSON array of story files to run, '' to run the full suite."
        type: string
        default: ""

jobs:
  visual-test:
    if: ${{ !inputs.skip && inputs.story-files != '[]' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    services:
      docker:
        image: docker:19.03.12
        options: --privileged
        ports:
          - 2376:2376
        env:
          DOCKER_TLS_CERTDIR: /certs
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /tmp/docker-certs:/certs/client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare frontend environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        run: NODE_ENV=development bun run build-pure:cljs

      - name: Build Storybook
        env:
          STORYBOOK_STORY_PATHS_FILE: ${{ inputs.story-files && 'loki-story-files.json' || '' }}
        run: |
          cat > loki-story-files.json <<'EOF'
          ${{ inputs.story-files }}
          EOF
          bun run build-storybook

      - name: Run Loki Visual Tests
        # All selected stories can have parameters.loki.skip set.
        run: bun run test-visual:loki --reactUri file:./storybook-static --verboseRenderer ${{ inputs.story-files && '--passWithNoStories' || '' }}

      - name: Generate Visual Report on Failure
        if: failure()
        run: bun run test-visual:loki-report

      - name: Upload Artifact
        id: artifact-upload-step
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: loki-report
          include-hidden-files: true
          path: .loki/
          if-no-files-found: ignore
