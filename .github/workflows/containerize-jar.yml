name: Containerize Uberjar
run-name: Containerize ${{ inputs.edition }} ${{ inputs.tag }} Uberjar

on:
  workflow_call:
    inputs:
      edition:
        type: string
        default: ee
      artifact-name:
        type: string
      repo:
        description: Docker owner and repo, e.g. "metabase/metabase".
        type: string
      tag:
        description: Docker tag, e.g. v1.87.2.
        type: string
      commit:
        type: string
      release:
        type: string
        default: 'true'
      build-args:
        type: string
  workflow_dispatch:
    inputs:
      edition:
        type: string
        default: ee
      artifact-name:
        description: usually something like "metabase-release-{{ edition }}-{{ hash }}-uberjar"
        type: string
      repo:
        description: Docker owner and repo, e.g. "metabase/metabase".
        type: string
      tag:
        description: Docker tag, e.g. v1.87.2.
        type: string
      commit:
        description: the full commit hash
        type: string

jobs:
  containerize:
    name: containerize (${{ inputs.edition }})
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    outputs:
      platforms: ${{ steps.platforms.outputs.result }}
      repo: ${{ steps.image.outputs.repo }}
      tag: ${{ steps.image.outputs.tag }}
      full_image: ${{ steps.image.outputs.full_image }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
      # we want the dockerfile from the commit we're building
    - run: git checkout ${{ inputs.commit }} -- bin/docker
    - name: Retrieve test build uberjar artifact
      uses: ./.github/actions/fetch-artifact
      with:
        name: ${{ inputs.artifact-name }}
    - name: Prepare build scripts
      run: cd ${{ github.workspace }}/release && yarn && yarn build
    - name: Resolve image repo and tag
      id: image
      uses: ./.github/actions/get-docker-info
      with:
        repo: ${{ inputs.repo }}
        tag: ${{ inputs.tag }}
        edition: ${{ inputs.edition }}
    - name: Get platforms
      id: platforms
      uses: actions/github-script@v7
      with:
        result-encoding: string
        script: | # js
          const { getBuildRequirements, isValidVersionString} = require('${{ github.workspace }}/release/dist/index.cjs');
          const version = "${{ steps.image.outputs.tag }}".split('-')[0];

          if (!isValidVersionString(version)) {
            return "linux/amd64,linux/arm64";
          }
          // versions before 53 need to be handled differently
          const buildInfo = getBuildRequirements(version);
          return buildInfo.platforms;
    - name: Move the Uberjar to the context dir
      run: mv ./metabase.jar bin/docker/.
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.release == 'true' && secrets.DOCKERHUB_RELEASE_USERNAME || secrets.DOCKERHUB_USERNAME }}
        password: ${{ inputs.release == 'true' && secrets.DOCKERHUB_RELEASE_TOKEN || secrets.DOCKERHUB_TOKEN }}
    - name: Set up QEMU
      if: contains(steps.platforms.outputs.result, 'arm')
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      if: contains(steps.platforms.outputs.result, 'arm')
      uses: docker/setup-buildx-action@v3
    - name: Build multi-arch container
      if: contains(steps.platforms.outputs.result, 'arm')
      uses: docker/build-push-action@v6
      with:
        context: bin/docker/.
        platforms: ${{ steps.platforms.outputs.result }}
        network: host
        tags: ${{ steps.image.outputs.full_image }}
        no-cache: true
        push: true
        build-args: ${{ inputs.build-args }}

    # we need to do this to get the nice fallback behavior of the legacy manifest file
    - name: Build container (x86 only)
      if: contains(steps.platforms.outputs.result, 'arm') == false
      env:
        BUILD_ARGS: ${{ inputs.build-args }}
        FULL_IMAGE: ${{ steps.image.outputs.full_image }}
      run: | # bash
        args=()
        while IFS= read -r line; do
          [ -n "$line" ] && args+=(--build-arg "$line")
        done <<< "$BUILD_ARGS"

        docker build \
          -t "$FULL_IMAGE" \
          "${args[@]}" \
          --network=host \
          --push \
          bin/docker/.

  verify-docker-pull:
    needs: containerize
    name: verify-docker-pull (${{ inputs.edition }})
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.release == 'true' && secrets.DOCKERHUB_RELEASE_USERNAME || secrets.DOCKERHUB_USERNAME }}
        password: ${{ inputs.release == 'true' && secrets.DOCKERHUB_RELEASE_TOKEN || secrets.DOCKERHUB_TOKEN }}
    - name: Pull the container image
      run: docker pull ${{ needs.containerize.outputs.full_image }}
    - name: Launch container
      run: docker run --rm -dp 3000:3000 ${{ needs.containerize.outputs.full_image }}
      timeout-minutes: 5
    - name: Wait for Metabase to start
      run: while ! curl -s 'http://localhost:3000/api/health' | grep '{"status":"ok"}'; do sleep 1; done
      timeout-minutes: 5

  verify-docker-pull-arm:
    needs: containerize
    if: contains(needs.containerize.outputs.platforms, 'linux/arm64')
    name: verify-docker-pull-arm (${{ inputs.edition }})
    runs-on: arm-ubuntu-24-2core
    timeout-minutes: 15
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.release == 'true' && secrets.DOCKERHUB_RELEASE_USERNAME || secrets.DOCKERHUB_USERNAME }}
        password: ${{ inputs.release == 'true' && secrets.DOCKERHUB_RELEASE_TOKEN || secrets.DOCKERHUB_TOKEN }}
    - name: Pull the container image
      run: docker pull ${{ needs.containerize.outputs.full_image }}
    - name: Launch container
      run: docker run --rm -dp 3000:3000 ${{ needs.containerize.outputs.full_image }}
      timeout-minutes: 5
    - name: Wait for Metabase to start
      run: while ! curl -s 'http://localhost:3000/api/health' | grep '{"status":"ok"}'; do sleep 1; done
      timeout-minutes: 5

  post-docker-info-comment:
    needs: [containerize, verify-docker-pull, verify-docker-pull-arm]
    if: |
      !cancelled() &&
      !failure() &&
      inputs.release != 'true' &&
      github.event_name == 'pull_request'
    name: post-docker-info-comment (${{ inputs.edition }})
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
    - name: Post PR comment
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0
      with:
        header: docker-build-status-${{ inputs.edition }}
        message: |
          ✅ Docker build completed for commit ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}

          The uberjar has been built and containerized successfully.

          **Branch:** `${{ github.head_ref || github.ref_name }}`
          **Docker Image:** `${{ needs.containerize.outputs.full_image }}`
          **Docker Hub:** [View on Docker Hub](https://hub.docker.com/r/${{ needs.containerize.outputs.repo }}/tags?name=${{ needs.containerize.outputs.tag }})
          **Triggered by:** @${{ github.actor }}

          Pull the image:
          ```bash
          docker pull ${{ needs.containerize.outputs.full_image }}
          ```
