## Ingestion support for python transforms: `secrets` holds an encrypted JSON map of env vars
## (e.g. API tokens) injected into the python runner subprocess; the resume point a run leaves
## behind lives in `incremental_state`, shared with the checkpoint watermark.

databaseChangeLog:
  - changeSet:
      id: v64.2026-07-24T10:00:00
      author: bronsa
      comment: Add transform.secrets
      changes:
        - addColumn:
            tableName: transform
            columns:
              - column:
                  name: secrets
                  type: ${text.type}
                  remarks: Encrypted JSON map of secret env vars passed to python transform runs
                  constraints:
                    nullable: true

  ## A transform resumes from either a checkpoint watermark or the state its own code returned,
  ## never both, so the two share one column.
  - changeSet:
      id: v64.2026-07-30T10:00:00
      author: bronsa
      comment: Rename transform.last_checkpoint_value to transform.incremental_state
      changes:
        - renameColumn:
            tableName: transform
            oldColumnName: last_checkpoint_value
            newColumnName: incremental_state
            columnDataType: ${text.type}

  - changeSet:
      id: v64.2026-07-30T10:00:01
      author: bronsa
      comment: Describe what transform.incremental_state now holds
      changes:
        - setColumnRemarks:
            tableName: transform
            columnName: incremental_state
            remarks: Where the last run left off; a checkpoint watermark, or opaque JSON state returned by the transform's own code
      ## setColumnRemarks has no automatic rollback
      rollback:
        - setColumnRemarks:
            tableName: transform
            columnName: incremental_state
            remarks: Serialized checkpoint watermark value for incremental transforms, temporal as ISO8601
