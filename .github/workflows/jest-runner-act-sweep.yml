name: Jest runner act warning sweep

on:
  push:
    branches:
      - jest-runner-act-sweep

jobs:
  sweep:
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [2]
        copy: [1]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - name: Build cljs
        run: bun run build-pure:cljs
      - name: Run the beforeunload spec alone
        run: |
          F=frontend/src/metabase/query_builder/containers/QueryBuilder.beforeunload-events.unit.spec.tsx
          for i in 1 2 3 4 5; do
            node_modules/.bin/jest $F --ignoreProjects ci-scripts --silent --runner ./frontend/test/harness/jest-runner.ts > run-$i.log 2>&1 || true
            echo "ALONE run $i: $(grep -E '^Tests:' run-$i.log)"
          done
          echo "JEST: $(node_modules/.bin/jest $F --ignoreProjects ci-scripts --silent 2>&1 | grep -E '^Tests:')"
          grep -c "^===" act-stacks.txt || true
          grep "^===" act-stacks.txt | sort | uniq -c || true
          awk '/^===/{n++} n<=2' act-stacks.txt | sed 's|.*/node_modules/[^ ]*/node_modules/||' | head -140 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sweep-${{ matrix.shard }}-${{ matrix.copy }}
          path: |
            run-*.log
            act-stacks.txt
            node_modules/.cache/test-harness/last-run
