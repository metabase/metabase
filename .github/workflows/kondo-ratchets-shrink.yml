name: Kondo Ratchets Shrink

on:
  push:
    branches: [master]
    paths:
      - "**.clj"
      - "**.cljc"
      - "**.cljs"
      - ".clj-kondo/**"
      - "bb.edn"

permissions:
  contents: write

concurrency:
  group: kondo-ratchets-shrink
  cancel-in-progress: true

jobs:
  shrink:
    name: Shrink ratchets
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java for cold dependency resolution
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Shrink ignore limits
        run: ./bin/mage fix-kondo-ratchets
      - name: Commit lowered limits
        run: |
          for attempt in 1 2 3; do
            if git diff --quiet -- .clj-kondo/ratchets.edn; then
              echo "Ratchets are already tight"
              exit 0
            fi

            git config user.name "Metabase Automation"
            git config user.email "github-automation@metabase.com"
            git add .clj-kondo/ratchets.edn
            git commit -m "Shrink Kondo ratchet limits"

            if git push origin HEAD:master; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Could not update master after three attempts" >&2
              exit 1
            fi

            git fetch origin master
            git reset --hard origin/master
            ./bin/mage fix-kondo-ratchets
          done
