## The dependency jobs find changed entities by comparing the latest updated_at of an entity, its parts and what it
## depends on with the version its status row last recorded, instead of reading stale flags that every write had to
## set. The status rows lose the flag and the retry state, and the rows an entity's version is made of get the
## timestamps they lacked. result_metadata_status records the version each MBQL card's result metadata was last
## re-derived from, analogous to dependency_status.

databaseChangeLog:
  - changeSet:
      id: v65.k4w2ns
      author: ranquild
      comment: Delete the dependency_status rows marked stale, since an entity without a row is processed again
      changes:
        - delete:
            tableName: dependency_status
            where: stale = TRUE
      rollback: # the deleted rows are recreated when the job processes their entities

  - changeSet:
      id: v65.nuaq4b
      author: ranquild
      comment: Drop the index on dependency_status.stale, which the jobs no longer read
      changes:
        - dropIndex:
            tableName: dependency_status
            indexName: idx_dependency_status_stale
      rollback:
        - sql:
            dbms: postgresql
            sql: CREATE INDEX idx_dependency_status_stale ON dependency_status(stale) WHERE stale = true
        - sql:
            dbms: mysql,mariadb,h2
            sql: CREATE INDEX idx_dependency_status_stale ON dependency_status(stale)

  - changeSet:
      id: v65.dngxhg
      author: ranquild
      comment: Drop dependency_status.stale, which change detection from updated_at replaces
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: stale
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: stale
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity needs dependency recalculation
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.brqkb7
      author: ranquild
      comment: Drop dependency_status.fail_count, which the jobs no longer use since they don't retry
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: fail_count
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: fail_count
                  type: int
                  defaultValueNumeric: 0
                  remarks: Number of consecutive failed dependency calculation attempts
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.drkztr
      author: ranquild
      comment: Drop dependency_status.next_retry_at, which the jobs no longer use since they don't retry
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: next_retry_at
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: next_retry_at
                  type: ${timestamp_type}
                  remarks: Earliest time at which a failed entity can be retried (null means immediately processable)

  - changeSet:
      id: v65.mhlfsd
      author: ranquild
      comment: Drop dependency_status.terminal, which the jobs no longer use since they don't retry
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: terminal
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: terminal
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity has exceeded max retries and should not be retried until modified
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.3xftdb
      author: ranquild
      comment: Add dependency_status.analyzed_updated_at
      changes:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: analyzed_updated_at
                  type: ${timestamp_type}
                  remarks: The latest updated_at of the entity, its parts and what it inlines when its dependencies were computed, or null to compute them again
      rollback:
        - dropColumn:
            tableName: dependency_status
            columnName: analyzed_updated_at

  - changeSet:
      id: v65.w7k2pd
      author: ranquild
      comment: Record the time of the upgrade as the version the remaining dependency_status rows were computed from
      changes:
        - update:
            tableName: dependency_status
            columns:
              - column:
                  name: analyzed_updated_at
                  valueComputed: current_timestamp
      rollback: # the column is dropped by the rollback of the changeset adding it

  - changeSet:
      id: v65.mlaukk
      author: ranquild
      comment: Add dashboardcard_series.created_at
      changes:
        - addColumn:
            tableName: dashboardcard_series
            columns:
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: dashboardcard_series
            columnName: created_at

  - changeSet:
      id: v65.0e9f98
      author: ranquild
      comment: Add dashboardcard_series.updated_at
      changes:
        - addColumn:
            tableName: dashboardcard_series
            columns:
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last updated
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: dashboardcard_series
            columnName: updated_at

  - changeSet:
      id: v65.9ri9ot
      author: ranquild
      comment: Add query_action.created_at
      changes:
        - addColumn:
            tableName: query_action
            columns:
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: query_action
            columnName: created_at

  - changeSet:
      id: v65.cqbc46
      author: ranquild
      comment: Add query_action.updated_at
      changes:
        - addColumn:
            tableName: query_action
            columns:
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last updated
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: query_action
            columnName: updated_at

  - changeSet:
      id: v65.eqlbau
      author: ranquild
      comment: Add sandboxes.created_at
      changes:
        - addColumn:
            tableName: sandboxes
            columns:
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: sandboxes
            columnName: created_at

  - changeSet:
      id: v65.kz5g0p
      author: ranquild
      comment: Add sandboxes.updated_at
      changes:
        - addColumn:
            tableName: sandboxes
            columns:
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last updated
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: sandboxes
            columnName: updated_at

  - changeSet:
      id: v65.dd3wgm
      author: ranquild
      comment: Add analysis_finding.analyzed_updated_at
      changes:
        - addColumn:
            tableName: analysis_finding
            columns:
              - column:
                  name: analyzed_updated_at
                  type: ${timestamp_type}
                  remarks: The latest updated_at of the entity, its parts, the snippets it uses and the entities it depends on when it was analyzed, or null to analyze it again
      rollback:
        - dropColumn:
            tableName: analysis_finding
            columnName: analyzed_updated_at

  - changeSet:
      id: v65.r8c3yq
      author: ranquild
      comment: Record the analyzed_at of the findings not marked stale as the version they were analyzed from
      changes:
        - update:
            tableName: analysis_finding
            columns:
              - column:
                  name: analyzed_updated_at
                  valueComputed: analyzed_at
            where: stale = FALSE
      rollback: # the column is dropped by the rollback of the changeset adding it

  - changeSet:
      id: v65.1suf0c
      author: ranquild
      comment: Drop the index on analysis_finding.stale, which the jobs no longer read
      changes:
        - dropIndex:
            tableName: analysis_finding
            indexName: idx_analysis_finding_stale
      rollback:
        - sql:
            dbms: postgresql
            sql: CREATE INDEX idx_analysis_finding_stale ON analysis_finding(stale) WHERE stale = true
        - sql:
            dbms: mysql,mariadb,h2
            sql: CREATE INDEX idx_analysis_finding_stale ON analysis_finding(stale)

  - changeSet:
      id: v65.d291qd
      author: ranquild
      comment: Drop analysis_finding.stale, which change detection from updated_at replaces
      changes:
        - dropColumn:
            tableName: analysis_finding
            columnName: stale
      rollback:
        - addColumn:
            tableName: analysis_finding
            columns:
              - column:
                  name: stale
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity needs re-analysis due to upstream changes
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.upols4
      author: ranquild
      comment: Create result_metadata_status for re-deriving the result metadata of MBQL cards
      changes:
        - createTable:
            tableName: result_metadata_status
            remarks: The version each MBQL card's result metadata was last re-derived from, analogous to dependency_status
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_type
                  type: varchar(254)
                  remarks: The type of the entity (card)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: int
                  remarks: The ID of the entity
                  constraints:
                    nullable: false
              - column:
                  name: analyzed_updated_at
                  type: ${timestamp_type}
                  remarks: The latest updated_at of the card, its parts, what it inlines and the entities it depends on when its result metadata was re-derived
      rollback:
        - dropTable:
            tableName: result_metadata_status

  - changeSet:
      id: v65.2n6p0h
      author: ranquild
      comment: Unique constraint to prevent duplicate result_metadata_status entries
      changes:
        - addUniqueConstraint:
            tableName: result_metadata_status
            columnNames: entity_type, entity_id
            constraintName: idx_unique_result_metadata_status
      rollback:
        - dropUniqueConstraint:
            tableName: result_metadata_status
            constraintName: idx_unique_result_metadata_status

  - changeSet:
      id: v65.f9t2xq
      author: ranquild
      comment: Index metabase_field by table_id and updated_at, so the latest updated_at of the fields of a table is read from the index
      changes:
        - createIndex:
            tableName: metabase_field
            indexName: idx_field_table_id_updated_at
            columns:
              - column:
                  name: table_id
              - column:
                  name: updated_at
      rollback:
        - dropIndex:
            tableName: metabase_field
            indexName: idx_field_table_id_updated_at

  - changeSet:
      id: v65.u3r8zm
      author: ranquild
      comment: Drop dependency_status.unresolved_tables, since a table a native query names is recorded once the query changes again
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: unresolved_tables
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: unresolved_tables
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity names tables that match no synced table, recomputed after each sync
                  constraints:
                    nullable: false
