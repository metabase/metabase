      id: wtw12rn
      author: ranquild
      comment: Give the unique personal collection owner key the name the next changeset drops, on the app DBs that ran a 2018 development build, whose Liquibase ignored its name and left the name PostgreSQL generates
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: >-
              SELECT COUNT(*) FROM pg_constraint
              WHERE conrelid = 'collection'::regclass AND conname = 'collection_personal_owner_id_key'
      changes:
        - sql:
            sql: ALTER TABLE collection RENAME CONSTRAINT collection_personal_owner_id_key TO unique_collection_personal_owner_id;
      rollback:
