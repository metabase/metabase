dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH lat AS (
        SELECT run_id, engine, percentile_cont(0.5) WITHIN GROUP (ORDER BY latency_ms) AS p50
        FROM harness_query_result
        WHERE scenario_id = {{scenario}} AND error IS NULL
          AND (run_id, engine) IN (SELECT run_id, engine FROM harness_latest_engine_run WHERE corpus_id = {{corpus}})
        GROUP BY 1, 2
      )
      SELECT m.engine AS "Engine",
             round(max(m.value) FILTER (WHERE m.metric = 'ndcg@10')::numeric, 3) AS "nDCG@10",
             round(max(m.value) FILTER (WHERE m.metric = 'recall@10')::numeric, 3) AS "Recall@10",
             round(max(m.value) FILTER (WHERE m.metric = 'mrr')::numeric, 3) AS "MRR",
             max(m.value) FILTER (WHERE m.metric = 'false_positive_rate') AS "Returned on a no-answer query",
             round(max(lat.p50)::numeric, 1) AS "p50 ms"
      FROM harness_scenario_metric m
      LEFT JOIN lat ON lat.run_id = m.run_id AND lat.engine = m.engine
      WHERE m.corpus_id = {{corpus}} AND m.scenario_id = {{scenario}}
        AND m.embedding_text = {{variant}}
        AND m.text_strategy = {{strategy}}
        [[AND (m.data_scale = {{scale}} OR m.data_scale IS NULL)]]
        [[AND m.embedder = {{embedder}}]]
      GROUP BY m.engine
      ORDER BY 2 DESC NULLS LAST
    template-tags:
    - default: baseline
      display-name: Embedding text
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000005
      name: variant
      required: true
