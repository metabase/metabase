name: Reusable - Update Documentation

# This workflow is designed to be called by other workflows.
on:
  workflow_call:
    inputs:
      target_branch:
        description: "The branch to check out and create a PR against"
        required: true
        type: string
    secrets:
      automation_token:
        description: "A token with permissions to create branches and PRs"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update documentation for ${{ inputs.target_branch }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.automation_token }}
          ref: ${{ inputs.target_branch }}

      # Run mage from this workflow's ref (master), so target branches don't need each change to it.
      # Only `docs/` gets committed, so this checkout stays out of the PR.
      - name: Checkout docs generator
        uses: actions/checkout@v7
        with:
          path: docs-generator
          sparse-checkout: |
            /bb.edn
            /bin/mage
            /bin/mage.bb
            /mage/
          sparse-checkout-cone-mode: false

      - name: Prepare backend environment
        uses: ./.github/actions/prepare-backend

      - name: Prepare frontend environment
        uses: ./.github/actions/prepare-frontend

      - name: Generate documentation
        run: docs-generator/bin/mage docs-generate --dir "$GITHUB_WORKSPACE"

      - name: Check for changes
        id: check_changes
        run: |
          # `git status` rather than `git diff`, which ignores new (untracked) files.
          if [ -z "$(git status --porcelain -- docs/)" ]; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in docs directory"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in docs directory"
          fi

      - name: Create branch and commit changes
        id: commit_and_push
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          BRANCH_NAME="docs/auto-update-${{ inputs.target_branch }}-$(date +%Y-%m-%d-%H%M%S)"
          echo "Creating branch: $BRANCH_NAME"

          # Create and switch to new branch from current target branch
          git checkout -b "$BRANCH_NAME"

          # Stage and commit changes
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi

          git commit -m "Update generated docs (${{ inputs.target_branch }})" --no-verify
          git push -u origin "$BRANCH_NAME"

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "Successfully created and pushed branch"

      # A broken generator tends to empty a file rather than tweak it, and nobody reviews an auto-merged
      # PR. Flag any file of at least MIN_LINES lines that is deleted or loses more than half its lines.
      # Small files are left out: SDK API pages shrink or disappear whenever an SDK type changes.
      - name: Check for large removals
        id: removals
        if: steps.commit_and_push.outputs.branch_name != ''
        env:
          MIN_LINES: 200
        run: |
          FLAGGED=""
          while read -r file; do
            old=$(git show "HEAD~1:$file" 2>/dev/null | wc -l)
            [ "$old" -ge "$MIN_LINES" ] || continue
            new=$(git show "HEAD:$file" 2>/dev/null | wc -l) # 0 when the file was deleted
            if [ $((new * 2)) -lt "$old" ]; then
              FLAGGED+="- \`$file\`: $((old)) → $((new)) lines"$'\n'
            fi
          done < <(git diff --name-only --no-renames HEAD~1 HEAD -- docs/)

          if [ -n "$FLAGGED" ]; then
            echo "Large removals found:"
            echo "$FLAGGED"
            echo "large_removals=true" >> "$GITHUB_OUTPUT"
          else
            echo "large_removals=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "files<<EOF"
            echo "$FLAGGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: create_pr
        if: steps.commit_and_push.outputs.branch_name != ''
        env:
          GITHUB_TOKEN: ${{ secrets.automation_token }}
          GH_REPO: ${{ github.repository }}
        run: |
          CHANGES_SUMMARY=$(git diff --name-only HEAD~1 docs/ 2>/dev/null | head -10 | sed 's/^/- /' || echo "- No specific files detected")
          TOTAL_CHANGES=$(git diff --name-only HEAD~1 docs/ 2>/dev/null | wc -l || echo "0")
          BRANCH_NAME="${{ steps.commit_and_push.outputs.branch_name }}"

          echo "Creating PR with branch: $BRANCH_NAME"
          echo "Changes detected: $TOTAL_CHANGES files"

          for i in {1..3}; do
            echo "Attempt $i of 3..."
            if PR_URL=$(gh pr create \
              --base "${{ inputs.target_branch }}" \
              --head "$BRANCH_NAME" \
              --title "Auto-update documentation for ${{ inputs.target_branch }}" \
              --body "This PR contains automatically generated documentation updates.

          ## Changes detected
          The following documentation files were updated:
          $CHANGES_SUMMARY
          $([ "$TOTAL_CHANGES" -gt 10 ] && echo "- ... and $((TOTAL_CHANGES - 10)) more files")

          ## Generation command
          Documentation was generated using \`./bin/mage docs-generate\`.

          This PR merges automatically once checks pass. If it removes most of a large file, the tech writers are asked to review it instead." \
              --label "Type:Documentation" \
              --label "no-backport"); then
              echo "PR created successfully on attempt $i: $PR_URL"
              echo "pr_number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"
              break
            else
              echo "PR creation failed on attempt $i"
              if [ "$i" -eq 3 ]; then
                echo "All attempts failed. Exiting with error."
                exit 1
              fi
              echo "Waiting 10 seconds before retry..."
              sleep 10
            fi
          done

      # Approving takes a different token than the one that opened the PR: GitHub won't let a token
      # approve its own pull request.
      - name: Approve the docs PR
        id: approve
        if: steps.create_pr.outcome == 'success' && steps.removals.outputs.large_removals == 'false'
        continue-on-error: true
        run: gh pr review --approve "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}

      # Merging, though, has to use the automation token: GitHub starts no workflow run for a push made
      # with `GITHUB_TOKEN`, so an auto-merge enabled with it would land the docs with no CI at all.
      - name: Enable auto-merge
        id: automerge
        if: steps.approve.outcome == 'success'
        continue-on-error: true
        run: gh pr merge --squash --auto "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.automation_token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}

      # Large removals, or a failed approve/merge: hand the PR to the tech writers. A PR that conflicts
      # later just waits with auto-merge on, in plain sight.
      - name: Request review from tech writers
        id: request_review
        if: steps.create_pr.outcome == 'success' && steps.automerge.outcome != 'success'
        run: |
          if [ "$LARGE_REMOVALS" == "true" ]; then
            REASON="it deletes or removes more than half of these files, which may mean the docs generator broke:"$'\n\n'"$REMOVED_FILES"$'\n'"Please check them before merging."
          else
            REASON="enabling auto-merge failed (see the workflow logs). Please review and merge it manually."
          fi
          gh pr edit "$PR_NUMBER" --add-reviewer "metabase/tech-writers"
          gh pr comment "$PR_NUMBER" --body "This PR wasn't merged automatically because $REASON"
        env:
          GH_TOKEN: ${{ secrets.automation_token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          LARGE_REMOVALS: ${{ steps.removals.outputs.large_removals }}
          REMOVED_FILES: ${{ steps.removals.outputs.files }}

      # Each run opens a new PR, and the newest one supersedes any still open from earlier runs. Leaving
      # those open would make them conflict with whichever merges first. Branches are kept in case
      # someone was working on one.
      - name: Close superseded docs PRs
        if: steps.create_pr.outcome == 'success'
        run: |
          gh pr list --base "$TARGET_BRANCH" --state open --limit 100 --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"docs/auto-update-$TARGET_BRANCH-\")) | .number" |
            while read -r OLD_PR; do
              [ "$OLD_PR" = "$PR_NUMBER" ] && continue
              echo "Closing #$OLD_PR, superseded by #$PR_NUMBER"
              gh pr close "$OLD_PR" --comment "Superseded by #$PR_NUMBER."
            done
        env:
          GH_TOKEN: ${{ secrets.automation_token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
          TARGET_BRANCH: ${{ inputs.target_branch }}

      - name: Skip PR creation
        if: steps.check_changes.outputs.changes == 'false'
        run: |
          echo "No documentation changes detected, skipping PR creation"

      - name: Workflow summary
        if: always()
        run: |
          {
            if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
              if [ "${{ steps.commit_and_push.outcome }}" == "success" ]; then
                if [ "${{ steps.create_pr.outcome }}" == "success" ]; then
                  echo "## ✅ Documentation Updated Successfully"
                  echo "- Branch: \`${{ steps.commit_and_push.outputs.branch_name }}\`"
                  echo "- PR #${{ steps.create_pr.outputs.pr_number }} created targeting **${{ inputs.target_branch }}**"
                  if [ "${{ steps.automerge.outcome }}" == "success" ]; then
                    echo "- Auto-merge enabled"
                  else
                    echo "- Not auto-merged (large removals: \`${{ steps.removals.outputs.large_removals }}\`); review requested from tech writers"
                  fi
                else
                  echo "## ⚠️ Branch Created but PR Failed"
                  echo "- Branch: \`${{ steps.commit_and_push.outputs.branch_name }}\`"
                  echo "- Manual PR creation required"
                fi
              else
                echo "## ❌ Failed to Create Branch"
                echo "- Check workflow logs for details"
              fi
            else
              echo "## ℹ️ No Changes Detected"
              echo "- Documentation is up to date on **${{ inputs.target_branch }}**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
