# Sites behind Cloudflare (npm, OpenAI, claude.ai) answer CI runners with a 403 challenge; a dead page answers 404.
accept = ["200..=204", "403", "429"]
# npm pages are behind that challenge, but the registry answers 404 for a missing package.
remap = ["^https://www\\.npmjs\\.com/package/(.+)$ https://registry.npmjs.org/$1"]
exclude = [
  # Liquid templates ({{page.version}}) in docs/embedding/sdk are rendered by the docs site, not here.
  "%7B%7B",
  # API base URLs the docs give as values: they answer API requests, not page loads.
  "^https://ollama\\.com/v1$",
  # Login-walled: redirects forever between console and auth.
  "^https://console\\.mistral\\.ai/",
  # GitHub renders issue comments client-side, so lychee can't see #issuecomment anchors.
  "^https://github\\.com/.+/issues/\\d+#issuecomment-",
  # Same for a repo's #readme anchor.
  "^https://github\\.com/[^/]+/[^/]+#readme$",
  # The API reference is rendered client-side by Scalar, so lychee can't see its #tag/... anchors.
  "^https://www\\.metabase\\.com/docs/latest/api#",
  "api\\.html#tag/",
]
exclude_path = ["docs/util", "docs/embedding/sdk/api"]
no_progress = true
include_fragments = "full"
verbose = "error"
include_verbatim = false
cache = false
