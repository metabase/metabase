name: Loki Visual Regression Testing

on:
  pull_request:
  merge_group:

jobs:
  files-changed:
    name: Check which files changed
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 3
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Everything files-changed needs — the action and the filter config —
          # lives under .github, and paths-filter diffs refs, not the worktree.
          sparse-checkout: .github
      - name: Test which files changed
        id: changes
        uses: ./.github/actions/files-changed
        with:
          any-of: frontend_ci, frontend_sources, frontend_loki_ci

  visual-test:
    needs: files-changed
    if: needs.files-changed.outputs.changed == 'true'
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    services:
      docker:
        image: docker:19.03.12
        options: --privileged
        ports:
          - 2376:2376
        env:
          DOCKER_TLS_CERTDIR: /certs
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /tmp/docker-certs:/certs/client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare frontend environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        run: NODE_ENV=development bun run build-pure:cljs

      - name: Run Loki Visual Tests
        run: bun run test-visual:loki:ci

      - name: Generate Visual Report on Failure
        if: failure()
        run: bun run test-visual:loki-report

      - name: Upload Artifact
        id: artifact-upload-step
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: loki-report
          include-hidden-files: true
          path: .loki/
          if-no-files-found: ignore
