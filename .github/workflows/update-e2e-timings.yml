name: Update E2E Timings

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: "Number of days to look back for timing artifacts"
        type: number
        default: 7
        required: false
  schedule:
    # Run weekly on Sundays at 6 AM UTC
    - cron: "0 6 * * 0"

jobs:
  collect-and-average-timings:
    if: ${{ github.event_name != 'schedule' || github.repository == 'metabase/metabase' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    env:
      DAYS_BACK: ${{ inputs.days_back || 7 }}
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.METABASE_BOT_APP_ID }}
          private-key: ${{ secrets.METABASE_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22

      - name: Collect and average timing data
        id: collect-timings
        uses: actions/github-script@v9
        with:
          script: |
            const { collectAndAverageTimings } = require('${{ github.workspace }}/.github/scripts/average-e2e-timings.js');
            const result = await collectAndAverageTimings({
              github,
              context,
              token: '${{ steps.app-token.outputs.token }}',
              daysBack: ${{ env.DAYS_BACK }},
              existingTimingsPath: 'e2e/support/timings.json'
            });

            core.setOutput('artifact-count', result.artifactCount);

      - name: Configure git and commit changes
        env:
          GITHUB_TOKEN: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATE=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="update-e2e-timings-$DATE"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "Branch name will be: $BRANCH_NAME"

          git checkout -b "$BRANCH_NAME"
          git add e2e/support/timings.json
          git commit -m "update e2e timings $DATE" --allow-empty --no-verify
          git push -u origin "$BRANCH_NAME"
      
      - name: Create Pull Request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}
        run: |
          BODY=

          ## Summary
          This PR updates the E2E test timing data with averaged values from recent test runs.

          ## Details
          - Collected data from the last **${{ env.DAYS_BACK }} days** of test runs
          - Averaged timing data from **${{ steps.collect-timings.outputs.artifact-count }}** test runs

          ## Generated automatically
          🤖 This PR was created automatically by the `update-e2e-timings` workflow.
          The timing data helps cypress-split optimize test distribution across parallel jobs.

          Co-Authored-By: GitHub Actions <actions@github.com>


          URL=$(gh pr create \
            --base master \
            --head "$BRANCH_NAME"
            --title "[chore] Update E2E test timings with recent data"
            --body "$BODY"
            --label ".CI & Tests"
            --label "no-backport"
            --reviewer devexp
          )

          PR_NUMBER=${URL##*/}

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Approve and Merge the PR
        env:
          # uses a different token than the token that created the PR so we can approve and merge it
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number }}
        shell: bash
        run: |
          gh pr review --approve "$PR_NUMBER"
          gh pr merge --squash --auto "$PR_NUMBER"
