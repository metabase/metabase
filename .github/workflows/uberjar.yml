name: Build Uberjar

# This workflow builds and containerizes an uberjar and pushes it to dockerhub.

concurrency:
  group: uberjar-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Optional full-length commit SHA-1 hash"
        type: string
        default: ''
        required: false
      containerize:
        description: "Set if the uberjar should be containerized and pushed to Dockerhub."
        type: boolean
        default: false
        required: false
  workflow_call:
    inputs:
      commit:
        description: "Optional full-length commit SHA-1 hash"
        type: string
        default: ''
        required: false
      containerize:
        description: "Set if the uberjar should be containerized and pushed to Dockerhub."
        type: boolean
        default: false
        required: false

jobs:
  setup:
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      healthcheck_matrix: ${{ steps.matrix.outputs.healthcheck_matrix }}
      container_matrix: ${{ steps.matrix.outputs.container_matrix }}
      java_version: ${{ steps.dependencies.outputs.java_version }}
      node_version: ${{ steps.dependencies.outputs.node_version }}
    steps:
      - uses: actions/checkout@v6

      - name: Check for existing EE uberjar
        id: check-ee
        uses: ./.github/actions/fetch-artifact
        with:
          commit: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          edition: ee
          fail-on-fetch-miss: false
          download: false

      - name: Check for existing OSS uberjar
        id: check-oss
        uses: ./.github/actions/fetch-artifact
        with:
          commit: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          edition: oss
          fail-on-fetch-miss: false
          download: false

      - name: Create build matrices
        id: matrix
        uses: actions/github-script@v9
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        with:
          script: | # js
            const refName = ${{ toJson(github.ref_name) }};
            const branch = process.env.BRANCH;
            const containerize = "${{ inputs.containerize }}" === "true";
            const isTrunk = refName === 'master' || refName.startsWith('release-');

            const hit = {
              ee: "${{ steps.check-ee.outputs.fetch-hit }}" === "true",
              oss: "${{ steps.check-oss.outputs.fetch-hit }}" === "true",
            };

            // Don't rebuild the uberjar if it has already been built for this commit.
            const buildEditions = ['ee', 'oss'].filter((edition) => !hit[edition]);

            // Only containerize the uberjar if containerize input is set. On master
            // publish ee and oss versions, otherwise just containerize the ee version.
            const containerEditions = containerize
              ? (branch === 'master' ? ['ee', 'oss'] : ['ee'])
              : [];

            // Health-check whatever we are about to push. Off the containerize path, keep the
            // old trunk-only coverage: master and release branches check both editions.
            const healthcheckEditions = containerize
              ? containerEditions
              : (isTrunk ? ['ee', 'oss'] : []);

            const toMatrix = (editions) =>
              JSON.stringify({ include: editions.map((edition) => ({ edition })) });

            core.setOutput('build_matrix', toMatrix(buildEditions));
            core.setOutput('healthcheck_matrix', toMatrix(healthcheckEditions));
            core.setOutput('container_matrix', toMatrix(containerEditions));

            core.info(`build: ${buildEditions} healthcheck: ${healthcheckEditions} containerize: ${containerEditions}`);

      - name: Prepare release scripts
        if: ${{ contains(github.ref, 'release-x') }}
        uses: ./.github/actions/prepare-release-scripts

      - name: Get build dependencies
        if: ${{ contains(github.ref, 'release-x') }}
        uses: actions/github-script@v9
        id: dependencies
        with:
          script: | # js
            const { getBuildRequirements, getVersionFromReleaseBranch } = require('${{ github.workspace }}/release/dist/index.cjs');

            const version = getVersionFromReleaseBranch('${{ github.ref }}');
            const requirements = getBuildRequirements(version);

            core.setOutput('java_version', requirements.java);
            core.setOutput('node_version', requirements.node);

  build:
    needs: [setup]
    name: Build MB ${{ matrix.edition }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.build_matrix) }}
    env:
      MB_EDITION: ${{ matrix.edition }}
      INTERACTIVE: false
      SKIP_LICENSES: ${{ github.event_name == 'pull_request' }}  # faster builds for dev
      # Emit bundle stats on trunk/release builds (tracked over time) and on PRs
      # (the bundle-size check reads them for both the PR head and its base ref).
      EMIT_BUNDLE_STATS: ${{ (github.ref_name == 'master' || startsWith(github.ref_name, 'release-') || github.event_name == 'pull_request') && 'true' || 'false' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
        with:
          node-version: "${{ needs.setup.outputs.node_version || '22' }}"
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
        with:
          java-version: "${{ needs.setup.outputs.java_version || 25 }}"
      - name: Build
        run: ./bin/build.sh
      - name: Upload bundle stats
        if: ${{ matrix.edition == 'ee' && env.EMIT_BUNDLE_STATS == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: metabase-bundle-stats-${{ matrix.edition }}-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          path: target/bundle-stats
          if-no-files-found: warn
      - name: Mark with the commit hash
        run: git rev-parse --short HEAD > COMMIT-ID
        shell: bash
      - name: Calculate SHA256 checksum
        run: sha256sum ./target/uberjar/metabase.jar > SHA256.sum
        shell: bash
      - name: Upload JARs as artifact
        uses: actions/upload-artifact@v7
        with:
          # Same key the artifact lookups use, so a build for an explicitly dispatched commit
          # uploads where `setup` and `jar-healthcheck` go looking for it.
          name: metabase-${{ matrix.edition }}-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}-uberjar
          path: |
            ./target/uberjar/metabase.jar
            ./COMMIT-ID
            ./SHA256.sum

  jar-healthcheck:
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    name: Is ${{ matrix.edition }} healthy?
    needs: [setup, build]
    # `build` is skipped when every artifact already exists, which must not skip this job.
    if: ${{ !failure() && !cancelled() }}
    timeout-minutes: 10
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.healthcheck_matrix) }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      - name: Prepare JRE (Java Run-time Environment)
        uses: actions/setup-java@v5.2.0
        with:
          java-package: jre
          java-version: ${{ needs.setup.outputs.java_version || 25 }}
          distribution: "temurin"
      - run: java -version
      - name: Retrieve uberjar artifact
        uses: ./.github/actions/fetch-artifact
        with:
          commit: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          edition: ${{ matrix.edition }}
      - name: Verify license files are present in uberjar
        run: |
          echo "Checking for license files in uberjar..."
          unzip -l ./metabase.jar | grep -q "license-backend-third-party.txt" || (echo "ERROR: license-backend-third-party.txt not found in uberjar" && exit 1)
          unzip -l ./metabase.jar | grep -q "license-frontend-third-party.txt" || (echo "ERROR: license-frontend-third-party.txt not found in uberjar" && exit 1)
          echo "Both license files found in uberjar"
      - name: Launch uberjar
        run: >-
          java --add-opens java.base/java.nio=ALL-UNNAMED -jar ./metabase.jar &
      - name: Wait for Metabase to start
        run: while ! curl 'http://localhost:3000/api/health' | grep '{"status":"ok"}'; do sleep 1; done

  containerize:
    needs: [setup, build, jar-healthcheck]
    # Both upstream jobs legitimately skip (nothing to build; nothing to health-check off
    # trunk), so gate on "not failed" rather than on `success()`.
    if: ${{ !failure() && !cancelled() && inputs.containerize }}
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.container_matrix) }}
    uses: ./.github/workflows/containerize-jar.yml
    secrets: inherit
    with:
      edition: ${{ matrix.edition }}
      commit: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
      release: false
      build-args: |
        GIT_COMMIT_SHA=${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
