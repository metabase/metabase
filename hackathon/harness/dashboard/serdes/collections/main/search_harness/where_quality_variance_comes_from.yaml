name: Where quality variance comes from
description: |-
  Main-effect sums of squares over vector engines only (keyword engines ignore the embedder). Approximate when cells are missing.

  **Variance share**: How much of the ups and downs in scores comes from each choice (engine, embedder, which question). Needs ≥2 engines and ≥2 embedders to mean anything.

  **Main effect / interaction**: Main effect: what one choice changes on its own. Interaction: what only shows up in combination (e.g. an English-only model on Polish questions).

  **nDCG@10 (ranking quality)**: 0 to 1: how well the engine put the right answers near the top of its first 10 results. Higher is better.

  **Vector vs keyword engine**: A vector engine matches by meaning, using embeddings. A keyword engine (appdb, in-place) matches words.

  **Embedder**: The model that makes embeddings. Today `all-minilm`; `snowflake-arctic-embed2` is coming.
