name: Cross-Version Migration Tests

on:
  workflow_call:
    inputs:
      digest:
        type: string
        required: false
        default: ""
        description: "HEAD image digest. Ensures we test against the image built for the current commit."

  workflow_dispatch:
    inputs:
      source_version:
        description: "Source version (e.g., v1.58.6 or HEAD)"
        required: true
        type: string
      target_version:
        description: "Target version (e.g., v1.58.7 or HEAD)"
        required: true
        type: string

jobs:
  generate-test-matrix:
    if: inputs.source_version == '' && github.repository == 'metabase/metabase'
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      oldest-target: ${{ steps.set-matrix.outputs.oldest-target }}
    steps:
      - name: Require HEAD digest
        if: inputs.digest == ''
        run: |
          echo "::error::inputs.digest is empty and required to test the current commit's Docker image"
          exit 1

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            release
            .github

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Generate version matrix
        id: set-matrix
        uses: actions/github-script@v9
        env:
          AWS_S3_STATIC_BUCKET: ${{ vars.AWS_S3_STATIC_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          script: | # js
            const { getSupportedMajors } = require('${{ github.workspace }}/release/dist/index.cjs');
            const { buildCrossVersionMatrix } = require('${{ github.workspace }}/.github/scripts/build-cross-version-matrix');

            // run against all supported versions
            const supportedMajors = await getSupportedMajors();
            console.log("supported majors:", supportedMajors);

            const { config } = buildCrossVersionMatrix(supportedMajors);
            const matrix = JSON.stringify({ include: config });
            core.setOutput("matrix", matrix);
            core.setOutput("oldest-target", `v1.${Math.min(...supportedMajors)}.x`);
            console.log("matrix:", matrix);

  test:
    needs: generate-test-matrix
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJson(needs.generate-test-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare Cypress environment
        uses: ./.github/actions/prepare-cypress

      - name: Download pre-built CLJS
        id: prebuilt-cljs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-cljs-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cljs_dev

      - name: Prepare back-end environment
        if: steps.prebuilt-cljs.outcome != 'success'
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        if: steps.prebuilt-cljs.outcome != 'success'
        run: bun run build-pure:cljs

      - name: Run cross-version test
        id: run-test
        env:
          CURRENT_VERSION: ${{ vars.CURRENT_VERSION }}
          HEAD_DIGEST: ${{ inputs.digest }}
          CYPRESS_KEEP_VIDEOS: "true"
        run: |
          cd cross-version
          ./test.sh --source "${{ matrix.source }}" --target "${{ matrix.target }}"

      - name: Notify Slack about master commits that need a backport or a release
        if: >-
          steps.run-test.outputs.skipped == 'true' &&
          matrix.target == needs.generate-test-matrix.outputs.oldest-target &&
          github.ref == 'refs/heads/master'
        uses: actions/github-script@v9
        env:
          CURRENT_VERSION: ${{ vars.CURRENT_VERSION }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_RELEASE_CHANNEL: ${{ vars.SLACK_RELEASE_CHANNEL }}
        with:
          script: | # js
            const { findSlackMessage, sendSlackMessage } = require('${{ github.workspace }}/release/dist/index.cjs');
            const { downgradeMajors, notifyReleaseNeeded } = require('${{ github.workspace }}/.github/scripts/notify-unreleased-migrations');

            await notifyReleaseNeeded({
              github,
              context,
              core,
              majors: downgradeMajors({
                target: '${{ matrix.target }}',
                currentVersion: Number(process.env.CURRENT_VERSION),
              }),
              channelName: process.env.SLACK_RELEASE_CHANNEL,
              findSlackMessage,
              sendSlackMessage,
            });

      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-recording-${{ matrix.source }}-${{ matrix.target }}
          path: |
            ./cypress
            ./logs/test.log
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure()
        run: |
          for f in cross-version/logs/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

  # Manual test for workflow_dispatch
  test-manual:
    if: inputs.source_version != ''
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare Cypress environment
        uses: ./.github/actions/prepare-cypress

      - name: Download pre-built CLJS
        id: prebuilt-cljs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-cljs-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cljs_dev

      - name: Prepare back-end environment
        if: steps.prebuilt-cljs.outcome != 'success'
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        if: steps.prebuilt-cljs.outcome != 'success'
        run: bun run build-pure:cljs

      - name: Run cross-version test
        env:
          CURRENT_VERSION: ${{ vars.CURRENT_VERSION }}
          CYPRESS_KEEP_VIDEOS: "true"
        run: |
          cd cross-version
          ./test.sh --source "${{ inputs.source_version }}" --target "${{ inputs.target_version }}"

      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-recording-${{ inputs.source_version }}-${{ inputs.target_version }}
          path: |
            ./cypress
            ./logs/test.log
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure()
        run: |
          for f in cross-version/logs/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
