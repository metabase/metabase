name: Files changed
description: >
  Answer one question about a commit — did it touch any of these parts of the
  repo? — using dorny/paths-filter against .github/file-paths.yaml.

  Checks the repository out when it needs to, then memoises paths-filter's whole
  answer in the Actions cache under a key derived from the commit under test and
  the filter configuration. A commit that has already been filtered, by an
  earlier workflow in the same push or by a re-run, short-circuits to the cached
  answer and skips both the checkout and the diff.

inputs:
  any-of:
    description: >
      Filter names from the filter file, comma- or newline-separated. `changed`
      is 'true' when the commit matched at least one of them. `name: true` is
      accepted alongside a bare `name`, so a multi-line list reads either way.
      A name the filter file doesn't define is an error, not a quiet 'false'.
    required: false
    default: ""
  all-of:
    description: >
      Filter names, in the same forms `any-of` accepts, that must *all* have
      matched. Give both and the commit has to satisfy the `any-of` OR and the
      `all-of` AND together.
    required: false
    default: ""
  filters:
    description: "Path to the paths-filter configuration, relative to the repo root."
    required: false
    default: .github/file-paths.yaml
  list-files:
    description: >
      Format for the `files` output: none, csv, shell, json or escape. `none`
      (the default) skips it, which keeps the outputs small.
    required: false
    default: none
  base:
    description: >
      Git ref to diff against. Leave empty to let paths-filter decide: the PR
      base for pull requests, the pushed-over commit for pushes.
    required: false
    default: ""
  token:
    description: "Token used to read the changed file list from the API. Defaults to github.token."
    required: false
    default: ""
  checkout:
    description: >
      `auto` (the default) checks the repository out only when the filter file
      isn't already in the workspace, so a job that has already checked out — or
      that sparse-checked-out `.github` just to reach this action — doesn't pay
      for a second clone. `true` always checks out, `false` never does.
    required: false
    default: auto
  fetch-depth:
    description: "fetch-depth for the checkout this action performs, when it performs one."
    required: false
    default: "1"
  cache:
    description: "Set to false to always recompute, reading from and writing to no cache."
    required: false
    default: "true"

outputs:
  changed:
    description: >
      'true' when the commit satisfied `any-of` (at least one matched) and
      `all-of` (every one matched). 'false' when neither input is given.
    value: ${{ steps.evaluate.outputs.changed }}
  files:
    description: >
      Files matched by the named filters, in the `list-files` format. Empty
      when `list-files` is `none`. Several filters are concatenated rather than
      merged, so overlapping ones can list a file twice.
    value: ${{ steps.evaluate.outputs.files }}
  results:
    description: >
      Every paths-filter output as a JSON object, for a job that needs more than
      one answer out of a single diff:
      fromJSON(steps.<id>.outputs.results).frontend_all.
    value: ${{ steps.evaluate.outputs.results }}
  cache-hit:
    description: "'true' when the answer was reused from an earlier run on this commit."
    value: ${{ steps.check.outputs.cached || 'false' }}

runs:
  using: composite
  steps:
    # The key has to pin everything the answer depends on: which commit we are
    # filtering, what we are filtering it against, and the filter config itself.
    # The config is covered by the commit — on a pull_request GITHUB_SHA is the
    # merge commit, so it moves whenever either the head or the base does.
    #
    # `any-of` deliberately stays out of the key: we cache paths-filter's whole
    # answer, so every job asking a different question of the same commit shares
    # one entry.
    - name: Work out the cache key
      id: plan
      shell: bash
      env:
        FILTERS: ${{ inputs.filters }}
        LIST_FILES: ${{ inputs.list-files }}
        BASE: ${{ inputs.base }}
        CHECKOUT: ${{ inputs.checkout }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail

        # Cache keys may not contain commas, and we want them readable, so fold
        # anything that isn't key-safe into a dash.
        slug() { printf '%s' "$1" | tr -c '[:alnum:]._-' '-'; }

        base_sha="${PR_BASE_SHA:-}"
        [ -n "$base_sha" ] || base_sha="${MERGE_GROUP_BASE_SHA:-}"
        [ -n "$base_sha" ] || base_sha="${PUSH_BEFORE_SHA:-}"
        [ -n "$base_sha" ] || base_sha="none"

        key="files-changed-v1"
        key="$key-$(slug "$GITHUB_EVENT_NAME")"
        key="$key-$(slug "$FILTERS")"
        key="$key-$(slug "$LIST_FILES")"
        key="$key-$(slug "${BASE:-auto}")"
        key="$key-$base_sha-${HEAD_SHA}-${GITHUB_SHA}"

        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "file=$RUNNER_TEMP/files-changed/$key.json" >> "$GITHUB_OUTPUT"

        # `auto` means: only clone if the filter config isn't already here. A job
        # that checked the repo out to reach this action in the first place has
        # nothing to gain from doing it twice.
        case "$CHECKOUT" in
          true|false) needed="$CHECKOUT" ;;
          auto) if [ -f "$FILTERS" ]; then needed=false; else needed=true; fi ;;
          *) echo "::error::checkout must be one of auto, true, false (got '$CHECKOUT')"; exit 1 ;;
        esac
        echo "checkout=$needed" >> "$GITHUB_OUTPUT"

    - name: Look for an answer from an earlier run on this commit
      id: restore
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.plan.outputs.file }}
        key: ${{ steps.plan.outputs.key }}

    # A half-written entry has to read as a miss rather than as an empty answer,
    # which would silently turn every filter false.
    - name: Check the cached answer is intact
      id: check
      if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      env:
        FILE: ${{ steps.plan.outputs.file }}
      run: |
        set -euo pipefail
        if jq -e 'type == "object" and length > 0' "$FILE" >/dev/null 2>&1; then
          echo "cached=true" >> "$GITHUB_OUTPUT"
          echo "Reusing the paths-filter answer cached for this commit."
        else
          echo "Cached answer is missing or malformed; filtering from scratch."
        fi

    - name: Checkout repository
      if: steps.check.outputs.cached != 'true' && steps.plan.outputs.checkout == 'true'
      uses: actions/checkout@v6
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Test which files changed
      id: filter
      if: steps.check.outputs.cached != 'true'
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
      with:
        token: ${{ inputs.token || github.token }}
        filters: ${{ inputs.filters }}
        list-files: ${{ inputs.list-files }}
        base: ${{ inputs.base }}

    # Written even when caching is off: `evaluate` reads its answer from here, so
    # there is only ever one place to read it from.
    - name: Record the answer
      if: steps.check.outputs.cached != 'true'
      shell: bash
      env:
        FILE: ${{ steps.plan.outputs.file }}
        OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$FILE")"
        printf '%s' "$OUTPUTS" | jq -c . > "$FILE"

    # Losing this race against a sibling workflow on the same commit is fine:
    # whoever got there first cached the same answer.
    - name: Cache the answer for the rest of this commit's workflows
      if: steps.check.outputs.cached != 'true' && inputs.cache == 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.plan.outputs.file }}
        key: ${{ steps.plan.outputs.key }}

    - name: Answer the question
      id: evaluate
      shell: bash
      env:
        FILE: ${{ steps.plan.outputs.file }}
        FILTERS: ${{ inputs.filters }}
        ANY_OF: ${{ inputs.any-of }}
        ALL_OF: ${{ inputs.all-of }}
        LIST_FILES: ${{ inputs.list-files }}
      run: |
        set -euo pipefail

        # A delimiter no file list can accidentally terminate.
        delim="ghadelim-$RANDOM$RANDOM-$$"
        emit() { printf '%s<<%s\n%s\n%s\n' "$1" "$delim" "$2" "$delim" >> "$GITHUB_OUTPUT"; }

        emit results "$(cat "$FILE")"

        # Accept `a, b`, one name per line, and the `a: true` map form — anything
        # other than `true` on the right is a typo we would rather not guess at.
        # Errors go to stderr so the command substitution below can't swallow them.
        parse() {
          local entry name value
          while IFS= read -r entry; do
            name="${entry%%:*}"
            value="${entry#"$name"}"
            name="$(printf '%s' "$name" | tr -d '[:space:]')"
            value="$(printf '%s' "${value#:}" | tr -d '[:space:]')"
            [ -n "$name" ] || continue
            if [ -n "$value" ] && [ "$value" != "true" ]; then
              echo "::error::Don't know what to do with the $2 entry '$entry' — write '$name' or '$name: true'." >&2
              return 1
            fi
            printf '%s\n' "$name"
          done < <(printf '%s\n' "$1" | tr ',' '\n')
        }

        # Fills the `names` global; a parse failure takes the whole step down.
        read_names() {
          local raw line
          names=()
          raw="$(parse "$1" "$2")" || exit 1
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              names+=("$line")
            fi
          done <<< "$raw"
        }

        read_names "$ANY_OF" any-of
        any_names=("${names[@]+"${names[@]}"}")
        read_names "$ALL_OF" all-of
        all_names=("${names[@]+"${names[@]}"}")

        if [ ${#any_names[@]} -eq 0 ] && [ ${#all_names[@]} -eq 0 ]; then
          emit changed false
          emit files ""
          echo "Neither any-of nor all-of given; read the answer from the results output."
          exit 0
        fi

        # Every name either side asked about, in order, without repeats.
        referenced=()
        while IFS= read -r name; do
          if [ -n "$name" ]; then
            referenced+=("$name")
          fi
        done < <(printf '%s\n' "${any_names[@]+"${any_names[@]}"}" \
                                "${all_names[@]+"${all_names[@]}"}" | awk 'NF && !seen[$0]++')

        # A name with no filter behind it would otherwise report 'false' forever,
        # quietly switching off whatever job depends on it.
        missing=()
        for name in "${referenced[@]}"; do
          jq -e --arg k "$name" 'has($k)' "$FILE" >/dev/null || missing+=("$name")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::$FILTERS defines no filter named: ${missing[*]}"
          exit 1
        fi

        matched() { [ "$(jq -r --arg k "$1" '.[$k]' "$FILE")" = "true" ]; }

        # any-of is an OR, all-of an AND, and asking for both means both must hold.
        changed=true
        if [ ${#any_names[@]} -gt 0 ]; then
          changed=false
          for name in "${any_names[@]}"; do
            if matched "$name"; then
              changed=true
              break
            fi
          done
        fi
        if [ "$changed" = true ] && [ ${#all_names[@]} -gt 0 ]; then
          for name in "${all_names[@]}"; do
            if ! matched "$name"; then
              changed=false
              break
            fi
          done
        fi

        parts=()
        for name in "${referenced[@]}"; do
          matched_files="$(jq -r --arg k "${name}_files" '.[$k] // ""' "$FILE")"
          if [ -n "$matched_files" ] && [ "$matched_files" != "[]" ]; then
            parts+=("$matched_files")
          fi
        done

        files=""
        if [ ${#parts[@]} -gt 0 ]; then
          # Concatenate rather than merge: `shell` and `escape` values are quoted
          # for a shell, so splitting them back apart on whitespace would maul any
          # path containing a space.
          case "$LIST_FILES" in
            json) files="$(printf '%s\n' "${parts[@]}" | jq -sc 'add')" ;;
            csv) files="$(IFS=','; printf '%s' "${parts[*]}")" ;;
            *) files="$(IFS=' '; printf '%s' "${parts[*]}")" ;;
          esac
        fi

        emit changed "$changed"
        emit files "$files"
        echo "changed=$changed for: ${referenced[*]}"
