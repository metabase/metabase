## How a table's rows change between loads (mutability) and how the loader writes them (load_strategy).

databaseChangeLog:
  - changeSet:
      id: t1gzih
      author: metatyb
      comment: Add mutability to metabase_table
      changes:
        - addColumn:
            tableName: metabase_table
            columns:
              - column:
                  name: mutability
                  type: varchar(32)
                  remarks: "How the table's rows change between loads, e.g. append_only or mutable"

  - changeSet:
      id: xezvgd
      author: metatyb
      comment: Add load_strategy to metabase_table
      changes:
        - addColumn:
            tableName: metabase_table
            columns:
              - column:
                  name: load_strategy
                  type: varchar(32)
                  remarks: "How the loader writes the table, e.g. full or incremental"

  - changeSet:
      id: k0rc5w
      author: metatyb
      comment: Add mutability to metabase_table_user_settings
      changes:
        - addColumn:
            tableName: metabase_table_user_settings
            columns:
              - column:
                  name: mutability
                  type: varchar(32)
                  remarks: "User-set mutability for the Table"

  - changeSet:
      id: ag6hhl
      author: metatyb
      comment: Add load_strategy to metabase_table_user_settings
      changes:
        - addColumn:
            tableName: metabase_table_user_settings
            columns:
              - column:
                  name: load_strategy
                  type: varchar(32)
                  remarks: "User-set load_strategy for the Table"

  - changeSet:
      id: 7kch39
      author: metatyb
      comment: Add mutability_set to metabase_table_user_settings
      changes:
        - addColumn:
            tableName: metabase_table_user_settings
            columns:
              - column:
                  name: mutability_set
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: "Whether the user set mutability, so a NULL mutability overrides the sync value"
                  constraints:
                    nullable: false

  - changeSet:
      id: qpwu5p
      author: metatyb
      comment: Add load_strategy_set to metabase_table_user_settings
      changes:
        - addColumn:
            tableName: metabase_table_user_settings
            columns:
              - column:
                  name: load_strategy_set
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: "Whether the user set load_strategy, so a NULL load_strategy overrides the sync value"
                  constraints:
                    nullable: false
