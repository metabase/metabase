    text: |-
      ### How to read this tab

      - **Speed: the same queries against every store**: How fast does each store answer the same questions as the catalogue grows? Median time per search, end to end over HTTP, including embedding the query (all-minilm). Bars are grouped by store; colours are catalogue size. Latency is not the point of the project — it shows every store ran the identical workload. *Shows: every embedding model, as separate rows or series, every size tier.*
      - **Speed: median and p95 by store and size**: What are the exact numbers behind the speed chart? p95 is the slowest 5% of searches; tails are noisy on a laptop. *Shows: every embedding model, as separate rows or series, every size tier.*
      - **Quality: swapping the store**: Does search get worse if pgvector is replaced by another store? Ranking quality per store on the same 56 golden questions. Vector-only variants (-vector, -pure) compare the stores themselves; semantic, sqlite-vec1 and lucene also mix in keyword hits. The keyword engines are the floor. *Shows: every embedding model, as separate rows or series, every size tier.*
      - **Quality: each store vs its pgvector counterpart, paired**: Is any store proven better or worse than pgvector, compared like for like? Each store against the pgvector engine with the same parts switched on, same questions. "Vector only" is the fair store comparison; "as shipped" adds each engine's keyword part and top-up. "no proven difference" means the 95% range crosses 0 — a tie at this sample size. *Shows: every embedding model, as separate rows or series, every size tier.*
      - **Embedding model: all-minilm vs arctic**: How much does a stronger embedding model help? Ranking quality per engine with each model, same 56 golden questions. Keyword engines do not embed, so their bars should not move — they are the sanity check. *Shows: every embedding model, as separate rows or series, every size tier.*
      - **Embedding model: arctic vs all-minilm, paired**: Is the stronger model proven better, per engine? arctic minus all-minilm on the same questions. Keyword engines should show 0. *Shows: every embedding model, as separate rows or series, every size tier.*
      - **What we embed: describing undocumented cards**: Does giving cards a description improve search? Gain in ranking quality over the catalogue as written (none), on the 24 held-out questions nobody tuned on. mech-fill-empty writes a description from the SQL by rules, only where missing; llm-fill-all has a local LLM describe every card; context-sql embeds the raw SQL instead. Vector-only engine, so the gain is the embedding's, not keyword matching. *Shows: every embedding model, as separate rows or series, every size tier.*
      - **What we embed: gain vs none, paired**: Is each text strategy proven better than leaving cards undescribed? nDCG@10 before (none) and after, and the paired gain with its 95% range, held-out questions only. *Shows: every embedding model, as separate rows or series, every size tier.*
