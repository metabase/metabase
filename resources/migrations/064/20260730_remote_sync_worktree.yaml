databaseChangeLog:
  - changeSet:
      id: v64.2026-07-30T10:00:00
      author: ranquild
      comment: Create remote_sync_worktree table
      changes:
        - createTable:
            tableName: remote_sync_worktree
            remarks: One row per checked-out remote-sync branch (a git-worktree-style checkout of the synced content tree)
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch
                  type: varchar(254)
                  remarks: Git branch this worktree is checked out to
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: User who created this worktree; null once that user is deleted
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: When this worktree was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: When this worktree was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: v64.2026-07-30T10:00:01
      author: ranquild
      comment: Unique index on remote_sync_worktree.branch - a branch can be checked out at most once
      changes:
        - createIndex:
            tableName: remote_sync_worktree
            indexName: idx_remote_sync_worktree_branch
            unique: true
            columns:
              - column:
                  name: branch

  - changeSet:
      id: v64.2026-07-30T10:00:02
      author: ranquild
      comment: FK remote_sync_worktree.creator_id -> core_user; SET NULL so the worktree survives its creator's deletion
      changes:
        - addForeignKeyConstraint:
            baseTableName: remote_sync_worktree
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_remote_sync_worktree_creator_id
            onDelete: SET NULL

  - changeSet:
      id: v64.2026-07-30T10:00:03
      author: ranquild
      comment: Add remote_sync_object.worktree_id
      changes:
        - addColumn:
            tableName: remote_sync_object
            columns:
              - column:
                  name: worktree_id
                  type: int
                  remarks: Worktree whose sync ledger this row belongs to; null for main-app remote sync
                  constraints:
                    nullable: true

  - changeSet:
      id: v64.2026-07-30T10:00:04
      author: ranquild
      comment: Index on remote_sync_object.worktree_id (backs the FK below and every worktree-scoped query)
      changes:
        - createIndex:
            tableName: remote_sync_object
            indexName: idx_remote_sync_object_worktree_id
            columns:
              - column:
                  name: worktree_id

  - changeSet:
      id: v64.2026-07-30T10:00:05
      author: ranquild
      comment: FK remote_sync_object.worktree_id -> remote_sync_worktree
      changes:
        - addForeignKeyConstraint:
            baseTableName: remote_sync_object
            baseColumnNames: worktree_id
            referencedTableName: remote_sync_worktree
            referencedColumnNames: id
            constraintName: fk_remote_sync_object_worktree_id

  - changeSet:
      id: v64.2026-07-30T10:00:06
      author: ranquild
      comment: Add remote_sync_task.worktree_id
      changes:
        - addColumn:
            tableName: remote_sync_task
            columns:
              - column:
                  name: worktree_id
                  type: int
                  remarks: Worktree this sync task ran in; null for main-app remote sync
                  constraints:
                    nullable: true

  - changeSet:
      id: v64.2026-07-30T10:00:07
      author: ranquild
      comment: Index on remote_sync_task.worktree_id (backs the FK below and every worktree-scoped query)
      changes:
        - createIndex:
            tableName: remote_sync_task
            indexName: idx_remote_sync_task_worktree_id
            columns:
              - column:
                  name: worktree_id

  - changeSet:
      id: v64.2026-07-30T10:00:08
      author: ranquild
      comment: FK remote_sync_task.worktree_id -> remote_sync_worktree
      changes:
        - addForeignKeyConstraint:
            baseTableName: remote_sync_task
            baseColumnNames: worktree_id
            referencedTableName: remote_sync_worktree
            referencedColumnNames: id
            constraintName: fk_remote_sync_task_worktree_id

  - changeSet:
      id: v64.2026-07-30T10:00:09
      author: ranquild
      comment: Add collection.worktree_id
      changes:
        - addColumn:
            tableName: collection
            columns:
              - column:
                  name: worktree_id
                  type: int
                  remarks: Worktree this collection was checked out into; null for main-app collections
                  constraints:
                    nullable: true

  - changeSet:
      id: v64.2026-07-30T10:00:10
      author: ranquild
      comment: Index on collection.worktree_id (backs the FK below and every worktree-scoped query)
      changes:
        - createIndex:
            tableName: collection
            indexName: idx_collection_worktree_id
            columns:
              - column:
                  name: worktree_id

  - changeSet:
      id: v64.2026-07-30T10:00:11
      author: ranquild
      comment: FK collection.worktree_id -> remote_sync_worktree
      changes:
        - addForeignKeyConstraint:
            baseTableName: collection
            baseColumnNames: worktree_id
            referencedTableName: remote_sync_worktree
            referencedColumnNames: id
            constraintName: fk_collection_worktree_id


  - changeSet:
      id: v64.2026-07-30T10:00:12
      author: ranquild
      comment: Create remote_sync_worktree_remapping table
      changes:
        - createTable:
            tableName: remote_sync_worktree_remapping
            remarks: Maps the entity_id an entity has on the branch to the entity_id of the copy a worktree checked out for it, so a worktree can hold its own copy of an entity the main app already has
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: worktree_id
                  type: int
                  remarks: Worktree this remapping belongs to
                  constraints:
                    nullable: false
              - column:
                  name: source_entity_id
                  type: char(21)
                  remarks: entity_id as it appears on the branch, and in every serialized file
                  constraints:
                    nullable: false
              - column:
                  name: target_entity_id
                  type: char(21)
                  remarks: entity_id of the row this worktree checked the entity out into
                  constraints:
                    nullable: false

  - changeSet:
      id: v64.2026-07-30T10:00:13
      author: ranquild
      comment: Unique index on (worktree_id, source_entity_id) - a branch entity is checked out at most once per worktree
      changes:
        - createIndex:
            tableName: remote_sync_worktree_remapping
            indexName: idx_remote_sync_worktree_remapping_source
            unique: true
            columns:
              - column:
                  name: worktree_id
              - column:
                  name: source_entity_id

  - changeSet:
      id: v64.2026-07-30T10:00:14
      author: ranquild
      comment: Unique index on target_entity_id - entity_id is globally unique, so a checked-out row backs exactly one remapping
      changes:
        - createIndex:
            tableName: remote_sync_worktree_remapping
            indexName: idx_remote_sync_worktree_remapping_target
            unique: true
            columns:
              - column:
                  name: target_entity_id

  - changeSet:
      id: v64.2026-07-30T10:00:15
      author: ranquild
      comment: FK remote_sync_worktree_remapping.worktree_id -> remote_sync_worktree; CASCADE so deleting a worktree drops its remappings
      changes:
        - addForeignKeyConstraint:
            baseTableName: remote_sync_worktree_remapping
            baseColumnNames: worktree_id
            referencedTableName: remote_sync_worktree
            referencedColumnNames: id
            constraintName: fk_remote_sync_worktree_remapping_worktree_id
            onDelete: CASCADE
