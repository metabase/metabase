name: Test gate

# Decides whether a test suite should run, so each suite owns its own gating
# instead of the caller computing a `skip` input for it.
#
# `force-run` and `force-skip` are global overrides; `defer` hands the decision
# to the paths filter, which is the only path that pays for a checkout.
#
# In a stack of PRs, only the ends run CI: the lowest unmerged PR (the one whose
# base ref is the stack base) and the top PR (the one at the last position).
# Every PR in between is force-skipped and gets tested once it reaches the
# bottom of the stack, unless it carries the `ci:run-all` label.
on:
  workflow_call:
    inputs:
      filters:
        description: >-
          Filter names from .github/file-paths.yaml, comma- or
          whitespace-separated. The suite runs when the diff matches any of them.
          Leave empty to decide on the overrides alone and skip the paths filter.
        type: string
        default: ''
      decide-flaky-rerun:
        description: >-
          Ask ci-conductor whether a PR re-run's failures are confirmed flakes, and report an
          auto-pass on the PR. Set by exactly one gate per run (run-tests.yml's, which needs
          `secrets: inherit`); every other gate follows its answer, so a re-run makes one billed
          call and every suite agrees.
        type: boolean
        default: false
    outputs:
      run:
        description: Whether the calling suite should run.
        value: >-
          ${{ jobs.flaky-rerun.outputs.auto-pass != 'true'
          && jobs.should-run.outputs.verdict != 'force-skip'
          && (inputs.filters == ''
          || jobs.should-run.outputs.verdict == 'force-run'
          || jobs.files-changed.outputs.any == 'true') }}
      matched:
        description: >-
          Which of the requested filters the diff touched, as a JSON array, for suites whose jobs
          map to different filters. A force-run reports every requested filter; an auto-pass none.
        value: >-
          ${{ (jobs.flaky-rerun.outputs.auto-pass == 'true' && '[]')
          || (jobs.should-run.outputs.verdict == 'force-run' && jobs.should-run.outputs.filters)
          || jobs.files-changed.outputs.matched || '[]' }}
      force-run:
        description: Whether the suite should run in full, ignoring the diff.
        value: >-
          ${{ jobs.should-run.outputs.verdict == 'force-run'
          && jobs.flaky-rerun.outputs.auto-pass != 'true' }}
      verdict:
        description: force-run, force-skip, or defer.
        value: ${{ jobs.should-run.outputs.verdict }}
      auto-pass:
        description: >-
          Whether this is a PR re-run whose failures are all confirmed flakes. It already turns
          `run`, `matched` and `force-run` off; a job gated on anything decided on the first attempt
          (another job's outputs) has to check it too, since a re-run keeps those.
        value: ${{ jobs.flaky-rerun.outputs.auto-pass == 'true' }}

jobs:
  should-run:
    name: Decide whether to run
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
      filters: ${{ steps.decide.outputs.filters }}
    steps:
      - name: Decide
        id: decide
        env:
          FILTERS: ${{ inputs.filters }}
        # Reads only what every runner already sets: GITHUB_REF_NAME, and the event payload at
        # GITHUB_EVENT_PATH. A push has no `pull_request` in its payload, so no PR rule matches it.
        run: | # bash
          # True when the PR carries the label $1. A non-PR event has no labels, so it never does.
          has_label() {
            jq -e --arg label "$1" \
              'any(.pull_request.labels[]?; .name == $label)' "$GITHUB_EVENT_PATH" > /dev/null
          }

          # The rules are checked in order and the first match wins, so precedence is their order.
          #
          # 1. master and the release branches are what we ship, so they always run everything.
          if [[ "$GITHUB_REF_NAME" == "master" || "$GITHUB_REF_NAME" == release-x.* ]]; then
            verdict=force-run
          # 2. `ci:run-all` asks for a full run on a PR, as if it were master. It beats `ci:skip`,
          #    so a PR carrying both still gets tested.
          elif has_label "ci:run-all"; then
            verdict=force-run
          # 3. `ci:skip` opts a PR out of CI entirely.
          elif has_label "ci:skip"; then
            verdict=force-skip
          # 4. Only the ends of a stack run CI: the bottom PR (the one whose base is the stack's
          #    base) and the top PR (the one at the last position). Every PR in between is skipped
          #    until it reaches the bottom, unless it carries `ci:run-all` (rule 2). A PR outside a
          #    stack has no `stack`, which reads as null and never matches.
          elif jq -e '.pull_request.stack != null
                      and .pull_request.stack.base.ref != .pull_request.base.ref
                      and .pull_request.stack.position != .pull_request.stack.size' \
                 "$GITHUB_EVENT_PATH" > /dev/null; then
            verdict=force-skip
          # 5. Everything else: each suite runs what the diff touched.
          else
            verdict=defer
          fi

          echo "verdict=$verdict" | tee -a "$GITHUB_OUTPUT"
          # Echoed back as JSON so a force-run can report every requested filter as matched.
          echo "filters=$(jq -Rc 'split("[,\\s]+";"") | map(select(length > 0))' <<< "$FILTERS")" | tee -a "$GITHUB_OUTPUT"

  # On a PR re-run whose failures ci-conductor calls likely flaky, and a person has confirmed, the
  # outputs above turn the suite off, so the re-run's failed jobs skip and its result check passes.
  #
  # Skipped on the first attempt on purpose. "Re-run failed jobs" keeps the jobs that succeeded but
  # re-evaluates the skipped ones, so this is the one gate job that runs again on a re-run. Once it
  # has run, a later re-run keeps its answer rather than asking again.
  flaky-rerun:
    name: Check for a confirmed-flaky re-run
    if: >-
      ${{ github.event_name == 'pull_request'
      && github.run_attempt != '1'
      && github.event.pull_request.head.repo.full_name == 'metabase/metabase' }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      auto-pass: ${{ steps.decide.outputs.auto-pass || steps.follow.outputs.auto-pass }}
    env:
      # Per attempt, so an answer never outlives the re-run it was given for.
      ARTIFACT: flaky-rerun-auto-pass-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ inputs.decide-flaky-rerun }}
        with:
          sparse-checkout: .github
      - uses: ./.github/actions/prepare-node-bun
        if: ${{ inputs.decide-flaky-rerun }}
      - name: Ask ci-conductor whether the failures are flaky
        id: decide
        if: ${{ inputs.decide-flaky-rerun }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          CI_CONDUCTOR_BASE_URL: ${{ vars.CI_CONDUCTOR_BASE_URL }}
          CI_CONDUCTOR_WEBHOOK_SECRET: ${{ secrets.CI_CONDUCTOR_WEBHOOK_SECRET }}
          ENG_STATS_URL: ${{ secrets.ENG_STATS_URL }}
          API_KEY: ${{ secrets.ENG_STATS_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun .github/scripts/flaky-rerun-auto-pass.ts

      # The other gates follow through an artifact: run-tests.yml's suites all need its gate, so the
      # answer is in place before theirs look. One that looks too early finds nothing and re-runs.
      - name: Record the auto-pass for the other gates
        if: ${{ steps.decide.outputs.auto-pass == 'true' }}
        run: mkdir -p flaky-rerun && echo true > flaky-rerun/auto-pass
      - name: Share the auto-pass with the other gates
        if: ${{ steps.decide.outputs.auto-pass == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: flaky-rerun/auto-pass
          retention-days: 1
          overwrite: true

      # `pattern` (not `name`): the artifact is absent whenever there's no auto-pass, which `name`
      # treats as an error and `pattern` as nothing to download.
      - name: Look for the run's auto-pass
        if: ${{ !inputs.decide-flaky-rerun }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: ${{ env.ARTIFACT }}
          path: flaky-rerun
      - name: Follow the run's auto-pass
        id: follow
        if: ${{ !inputs.decide-flaky-rerun }}
        run: |
          if [ -n "$(find flaky-rerun -type f 2>/dev/null)" ]; then
            echo "Every failure on this PR is a confirmed flake; skipping the suite on this re-run."
            echo "auto-pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "No auto-pass for this re-run; the suite runs as usual."
          fi

  files-changed:
    name: Detect changed files
    needs: should-run
    if: ${{ needs.should-run.outputs.verdict == 'defer' && inputs.filters != '' }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      matched: ${{ steps.match.outputs.matched }}
      any: ${{ steps.match.outputs.any }}
    steps:
      # The filter definitions are the only thing on disk that paths-filter reads.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      # No file lists: one filter's list can outgrow the 128 KiB a single environment variable may
      # hold on Linux, and every caller after the gate pays for it. A job that needs the paths runs
      # its own paths filter.
      - name: Test which files changed
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-paths.yaml
      - name: Match the diff against the requested filters
        id: match
        uses: actions/github-script@v9
        env:
          REQUESTED: ${{ inputs.filters }}
          # The names of every filter the diff matched, as a JSON array.
          CHANGED: ${{ steps.changes.outputs.changes }}
        with:
          script: | # js
            const fs = require('fs');

            const requested = process.env.REQUESTED.split(/[\s,]+/).filter(Boolean);
            const changed = JSON.parse(process.env.CHANGED);

            // A filter name that no longer exists would silently gate the suite off forever.
            const defined = [...fs.readFileSync('.github/file-paths.yaml', 'utf8')
              .matchAll(/^(\w+):/gm)].map(([, name]) => name);
            const unknown = requested.filter((filter) => !defined.includes(filter));
            if (unknown.length) {
              core.setFailed(`Unknown filter(s) in .github/file-paths.yaml: ${unknown.join(', ')}`);
              return;
            }

            const matched = requested.filter((filter) => changed.includes(filter));
            core.info(`requested: ${requested.join(', ')}`);
            core.info(`matched: ${matched.join(', ') || 'none'}`);
            core.setOutput('matched', JSON.stringify(matched));
            core.setOutput('any', matched.length > 0);
