# Everything else: cleans, CI entry points and the dependency gate.

tasks:
  ci:
    command: noop
    deps:
      - ci-frontend
      - ci-backend
    options:
      cache: false

  ci-backend:
    script: >-
      clojure -X:dev:ee:ee-dev:drivers:drivers-dev:eastwood && clojure
      -X:dev:test
    options:
      cache: false

  ci-frontend:
    command: noop
    deps:
      - lint
      - test
    options:
      cache: false

  clean-dev-js:
    script: >-
      rm -rf resources/frontend_client/app/dist
      target/classes/frontend_client/app/dist
      resources/frontend_client/app/embedding-sdk
      target/classes/frontend_client/app/embedding-sdk
    options:
      cache: false

  ensure-deps:
    script: >-
      bun install
    inputs:
      - bun.lock
      - package.json

  remove-webpack-cache:
    script: >-
      rm -rf ./node_modules/.cache
    options:
      cache: false
