## The dependency jobs find changed entities by comparing their updated_at with the version their status row last
## recorded, instead of reading stale flags that every write had to set. The status rows lose the flag and the retry
## state, and the rows a dependency's version is made of get the timestamps they lacked.

databaseChangeLog:
  - changeSet:
      id: v65.nuaq4b
      author: ranquild
      comment: Drop the index on dependency_status.stale, which the jobs no longer read
      changes:
        - dropIndex:
            tableName: dependency_status
            indexName: idx_dependency_status_stale
      rollback:
        - sql:
            dbms: postgresql
            sql: CREATE INDEX idx_dependency_status_stale ON dependency_status(stale) WHERE stale = true
        - sql:
            dbms: mysql,mariadb,h2
            sql: CREATE INDEX idx_dependency_status_stale ON dependency_status(stale)

  - changeSet:
      id: v65.dngxhg
      author: ranquild
      comment: Drop dependency_status.stale, which change detection from updated_at replaces
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: stale
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: stale
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity needs dependency recalculation
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.brqkb7
      author: ranquild
      comment: Drop dependency_status.fail_count, which change detection from updated_at replaces
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: fail_count
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: fail_count
                  type: int
                  defaultValueNumeric: 0
                  remarks: Number of consecutive failed dependency calculation attempts
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.drkztr
      author: ranquild
      comment: Drop dependency_status.next_retry_at, which change detection from updated_at replaces
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: next_retry_at
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: next_retry_at
                  type: ${timestamp_type}
                  remarks: Earliest time at which a failed entity can be retried (null means immediately processable)

  - changeSet:
      id: v65.mhlfsd
      author: ranquild
      comment: Drop dependency_status.terminal, which change detection from updated_at replaces
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: terminal
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: terminal
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity has exceeded max retries and should not be retried until modified
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.3xftdb
      author: ranquild
      comment: Add dependency_status.seen_updated_at
      changes:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: seen_updated_at
                  type: ${timestamp_type}
                  remarks: The latest updated_at of the entity and the rows it is made of when its dependencies were computed, or null to compute them again
      rollback:
        - dropColumn:
            tableName: dependency_status
            columnName: seen_updated_at

  - changeSet:
      id: v65.8km8x7
      author: ranquild
      comment: Add dependency_status.seen_count
      changes:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: seen_count
                  type: int
                  remarks: The number of rows the entity is made of when its dependencies were computed
      rollback:
        - dropColumn:
            tableName: dependency_status
            columnName: seen_count

  - changeSet:
      id: v65.62kjla
      author: ranquild
      comment: Add dependency_status.created_at
      changes:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: dependency_status
            columnName: created_at

  - changeSet:
      id: v65.3s0sav
      author: ranquild
      comment: Add dependency_status.updated_at
      changes:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last written
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: dependency_status
            columnName: updated_at

  - changeSet:
      id: v65.mlaukk
      author: ranquild
      comment: Add dashboardcard_series.created_at
      changes:
