# An example GitHub Actions workflow for a repository that library branching syncs. It checks the files of each
# pull request: every file decodes, the snapshot is well formed, and, with .metabase/manifest.yaml, every table and
# field that the content names is in the manifest. It needs no Metabase instance and no Metabase source.
#
# Copy it to .github/workflows/ of the repository. Set METABASE_VERSION to the tag of the Metabase release that
# production runs, and refresh .metabase/manifest.yaml from production (GET /api/ee/library-branching/manifest) when
# its databases change. The checker is the asset library-checker.jar of that release: a babashka uberjar that
# `bb --config bin/library-checker/bb.edn build` makes from the Metabase source.
name: Library check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      METABASE_VERSION: vX.Y.Z
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install babashka
        run: |
          curl -sLO https://raw.githubusercontent.com/babashka/babashka/master/install
          bash install --version 1.12.212 --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Get the checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "$METABASE_VERSION" --repo metabase/metabase
          --pattern library-checker.jar --dir "$RUNNER_TEMP"

      - name: Check
        run: bb "$RUNNER_TEMP/library-checker.jar" .
