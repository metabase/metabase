# ClojureScript: compile, watch, REPL and the shadow-cljs server.

tasks:
  build-cljs:
    script: >-
      shadow-cljs compile app
    inputs:
      - "@group(cljs)"
    outputs:
      - target/cljs_dev/**

  build-hot-cljs:
    script: >-
      shadow-cljs watch app
    options:
      persistent: true
      cache: false
      runInCI: false
      outputStyle: stream

  build-release-cljs:
    script: >-
      shadow-cljs release app
    deps:
      - clean-release-cljs
    inputs:
      - "@group(cljs)"
    outputs:
      - target/cljs_release/**

  build-watch-cljs:
    script: >-
      shadow-cljs watch app
    options:
      persistent: true
      cache: false
      runInCI: false
      outputStyle: stream

  clean-cljs:
    command: noop
    deps:
      - clean-dev-cljs
      - clean-release-cljs
    options:
      cache: false

  clean-dev-cljs:
    script: >-
      rm -rf target/cljs_dev/*
    options:
      cache: false

  clean-release-cljs:
    script: >-
      rm -rf target/cljs_release/*
    options:
      cache: false

  cljs-nrepl:
    script: >-
      shadow-cljs node-repl
                  -d cider/cider-nrepl:0.57.0
                  -d cider/piggieback:0.6.1
                  -d refactor-nrepl/refactor-nrepl:3.11.0
    options:
      persistent: true
      cache: false
      runInCI: false
      outputStyle: stream

  cljs-server-restart:
    script: >-
      shadow-cljs restart
    options:
      cache: false

  cljs-server-start:
    script: >-
      shadow-cljs start
    options:
      cache: false

  cljs-server-stop:
    script: >-
      shadow-cljs stop
    options:
      cache: false
