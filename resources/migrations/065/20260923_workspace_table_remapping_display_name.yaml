## Record the display name a workspace table answers to.
##
## A workspace table is named by a random UUID, so the name sync humanizes from it says nothing about what the
## table holds. Readers see the workspace table where the canonical table would be, so it has to answer to the
## canonical table's display name -- which is known when the remapping is written, and cannot be derived in SQL
## when it is read.

databaseChangeLog:

  - changeSet:
      id: v65.2026-09-23T21:00:00
      author: ranquild
      comment: Add workspace_table_remapping.display_name
      changes:
        - addColumn:
            tableName: workspace_table_remapping
            columns:
              - column:
                  name: display_name
                  type: varchar(254)
                  remarks: Display name the workspace table answers to, that of the canonical table it stands in for
                  constraints:
                    nullable: true
