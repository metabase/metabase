## Remote-sync worktrees: a worktree is a checked-out branch materialized alongside the main app.
## Its content lives in the same tables as the main app's, tagged with `worktree_id`.
##
## The main app is itself a worktree row -- the one flagged `is_default` -- so `worktree_id` is
## NOT NULL everywhere and no row is ambiguous. Its `branch` is null: the main app follows the
## `remote-sync-branch` setting rather than being pinned to one branch. The
## default worktree is created here and nothing else ever sets the flag.
##
## Making `worktree_id` NOT NULL is what lets the database enforce worktree containment. A child
## carries a composite foreign key `(parent_id, worktree_id) -> parent (id, worktree_id)`, so a
## row can only ever be attached to a parent in its own worktree, and nothing can be moved across
## worktrees. With a nullable `worktree_id` this would not work: a foreign key with a null column
## is not checked at all, which would let main-app rows sit inside worktree collections.
##
## Where the parent link is NOT NULL (dashboard cards, tabs, series, parameter cards, actions,
## transform tag assignments) the check always applies. Where it is nullable (anything parented by
## a collection) it applies to everything except root-level content, which has no parent to check.
##
## The single-column `entity_id` uniques these composite uniques replace are dropped in
## 20260730_drop_entity_id_uniques.yaml, which runs before this file.

databaseChangeLog:

  - changeSet:
      id: v64.2026-07-30T10:00:00
      author: ranquild
      comment: Create remote_sync_worktree table - one row per checkout, including the default one standing for the main app
      changes:
        - createTable:
            tableName: remote_sync_worktree
            remarks: One row per checked-out remote-sync branch, plus the default row standing for the main app
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch
                  type: varchar(254)
                  remarks: Git branch this worktree is checked out to; null for the default worktree, which follows the remote-sync-branch setting
                  constraints:
                    nullable: true
              - column:
                  name: is_default
                  type: ${boolean.type}
                  remarks: True on the single row standing for the main app, false on every real worktree
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: User who created this worktree; null once that user is deleted, and on the default worktree
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: When this worktree was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: When this worktree was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: v64.2026-07-30T10:00:01
      author: ranquild
      comment: Unique index on remote_sync_worktree.branch - a branch can be checked out at most once
      changes:
        - createIndex:
            tableName: remote_sync_worktree
            indexName: idx_remote_sync_worktree_branch
            unique: true
            columns:
              - column:
                  name: branch

  - changeSet:
      id: v64.2026-07-30T10:00:02
      author: ranquild
      comment: FK remote_sync_worktree.creator_id -> core_user; SET NULL so the worktree survives its creator's deletion
      changes:
        - addForeignKeyConstraint:
            baseTableName: remote_sync_worktree
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_remote_sync_worktree_creator_id
            onDelete: SET NULL

  - changeSet:
      id: v64.2026-07-30T10:00:03
      author: ranquild
      comment: Insert the default worktree - the main app's own row, which every pre-existing row is attached to below
      changes:
        - insert:
            tableName: remote_sync_worktree
            columns:
              - column:
                  name: is_default
                  valueBoolean: true
      rollback:
        - delete:
            tableName: remote_sync_worktree
            where: is_default = TRUE

  - changeSet:
      id: v64.2026-07-30T10:00:04
      author: ranquild
      comment: Add collection.worktree_id
      changes:
        - addColumn:
            tableName: collection
            columns:
              - column:
                  name: worktree_id
                  type: int
                  remarks: Worktree this collection was checked out into; the default worktree is the main app
                  constraints:
                    nullable: true

  - changeSet:
      id: v64.2026-07-30T10:00:05
      author: ranquild
      comment: Attach every existing collection row to the default worktree - they are all main-app content
      changes:
        - update:
            tableName: collection
            columns:
              - column:
                  name: worktree_id
                  valueComputed: (SELECT id FROM remote_sync_worktree WHERE is_default = TRUE)
      rollback: []

  - changeSet:
      id: v64.2026-07-30T10:00:06
      author: ranquild
      comment: Require collection.worktree_id from now on - it is what makes the composite worktree FKs below enforceable
      changes:
        - addNotNullConstraint:
            tableName: collection
            columnName: worktree_id
            columnDataType: int

