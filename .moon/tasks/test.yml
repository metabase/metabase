# Test suites and their runners.

tasks:
  clean-cypress-artifacts:
    script: |-
      rm -R -f cypress/
    options:
      cache: false

  embedding-sdk-test-unit:
    # Not cached. A stale hit on a test task is a false pass, which is the worst
    # failure this config can produce, and the input sets are not yet verified:
    # jest.base.conf.js maps docs/* to the real docs directory, so a docs change
    # can affect a test while sitting outside every declared input. Revisit once
    # bin/audit-task-reads.sh has actually run and proven them.
    script: |-
      jest --ignoreProjects ci-scripts \
           --maxWorkers=4 \
           enterprise/frontend/src/embedding-sdk-package/ \
           enterprise/frontend/src/embedding-sdk-bundle/ \
           enterprise/frontend/src/embedding-sdk-shared/
    inputs:
      - "@group(sdk)"
      - "@group(jest)"
    options:
      cache: false

  generate-cypress-html-report:
    script: |-
      mochawesome-merge cypress/reports/mochareports/*.json \
          > cypress/reports/cypress-test-report.json \
      && marge cypress/reports/cypress-test-report.json -o cypress/reports \
                                                        --inline
    options:
      cache: false

  test:
    command: noop
    deps:
      - test-unit
      - test-timezones
      - test-cypress
    options:
      cache: false
      runDepsInParallel: false

  test-ci-scripts:
    # Not cached. A stale hit on a test task is a false pass, which is the worst
    # failure this config can produce, and the input sets are not yet verified:
    # jest.base.conf.js maps docs/* to the real docs directory, so a docs change
    # can affect a test while sitting outside every declared input. Revisit once
    # bin/audit-task-reads.sh has actually run and proven them.
    script: |-
      jest --selectProjects ci-scripts --maxWorkers=4
    inputs:
      - bin/**
      - release/**
      - "@group(jest)"
    options:
      cache: false

  test-cljs:
    # Not cached. A stale hit on a test task is a false pass, which is the worst
    # failure this config can produce, and the input sets are not yet verified:
    # jest.base.conf.js maps docs/* to the real docs directory, so a docs change
    # can affect a test while sitting outside every declared input. Revisit once
    # bin/audit-task-reads.sh has actually run and proven them.
    script: |-
      shadow-cljs compile test \
      && node target/node-tests.js
    inputs:
      - "@group(cljs)"
      - test/**
    options:
      cache: false

  test-cypress:
    script: |-
      tsx ./e2e/runner/run_cypress_local.ts
    options:
      cache: false

  test-cypress-host-sample-apps:
    script: |-
      tsx ./e2e/runner/run_cypress_host_sample_apps.ts
    options:
      cache: false

  test-debug:
    script: |-
      node --inspect-brk node_modules/.bin/jest \
           --runInBand \
           --detectOpenHandles
    deps:
      - build-cljs
    options:
      cache: false

  test-memory:
    script: |-
      node --expose-gc ./node_modules/.bin/jest \
           --runInBand \
           --config jest.memory.conf.js
    options:
      cache: false

  test-timezones:
    script: |-
      ./frontend/test/__runner__/run_timezone_tests
    options:
      cache: false

  test-timezones-unit:
    # Not cached. A stale hit on a test task is a false pass, which is the worst
    # failure this config can produce, and the input sets are not yet verified:
    # jest.base.conf.js maps docs/* to the real docs directory, so a docs change
    # can affect a test while sitting outside every declared input. Revisit once
    # bin/audit-task-reads.sh has actually run and proven them.
    script: |-
      jest --silent --maxWorkers=4 --config jest.tz.unit.conf.js
    deps:
      - build-cljs
    inputs:
      - "@group(frontend)"
      - jest.tz.unit.conf.js
    options:
      cache: false

  test-unit:
    # Not cached. A stale hit on a test task is a false pass, which is the worst
    # failure this config can produce, and the input sets are not yet verified:
    # jest.base.conf.js maps docs/* to the real docs directory, so a docs change
    # can affect a test while sitting outside every declared input. Revisit once
    # bin/audit-task-reads.sh has actually run and proven them.
    script: |-
      jest --ignoreProjects ci-scripts --maxWorkers=4
    deps:
      - build-cljs
    inputs:
      - "@group(frontend)"
      - "@group(jest)"
    options:
      cache: false

  test-unit-watch:
    script: |-
      jest --ignoreProjects ci-scripts --maxWorkers=4 --watch
    deps:
      - build-cljs
    options:
      persistent: true
      cache: false
      runInCI: false
      outputStyle: stream

  test-unit-watch-cljs:
    command: noop
    deps:
      - build-watch-cljs
      - test-unit-watch
    options:
      persistent: true
      cache: false
      runInCI: false
      outputStyle: stream

  validate-e2e-filenames:
    script: |-
      node e2e/validate-e2e-test-files.js
    inputs:
      - "@group(e2e)"
