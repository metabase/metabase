databaseChangeLog:
  - changeSet:
      id: v64.2026-09-16T00:00:00
      author: poom
      comment: Assign existing permission groups to data apps
      changes:
        - createTable:
            tableName: data_app_group
            remarks: Instance-local permission group assignments for data apps
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
                    primaryKeyName: pk_data_app_group
              - column:
                  name: data_app_id
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: permission_group_id
                  type: int
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: data_app_group
            columnNames: data_app_id, permission_group_id
            constraintName: uq_data_app_group
        - addForeignKeyConstraint:
            baseTableName: data_app_group
            baseColumnNames: data_app_id
            referencedTableName: data_app
            referencedColumnNames: id
            constraintName: fk_data_app_group_app
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: data_app_group
            baseColumnNames: permission_group_id
            referencedTableName: permissions_group
            referencedColumnNames: id
            constraintName: fk_data_app_group_group
            onDelete: CASCADE
        - createIndex:
            tableName: data_app_group
            indexName: idx_data_app_group_group
            columns:
              - column:
                  name: permission_group_id

  - changeSet:
      id: v64.2026-09-16T00:00:01
      author: poom
      comment: Remove generated groups and individual assignments from the data apps preview
      changes:
        - delete:
            tableName: permissions_group
            where: is_data_app_group = true
      rollback: # Preview assignments are intentionally discarded.
        - sql:
            sql: SELECT 1;

  - changeSet:
      id: v64.2026-09-16T00:00:02
      author: poom
      comment: Remove the generated data app group foreign key
      changes:
        - dropForeignKeyConstraint:
            baseTableName: data_app
            constraintName: fk_data_app_permission_group_id
      rollback:
        - addForeignKeyConstraint:
            baseTableName: data_app
            baseColumnNames: permission_group_id
            referencedTableName: permissions_group
            referencedColumnNames: id
            constraintName: fk_data_app_permission_group_id
            onDelete: SET NULL

  - changeSet:
      id: v64.2026-09-16T00:00:03
      author: poom
      comment: Remove the generated data app group reference
      changes:
        - dropColumn:
            tableName: data_app
            columnName: permission_group_id
      rollback:
        - addColumn:
            tableName: data_app
            columns:
              - column:
                  name: permission_group_id
                  type: int
                  constraints:
                    nullable: true

  - changeSet:
      id: v64.2026-09-16T00:00:04
      author: poom
      comment: Remove the generated data app group marker
      changes:
        - dropColumn:
            tableName: permissions_group
            columnName: is_data_app_group
      rollback:
        - addColumn:
            tableName: permissions_group
            columns:
              - column:
                  name: is_data_app_group
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
