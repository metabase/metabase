name: Deploy PR Environment
run-name: Building Dynamic PR Environment for ${{ github.ref_name }} by @${{ github.actor }}

on:
  pull_request:
    types: [ opened, labeled, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read
  pull-requests: write

jobs:
  build:
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == 'metabase/metabase' &&
        (
          github.event.action != 'labeled' ||
          contains(fromJSON('["PR-Env", "PR-Env-self-hosting", "PR-Env-analytics-dev"]'), github.event.label.name)
        ) &&
        (
          contains(github.event.pull_request.labels.*.name, 'PR-Env') ||
          contains(github.event.pull_request.labels.*.name, 'PR-Env-self-hosting') ||
          contains(github.event.pull_request.labels.*.name, 'PR-Env-analytics-dev')
        )
      }}
    uses: ./.github/workflows/uberjar.yml
    secrets: inherit

  containerize:
    needs: [build]
    uses: ./.github/workflows/containerize-jar.yml
    secrets: inherit
    with:
      edition: ee
      registry: ecr
      repo: metabase-enterprise
      tag: ${{ github.event.pull_request.head.sha }}
      commit: ${{ github.event.pull_request.head.sha }}
      platforms: linux/amd64

  deploy:
    needs: [containerize]
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    name: PR Review ENV
    timeout-minutes: 60
    outputs:
      self_hosting: ${{ steps.label.outputs.self_hosting }}
      analytics_dev_mode: ${{ steps.label.outputs.analytics_dev_mode }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Resolve Labels
        id: label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          self_hosting=false
          analytics_dev_mode=false

          while IFS= read -r label; do
            case "$label" in
              PR-Env-self-hosting)  self_hosting=true ;;
              PR-Env-analytics-dev) analytics_dev_mode=true ;;
            esac
          done < <(jq -r '.[]' <<< "$LABELS")

          {
            echo "self_hosting=${self_hosting}"
            echo "analytics_dev_mode=${analytics_dev_mode}"
          } >> "$GITHUB_OUTPUT"
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.PR_ENV_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PR_ENV_TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.50.1
          sha256sum: d9fe6b480fb5078f0aa57dace686898dda7e2a768884271159faa74846bfb576
      - name: Create OIDC Token
        id: create-oidc-token
        shell: bash
        run: |
          export OIDC_URL_WITH_AUDIENCE="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ secrets.PR_ENV_K8S_AUDIENCE }}"
          IDTOKEN=$(curl -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" -H "Accept: application/json; api-version=2.0" "$OIDC_URL_WITH_AUDIENCE" | jq -r .value)
          echo "::add-mask::${IDTOKEN}"
          echo "idToken=${IDTOKEN}" >>$GITHUB_OUTPUT
      - name: Setup Kube Context
        uses: azure/k8s-set-context@v2
        with:
          method: kubeconfig
          kubeconfig: |
            kind: Config
            apiVersion: v1
            current-context: default
            clusters:
            - name: default
              cluster:
                certificate-authority-data: ${{ secrets.PR_ENV_K8S_CERTIFICATE_AUTHORITY_DATA }}
                server: ${{ secrets.PR_ENV_K8S_SERVER }}
            users:
            - name: oidc-token
              user:
                token: ${{ steps.create-oidc-token.outputs.IDTOKEN }}
            contexts:
            - name: default
              context:
                cluster: default
                namespace: default
                user: oidc-token
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PR_ENV_IAM_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: us-east-1
      - name: Setup psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create app database if not exists
        run: |
          export PGPASSWORD='${{ secrets.PR_ENV_DB_PASSWORD }}'
          export PGUSER=${{ secrets.PR_ENV_DB_USER }}
          export PGHOST=${{ secrets.PR_ENV_DB_HOST }}
          export PGDATABASE=${{ secrets.PR_ENV_DB_NAME }}
          psql -tc "SELECT 1 FROM pg_database WHERE datname = 'hosting_pr${{ github.event.number }}'" \
          | grep -q 1 \
          || psql -c "CREATE DATABASE hosting_pr${{ github.event.number }}"
      - name: Download Deployment YAML template
        if: ${{ steps.label.outputs.self_hosting != 'true' }}
        run: aws s3 cp s3://metabase-pr-env/metabase.yml.tmpl ./metabase.yml.tmpl
      - name: Render Deployment YAML
        if: ${{ steps.label.outputs.self_hosting != 'true' }}
        uses: nowactions/envsubst@v1
        with:
          input: ./metabase.yml.tmpl
          output: ./metabase.yml
        env:
          IMAGE_TAG: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
          MB_PREMIUM_EMBEDDING_TOKEN: ${{ secrets.PR_ENV_MB_PREMIUM_EMBEDDING_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MB_ANALYTICS_DEV_MODE: ${{ steps.label.outputs.analytics_dev_mode }}
      - name: Deploy PR Review ENV
        if: ${{ steps.label.outputs.self_hosting != 'true' }}
        run: |
          kubectl apply -f ./metabase.yml
      - name: Download Helm values template (self-hosting)
        if: ${{ steps.label.outputs.self_hosting == 'true' }}
        run: aws s3 cp s3://metabase-pr-env/values.yaml.tmpl ./values.yaml.tmpl
      - name: Render Helm values (self-hosting)
        if: ${{ steps.label.outputs.self_hosting == 'true' }}
        uses: nowactions/envsubst@v1
        with:
          input: ./values.yaml.tmpl
          output: ./values.yaml
        env:
          IMAGE_TAG: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
          MB_PREMIUM_EMBEDDING_TOKEN: ${{ secrets.PR_ENV_MB_PREMIUM_EMBEDDING_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          DB_HOST: ${{ secrets.PR_ENV_DB_HOST }}
          DB_USERNAME: ${{ secrets.PR_ENV_DB_USER }}
          DB_PASSWORD: ${{ secrets.PR_ENV_DB_PASSWORD }}
          CONFIG: ${{ secrets.PR_ENV_CONFIG }}
          MB_ANALYTICS_DEV_MODE: ${{ steps.label.outputs.analytics_dev_mode }}

      - name: Setup Helm
        if: ${{ steps.label.outputs.self_hosting == 'true' }}
        uses: azure/setup-helm@v4
        with:
          version: 'latest'
      - name: Login to Quay.io
        if: ${{ steps.label.outputs.self_hosting == 'true' }}
        run: |
          helm registry login quay.io \
            --username ${{ secrets.QUAY_USERNAME }} \
            --password ${{ secrets.QUAY_PASSWORD }}
      - name: Deploy PR Review ENV (self-hosting)
        if: ${{ steps.label.outputs.self_hosting == 'true' }}
        run: |
          helm upgrade --install hosting-pr${{ github.event.number }} \
            oci://quay.io/enterprisemetabase/chart-metabase-stack \
            --namespace hosting-pr${{ github.event.number }} \
            --create-namespace \
            --values ./values.yaml \
            --atomic \
            --timeout 10m
  preview_links:
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    needs: [deploy]
    steps:
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          message: |
            👋 Deploying a preview environment for commit ${{ github.event.pull_request.head.sha || github.sha }}.
            ✅ Preview:
                https://pr${{ github.event.number }}.coredev.metabase.com
            🗒️ [login instructions](https://www.notion.so/metabase/Ephemeral-PR-Environments-c74a3710c87a460dbf4fc0007a001458)
            📦 Deployment type: ${{ needs.deploy.outputs.self_hosting == 'true' && 'PR-Env-self-hosting' || (needs.deploy.outputs.analytics_dev_mode == 'true' && 'PR-Env-analytics-dev' || 'PR-Env') }}
