  - changeSet:
      id: 1h91ve
      author: ranquild
      comment: Clear the caveats and points_of_interest that their unset flags said no user set, since a value now means a user set it
      changes:
        - sql:
            sql: >-
              UPDATE metabase_table_user_settings
              SET caveats = CASE WHEN caveats_set = TRUE THEN caveats ELSE NULL END,
                  points_of_interest = CASE WHEN points_of_interest_set = TRUE THEN points_of_interest ELSE NULL END
              WHERE caveats_set = FALSE OR points_of_interest_set = FALSE
      rollback: # not necessary; the cleared values were not shown to users
