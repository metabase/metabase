## Before v58 every user created through SSO got a random password, which v58 copied into a `password` AuthIdentity.
## Password reset now allows any user with a `password` AuthIdentity, so delete the ones of SSO users that were never
## used to log in.

databaseChangeLog:
  - changeSet:
      id: q0zohg
      author: ranquild
      comment: Delete the password AuthIdentities of SSO users that were never used to log in
      changes:
        - sql:
            sql: >-
              DELETE FROM auth_identity
              WHERE provider = 'password'
                AND last_used_at IS NULL
                AND EXISTS (SELECT 1 FROM core_user
                            WHERE core_user.id = auth_identity.user_id
                              AND core_user.sso_source IS NOT NULL)
      rollback:
