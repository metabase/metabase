dataset_query:
  database: Search Harness
  stages:
  - native: |-
      SELECT engine AS "Engine", round(avg(value)::numeric, 3) AS "nDCG@10"
      FROM harness_scenario_metric
      WHERE corpus_id = 'northwind-golden-v1' AND metric = 'ndcg@10' AND embedder = 'ollama/all-minilm' AND embedding_text = 'baseline' AND text_strategy = 'none'
      GROUP BY engine
      ORDER BY array_position(ARRAY['semantic', 'semantic-pure', 'semantic-vector', 'sqlite-vec1', 'sqlite-vec1-pure', 'lucene', 'lucene-pure', 'appdb', 'in-place'], engine)
    lib/type: mbql.stage/native
  lib/type: mbql/query
