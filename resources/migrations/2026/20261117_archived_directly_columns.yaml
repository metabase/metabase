## Pulses, snippets and timelines record, as cards, dashboards and collections do, whether they were archived on their
## own or along with their collection, so that restoring a collection restores only what its archive took down.

databaseChangeLog:

  - changeSet:
      id: pu1a7q
      author: ranquild
      comment: Add pulse.archived_directly
      changes:
        - addColumn:
            tableName: pulse
            columns:
              - column:
                  name: archived_directly
                  type: ${boolean.type}
                  remarks: Whether the Pulse was archived directly, rather than along with its collection
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: pu2b8r
      author: ranquild
      comment: Mark already-archived pulse rows as archived directly unless their collection is archived
      changes:
        - sql:
            sql: >-
              UPDATE pulse
              SET archived_directly = TRUE
              WHERE archived = TRUE AND (dashboard_id IS NOT NULL OR NOT EXISTS (SELECT 1 FROM collection WHERE collection.id = pulse.collection_id AND collection.archived = TRUE));
      rollback: # nothing to do; rolling back the preceding changeset drops the column

  - changeSet:
      id: nq3c9x
      author: ranquild
      comment: Add native_query_snippet.archived_directly
      changes:
        - addColumn:
