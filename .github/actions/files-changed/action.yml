name: Files changed
description: >
  Work out which parts of the repo a commit touches, using dorny/paths-filter
  against .github/file-paths.yaml.

  Checks the repository out when it needs to, then memoises the answer in the
  Actions cache under a key derived from the commit under test and the filter
  configuration. A commit that has already been filtered — by an earlier
  workflow in the same push, or by a re-run — short-circuits to the cached
  result and skips both the checkout and the diff.

inputs:
  filters:
    description: "Path to the paths-filter configuration, relative to the repo root."
    required: false
    default: .github/file-paths.yaml
  list-files:
    description: >
      Format for the `<filter>_files` outputs: none, csv, shell, json or escape.
      `none` (the default) skips them, which keeps the outputs small.
    required: false
    default: none
  base:
    description: >
      Git ref to diff against. Leave empty to let paths-filter decide: the PR
      base for pull requests, the pushed-over commit for pushes.
    required: false
    default: ""
  token:
    description: "Token used to read the changed file list from the API. Defaults to github.token."
    required: false
    default: ""
  checkout:
    description: >
      `auto` (the default) checks the repository out only when the filter file
      isn't already in the workspace, so a job that has already checked out — or
      that sparse-checked-out `.github` just to reach this action — doesn't pay
      for a second clone. `true` always checks out, `false` never does.
    required: false
    default: auto
  fetch-depth:
    description: "fetch-depth for the checkout this action performs, when it performs one."
    required: false
    default: "1"
  cache:
    description: "Set to false to always recompute, reading from and writing to no cache."
    required: false
    default: "true"

outputs:
  all_changed:
    description: "'true' when the commit touches a file matched by the `all_changed` filter."
    value: ${{ steps.filter.outputs.all_changed || steps.hydrate.outputs.all_changed }}
  all_changed_files:
    description: "Files matched by the `all_changed` filter, formatted per `list-files`. Empty when `list-files` is `none`."
    value: ${{ steps.filter.outputs.all_changed_files || steps.hydrate.outputs.all_changed_files }}
  default:
    description: "'true' when the commit touches a file matched by the `default` filter."
    value: ${{ steps.filter.outputs.default || steps.hydrate.outputs.default }}
  default_files:
    description: "Files matched by the `default` filter, formatted per `list-files`. Empty when `list-files` is `none`."
    value: ${{ steps.filter.outputs.default_files || steps.hydrate.outputs.default_files }}
  actionlint:
    description: "'true' when the commit touches a file matched by the `actionlint` filter."
    value: ${{ steps.filter.outputs.actionlint || steps.hydrate.outputs.actionlint }}
  actionlint_files:
    description: "Files matched by the `actionlint` filter, formatted per `list-files`. Empty when `list-files` is `none`."
    value: ${{ steps.filter.outputs.actionlint_files || steps.hydrate.outputs.actionlint_files }}
  shared_sources:
    description: "'true' when the commit touches a file matched by the `shared_sources` filter."
    value: ${{ steps.filter.outputs.shared_sources || steps.hydrate.outputs.shared_sources }}
  shared_sources_files:
    description: "Files matched by the `shared_sources` filter, formatted per `list-files`. Empty when `list-files` is `none`."
    value: ${{ steps.filter.outputs.shared_sources_files || steps.hydrate.outputs.shared_sources_files }}
  shared_specs:
    description: "'true' when the commit touches a file matched by the `shared_specs` filter."
    value: ${{ steps.filter.outputs.shared_specs || steps.hydrate.outputs.shared_specs }}
  shared_specs_files:
    description: "Files matched by the `shared_specs` filter, formatted per `list-files`. Empty when `list-files` is `none`."
    value: ${{ steps.filter.outputs.shared_specs_files || steps.hydrate.outputs.shared_specs_files }}
  shared_ci:
    description: "'true' when the commit touches a file matched by the `shared_ci` filter."
    value: ${{ steps.filter.outputs.shared_ci || steps.hydrate.outputs.shared_ci }}
  shared_ci_files:
    description: "Files matched by the `shared_ci` filter, formatted per `list-files`. Empty when `list-files` is `none`."
    value: ${{ steps.filter.outputs.shared_ci_files || steps.hydrate.outputs.shared_ci_files }}
  shared_e2e:
    description: "'true' when the commit touches a file matched by the `shared_e2e` filter."
    value: ${{ steps.filter.outputs.shared_e2e || steps.hydrate.outputs.shared_e2e }}
  shared_e2e_files:
    description: "Files matched by the `shared_e2e` filter, formatted per `list-files`. Empty when `list-files` is `none`."
    value: ${{ steps.filter.outputs.shared_e2e_files || steps.hydrate.outputs.shared_e2e_files }}
  frontend_ci:
    description: "'true' when the commit touches a file matched by the `frontend_ci` filter."
    value: ${{ steps.filter.outputs.frontend_ci || steps.hydrate.outputs.frontend_ci }}
  frontend_ci_files:
    description: "Files matched by the `frontend_ci` filter, formatted per `list-files`. Empty when `list-files` is `none`."
    value: ${{ steps.filter.outputs.frontend_ci_files || steps.hydrate.outputs.frontend_ci_files }}
