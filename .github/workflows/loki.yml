name: Loki Visual Regression Testing

on:
  workflow_call:
    inputs:
      test-plan-artifact-id:
        description: "ID of this run's test-plan.json artifact, or '' to run the full suite."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-loki
  cancel-in-progress: true

jobs:
  # The shared verdict plus the run's story selection, in one job:
  # `.github/scripts/gate/loki.ts` turns them into whether the visual test runs and whether it has a
  # selection to narrow itself to, so the test job carries a single condition and everything else is
  # decided here. The script is a plain module, unit tested by the ci-scripts jest project.
  gate:
    name: Decide whether to run
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      visual-test: ${{ steps.plan.outputs.visual-test }}
      test-plan-artifact-id: ${{ steps.plan.outputs.test-plan-artifact-id }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            /.nvmrc
            /package.json
          sparse-checkout-cone-mode: false

      - name: Apply the shared gate
        id: base
        uses: ./.github/actions/test-gate
        with:
          filters: frontend_loki_all

      - name: Prepare Node + Bun environment
        uses: ./.github/actions/prepare-node-bun

      # Only for the verdict: a plan that selects no stories keeps the visual test out of the run
      # entirely. The paths file it writes here is thrown away with the runner -- the test job reads
      # the plan again for its own copy.
      - name: Read the Loki story selection
        id: story-selection
        if: ${{ steps.base.outputs.run == 'true' && inputs.test-plan-artifact-id != '' }}
        uses: ./.github/actions/prepare-test-selection
        with:
          suite: loki
          test-plan-artifact-id: ${{ inputs.test-plan-artifact-id }}

      - name: Plan the Loki jobs
        id: plan
        env:
          RUN: ${{ steps.base.outputs.run }}
          SELECTION: ${{ steps.story-selection.outputs.selection }}
          TEST_PLAN_ARTIFACT_ID: ${{ inputs.test-plan-artifact-id }}
        run: bun .github/scripts/gate/loki.ts

  visual-test:
    name: loki-run
    needs: gate
    if: ${{ needs.gate.outputs.visual-test != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    services:
      docker:
        image: docker:19.03.12
        options: --privileged
        ports:
          - 2376:2376
        env:
          DOCKER_TLS_CERTDIR: /certs
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /tmp/docker-certs:/certs/client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare frontend environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        run: NODE_ENV=development bun run build-pure:cljs

      - name: Prepare Loki story selection
        id: loki-selection
        if: ${{ needs.gate.outputs.test-plan-artifact-id != '' }}
        uses: ./.github/actions/prepare-test-selection
        with:
          suite: loki
          test-plan-artifact-id: ${{ needs.gate.outputs.test-plan-artifact-id }}

      - name: Build Storybook
        env:
          STORYBOOK_STORY_PATHS_FILE: ${{ steps.loki-selection.outputs.paths-file }}
        run: bun run build-storybook

      - name: Run Loki Visual Tests
        # Loki drops stories with parameters.loki.skip, and exits non-zero when that leaves the selection empty.
        run: bun run test-visual:loki --reactUri file:./storybook-static --verboseRenderer ${{ steps.loki-selection.outputs.paths-file && '--passWithNoStories --requireReference' || '' }}

      - name: Generate Visual Report on Failure
        if: failure()
        run: bun run test-visual:loki-report

      - name: Upload Artifact
        id: artifact-upload-step
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: loki-report
          include-hidden-files: true
          path: .loki/
          if-no-files-found: ignore

  loki-tests-result:
    name: visual-test
    needs: [gate, visual-test]
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
      - name: Check Loki job status
        uses: actions/github-script@v9
        env:
          needs: ${{ toJson(needs) }}
        with:
          script: | # js
            const needs = JSON.parse(process.env.needs);
            const jobs = Object.entries(needs).map(
              ([jobName, jobValues]) => ({
                name: jobName,
                result: jobValues.result
              }));

            // are all jobs skipped or successful?
            if (jobs.every(job => (job.result === 'skipped' || job.result === 'success'))) {
              console.log('All jobs are skipped or successful');
              process.exit(0);
            }

            // otherwise, something failed
            console.log('Some Loki jobs failed');
            jobs.forEach((job) => {
              if (job.result !== 'success') {
                console.log(`${job.name} - ${job.result}`);
              }
            });
            process.exit(1);
