## Tracks the entities whose result columns changed, so the dependencies module re-derives the result metadata of
## the MBQL cards depending on them, analogous to dependency_status.

databaseChangeLog:
  - changeSet:
      id: v65.upols4
      author: ranquild
      comment: Create result_metadata_status for re-deriving the result metadata of dependent cards
      changes:
        - createTable:
            tableName: result_metadata_status
            remarks: Tracks the entities whose result columns changed, so the MBQL cards depending on them re-derive their result metadata, analogous to dependency_status
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_type
                  type: varchar(254)
                  remarks: The type of the entity (card, measure, table)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: int
                  remarks: The ID of the entity
                  constraints:
                    nullable: false
              - column:
                  name: stale
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity changed, so the MBQL cards depending on it need re-deriving
                  constraints:
                    nullable: false
              - column:
                  name: terminal
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when re-deriving the cards depending on the entity failed, so it is not processed again until the entity changes again
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last marked, cleared or failed, which guards changing a row marked again meanwhile
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: result_metadata_status

  - changeSet:
      id: v65.2n6p0h
      author: ranquild
      comment: Unique constraint to prevent duplicate result_metadata_status entries
      changes:
        - addUniqueConstraint:
            tableName: result_metadata_status
            columnNames: entity_type, entity_id
            constraintName: idx_unique_result_metadata_status
      rollback:
        - dropUniqueConstraint:
            tableName: result_metadata_status
            constraintName: idx_unique_result_metadata_status

  - changeSet:
      id: v65.1605lz
      author: ranquild
      comment: Add an index on result_metadata_status.stale (partial on Postgres) for efficient polling
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE INDEX idx_result_metadata_status_stale ON result_metadata_status(stale) WHERE stale = true
        - sql:
            dbms: mysql,mariadb,h2
            sql: CREATE INDEX idx_result_metadata_status_stale ON result_metadata_status(stale)
      rollback:
        - dropIndex:
            tableName: result_metadata_status
            indexName: idx_result_metadata_status_stale
