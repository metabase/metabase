## Remote sync tracks a published Table through its TableUserSettings, FieldUserSettings, and Dimensions, never the
## Table or its Fields themselves, so their RemoteSyncObject rows go.

databaseChangeLog:
  - changeSet:
      id: v66.2026-10-15T00:00:00
      author: ranquild
      comment: Delete the RemoteSyncObject rows of Tables and Fields
      changes:
        - sql:
            sql: DELETE FROM remote_sync_object WHERE model_type IN ('Table', 'Field')
      rollback: []
