      rollback: # the EDN this held is gone; there is nothing to restore

  - changeSet:
      id: v64.expljsone
      author: nvoxland
      comment: Clear exploration_query_result.chart_stats, now that it holds JSON
      changes:
        - update:
            tableName: exploration_query_result
            columns:
              - column:
                  name: chart_stats
                  value: "NULL"
      rollback: # the EDN this held is gone; there is nothing to restore
