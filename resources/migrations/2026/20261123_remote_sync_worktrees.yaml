## Remote sync worktrees: checkouts of other branches whose content lives in the same tables as the main app, told
## apart by worktree_id, 1 for the default worktree that is the main app. Every table that can reach content remote
## sync syncs has the column. On PostgreSQL references between rows stay in one worktree, unique keys are unique per
## worktree, and new rows land in the worktree the metabase.worktree_id setting of the connection names.

databaseChangeLog:
  - changeSet:
      id: wtw01tb
      author: ranquild
      comment: Add remote_sync_worktree, a checkout of a remote sync branch whose content lives in the same tables as the main app
      changes:
        - createTable:
            tableName: remote_sync_worktree
            remarks: A checkout of a remote sync branch whose content lives in the same tables as the main app
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  remarks: Unique ID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch
                  type: varchar(254)
                  remarks: The remote sync branch the worktree checks out, empty for the default worktree
                  constraints:
                    nullable: false
              - column:
                  name: is_default
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: Whether this is the default worktree, the main app
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: The user who created the worktree
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: The timestamp of when the worktree was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: The timestamp of when the worktree was last updated
                  constraints:
                    nullable: false
  - changeSet:
      id: wtw02df
      author: ranquild
      comment: Add the default worktree, the main app, which the new table gives id 1
      changes:
        - insert:
            tableName: remote_sync_worktree
            columns:
              - column:
                  name: branch
                  value: ''
              - column:
                  name: is_default
                  valueBoolean: true
      rollback:
        - delete:
            tableName: remote_sync_worktree
            where: is_default = TRUE
  - changeSet:
      id: wtw05us
      author: ranquild
      comment: Add core_user.current_worktree_id, the worktree other than the default one the user works in, on PostgreSQL, where worktrees exist
      dbms: postgresql
      changes:
        - addColumn:
            tableName: core_user
            columns:
              - column:
                  name: current_worktree_id
                  type: int
                  remarks: The worktree other than the default one the user works in, or null for the main app
  - changeSet:
      id: wtw06ix
      author: ranquild
      comment: Index the users of a worktree, which deleting the worktree updates, on PostgreSQL, where worktrees exist
      dbms: postgresql
      changes:
        - createIndex:
            tableName: core_user
            indexName: idx_core_user_current_worktree_id
            columns:
              - column:
                  name: current_worktree_id
  - changeSet:
      id: wtw07fk
      author: ranquild
      comment: Move the users of a deleted worktree back to the main app, on PostgreSQL, where worktrees exist
      dbms: postgresql
      changes:
        - addForeignKeyConstraint:
            baseTableName: core_user
            baseColumnNames: current_worktree_id
            referencedTableName: remote_sync_worktree
            referencedColumnNames: id
            constraintName: fk_core_user_current_worktree_id
            onDelete: SET NULL
  - changeSet:
      id: wtw08fn
      author: ranquild
      comment: Add metabase_worktree_id(), the worktree the metabase.worktree_id setting of a connection names, the default one (1) when it is unset or empty, or 0 for every worktree
      dbms: postgresql
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION metabase_worktree_id() RETURNS INTEGER LANGUAGE sql STABLE PARALLEL SAFE AS
                $$ SELECT COALESCE(NULLIF(current_setting('metabase.worktree_id', true), '')::INTEGER, 1) $$;
      rollback:
        - sql:
            sql: DROP FUNCTION metabase_worktree_id();
  - changeSet:
      id: wtw09co
      author: ranquild
      comment: Add worktree_id, the worktree of a row, the default one (1) for the main app, on PostgreSQL, where worktrees exist, to every table that can reach content remote sync syncs, deleting the rows of a worktree with it, but for the logs of what people and jobs did (audit_log, data_test_run, query_execution, source_replacement_run, task_history, task_run, test_suite_run, transform_dag_run, transform_job_run, transform_run, view_log), and putting new rows in the worktree of the connection
