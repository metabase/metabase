name: Cross-Version Migration Tests

on:
  workflow_call:
    inputs:
      digest:
        description: "HEAD image digest. Ensures we test against the image built for the current commit."

  workflow_dispatch:
    inputs:
      source_version:
        description: "Source version (e.g., v1.58.6 or HEAD)"
        required: true
        type: string
      target_version:
        description: "Target version (e.g., v1.58.7 or HEAD)"
        required: true
        type: string

jobs:
  generate-test-matrix:
    if: inputs.source_version == '' && github.repository == 'metabase/metabase'
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            release
            .github

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Generate version matrix
        id: set-matrix
        uses: actions/github-script@v9
        env:
          AWS_S3_STATIC_BUCKET: ${{ vars.AWS_S3_STATIC_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          script: | # js
            const { getSupportedMajors } = require('${{ github.workspace }}/release/dist/index.cjs');
            const { buildCrossVersionMatrix } = require('${{ github.workspace }}/.github/scripts/build-cross-version-matrix');

            // run against all supported versions
            const supportedMajors = await getSupportedMajors();
            console.log("supported majors:", supportedMajors);

            const { config } = buildCrossVersionMatrix(supportedMajors);
            const matrix = JSON.stringify({ include: config });
            core.setOutput("matrix", matrix);
            console.log("matrix:", matrix);

  test:
    needs: generate-test-matrix
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJson(needs.generate-test-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare Cypress environment
        uses: ./.github/actions/prepare-cypress

      - name: Run cross-version test
        env:
          CURRENT_VERSION: ${{ vars.CURRENT_VERSION }}
          RESULT_FILE: ${{ runner.temp }}/cross-version-result-${{ matrix.source }}-${{ matrix.target }}.json
          HEAD_DIGEST: ${{ inputs.digest }}
        run: |
          cd cross-version
          ./test.sh --source "${{ matrix.source }}" --target "${{ matrix.target }}"

      - name: Upload failure result
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-result-${{ matrix.source }}-${{ matrix.target }}
          path: ${{ runner.temp }}/cross-version-result-${{ matrix.source }}-${{ matrix.target }}.json
          if-no-files-found: ignore

      - name: Upload Cypress Artifacts upon failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-recording-${{ matrix.source }}-${{ matrix.target }}
          path: |
            ./cypress
            ./logs/test.log
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure()
        run: |
          for f in cross-version/logs/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

  # Manual test for workflow_dispatch
  test-manual:
    if: inputs.source_version != ''
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare Cypress environment
        uses: ./.github/actions/prepare-cypress

      - name: Run cross-version test
        env:
          CURRENT_VERSION: ${{ vars.CURRENT_VERSION }}
        run: |
          cd cross-version
          ./test.sh --source "${{ inputs.source_version }}" --target "${{ inputs.target_version }}"

      - name: Upload Cypress Artifacts upon failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-recording-${{ inputs.source_version }}-${{ inputs.target_version }}
          path: |
            ./cypress
            ./logs/test.log
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure()
        run: |
          for f in cross-version/logs/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
