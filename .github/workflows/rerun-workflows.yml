name: Re-run Flaky Workflows

on:
  workflow_run:
    workflows: [Run tests]
    types: [completed]
    branches: [master, "release-x.**", "backport-**"]

jobs:
  rerun-on-failure:
    name: "Re-run '${{ github.event.workflow_run.name }}' workflow"
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    # Do not re-run scheduled workflow runs
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event != 'schedule'
    env:
      BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
      AUTHOR_NAME: ${{ github.event.workflow_run.head_commit.author.name }}
      AUTHOR_LOGIN: ${{ github.event.workflow_run.head_commit.author.username }}
    steps:
      - name: Generate job summary
        run: |
          {
            echo "# ${{ github.event.workflow_run.name }} workflow failed! :x:"
            echo ""
            echo "View the failed run attempt (#${{ github.event.workflow_run.run_attempt }}) using the following link:"
            echo "${{ github.event.workflow_run.html_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github

      - name: Trigger a re-run
        uses: actions/github-script@v9
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          script: | # js
            const MAX_ATTEMPTS = 1;
            const ATTEMPT = "${{ github.event.workflow_run.run_attempt }}";
            const FAILED_RUN_URL = "${{ github.event.workflow_run.html_url }}";
            const FAILED_RUN_NAME = "${{ github.event.workflow_run.name }}";
            const BREAKING_COMMIT = "${{ github.event.workflow_run.head_sha }}";
            const AUTHOR = process.env.AUTHOR_NAME;
            const BRANCH = process.env.BRANCH_NAME;
            const LINEAR_TEAM_ID = '2e3af6a2-9b19-4abd-b72c-4b5665054861';

            if (ATTEMPT <= MAX_ATTEMPTS) {
              try {
                await github.rest.actions.reRunWorkflowFailedJobs({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: ${{ github.event.workflow_run.id }},
                });
              } catch (error) {
                if (error.status === 403) {
                  console.log(`Skipping re-run: ${error.message}`);
                } else {
                  throw error;
                }
              }
            } else if (!BRANCH.includes('backport-')) {
              const { createLinearIssue } = require('./.github/scripts/linear-issues.js');

              // find out which jobs failed
              const { owner, repo } = context.repo;

              const jobInfo = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: ${{ github.event.workflow_run.id }},
                per_page: 100,
              });

              const failedJobs = jobInfo.data.jobs
                .filter(job => job.status === "completed" && job.conclusion === "failure" && !job.name.includes("-tests-result"));

              // don't file an issue if only the flaky job failed
              if (failedJobs.every(job => job.name.toLowerCase().includes("flaky"))) {
                return;
              }

              const shortSha = BREAKING_COMMIT.slice(0, 7);
              const commitUrl = `https://github.com/${owner}/${repo}/commit/${BREAKING_COMMIT}`;

              const description = [
                `CI is failing on \`${owner}/${repo}@${BRANCH}\` after ${ATTEMPT} attempts.`,
                ``,
                `- **Author:** ${AUTHOR}`,
                `- **Commit:** [\`${shortSha}\`](${commitUrl})`,
                `- **Failed run:** [${FAILED_RUN_NAME}](${FAILED_RUN_URL})`,
                ``,
                `## Failing jobs (${failedJobs.length})`,
                ``,
                ...failedJobs.map(job => `- [${job.name}](${job.html_url})`),
              ].join('\n');

              const result = await createLinearIssue({
                teamId: LINEAR_TEAM_ID,
                title: `CI is failing on ${BRANCH}: ${failedJobs.length} failing job(s) from ${shortSha}`,
                description,
                linearApiKey: process.env.LINEAR_API_KEY,
              });

              if (result.success) {
                core.info(`Created Linear issue ${result.issue.identifier}: ${result.issue.url}`);
              } else {
                core.setFailed(`Could not create a Linear issue: ${result.message}`);
              }
            }
