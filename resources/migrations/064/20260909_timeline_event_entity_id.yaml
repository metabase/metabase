databaseChangeLog:
  - changeSet:
      id: v64.2026-09-09T00:00:00
      author: havenchyk
      comment: Add a portable entity ID to timeline events
      changes:
        - addColumn:
            tableName: timeline_event
            columns:
              - column:
                  name: entity_id
                  type: char(21)
                  remarks: NanoID used to identify the event across instances
                  constraints:
                    nullable: true
                    unique: true

  - changeSet:
      id: v64.2026-09-09T00:00:01
      author: havenchyk
      comment: Backfill entity IDs for existing timeline events
      changes:
        - sql:
            dbms: postgresql
            sql: UPDATE timeline_event SET entity_id = substr(replace(gen_random_uuid()::text, '-', ''), 1, 21) WHERE entity_id IS NULL;
        - sql:
            dbms: mysql,mariadb
            sql: UPDATE timeline_event SET entity_id = substr(replace(uuid(), '-', ''), 1, 21) WHERE entity_id IS NULL;
        - sql:
            dbms: h2
            sql: UPDATE timeline_event SET entity_id = substr(replace(cast(random_uuid() as varchar), '-', ''), 1, 21) WHERE entity_id IS NULL;
      rollback: []

  - changeSet:
      id: v64.2026-09-09T00:00:02
      author: havenchyk
      comment: Require an entity ID on timeline events
      changes:
        - addNotNullConstraint:
            tableName: timeline_event
            columnName: entity_id
            columnDataType: char(21)
