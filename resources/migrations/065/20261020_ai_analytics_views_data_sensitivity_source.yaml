## Reinstall v_ai_usage_log (v7) and v_metabot_conversations (v9) with a CASE branch for the
## `data_sensitivity_classification` usage source, which the LLM data-sensitivity classifier writes to
## ai_usage_log. v7 = v6 plus that branch; v9 = v8 plus that branch. Previous versions are never edited
## in place.
##
## runOnChange so editing the v7 / v9 SQL re-runs these on upgrade.
##
## Keep the CASE branches in sync with the known-sources / known-profile-ids allow-lists in
## enterprise/backend/src/metabase_enterprise/metabot/usage.clj.
databaseChangeLog:
  - changeSet:
      id: v65.2026-10-20T12:00:00
      author: tplude
      runOnChange: true
      comment: Reinstall v_ai_usage_log (v7) with the data_sensitivity_classification source in source_name CASE
      changes:
        - sqlFile:
            dbms: postgresql
            path: ../instance_analytics_views/ai_usage_log/v7/postgres-ai_usage_log.sql
            relativeToChangelogFile: true
        - sqlFile:
            dbms: mysql,mariadb
            path: ../instance_analytics_views/ai_usage_log/v7/mysql-ai_usage_log.sql
            relativeToChangelogFile: true
        - sqlFile:
            dbms: h2
            path: ../instance_analytics_views/ai_usage_log/v7/h2-ai_usage_log.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            dbms: postgresql
            path: ../instance_analytics_views/ai_usage_log/v6/postgres-ai_usage_log.sql
            relativeToChangelogFile: true
        - sqlFile:
            dbms: mysql,mariadb
            path: ../instance_analytics_views/ai_usage_log/v6/mysql-ai_usage_log.sql
            relativeToChangelogFile: true
        - sqlFile:
            dbms: h2
            path: ../instance_analytics_views/ai_usage_log/v6/h2-ai_usage_log.sql
            relativeToChangelogFile: true

  - changeSet:
      id: v65.2026-10-20T12:00:01
      author: tplude
      runOnChange: true
      comment: Reinstall v_metabot_conversations (v9) with the data_sensitivity_classification source CASE branch
      changes:
        - sqlFile:
            dbms: postgresql
            path: ../instance_analytics_views/metabot_conversations/v9/postgres-metabot_conversations.sql
            relativeToChangelogFile: true
        - sqlFile:
            dbms: mysql,mariadb
            path: ../instance_analytics_views/metabot_conversations/v9/mysql-metabot_conversations.sql
            relativeToChangelogFile: true
        - sqlFile:
            dbms: h2
            path: ../instance_analytics_views/metabot_conversations/v9/h2-metabot_conversations.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            dbms: postgresql
            path: ../instance_analytics_views/metabot_conversations/v8/postgres-metabot_conversations.sql
            relativeToChangelogFile: true
        - sqlFile:
            dbms: mysql,mariadb
            path: ../instance_analytics_views/metabot_conversations/v8/mysql-metabot_conversations.sql
            relativeToChangelogFile: true
        - sqlFile:
            dbms: h2
            path: ../instance_analytics_views/metabot_conversations/v8/h2-metabot_conversations.sql
            relativeToChangelogFile: true
