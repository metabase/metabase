name: Check doc links

on:
  pull_request:
  workflow_dispatch:

jobs:
  link-checker:
    name: Check documentation links
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            docs
            .lychee

      - name: Cache lychee
        uses: actions/cache@v5
        with:
          path: ~/.cache/lychee
          key: lychee-${{ runner.os }}-${{ hashFiles('.lychee/config.toml') }}

      - name: Run link checker
        id: link-check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: docs --config ./.lychee/config.toml --offline
          format: markdown

      # The nav sidebar is a YAML tree, not markdown, so lychee cannot extract its links directly.
      # Render it as a markdown list of links (one per nav url) and check that with lychee.
      - name: Set up Babashka
        if: ${{ !cancelled() }}
        uses: turtlequeue/setup-babashka@d78ec6570aea3b614bc695cafcceb82eb45c2af9 # v1.8.0
        with:
          babashka-version: 1.12.197

      - name: Render nav.yml as markdown links
        if: ${{ !cancelled() }}
        run: bb --config /dev/null docs/util/nav_links.clj "$RUNNER_TEMP/nav-links.md"

      - name: Check nav.yml links
        if: ${{ !cancelled() }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: ${{ runner.temp }}/nav-links.md --offline --root-dir ./docs --fallback-extensions md,html --include-fragments --no-progress
          format: markdown
