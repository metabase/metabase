dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH t AS (
        SELECT * FROM (
        SELECT tag, engine, scenario_id, value
        FROM harness_tag_metric
        WHERE corpus_id = {{corpus}} AND metric = 'ndcg@10'
          AND embedding_text = {{variant}}
          AND text_strategy = {{strategy}}
          [[AND (data_scale = {{scale}} OR data_scale IS NULL)]]
          [[AND embedder = {{embedder}}]]
        ) s WHERE tag IN ('paraphrase', 'concept', 'exact-name', 'rare-token', 'typo', 'cross-lingual', 'ambiguous', 'empty-expected')
      ), n AS (SELECT tag, count(DISTINCT scenario_id) AS n FROM t GROUP BY tag),
      a AS (
        SELECT t.tag, t.tag || '  (n=' || n.n || ')' AS category, t.engine AS pivot, round(avg(t.value)::numeric, 2) AS v
        FROM t JOIN n USING (tag)
        GROUP BY 1, 2, 3
      )
      SELECT category AS "Category",
             CASE tag WHEN 'exact-name' THEN 'keyword' WHEN 'rare-token' THEN 'keyword' WHEN 'paraphrase' THEN 'semantic' WHEN 'concept' THEN 'semantic' WHEN 'typo' THEN 'semantic' WHEN 'cross-lingual' THEN 'semantic only' WHEN 'ambiguous' THEN 'none' WHEN 'empty-expected' THEN 'precision check' END AS "Expected winner",
             max(v) FILTER (WHERE pivot = 'semantic') AS "semantic",
             max(v) FILTER (WHERE pivot = 'semantic-pure') AS "semantic-pure",
             max(v) FILTER (WHERE pivot = 'semantic-vector') AS "semantic-vector",
             max(v) FILTER (WHERE pivot = 'sqlite-vec1') AS "sqlite-vec1",
             max(v) FILTER (WHERE pivot = 'sqlite-vec1-pure') AS "sqlite-vec1-pure",
             max(v) FILTER (WHERE pivot = 'lucene') AS "lucene",
             max(v) FILTER (WHERE pivot = 'lucene-pure') AS "lucene-pure",
             max(v) FILTER (WHERE pivot = 'appdb') AS "appdb",
             max(v) FILTER (WHERE pivot = 'in-place') AS "in-place"
      FROM a
      GROUP BY tag, category
      ORDER BY array_position(ARRAY['paraphrase', 'concept', 'exact-name', 'rare-token', 'typo', 'cross-lingual', 'ambiguous', 'empty-expected'], tag)
    template-tags:
    - default: baseline
      display-name: Embedding text
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000005
      name: variant
      required: true
      type: text
    - default: none
      display-name: Text strategy
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000006
      name: strategy
      required: true
      type: text
    - default: northwind-golden-v1
      display-name: Corpus
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000001
      name: corpus
      required: true
      type: text
    - display-name: Scale
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000002
      name: scale
      required: false
      type: number
    - display-name: Embedder
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000003
      name: embedder
      required: false
      type: text
    lib/type: mbql.stage/native
  lib/type: mbql/query
