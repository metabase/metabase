version: 1

name: Data App Template

slug: data-app-template

description: A summary of what this app does

path: ./dist/index.js

# Origins this app may call with fetch/XHR. Everything else is blocked — both in
# `npm run dev` (via the dev server's CSP) and inside Metabase (the sandbox).
# The Metabase instance itself is reached through the SDK, not listed here.
# allowed_hosts:
#   - https://api.example.com
#   - https://*.internal.acme.com

# The entity ID of the app's collection. Write the collection's file under the
# repo's `collections/data_apps/` first, then set its ID here.
collection:

# Generate with `npx representations generate-entity-id`.
entity_id:

serdes/meta:
- model: DataApp
