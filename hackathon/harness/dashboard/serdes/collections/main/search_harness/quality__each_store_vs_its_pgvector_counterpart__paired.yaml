dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH pairs(section, arm, ref) AS (VALUES
        ('1 vector only (the store comparison)', 'sqlite-vec1-pure', 'semantic-vector'),
        ('1 vector only (the store comparison)', 'lucene-pure', 'semantic-vector'),
        ('2 as shipped', 'semantic-pure', 'semantic'),
        ('2 as shipped', 'sqlite-vec1', 'semantic'),
        ('2 as shipped', 'lucene', 'semantic'),
        ('3 keyword floor', 'appdb', 'semantic'),
        ('3 keyword floor', 'in-place', 'semantic')
      ), m AS (
        SELECT engine, scenario_id, value
        FROM harness_scenario_metric
        WHERE corpus_id = 'northwind-golden-v1' AND metric = 'ndcg@10' AND embedder = 'ollama/all-minilm' AND embedding_text = 'baseline' AND text_strategy = 'none'
      ), d AS (
        SELECT p.section, p.arm, p.ref, a.value - r.value AS delta
        FROM pairs p
        JOIN m a ON a.engine = p.arm
        JOIN m r ON r.engine = p.ref AND r.scenario_id = a.scenario_id
      ), s AS (
        SELECT section, arm, ref, count(*) AS n, avg(delta) AS mean, 1.96 * stddev_samp(delta) / sqrt(count(*)) AS ci
        FROM d GROUP BY 1, 2, 3
      )
      SELECT substr(section, 3) AS "Comparison", arm || ' vs ' || ref AS "Engines",
             round(mean::numeric, 3) AS "Δ", round(ci::numeric, 3) AS "± 95% CI",
             CASE WHEN n < 5 THEN 'too few questions'
                  WHEN mean - ci > 0 THEN 'better'
                  WHEN mean + ci < 0 THEN 'worse'
                  ELSE 'no proven difference' END AS "Verdict",
             n AS "n questions"
      FROM s
      ORDER BY section, array_position(ARRAY['semantic', 'semantic-pure', 'semantic-vector', 'sqlite-vec1', 'sqlite-vec1-pure', 'lucene', 'lucene-pure', 'appdb', 'in-place'], arm)
    lib/type: mbql.stage/native
  lib/type: mbql/query
