databaseChangeLog:
  - changeSet:
      id: ahzvzr
      author: ranquild
      comment: Add worktree, a checkout of a remote sync branch whose content lives in the same tables as the main app
      changes:
        - createTable:
            tableName: worktree
            remarks: A checkout of a remote sync branch whose content lives in the same tables as the main app
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  remarks: Unique ID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch
                  type: varchar(254)
                  remarks: The remote sync branch the worktree checks out
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: The user who created the worktree
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: The timestamp of when the worktree was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: The timestamp of when the worktree was last updated
                  constraints:
                    nullable: false

  - changeSet:
      id: wtk4cz
      author: ranquild
      comment: Add the foreign key of worktree.creator_id, keeping the worktree when its creator is deleted
      changes:
        - addForeignKeyConstraint:
            baseTableName: worktree
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_worktree_creator_id
            onDelete: SET NULL

  - changeSet:
      id: wtq7kd
      author: ranquild
      comment: Add core_user.worktree_id, the worktree the user works in, or null for the main app
      changes:
        - addColumn:
            tableName: core_user
            columns:
              - column:
                  name: worktree_id
                  type: int
                  remarks: The worktree the user works in, or null for the main app

  - changeSet:
      id: wtx3mf
      author: ranquild
      comment: Add the foreign key of core_user.worktree_id, so deleting a worktree moves its users back to the main app
      changes:
        - addForeignKeyConstraint:
            baseTableName: core_user
            baseColumnNames: worktree_id
            referencedTableName: worktree
            referencedColumnNames: id
            constraintName: fk_core_user_worktree_id
            onDelete: SET NULL

