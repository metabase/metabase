## Adds segment_test: a test of one segment, replacing the tables its query reads with fixture data and checking the
## rows it selects against expectations. The inputs and expectations are JSON documents validated by
## metabase-enterprise.data-testing.schema, as for card_test. A segment's tests are deleted with it.

databaseChangeLog:
  - changeSet:
      id: lcbmfh
      author: galdre
      comment: Add segment_test
      changes:
        - createTable:
            tableName: segment_test
            remarks: A test of a segment, with fixture inputs and expectations on the rows it selects
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_id
                  type: ${entity_id.type}
                  remarks: NanoID for serdes
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: segment_id
                  type: int
                  remarks: The segment under test
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: The user who created the test
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: ${text.type}
                  remarks: The name of the test
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: ${text.type}
                  remarks: A description of the test
              - column:
                  name: inputs
                  type: ${text.type}
                  remarks: JSON array of the input tables replaced with fixture data
                  constraints:
                    nullable: false
              - column:
                  name: expectations
                  type: ${text.type}
                  remarks: JSON array of the expectations checked against the rows the segment selects
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: The timestamp this test was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: The timestamp this test was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: s68bl9
      author: galdre
      comment: Index segment_test.segment_id
      changes:
        - createIndex:
            tableName: segment_test
            indexName: idx_segment_test_segment_id
            columns:
              - column:
                  name: segment_id

  - changeSet:
      id: fz258s
      author: galdre
      comment: Add FK constraint on segment_test.segment_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: segment_test
            baseColumnNames: segment_id
            referencedTableName: segment
            referencedColumnNames: id
            constraintName: fk_segment_test_segment_id
            onDelete: CASCADE

  - changeSet:
      id: x5kxtn
      author: galdre
      comment: Index segment_test.creator_id
      changes:
        - createIndex:
            tableName: segment_test
            indexName: idx_segment_test_creator_id
            columns:
              - column:
                  name: creator_id

  - changeSet:
      id: nxuoll
      author: galdre
      comment: Add FK constraint on segment_test.creator_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: segment_test
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_segment_test_creator_id
            onDelete: CASCADE
