## Assert DB-level defaults for metabase_table.data_layer / data_authority so they're consistent across
## app DBs (data_authority was NULL on MySQL/MariaDB). The model before-insert sets both for model inserts.

databaseChangeLog:
  - changeSet:
      id: v63.2026-06-10T10:00:00
      author: chris
      comment: Default metabase_table.data_layer to "internal" at the DB level
      changes:
        - addDefaultValue:
            tableName: metabase_table
            columnName: data_layer
            columnDataType: varchar(254)
            defaultValue: internal

  - changeSet:
      id: v63.2026-06-10T10:00:01
      author: chris
      comment: Reassert metabase_table.data_authority DB default of "unconfigured" (was inconsistent on MySQL/MariaDB)
      changes:
        - addDefaultValue:
            tableName: metabase_table
            columnName: data_authority
            columnDataType: varchar(20)
            defaultValue: unconfigured
      ## The default this reasserts is not ours to drop: v57 created data_authority NOT NULL with the same
      ## "unconfigured" default. Liquibase's automatic rollback for addDefaultValue is dropDefaultValue, which
      ## would take v57's default with it and leave a NOT NULL column with no default — every pre-v63 insert
      ## that omits data_authority (the model only started supplying it in v63) then fails the constraint.
      ## That is what breaks a downgrade to v62 or older: the audit DB sync dies inserting metabase_table rows
      ## and the instance never finishes booting. Rolling this back is a no-op.
      rollback: # nothing to do; see above
