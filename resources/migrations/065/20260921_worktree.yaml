      id: v65.2026-09-21T14:01:00
      author: ranquild
      comment: Drop the global unique constraint on native_query_snippet.name - it is replaced by a per-worktree one below
      changes:
        - sql:
            dbms: postgresql
            sql: ALTER TABLE native_query_snippet DROP CONSTRAINT native_query_snippet_name_key;
        - sql:
            dbms: mysql,mariadb
            sql: ALTER TABLE native_query_snippet DROP INDEX `name`;
        - sql:
            dbms: h2
            sql: >-
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE NATIVE_QUERY_SNIPPET DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
                  ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND kcu.TABLE_NAME = tc.TABLE_NAME
                WHERE tc.TABLE_NAME = 'NATIVE_QUERY_SNIPPET'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'NAME'
              );
      # The constraint has to come back under the name the database gave it originally, or a down-migration
      # followed by an up-migration would leave nothing for the statements above to drop.
      rollback:
        - sql:
            dbms: postgresql
            sql: ALTER TABLE native_query_snippet ADD CONSTRAINT native_query_snippet_name_key UNIQUE (name);
        - sql:
            dbms: mysql,mariadb
            sql: ALTER TABLE native_query_snippet ADD UNIQUE KEY `name` (`name`);
        - sql:
            dbms: h2
            sql: ALTER TABLE NATIVE_QUERY_SNIPPET ADD CONSTRAINT UQ_NATIVE_QUERY_SNIPPET_NAME UNIQUE(NAME);

