name: App DB Tests

on:
  workflow_call:

  # Run one app-DB job on demand, against the ref you dispatch on, optionally under a profiler.
  # Everything else about the job -- services, matrix legs, test args, quarantine gating -- is
  # whatever the normal CI run uses, because it is the same job.
  workflow_dispatch:
    inputs:
      app-db:
        description: 'Which app-DB job to run. Only this one runs; the others are skipped.'
        type: choice
        required: true
        options:
          - mariadb
          - mysql
          - postgres
      tests:
        description: 'Optional: run only these tests, comma- or space-separated, e.g. metabase.db.custom-migrations-test/some-test. Bare namespaces work too. Blank runs the job''s usual set.'
        type: string
        required: false
        default: ''
      profile:
        description: 'Profile the test run and attach a flamegraph to the job. Adds sampling overhead.'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-app-db
  cancel-in-progress: true

# Exposed to every job so the test-driver action can report failures to
# ci-conductor (secrets: inherit is already set on the app-db call in
# run-tests.yml). See DEV-2224.
env:
  CI_CONDUCTOR_BASE_URL: ${{ vars.CI_CONDUCTOR_BASE_URL }}
  CI_CONDUCTOR_WEBHOOK_SECRET: ${{ secrets.CI_CONDUCTOR_WEBHOOK_SECRET }}
  # Both read by the test-driver action, which is what actually runs the tests. Set here rather than
  # passed as inputs to each job so that turning either on is one line, not one line per job.
  # Empty (and so off) on workflow_call, where neither input exists.
  #
  # ONLY_TESTS replaces the job's own test selection, so every matrix leg of the chosen job runs the
  # whole list -- each app DB has three.
  PROFILE_TESTS: ${{ inputs.profile }}
  ONLY_TESTS: ${{ inputs.tests }}

jobs:
  # The shared verdict plus the app-DB plan, in one job: `.github/scripts/gate/app-db.ts` turns the
  # verdict into the `strategy.matrix` each test job runs, so those jobs carry a single condition --
  # whether a matrix came back for them -- and everything else is decided here. The script is a
  # plain module, unit tested by the ci-scripts jest project.
  gate:
    name: Decide whether to run
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      be-tests-mariadb: ${{ steps.plan.outputs.be-tests-mariadb }}
      be-tests-mysql: ${{ steps.plan.outputs.be-tests-mysql }}
      be-tests-postgres: ${{ steps.plan.outputs.be-tests-postgres }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            /.nvmrc
            /package.json
          sparse-checkout-cone-mode: false
      - name: Apply the shared gate
        id: base
        uses: ./.github/actions/test-gate
        with:
          filters: backend_all
          # A direct dispatch names an app DB and runs it whatever the diff says.
          ignore-diff: ${{ inputs.app-db != '' }}
      - name: Prepare Node + Bun environment
        uses: ./.github/actions/prepare-node-bun
      - name: Plan the app DB matrices
        id: plan
        env:
          RUN: ${{ steps.base.outputs.run }}
          FORCE_RUN: ${{ steps.base.outputs.force-run }}
          ONLY_APP_DB: ${{ inputs.app-db }}
        run: bun .github/scripts/gate/app-db.ts

  be-tests-mariadb:
    needs: gate
    if: ${{ needs.gate.outputs.be-tests-mariadb != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.be-tests-mariadb) }}

    services:
      mysql:
        image: ${{ matrix.version.image }}
        # disposable CI database: a RAM-backed datadir makes the ~90k fsyncs of a full
        # migration chain free (measured: setup-db! 59s -> 16s)
        options: --tmpfs /var/lib/mysql:rw
        ports:
          - "3306:3306"
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: true
          MARIADB_DATABASE: mb_test
    env:
      CI: 'true'
      DRIVERS: mysql
      MB_DB_TYPE: mysql
      MB_DB_HOST: localhost
      MB_DB_PORT: 3306
      MB_DB_DBNAME: mb_test
      MB_DB_USER: root
      MB_MYSQL_TEST_USER: root
      #
      # SSL config: only for mysql latest tests.
      #
      # set up env vars for something named "MYSQL_SSL" to run MySQL SSL tests verifying connectivity with PEM cert
      # they are deliberately given a different name to prevent them from affecting the regular test run against
      # the configured MySQL instance, but there is one particular test (mysql-connect-with-ssl-and-pem-cert-test)
      # that overrides the MB_MYSQL_TEST_* values with them
      # the MYSQL_RDS_SSL_INSTANCE vars are defined as secrets and can be altered
      MB_MYSQL_SSL_TEST_SSL: ${{ matrix.version.env.enable-ssl-tests }}
      MB_MYSQL_SSL_TEST_HOST: ${{ secrets.MYSQL_RDS_SSL_INSTANCE_HOST }}
      MB_MYSQL_SSL_TEST_ADDITIONAL_OPTIONS: 'verifyServerCertificate=true'
      # the contents of the ./resources/certificates/rds-combined-ca-bundle.pem file
      MB_MYSQL_SSL_TEST_SSL_CERT: ${{ secrets.MB_MYSQL_SSL_TEST_SSL_CERT }}
      MB_MYSQL_SSL_TEST_USER: metabase
      MB_MYSQL_SSL_TEST_PASSWORD: ${{ secrets.MYSQL_RDS_SSL_INSTANCE_PASSWORD }}
    # for historic reasons (I don't want to mess around with required jobs) the job name should be something like
    # "be-tests-mariadb-10-6-ee (0)"
    name: "${{ matrix.version.name }} ${{ matrix.job.name }}"
    # Shared by every app DB job below via `*app-db-test-steps`.
    steps: &app-db-test-steps
      - uses: actions/checkout@v6
      - name: Test ${{ matrix.version.name }}
        id: test-driver
        uses: ./.github/actions/test-driver
        with:
          build-static-viz: ${{ matrix.job.build-static-viz }}
          junit-name: ${{ matrix.version.junit-name }}
          artifact-suffix: ${{ matrix.job.name }}
          test-args: ${{ matrix.job.test-args }}

  be-tests-mysql:
    needs: gate
    if: ${{ needs.gate.outputs.be-tests-mysql != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.be-tests-mysql) }}

    services:
      mysql:
        image: ${{ matrix.version.image }}
        # disposable CI database: a RAM-backed datadir makes the ~90k fsyncs of a full
        # migration chain free (measured: setup-db! 59s -> 16s)
        options: --tmpfs /var/lib/mysql:rw
        ports:
          - "3306:3306"
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: mb_test
    env:
      CI: 'true'
      DRIVERS: mysql
      MB_DB_TYPE: mysql
      MB_DB_HOST: localhost
      MB_DB_PORT: 3306
      MB_DB_DBNAME: mb_test
      MB_DB_USER: root
      MB_MYSQL_TEST_USER: root
      #
      # SSL config: only for mysql latest tests.
      #
      # set up env vars for something named "MYSQL_SSL" to run MySQL SSL tests verifying connectivity with PEM cert
      # they are deliberately given a different name to prevent them from affecting the regular test run against
      # the configured MySQL instance, but there is one particular test (mysql-connect-with-ssl-and-pem-cert-test)
      # that overrides the MB_MYSQL_TEST_* values with them
      # the MYSQL_RDS_SSL_INSTANCE vars are defined as secrets and can be altered
      MB_MYSQL_SSL_TEST_SSL: ${{ matrix.version.env.enable-ssl-tests }}
      MB_MYSQL_SSL_TEST_HOST: ${{ secrets.MYSQL_RDS_SSL_INSTANCE_HOST }}
      MB_MYSQL_SSL_TEST_ADDITIONAL_OPTIONS: 'verifyServerCertificate=true'
      # the contents of the ./resources/certificates/rds-combined-ca-bundle.pem file
      MB_MYSQL_SSL_TEST_SSL_CERT: ${{ secrets.MB_MYSQL_SSL_TEST_SSL_CERT }}
      MB_MYSQL_SSL_TEST_USER: metabase
      MB_MYSQL_SSL_TEST_PASSWORD: ${{ secrets.MYSQL_RDS_SSL_INSTANCE_PASSWORD }}
      MB_MYSQL_AWS_IAM_TEST: ${{ matrix.version.env.enable-aws-iam-tests }}
      MB_MYSQL_AWS_IAM_TEST_HOST: ${{ secrets.MYSQL_AURORA_IAM_INSTANCE_HOST }}
      MB_MYSQL_AWS_IAM_TEST_PORT: 3306
      MB_MYSQL_AWS_IAM_TEST_USER: my_iam_user
      MB_MYSQL_AWS_IAM_TEST_DBNAME: test_db
      MB_MYSQL_AWS_IAM_TEST_SSL_CERT: trust
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_AURORA_IAM_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_AURORA_IAM_SECRET_ACCESS_KEY }}
    # for historic reasons (I don't want to mess around with required jobs) the job name should be something like
    # "be-tests-mariadb-10-6-ee (0)"
    name: "${{ matrix.version.name }} ${{ matrix.job.name }}"
    steps: *app-db-test-steps

  be-tests-postgres:
    needs: gate
    if: ${{ needs.gate.outputs.be-tests-postgres != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.be-tests-postgres) }}
    name: "${{ matrix.version.name }} ${{ matrix.job.name }}"
    env:
      CI: 'true'
      DRIVERS: postgres
      MB_DB_TYPE: postgres
      MB_DB_PORT: 5432
      MB_DB_HOST: localhost
      MB_DB_DBNAME: mb_test
      MB_DB_USER: mb_test
      MB_POSTGRESQL_TEST_USER: mb_test
      # SSL tests are only enabled for the postgres-latest job.
      MB_POSTGRES_SSL_TEST_SSL: ${{ matrix.version.env.enable-ssl-tests }}
      MB_POSTGRES_SSL_TEST_SSL_MODE: verify-full
      MB_POSTGRES_SSL_TEST_SSL_ROOT_CERT_PATH: 'test-resources/certificates/us-east-2-bundle.pem'
      MB_POSTGRES_AWS_IAM_TEST: ${{ matrix.version.env.enable-aws-iam-tests }}
      MB_POSTGRES_AWS_IAM_TEST_HOST: ${{ secrets.POSTGRES_AURORA_IAM_INSTANCE_HOST }}
      MB_POSTGRES_AWS_IAM_TEST_PORT: 5432
      MB_POSTGRES_AWS_IAM_TEST_USER: my_iam_user
      MB_POSTGRES_AWS_IAM_TEST_DBNAME: test_db
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_AURORA_IAM_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_AURORA_IAM_SECRET_ACCESS_KEY }}
    services:
      postgres:
        image: ${{ matrix.version.image }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: mb_test
          POSTGRES_DB: mb_test
          POSTGRES_HOST_AUTH_METHOD: trust
    steps: *app-db-test-steps

  app-db-tests-result:
    needs:
      - gate
      - be-tests-mariadb
      - be-tests-mysql
      - be-tests-postgres
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    name: app-db-tests-result
    if: ${{ !cancelled() }}
    steps:
      - name: Check job status
        uses: actions/github-script@v9
        env:
          needs: ${{ toJson(needs) }}
        with:
          script: | # js
            const needs = JSON.parse(process.env.needs);

            const jobs = Object.entries(needs).map(
              ([jobName, jobValues]) => ({
                name: jobName,
                result: jobValues.result
              }));

            // are all jobs skipped or successful?
            if (jobs.every(job => (job.result === 'skipped' || job.result === 'success'))) {
                console.log("");
                console.log("        _------.        ");
                console.log("       /  ,     \_      ");
                console.log("     /   /  /{}\ |o\_   ");
                console.log("    /    \  `--' /-' \  ");
                console.log("   |      \      \    | ");
                console.log("  |              |`-, | ");
                console.log("  /              /__/)/ ");
                console.log(" |              |       ");
                console.log("");
                console.log("All app db tests have passed (or have been skipped). Cam is very proud of you.");
              process.exit(0);
            }

            // otherwise, something failed
            console.log("");
            console.log("       .::::::::::.                          .::::::::::.       ");
            console.log("     .::::''''''::::.                      .::::''''''::::.     ");
            console.log("   .:::'          `::::....          ....::::'          `:::.   ");
            console.log("  .::'             `:::::::|        |:::::::'             `::.  ");
            console.log(" .::|               |::::::|_ ___ __|::::::|               |::. ");
            console.log(" `--'               |::::::|_()__()_|::::::|               `--' ");
            console.log("  :::               |::-o::|        |::o-::|               :::  ");
            console.log("  `::.             .|::::::|        |::::::|.             .::'  ");
            console.log("   `:::.          .::\-----'        `-----/::.          .:::'   ");
            console.log("     `::::......::::'                      `::::......::::'     ");
            console.log("       `::::::::::'                          `::::::::::'       ");
            console.log("");
            console.log("App db tests have failed. You have been sentenced to MetaJail.");

            jobs.forEach((job) => {
              if (job.result !== 'success') {
                console.log(`${job.name} - ${job.result}`);
              }
            });

            process.exit(1);
