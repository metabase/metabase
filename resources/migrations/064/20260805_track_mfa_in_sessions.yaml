# In order for us to know whether a session is valid post MFA requirement,
# we need to be able to inspect which sessions were obtained using MFA.

databaseChangeLog:
  - changeSet:
      id: v64.2026-08-05T09:55:00
      author: Ethan McCue
      comment: Track MFA method used in session
      changes:
        - addColumn:
            tableName: core_session
            columns:
              - column:
                  name: mfa_auth_identity_id
                  type: int
                  remarks: Foreign key to auth_identity method used for MFA
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: core_session
            columnName: mfa_auth_identity_id
