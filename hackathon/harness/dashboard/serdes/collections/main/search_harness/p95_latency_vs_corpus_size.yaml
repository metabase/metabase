name: p95 latency vs corpus size
description: |-
  How does the slow-end search time grow as the catalogue grows? One line per engine; left to right = bigger catalogue: the golden set (235 items), then generated catalogues of 1k and 10k items. A line that climbs steeply won't scale. Each size is its own run, so trust big jumps along a line (over ~2×), not small ones. An engine shown as a single point was only run on the golden set, not "fine at scale". Compare latency only within one run: different runs used different Metabase instances, so across runs (semantic vs semantic-pure, all-minilm vs arctic) a difference under ~2× may be the machine, not the engine. Runs that overlapped another run are left out (Overlapped column in Runs in view). End-to-end query latency, measured from outside over HTTP, on a log scale.

  **Latency**: Time from sending a search to getting results back, in milliseconds (ms). Lower is better.

  **p50 / p95 / p99**: Half / 95% / 99% of searches are faster than this. p50 is the typical search; p95 and p99 are the slow ones users notice. Lower is better.

  **Scale**: Catalogue size tier. The golden set (235 items) has none; generated catalogues of 1k and 10k items are used only to time searches (they have no right answers).

  **Log scale**: Each gridline is 10× the one below; use it to compare growth rates, not absolute gaps.
