databaseChangeLog:
  - changeSet:
      id: v65.2026-09-21T10:00:00
      author: ranquild
      comment: Create worktree table
      changes:
        - createTable:
            tableName: worktree
            remarks: One row per checked-out remote-sync branch (a git-worktree-style checkout of the synced content tree)
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch
                  type: varchar(254)
                  remarks: Git branch this worktree is checked out to
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: User who created this worktree; null once that user is deleted
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: When this worktree was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: When this worktree was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.2026-09-21T10:01:00
      author: ranquild
      comment: Unique index on worktree.branch - a branch can be checked out at most once
      changes:
        - createIndex:
            tableName: worktree
            indexName: idx_worktree_branch
            unique: true
            columns:
              - column:
                  name: branch

  - changeSet:
      id: v65.2026-09-21T10:02:00
      author: ranquild
      comment: FK worktree.creator_id -> core_user; SET NULL so the worktree survives its creator's deletion
      changes:
        - addForeignKeyConstraint:
            baseTableName: worktree
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_worktree_creator_id
            onDelete: SET NULL

  - changeSet:
      id: v65.2026-09-21T10:03:00
      author: ranquild
      comment: Index on worktree.creator_id - every foreign key is expected to be indexed
      changes:
        - createIndex:
            tableName: worktree
            indexName: idx_worktree_creator_id
            columns:
              - column:
                  name: creator_id
      # MySQL keeps an index on every foreign key column and refuses to drop the last one, so the constraint has
      # to come off first and go back on after -- re-added here rather than left to the changeset that created
      # it, which rolls back later and would find it already gone.
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: worktree
            constraintName: fk_worktree_creator_id
        - dropIndex:
            tableName: worktree
            indexName: idx_worktree_creator_id
        - addForeignKeyConstraint:
            baseTableName: worktree
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_worktree_creator_id
            onDelete: SET NULL

  - changeSet:
      id: v65.2026-09-21T10:04:00
      author: ranquild
      comment: Create worktree_entity_remapping table
      changes:
        - createTable:
            tableName: worktree_entity_remapping
            remarks: Maps the entity_id an entity has on the branch to the entity_id of the copy a worktree checked out for it, so a worktree can hold its own copy of an entity the main app already has
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: worktree_id
                  type: int
                  remarks: Worktree this remapping belongs to
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(254)
                  remarks: Serdes model name the remapped entity_ids belong to (e.g. Transform)
                  constraints:
                    nullable: false
              - column:
                  name: source_entity_id
                  type: char(21)
                  remarks: entity_id as it appears on the branch, and in every serialized file
                  constraints:
                    nullable: false
              - column:
                  name: local_entity_id
                  type: char(21)
                  remarks: entity_id of the row this worktree checked the entity out into
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.2026-09-21T10:05:00
      author: ranquild
      comment: Unique index on (worktree_id, source_entity_id) - a branch entity is checked out at most once per worktree
      changes:
        - createIndex:
            tableName: worktree_entity_remapping
            indexName: idx_worktree_entity_remapping_source
            unique: true
            columns:
              - column:
                  name: worktree_id
              - column:
                  name: source_entity_id

  - changeSet:
      id: v65.2026-09-21T10:06:00
      author: ranquild
      comment: Unique index on local_entity_id - entity_id is globally unique, so a checked-out row backs exactly one remapping
      changes:
        - createIndex:
            tableName: worktree_entity_remapping
            indexName: idx_worktree_entity_remapping_target
            unique: true
            columns:
              - column:
                  name: local_entity_id

  - changeSet:
      id: v65.2026-09-21T10:07:00
      author: ranquild
      comment: FK worktree_entity_remapping.worktree_id -> worktree; CASCADE so deleting a worktree drops its remappings
      changes:
        - addForeignKeyConstraint:
            baseTableName: worktree_entity_remapping
            baseColumnNames: worktree_id
            referencedTableName: worktree
            referencedColumnNames: id
            constraintName: fk_worktree_entity_remapping_worktree_id
            onDelete: CASCADE

