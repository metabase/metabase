## Adds card_test: a test of one card (a question, model or metric), replacing some of the tables its query reads with
## fixture data and checking its result set against expectations. The inputs and expectations are JSON documents
## validated by metabase-enterprise.data-testing.schema, as for transform_test. A card's tests are deleted with it.

databaseChangeLog:
  - changeSet:
      id: t1jz0k
      author: galdre
      comment: Add card_test
      changes:
        - createTable:
            tableName: card_test
            remarks: A test of a card, with fixture inputs and expectations on its result set
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_id
                  type: ${entity_id.type}
                  remarks: NanoID for serdes
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: card_id
                  type: int
                  remarks: The card under test
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: The user who created the test
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: ${text.type}
                  remarks: The name of the test
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: ${text.type}
                  remarks: A description of the test
              - column:
                  name: inputs
                  type: ${text.type}
                  remarks: JSON array of the input tables replaced with fixture data
                  constraints:
                    nullable: false
              - column:
                  name: expectations
                  type: ${text.type}
                  remarks: JSON array of the expectations checked against the card's result set
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: The timestamp this test was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: The timestamp this test was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: k8wio8
      author: galdre
      comment: Index card_test.card_id
      changes:
        - createIndex:
            tableName: card_test
            indexName: idx_card_test_card_id
            columns:
              - column:
                  name: card_id

  - changeSet:
      id: a1tc5x
      author: galdre
      comment: Add FK constraint on card_test.card_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: card_test
            baseColumnNames: card_id
            referencedTableName: report_card
            referencedColumnNames: id
            constraintName: fk_card_test_card_id
            onDelete: CASCADE

  - changeSet:
      id: m3pv7q
      author: galdre
      comment: Index card_test.creator_id
      changes:
        - createIndex:
            tableName: card_test
            indexName: idx_card_test_creator_id
            columns:
              - column:
                  name: creator_id

  - changeSet:
      id: c65vs3
      author: galdre
      comment: Add FK constraint on card_test.creator_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: card_test
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_card_test_creator_id
            onDelete: CASCADE
