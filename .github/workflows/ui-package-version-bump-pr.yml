name: UI Package Version Bump PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release type
        type: choice
        options: [patch, minor, major]
        required: true
      note:
        description: Changelog note for package consumers
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ui-package-version-bump-pr
  cancel-in-progress: false

jobs:
  bump-version:
    if: ${{ github.repository == 'metabase/metabase' && github.ref == 'refs/heads/master' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}

      - name: Update version and changelog
        id: bump
        working-directory: frontend/ui-package
        env:
          BUMP: ${{ inputs.bump }}
          NOTE: ${{ inputs.note }}
        run: |
          version=$(node ../../bin/ui-package/bump-version.mjs "$BUMP" "$NOTE")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "Metabase Automation"
          git config user.email "github-automation@metabase.com"
          branch="ui-package-version-bump-$VERSION"
          git switch -c "$branch"
          git add frontend/ui-package/package.json frontend/ui-package/CHANGELOG.md
          git commit -m "Release @metabase/ui $VERSION"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base master --head "$branch" --label ui-release-trigger --label .Team/DevEx \
            --title "Release @metabase/ui $VERSION" \
            --body "Review the changelog before merging. Merging smoke-tests and publishes @metabase/ui@$VERSION to npm."
