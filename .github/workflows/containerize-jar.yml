name: Containerize Uberjar
run-name: Containerize ${{ inputs.edition }} ${{ inputs.tag }} Uberjar

on:
  workflow_call:
    inputs:
      edition:
        description: Metabase edition (ee or oss)
        type: string
        required: true
      registry:
        description: Registry the image is pushed to, either "docker" or "ecr".
        type: string
        default: docker
      repo:
        description: Repository name the image is pushed to, e.g. "metabase-enterprise".
        type: string
      tag:
        description:  Image tag, e.g. v1.87.2.
        type: string
      commit:
        type: string
      release:
        type: boolean
        default: false
      build-args:
        type: string
      platforms:
        description: Platforms the image is built for.
        type: string
        default: linux/amd64,linux/arm64
    outputs:
      digest-ee:
        description: Image digest, useful for pulling the built image from Docker Hub. Only set if this is the 'ee' edition.
        value: ${{ jobs.containerize.outputs.digest-ee }}
      digest-oss:
        description:  Image digest, useful for pulling the built image from Docker Hub. Only set if this is the 'oss' edition.
        value: ${{ jobs.containerize.outputs.digest-oss }}

  workflow_dispatch:
    inputs:
      edition:
        description: Metabase edition (ee or oss)
        type: choice
        options:
          - ee
          - oss
        required: true
      registry:
        description: Registry the image is pushed to
        type: choice
        options:
          - docker
          - ecr
        default: docker
      repo:
        description: Repository name the image is pushed to, e.g. "metabase-enterprise".
        type: string
      tag:
        description: Image tag, e.g. v1.87.2.
        type: string
      commit:
        description: the full commit hash
        type: string
      release:
        description: Whether this is a release artifact (uses metabase-release- prefix)
        type: boolean
        default: false
      platforms:
        description: Platforms the image is built for.
        type: string
        default: linux/amd64,linux/arm64

jobs:
  # REVERTME (GDGT-3476): metabase/graaljs-isolate-musl isn't published yet, so build the musl isolate from
  # bin/docker/js-isolate here and feed it to the image build through a local registry. Remove this job, the
  # `registry` service and the "REVERTME" steps in `containerize` once the Dockerfiles pin the published image.
  build-js-isolate:
    name: build-js-isolate (${{ inputs.edition }}, ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # native-image can't cross-compile and needs ~8 GB of memory
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      if: contains(inputs.platforms, format('linux/{0}', matrix.arch))
      with:
        ref: ${{ inputs.commit }}
        fetch-depth: 1
        sparse-checkout: bin/docker/js-isolate
    - name: Set up Docker Buildx
      if: contains(inputs.platforms, format('linux/{0}', matrix.arch))
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
    - name: Build and test the isolate
      if: contains(inputs.platforms, format('linux/{0}', matrix.arch))
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: bin/docker/js-isolate
        platforms: linux/${{ matrix.arch }}
        outputs: type=local,dest=js-isolate-out
    - uses: actions/upload-artifact@v7
      if: contains(inputs.platforms, format('linux/{0}', matrix.arch))
      with:
        name: js-isolate-${{ inputs.edition }}-${{ matrix.arch }}
        path: js-isolate-out
        retention-days: 1
        if-no-files-found: error

  containerize:
    needs: build-js-isolate
    name: containerize (${{ inputs.edition }})
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    # REVERTME (GDGT-3476): holds the locally built isolate image, see build-js-isolate
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    outputs:
      full_image: ${{ steps.image.outputs.full_image }}
      digest: ${{ steps.build.outputs.digest }}
      digest-ee: ${{ inputs.edition == 'ee' && steps.build.outputs.digest || '' }}
      digest-oss: ${{ inputs.edition == 'oss' && steps.build.outputs.digest || '' }}
    env:
      AWS_REGION: us-east-1
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

      # we want the dockerfile from the commit we're building
    - run: |
        git fetch --depth=1 origin ${{ inputs.commit }}
        git checkout ${{ inputs.commit }} -- bin/docker

    - name: Retrieve uberjar artifact
      uses: ./.github/actions/fetch-artifact
      with:
        commit: ${{ inputs.commit }}
        edition: ${{ inputs.edition }}
        release: ${{ inputs.release }}
        extract-path: bin/docker

    - name: Resolve image repo and tag
      id: image
      uses: ./.github/actions/get-docker-info
      with:
        registry: ${{ inputs.registry }}
        repo: ${{ inputs.repo }}
        tag: ${{ inputs.tag }}
        edition: ${{ inputs.edition }}
        aws-account-id: ${{ secrets.PR_ENV_AWS_ACCOUNT_ID }}
        aws-region: ${{ env.AWS_REGION }}
        dockerhub-owner: ${{ vars.DOCKERHUB_OWNER }}

    - name: Configure AWS credentials
      if: ${{ inputs.registry == 'ecr' }}
      uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
      with:
        role-to-assume: ${{ secrets.PR_ENV_IAM_ROLE }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      if: ${{ inputs.registry == 'ecr' }}
      uses: aws-actions/amazon-ecr-login@183a1442edf41672e66566b7fc560e297a290896 # v2
      with:
        registries: "${{ secrets.PR_ENV_AWS_ACCOUNT_ID }}"

    - name: Login to Docker Hub
      if: ${{ inputs.registry != 'ecr' }}
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        username: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_USERNAME || secrets.DOCKERHUB_USERNAME }}
        password: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_TOKEN || secrets.DOCKERHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      with:
        cache-image: ${{ github.event_name != 'pull_request' }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      with:
        # REVERTME (GDGT-3476): lets the builder reach the local registry; drop with build-js-isolate
        driver-opts: network=host

    - name: Download the locally built isolate (REVERTME, GDGT-3476)
      uses: actions/download-artifact@v8
      with:
        pattern: js-isolate-${{ inputs.edition }}-*
        path: js-isolate-ci

    - name: Lay out the isolate per architecture (REVERTME, GDGT-3476)
      run: |
        cd js-isolate-ci
        for dir in js-isolate-${{ inputs.edition }}-*; do mv "$dir" "${dir##*-}"; done
        cat > Dockerfile <<'DOCKERFILE'
        FROM scratch
        ARG TARGETARCH
        COPY ${TARGETARCH}/ /
        DOCKERFILE

    - name: Build the isolate image (REVERTME, GDGT-3476)
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: js-isolate-ci
        platforms: ${{ inputs.platforms }}
        tags: localhost:5000/graaljs-isolate-musl:ci
        push: true

    - name: Build and Push Images
      id: build
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: bin/docker/.
        platforms: ${{ inputs.platforms }}
        network: host
        tags: ${{ steps.image.outputs.full_image }}
        no-cache: true
        push: true
        # REVERTME (GDGT-3476): JS_ISOLATE_IMAGE points at the locally built isolate; drop it with build-js-isolate
        build-args: |
          ${{ inputs.build-args }}
          JS_ISOLATE_IMAGE=localhost:5000/graaljs-isolate-musl:ci

    - name: Post link to image on DockerHub
      if: ${{ inputs.registry != 'ecr' && github.event_name == 'pull_request' }}
      uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
      with:
        header: docker-build-status-${{ inputs.edition }}
        message: |
          ✅ Docker build completed for commit ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}

          The uberjar has been built and containerized successfully.

          **Branch:** `${{ github.head_ref || github.ref_name }}`
          **Docker Image:** `${{ steps.image.outputs.full_image }}`
          **Docker Hub:** [View on Docker Hub](https://hub.docker.com/r/${{ steps.image.outputs.repo }}/tags?name=${{ steps.image.outputs.tag }})
          **Triggered by:** @${{ github.actor }}

          Pull the image:
          ```bash
          docker pull ${{ steps.image.outputs.full_image }}
          ```

  verify-static-viz:
    needs: containerize
    if: inputs.registry != 'ecr'
    name: verify-static-viz (${{ inputs.edition }}, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ${{ vars.DEFAULT_RUNNER_KEY }}
          - platform: linux/arm64
            runner: arm-ubuntu-24-2core
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      if: contains(inputs.platforms, matrix.platform)
      with:
        fetch-depth: 1
        sparse-checkout: .github/scripts
    - name: Login to Docker Hub
      if: contains(inputs.platforms, matrix.platform)
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        username: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_USERNAME || secrets.DOCKERHUB_USERNAME }}
        password: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_TOKEN || secrets.DOCKERHUB_TOKEN }}
    - name: Pull the container image
      if: contains(inputs.platforms, matrix.platform)
      run: docker pull --platform ${{ matrix.platform }} ${{ needs.containerize.outputs.full_image }}
    - name: Render a chart inside the image
      if: contains(inputs.platforms, matrix.platform)
      run: .github/scripts/verify-docker-static-viz.sh ${{ needs.containerize.outputs.full_image }}

  verify-docker-pull-amd64:
    needs: containerize
    if: >-
      inputs.release &&
      inputs.registry != 'ecr'
    name: verify-docker-pull-amd64 (${{ inputs.edition }})
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        username: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_USERNAME || secrets.DOCKERHUB_USERNAME }}
        password: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_TOKEN || secrets.DOCKERHUB_TOKEN }}
    - name: Pull the container image
      run: docker pull ${{ needs.containerize.outputs.full_image }}
    - name: Launch container
      run: docker run --rm -dp 3000:3000 ${{ needs.containerize.outputs.full_image }}
      timeout-minutes: 5
    - name: Wait for Metabase to start
      run: while ! curl -s 'http://localhost:3000/api/health' | grep '{"status":"ok"}'; do sleep 1; done
      timeout-minutes: 5

  verify-docker-pull-arm:
    needs: containerize
    if: >-
      inputs.release &&
      inputs.registry != 'ecr' &&
      contains(inputs.platforms, 'linux/arm64')
    name: verify-docker-pull-arm (${{ inputs.edition }})
    runs-on: arm-ubuntu-24-2core
    timeout-minutes: 15
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        username: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_USERNAME || secrets.DOCKERHUB_USERNAME }}
        password: ${{ inputs.release && secrets.DOCKERHUB_RELEASE_TOKEN || secrets.DOCKERHUB_TOKEN }}
    - name: Pull the container image
      run: docker pull ${{ needs.containerize.outputs.full_image }}
    - name: Launch container
      run: docker run --rm -dp 3000:3000 ${{ needs.containerize.outputs.full_image }}
      timeout-minutes: 5
    - name: Wait for Metabase to start
      run: while ! curl -s 'http://localhost:3000/api/health' | grep '{"status":"ok"}'; do sleep 1; done
      timeout-minutes: 5
