      author: yb
      comment: Content Diagnostics — index findings by entity
      changes:
        - createIndex:
            tableName: content_diagnostics_finding
            indexName: idx_cd_finding_entity
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_id

