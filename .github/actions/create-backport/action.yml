name: Create Backport PR
description: Cherry-picks a commit onto a release branch and opens the backport pull request.

inputs:
  target-version: # major version number like 34 or 86
    required: true
  backport-commit:
    required: true
  github-token:
    required: true
  github-token-2: # need a second token to approve the PR
    required: true

runs:
  using: "composite"
  steps:
    - id: create_backport_pull_request
      name: Create backport pull request
      env:
        TARGET_VERSION: ${{ inputs.target-version }}
        TARGET_BRANCH: release-x.${{ inputs.target-version }}.x
        ORIGINAL_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        ORIGINAL_TITLE: ${{ github.event.pull_request.title }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COMMIT: ${{ inputs.backport-commit }}
      shell: bash
      run: | # bash
        git config --global user.email "metabase-bot@metabase.com"
        git config --global user.name "Metabase bot"

        BACKPORT_BRANCH="backport-$TARGET_VERSION-$COMMIT"

        # Kondo ignore ratchets apply only to our trunk development.
        # Release branches keep an explicit opt-out in the file, which can conflict with backported budget changes.
        # Resolve that conflict by preserving the release branch's opt-out.
        # Older release branches do not have the file, so remove it there instead.
        # If no other files conflict, finish the cherry-pick automatically.
        #
        # During a cherry-pick, HEAD ("ours") is the release branch.
        # This is also true when the function is copied into backport.sh for manual conflict resolution.
        resolve_ratchets() {
          local f=.clj-kondo/ratchets.edn
          [ -n "$(git ls-files -u -- "$f")" ] || return 0
          if git cat-file -e "HEAD:$f" 2>/dev/null; then
            echo "$f: keeping the release branch's copy"
            git checkout HEAD -- "$f"
          else
            echo "$f: dropped, kondo ratchets are master-only"
            git rm -q "$f"
          fi
          if [ -z "$(git ls-files -u)" ]; then
            echo "$f was the only conflict, finishing the cherry-pick"
            if git diff --cached --quiet HEAD; then
              # If the commit changed only the ratchets file, resolving the conflict leaves nothing
              # staged. --continue refuses an empty commit, so create one explicitly to preserve the
              # backport commit and allow the PR to be opened.
              echo "nothing left to apply, committing the backport empty"
              git commit --allow-empty --no-edit
            else
              git -c core.editor=true cherry-pick --continue
            fi
          fi
        }

        # Checkout the target branch and create a new backport branch
        git checkout ${TARGET_BRANCH}
        git fetch --all
        git checkout -b ${BACKPORT_BRANCH}
        git cherry-pick ${COMMIT} || true
        resolve_ratchets

        CONFLICT_LIST=$(git ls-files -u)

        CONFLICTS=$(git ls-files -u | wc -l)
        if [ "$CONFLICTS" -gt 0 ]; then
          git cherry-pick --abort

          echo "Could not cherry pick because of a conflict"
          echo "has-conflicts=true" >> "$GITHUB_OUTPUT"

          # Add a shell script for resolving conflicts
          {
            echo "#!/usr/bin/env bash"
            echo "git reset HEAD~1"
            echo "rm ./backport.sh"
            echo "git cherry-pick ${COMMIT}"
            declare -f resolve_ratchets
            echo "resolve_ratchets"
            echo "echo -e 'Resolve conflicts and force push this branch.\n\nTo backport translations run: bin/i18n/merge-translations <release-branch>'"
          } > ./backport.sh
          chmod +x ./backport.sh
          git add ./backport.sh
          git commit -m "Add backport resolution script"

          PR_BODY=$(cat <<-END
          #${ORIGINAL_PULL_REQUEST_NUMBER}
          > [!IMPORTANT]
          > Manual conflict resolution is required.
          > Checkout the branch and run \`./backport.sh\` script. Force push your changes after cherry-picking. Mark the PR as ready for review once conflicts have been addressed.

          Conflicts:
          \`\`\`shell
          ${CONFLICT_LIST}
          \`\`\`
        END
          )
        else
          echo "has-conflicts=false" >> "$GITHUB_OUTPUT"
          PR_BODY="#${ORIGINAL_PULL_REQUEST_NUMBER}"
        fi

        git push -u origin ${BACKPORT_BRANCH}

        PR_ARGS=(--base "${TARGET_BRANCH}" --head "${BACKPORT_BRANCH}" --label "was-backported" --assignee "${{ github.event.pull_request.user.login }}" --title "🤖 v${TARGET_VERSION} backported \"${ORIGINAL_TITLE}\"" --body "${PR_BODY}")
        if [ "$CONFLICTS" -gt 0 ]; then
          PR_ARGS+=(--draft)
        fi

        BACKPORT_PR_URL=$(gh pr create "${PR_ARGS[@]}")
        BACKPORT_PR_NUMBER=${BACKPORT_PR_URL##*/}

        echo "backport_pr_number=$BACKPORT_PR_NUMBER" >> "$GITHUB_OUTPUT"
        echo "New PR has been created: #${BACKPORT_PR_NUMBER}"

        git checkout ${{ github.sha }}

    - name: Auto approve backport PR
      if: ${{ steps.create_backport_pull_request.outputs.has-conflicts == 'false' }}
      uses: juliangruber/approve-pull-request-action@68fcc9a5a73b5641cadf757cf99d73720dcb05d0 # v2.1.0
      with:
        github-token: ${{ inputs.github-token-2 }}
        number: ${{ steps.create_backport_pull_request.outputs.backport_pr_number }}

    - name: Enable Pull Request Automerge
      if: ${{ steps.create_backport_pull_request.outputs.has-conflicts == 'false' }}
      run: gh pr merge --squash --auto "$PR_NUMBER"
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ steps.create_backport_pull_request.outputs.backport_pr_number }}

    - uses: ./.github/actions/notify-pull-request
      if: ${{ steps.create_backport_pull_request.outputs.has-conflicts == 'true' }}
      with:
        include-log: false
        message: Manual conflict resolution is required on \#${{ steps.create_backport_pull_request.outputs.backport_pr_number }}

    - uses: ./.github/actions/notify-pull-request
      if: ${{ failure() }}
      with:
        include-log: true
        message: Something went wrong while creating backport
