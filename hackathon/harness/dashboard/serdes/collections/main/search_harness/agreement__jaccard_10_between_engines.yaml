dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH p AS (
        SELECT engine, engine_b, round(avg(jaccard)::numeric, 2) AS v
        FROM harness_agreement
        WHERE corpus_id = {{corpus}}
          AND embedding_text = {{variant}}
          AND text_strategy = {{strategy}}
          [[AND (data_scale = {{scale}} OR data_scale IS NULL)]]
          [[AND embedder = {{embedder}}]]
        GROUP BY 1, 2
      ), a AS (
        SELECT * FROM p
        UNION ALL
        SELECT DISTINCT engine, engine, 1.0 FROM p
      )
      SELECT engine AS "Engine",
             max(v) FILTER (WHERE engine_b = 'semantic') AS "semantic",
             max(v) FILTER (WHERE engine_b = 'semantic-pure') AS "semantic-pure",
             max(v) FILTER (WHERE engine_b = 'semantic-vector') AS "semantic-vector",
             max(v) FILTER (WHERE engine_b = 'sqlite-vec1') AS "sqlite-vec1",
             max(v) FILTER (WHERE engine_b = 'sqlite-vec1-pure') AS "sqlite-vec1-pure",
             max(v) FILTER (WHERE engine_b = 'lucene') AS "lucene",
             max(v) FILTER (WHERE engine_b = 'lucene-pure') AS "lucene-pure",
             max(v) FILTER (WHERE engine_b = 'appdb') AS "appdb",
             max(v) FILTER (WHERE engine_b = 'in-place') AS "in-place"
      FROM a
      GROUP BY 1
      ORDER BY array_position(ARRAY['semantic', 'semantic-pure', 'semantic-vector', 'sqlite-vec1', 'sqlite-vec1-pure', 'lucene', 'lucene-pure', 'appdb', 'in-place'], engine)
    template-tags:
    - default: baseline
      display-name: Embedding text
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000005
