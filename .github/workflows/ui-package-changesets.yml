name: UI Package Changesets

on:
  push:
    branches: [master]
    paths:
      - 'frontend/ui-package/.changeset/**'
  workflow_dispatch:

concurrency:
  group: ui-package-changesets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version-pr:
    if: ${{ github.repository == 'metabase/metabase' && github.ref == 'refs/heads/master' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'

      - name: Open or update the UI release PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Use the automation account so the release PR runs the usual PR checks.
          github-token: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}
          cwd: ${{ github.workspace }}/frontend/ui-package
          version-script: bunx --bun @changesets/cli@3.0.3 version
          pr-title: 'Release @metabase/ui (publishes on merge)'
          commit-message: 'Release @metabase/ui'
          create-github-releases: false
          push-git-tags: false
