# A small model whose field names deliberately differ from the columns of
# their source tables. Keys, relationship columns and metric expressions
# all name the fields, never the source columns, as described in
# core-spec/spec.md "Name Resolution". Converters that compile to SQL
# against the source tables have to substitute each field's expression.
version: "0.2.0.dev0"
name: renamed_fields
description: Orders and customers whose field names differ from their source columns

datasets:
  - name: orders
    source: sales.public.orders   # columns: o_orderkey, o_custkey, o_orderdate, o_totalprice, total_cents
    primary_key: [order_id]
    description: One row per order
    fields:
      - name: order_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: o_orderkey
        datatype: Integer
      - name: customer_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: o_custkey
        datatype: Integer
      - name: order_date
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: o_orderdate
        datatype: Date
        dimension:
          is_time: true
      - name: total_amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: o_totalprice
        datatype: Decimal
      - name: total_usd
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: total_cents / 100.0
        datatype: Decimal

  - name: customers
    source: sales.public.customers   # columns: c_custkey, c_name, c_mktsegment
    primary_key: [id]
    description: One row per customer
    fields:
      - name: id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: c_custkey
        datatype: Integer
      - name: name
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: c_name
        datatype: String
      - name: segment
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: c_mktsegment
        datatype: String

relationships:
  - name: orders_to_customers
    from: orders
    to: customers
    from_columns: [customer_id]   # field of orders, not o_custkey
    to_columns: [id]              # field of customers, not c_custkey

metrics:
  - name: total_revenue
    description: Sum of order totals in dollars
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(orders.total_usd)
  - name: order_count
    description: Number of orders
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT orders.order_id)
  - name: customer_count
    description: Number of customers with at least one order
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT orders.customer_id)
  - name: gross_revenue
    description: Sum of order totals as the source records them, through the renamed field
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(orders.total_amount)
