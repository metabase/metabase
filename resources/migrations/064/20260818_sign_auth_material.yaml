databaseChangeLog:
  - changeSet:
      id: v64.2026-08-18T00:00:01
      author: bryanmaass
      comment: Add core_user.is_superuser_sig
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: core_user
                columnName: is_superuser_sig
      changes:
        - addColumn:
            tableName: core_user
            columns:
              - column:
                  name: is_superuser_sig
                  type: ${text.type}
                  remarks: "Keyed signature over the is_superuser value; verified when resolving the current user."
                  constraints:
                    nullable: true

  - changeSet:
      id: v64.2026-08-18T00:00:02
      author: bryanmaass
      comment: Add auth_identity.credentials_sig
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: auth_identity
                columnName: credentials_sig
      changes:
        - addColumn:
            tableName: auth_identity
            columns:
              - column:
                  name: credentials_sig
                  type: ${text.type}
                  remarks: "Keyed signature over the credentials fields; verified before honoring stored credentials."
                  constraints:
                    nullable: true

  - changeSet:
      id: v64.2026-08-18T00:00:03
      author: bryanmaass
      comment: Backfill auth material signature columns
      changes:
        - customChange:
            class: metabase.app_db.custom_migrations.BackfillAuthMaterialSignatures
