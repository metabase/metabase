      rollback:
        - addColumn:
            tableName: sandboxes
            columns:
              - column:
                  name: worktree_id
                  type: INTEGER
                  defaultValueNumeric: 1
                  remarks: The remote sync worktree of the row, 1 being the main app
                  constraints:
                    nullable: false
