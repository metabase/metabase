name: Profile Tests

# On-demand profiling of an arbitrary test selection. Unlike the regular test workflows, this one always
# uploads its output — flamegraph, raw stacks, and per-test wall times — including when the tests pass,
# because a green-but-slow suite is exactly what it exists to diagnose.

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Passed to hawk :only. A vector of namespaces/vars, e.g. [metabase.driver.bigquery-cloud-sdk-test], or a quoted directory, e.g. "test/metabase/driver/"'
        type: string
        required: true
      drivers:
        description: 'DRIVERS value. Only bigquery-cloud-sdk has credentials wired up here — leave blank for tests that need no warehouse.'
        type: string
        required: false
        default: 'bigquery-cloud-sdk'
      event:
        description: 'wall samples blocked threads too, so it shows time spent waiting on the network; cpu only sees on-CPU work.'
        type: choice
        options:
          - wall
          - cpu
          - alloc
        default: wall
      interval:
        description: 'Sampling interval in nanoseconds. Raise it for long runs — the raw stacks file grows at roughly 100 KB/s at 10ms.'
        type: string
        required: false
        default: '10000000'
      timeout:
        description: 'Job timeout in minutes.'
        type: number
        required: false
        default: 90

jobs:
  profile:
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: ${{ inputs.timeout }}
    env:
      CI: 'true'
      DRIVERS: ${{ inputs.drivers }}
      MB_BIGQUERY_TEST_PROJECT_ID: ${{ secrets.BIGQUERY_TEST_PROJECT_ID }}
      MB_BIGQUERY_TEST_CLIENT_ID: ${{ secrets.MB_BIGQUERY_TEST_CLIENT_ID }}
      MB_BIGQUERY_TEST_CLIENT_SECRET: ${{ secrets.MB_BIGQUERY_TEST_CLIENT_SECRET }}
      MB_BIGQUERY_TEST_ACCESS_TOKEN: ${{ secrets.MB_BIGQUERY_TEST_ACCESS_TOKEN }}
      MB_BIGQUERY_TEST_REFRESH_TOKEN: ${{ secrets.MB_BIGQUERY_TEST_REFRESH_TOKEN }}
      MB_BIGQUERY_CLOUD_SDK_TEST_SERVICE_ACCOUNT_JSON: ${{ secrets.MB_BIGQUERY_CLOUD_SDK_TEST_SERVICE_ACCOUNT_JSON }}
      MB_BIGQUERY_CLOUD_SDK_TEST_SERVICE_ACCOUNT_JSON_ROUTING: ${{ secrets.MB_BIGQUERY_CLOUD_SDK_TEST_SERVICE_ACCOUNT_JSON_ROUTING }}
    steps:
      - uses: actions/checkout@v6

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      # perf_events are unreadable by an unprivileged process on the default runner image, and the cpu
      # event has no other sampling mechanism. wall and alloc do not go through perf_events at all.
      - name: Allow perf events
        if: ${{ inputs.event == 'cpu' }}
        run: sudo sysctl -w kernel.perf_event_paranoid=1 kernel.kptr_restrict=0

      # Inputs go through env vars rather than being interpolated into the script, so a selection
      # containing shell metacharacters is passed to clojure verbatim instead of being executed.
      - name: Run tests under the profiler
        id: run-test
        env:
          ONLY: ${{ inputs.test }}
          EVENT: ${{ inputs.event }}
          INTERVAL: ${{ inputs.interval }}
        run: |
          clojure -X:dev:ci:ee:ee-dev:drivers:drivers-dev:test:profile-tests \
            :only "$ONLY" :profile-event ":$EVENT" :profile-interval "$INTERVAL"

      - name: Summarize test wall times
        if: always()
        run: |
          mkdir -p target/profile-report
          grep -h '<testsuite' target/junit/*.xml 2>/dev/null \
            | sed -E 's|.*<testsuite name="([^"]*)" time="([^"]*)".*|\2 \1|' \
            | sort -rn > target/profile-report/slowest-namespaces.txt
          grep -h '<testcase' target/junit/*.xml 2>/dev/null \
            | sed -E 's|.*classname="([^"]*)" name="([^"]*)" time="([^"]*)".*|\3 \1/\2|' \
            | sort -rn > target/profile-report/slowest-tests.txt
          echo "### Slowest namespaces (seconds)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -25 target/profile-report/slowest-namespaces.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profile-${{ github.run_id }}
          path: |
            target/clj-async-profiler/results/**
            target/profile-report/**
            target/junit/**/*.xml
          retention-days: 14
          if-no-files-found: warn
