# Settings shared by every task file in this directory. moon merges
# fileGroups, taskOptions, implicitDeps and tasks across all of them.

fileGroups:
  frontend:
    - frontend/**
    - enterprise/frontend/**
  e2e:
    - e2e/**
  cljs:
    - src/**
    - resources/**
    - deps.edn
    - shadow-cljs.edn
    - .clj-kondo/config/modules/config.edn
  tsconfig:
    - tsconfig.json
    - tsconfig.base.json
    - tsconfig.sdk.json
  # Tracked files under resources/frontend_client that the build reads.
  # That directory is a mix: these are inputs, app/dist and the generated
  # html files are outputs.
  frontendClient:
    - resources/frontend_client/*_template.html
    - resources/frontend_client/init.html
    - resources/frontend_client/inline_js/**
    - resources/frontend_client/app/assets/**
    - resources/frontend_client/app/fonts/**
    - resources/frontend_client/app/img/**
    - resources/frontend_client/app/instance-loading-page/**
  rspack:
    - rspack.*.js
    - rspack.config.js
    - babel.config.json
    - postcss.config.js
  jest:
    - jest.config.js
    - jest.base.conf.js
    - jest.esm-packages.js
    - babel.config.json
  sdk:
    - enterprise/frontend/src/embedding-sdk-package/**
    - enterprise/frontend/src/embedding-sdk-ee/**
    - frontend/src/embedding-sdk-bundle/**
    - frontend/src/embedding-sdk-shared/**

taskOptions:
  outputStyle: buffer-only-failure

implicitDeps:
  - deps

tasks:
  deps:
    script: |-
      bun install
    inputs:
      - bun.lock
      - package.json
