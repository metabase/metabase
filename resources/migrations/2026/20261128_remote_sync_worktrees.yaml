## Remote sync worktrees: checkouts of other branches whose content lives in the same tables as the default worktree,
## told apart by worktree_id, 1 for the default worktree. Every table that can reach content remote sync syncs has the
## column, but for sandboxes and permissions, which are shared across worktrees like data permissions. Their unique
## keys are unique per worktree, what is in a Collection is deleted with it, and the rows and logs of a worktree are
## deleted with it. Each changeset runs one statement, since MySQL commits each DDL statement, so that an upgrade that
## stops part way resumes where it stopped.

databaseChangeLog:
  - changeSet:
      id: tkqd6n
      author: ranquild
      comment: Undo the earlier remote sync worktree migrations on a database that ran them, a development one built on master, so that the changesets after this one build the worktree schema again
      preConditions:
        - onFail: MARK_RAN
