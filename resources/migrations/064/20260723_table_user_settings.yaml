## Adds metabase_table_user_settings, a mirror table of metabase_table that records the values a
## user has explicitly set through the UI (as opposed to values authored by sync). Follows the
## pattern of metabase_field_user_settings (v55.2025-06-23T11:29:00).

databaseChangeLog:
  - changeSet:
      id: v64.2026-07-23T10:00:00
      author: ranquild
      comment: Add metabase_table_user_settings
      changes:
        - createTable:
            tableName: metabase_table_user_settings
            remarks: Mirror table of metabase_table to keep track of user-set values (only settable fields are mirrored)
            columns:
              - column:
                  remarks: The related Table
                  name: table_id
                  type: int
                  constraints:
                    primaryKey: true
                    nullable: false
                    referencedTableName: metabase_table
                    referencedColumnNames: id
                    foreignKeyName: fk_table_user_settings_table_id
                    deleteCascade: true
              - column:
                  name: created_at
                  remarks: The timestamp of when the user setting was created
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  remarks: The timestamp of when the user setting was updated
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  remarks: User-set display_name for the Table
                  name: display_name
                  type: varchar(254)
              - column:
                  remarks: User-set description for the Table
                  name: description
                  type: ${text.type}
              - column:
                  remarks: User-set entity_type for the Table
                  name: entity_type
                  type: varchar(254)
              - column:
                  remarks: User-set visibility_type for the Table
                  name: visibility_type
                  type: varchar(254)
              - column:
                  remarks: User-set field_order for the Table
                  name: field_order
                  type: varchar(254)
              - column:
                  remarks: User-set caveats for the Table
                  name: caveats
                  type: ${text.type}
              - column:
                  remarks: User-set points_of_interest for the Table
                  name: points_of_interest
                  type: ${text.type}
              - column:
                  remarks: User-set show_in_getting_started for the Table
                  name: show_in_getting_started
                  type: ${boolean.type}
              - column:
                  remarks: User-set collection_id for the Table
                  name: collection_id
                  type: int
              - column:
                  remarks: User-set is_published for the Table
                  name: is_published
                  type: ${boolean.type}
              - column:
                  remarks: User-set data_layer for the Table
                  name: data_layer
                  type: varchar(254)
              - column:
                  remarks: User-set data_authority for the Table
                  name: data_authority
                  type: varchar(20)
              - column:
                  remarks: User-set data_source for the Table
                  name: data_source
                  type: varchar(254)
              - column:
                  remarks: User-set owner_email for the Table
                  name: owner_email
                  type: ${text.type}
              - column:
                  remarks: User-set owner_user_id for the Table
                  name: owner_user_id
                  type: int

  ## The indexes are created before the FK constraints: MySQL/MariaDB require an index to back
  ## every FK and reuse an existing one, so this keeps rollback working (the FK is dropped before
  ## the index it would otherwise still need). Postgres doesn't auto-index FKs, which is what
  ## fks-are-indexed-test checks for.
  - changeSet:
      id: v64.2026-07-23T10:00:01
      author: ranquild
      comment: Index metabase_table_user_settings.collection_id
      changes:
        - createIndex:
            tableName: metabase_table_user_settings
            indexName: idx_table_user_settings_collection_id
            columns:
              - column:
                  name: collection_id

  - changeSet:
      id: v64.2026-07-23T10:00:02
      author: ranquild
      comment: Add FK constraint on metabase_table_user_settings.collection_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: metabase_table_user_settings
            baseColumnNames: collection_id
            referencedTableName: collection
            referencedColumnNames: id
            constraintName: fk_table_user_settings_collection_id
            onDelete: SET NULL

  - changeSet:
      id: v64.2026-07-23T10:00:03
      author: ranquild
      comment: Index metabase_table_user_settings.owner_user_id
      changes:
        - createIndex:
            tableName: metabase_table_user_settings
            indexName: idx_table_user_settings_owner_user_id
            columns:
              - column:
                  name: owner_user_id

  - changeSet:
      id: v64.2026-07-23T10:00:04
      author: ranquild
      comment: Add FK constraint on metabase_table_user_settings.owner_user_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: metabase_table_user_settings
            baseColumnNames: owner_user_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_table_user_settings_owner_user_id
            onDelete: SET NULL

  ## Backfill settings for all active tables from values that can be attributed as user edits. The
  ## purely user-authored columns (caveats, points_of_interest, collection_id, is_published,
  ## owner_email, owner_user_id) are copied as-is, and columns with a known system default are
  ## recorded only when they differ from it: data_layer 'internal', data_authority 'unconfigured',
  ## field_order 'database' (every in-tree driver's default-field-order), visibility_type NULL,
  ## is_published/show_in_getting_started FALSE. visibility_type 'cruft' is sync-authored (the
  ## cruft detector hides tables by setting it), so it is not copied — and since the model keeps
  ## the pair in sync, the accompanying data_layer of a crufty table is sync-derived too, so
  ## neither half is recorded for those tables. Columns whose current value cannot be attributed
  ## stay NULL and accumulate from user edits going forward: display_name (the humanization
  ## strategy is env-configurable, so there is no default to compare against), description (may be
  ## user-written or synced from a database comment), entity_type (the sync classifier writes a
  ## name-derived value on every table) and data_source (uploads/transforms write it). Tables where
  ## nothing would be recorded get no row (an all-NULL row carries no information), inactive tables
  ## are ignored, and the audit/instance-analytics database is excluded (curated by Metabase
  ## itself), via NOT EXISTS rather than NOT IN (SELECT ...) since NOT IN degrades on large
  ## instances (#78271). Rows that already exist (user edits made before this changeset ran) are
  ## left untouched. created_at/updated_at are omitted so their current_timestamp defaults apply.
  - changeSet:
      id: v64.2026-07-23T10:00:05
      author: ranquild
      comment: Backfill metabase_table_user_settings from user-attributable table values
      changes:
        - sql:
            sql: >-
              INSERT INTO metabase_table_user_settings
                (table_id, caveats, points_of_interest, visibility_type,
                 data_layer, collection_id, is_published, owner_email, owner_user_id, data_authority,
                 field_order, show_in_getting_started)
              SELECT
                t.id,
                t.caveats,
                t.points_of_interest,
                CASE WHEN t.visibility_type <> 'cruft' THEN t.visibility_type END,
                CASE WHEN t.data_layer <> 'internal'
                      AND (t.visibility_type IS NULL OR t.visibility_type <> 'cruft')
                     THEN t.data_layer END,
                t.collection_id,
                CASE WHEN t.is_published = TRUE THEN t.is_published END,
                t.owner_email,
                t.owner_user_id,
                CASE WHEN t.data_authority <> 'unconfigured' THEN t.data_authority END,
                CASE WHEN t.field_order <> 'database' THEN t.field_order END,
                CASE WHEN t.show_in_getting_started = TRUE THEN t.show_in_getting_started END
              FROM metabase_table t
              WHERE t.active = TRUE
                AND NOT EXISTS (SELECT 1 FROM metabase_database d WHERE d.id = t.db_id AND d.is_audit = TRUE)
                AND NOT EXISTS (SELECT 1 FROM metabase_table_user_settings s WHERE s.table_id = t.id)
                AND (t.caveats IS NOT NULL
                  OR t.points_of_interest IS NOT NULL
                  OR (t.visibility_type IS NOT NULL AND t.visibility_type <> 'cruft')
                  OR (t.data_layer IS NOT NULL AND t.data_layer <> 'internal'
                      AND (t.visibility_type IS NULL OR t.visibility_type <> 'cruft'))
                  OR t.collection_id IS NOT NULL
                  OR t.is_published = TRUE
                  OR t.owner_email IS NOT NULL
                  OR t.owner_user_id IS NOT NULL
                  OR (t.data_authority IS NOT NULL AND t.data_authority <> 'unconfigured')
                  OR (t.field_order IS NOT NULL AND t.field_order <> 'database')
                  OR t.show_in_getting_started = TRUE)
      rollback: # not necessary; the table is dropped by the rollback of v64.2026-07-23T10:00:00
