## Add permissions_group.is_data_app_group — a data-app group is a server-managed namespace, like a
## tenant group: hidden from the normal groups UI and not user-configurable. Mirrors is_tenant_group.
## The app code that creates a data app's group sets this true; every other group defaults to false.
## The second changeSet backfills groups that already existed before the column, identified by the
## data_app.permission_group_id FK, so they are hidden and blocked like freshly-created ones.

databaseChangeLog:
  - changeSet:
      id: v64.2026-09-01T00:00:00
      author: timofei
      comment: Add permissions_group.is_data_app_group boolean column
      changes:
        - addColumn:
            tableName: permissions_group
            columns:
              - column:
                  name: is_data_app_group
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: "true iff this is a Data App group (server-managed, hidden from the groups UI)"
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: permissions_group
            columnName: is_data_app_group

  - changeSet:
      id: v64.2026-09-01T00:00:01
      author: timofei
      comment: Flag data-app permission groups that predate the is_data_app_group column
      changes:
        - update:
            tableName: permissions_group
            columns:
              - column:
                  name: is_data_app_group
                  valueBoolean: true
            where: >-
              id IN (SELECT permission_group_id FROM data_app WHERE permission_group_id IS NOT NULL)
      rollback: # no-op: the column and this data are dropped when the add-column change above rolls back
