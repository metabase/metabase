name: Frontend

on:
  workflow_call:
    inputs:
      force-run:
        description: Run every job regardless of the diff (master / release branches).
        type: boolean
        default: false
      # ID of this run's test-plan.json artifact, or '' to run the full suite.
      test-plan-artifact-id:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      skip:
        description: "Skip main frontend jobs (type-check, unit tests, timezone tests)"
        type: boolean
        default: false
      skip-lint:
        description: "Skip linting jobs (oxfmt, eslint, css variables check)"
        type: boolean
        default: false
      skip-custom-viz:
        description: "Skip custom-viz package tests"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-frontend
  cancel-in-progress: true

env:
  # Consumed by the report-failures-to-ci-conductor step in fe-tests-unit. Absent
  # (e.g. fork PRs without secret access) the reporter no-ops. Matches the other
  # suite workflows (backend, drivers, e2e, app-db, semantic-search).
  CI_CONDUCTOR_BASE_URL: ${{ vars.CI_CONDUCTOR_BASE_URL }}
  CI_CONDUCTOR_WEBHOOK_SECRET: ${{ secrets.CI_CONDUCTOR_WEBHOOK_SECRET }}

jobs:
  # Tier 1: which suites the diff can affect. Tier 0 (the global force-run /
  # force-skip overrides) stays in run-tests.yml -- a force-skip never calls this
  # workflow at all, and the two ways of saying "run everything" skip the diff
  # outright. Every gate below then reads "run unless the filter said no", so a
  # skipped diff, an unknown filter or a malformed verdict all fail open.
  files-changed:
    name: Detect changed files
    if: ${{ !inputs.force-run && github.event_name != 'workflow_dispatch' }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      changes: ${{ steps.detect.outputs.changes }}
    steps:
      # A local action has to be checked out before it can run, and `.github` is
      # everything either it or the filters need -- seconds, not a full clone.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
      - id: detect
        uses: ./.github/actions/files-changed

  fe-lint:
    needs: files-changed
    if: >-
      ${{ !cancelled() && !inputs.skip-lint &&
      (fromJSON(needs.files-changed.outputs.changes || '{}').frontend_all != 'false' || fromJSON(needs.files-changed.outputs.changes || '{}').e2e_all != 'false') }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Cache spec
        id: cache-spec
        run: .github/scripts/cache-keys.sh | tee -a "$GITHUB_OUTPUT"
      # Small enough, and written by few enough jobs, that this one reads and writes its own cache
      # rather than waiting on cache-warm.
      - name: ESLint cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.cache-spec.outputs.eslint-path }}
          key: ${{ steps.cache-spec.outputs.eslint-key }}
          restore-keys: ${{ steps.cache-spec.outputs.eslint-restore-key }}

      - name: Compile CLJS
        run: bun run build-pure:cljs
      - name: Find CSS variables that are used but never defined
        run: bun run find-never-defined-css-variables
      - name: Run oxfmt formatting linter
        run: bun run lint-format-pure
      - name: Run ESLint linter
        run: bun run lint-eslint-pure
      - name: Run CSS linter
        run: bun run lint-css

  fe-type-check:
    needs: files-changed
    if: ${{ !cancelled() && !inputs.skip && fromJSON(needs.files-changed.outputs.changes || '{}').frontend_all != 'false' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - run: bun run build-pure:cljs
        name: Compile CLJS
      - run: bun run type-check-pure
        name: Check types

  fe-tests-unit:
    needs: files-changed
    if: ${{ !cancelled() && !inputs.skip && fromJSON(needs.files-changed.outputs.changes || '{}').frontend_all != 'false' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2] # 2 shards for parallel execution
    env:
      SHARDS: 2 # should match matrix above
      JEST_JUNIT_OUTPUT_DIR: ./target/junit
      JEST_JUNIT_OUTPUT_NAME: test-report-frontend-unit.xml
      UNIT_TEST_RESULTS_FILE: unit-test-results.json
    steps:
      - uses: actions/checkout@v6
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - name: Resolve current job id
        # Resolve JOB_ID before the long test step so the ci-conductor reporter
        # below can link failures to this exact job. Best-effort.
        uses: ./.github/actions/resolve-job-id
      - name: Prepare unit test selection
        id: unit-selection
        if: ${{ inputs.test-plan-artifact-id != '' }}
        uses: ./.github/actions/prepare-test-selection
        with:
          suite: unit
          test-plan-artifact-id: ${{ inputs.test-plan-artifact-id }}
      - name: Run frontend unit tests
        id: fe-tests
        env:
          JEST_TEST_PATHS_FILE: ${{ steps.unit-selection.outputs.paths-file }}
        # Jest exits non-zero on a shard with no files unless --passWithNoTests is set.
        run: |
          rm -f "$UNIT_TEST_RESULTS_FILE" "$JEST_JUNIT_OUTPUT_DIR/$JEST_JUNIT_OUTPUT_NAME"
          bun run test-unit --silent --shard=${{ matrix.shard }}/${{ env.SHARDS }} --json --outputFile="$UNIT_TEST_RESULTS_FILE" ${{ steps.unit-selection.outputs.paths-file && '--passWithNoTests' || '' }}
        # Ordinary assertion failures can be quarantined, but runner failures cannot.
        continue-on-error: true
      - name: Check unit test results
        if: ${{ !cancelled() && (steps.fe-tests.outcome == 'failure' || steps.unit-selection.outputs.paths-file) }}
        env:
          TEST_OUTCOME: ${{ steps.fe-tests.outcome }}
          JEST_TEST_PATHS_FILE: ${{ steps.unit-selection.outputs.paths-file }}
        run: bun .github/scripts/check-unit-test-results.ts
      - name: Report failed tests to ci-conductor
        if: ${{ !cancelled() && ( steps.fe-tests.outcome == 'failure' || github.run_attempt != '1' ) }}
        # This step should NEVER fail the job!
        continue-on-error: true
        uses: ./.github/actions/report-failures-to-ci-conductor
        with:
          test-suite: fe-tests-unit
          adapter: frontend
      - name: Quarantine gate
        if: ${{ !cancelled() && steps.fe-tests.outcome == 'failure' }}
        continue-on-error: ${{ vars.QUARANTINE_ENGINE != 'ci-conductor' }}
        timeout-minutes: 3
        uses: ./.github/actions/quarantine-gate
        with:
          adapter: frontend
          test-suite: fe-tests-unit
          enforce-quarantine: ${{ vars.QUARANTINE_ENGINE == 'ci-conductor' }}

  fe-tests-timezones:
    needs: files-changed
    if: ${{ !cancelled() && !inputs.skip && fromJSON(needs.files-changed.outputs.changes || '{}').frontend_all != 'false' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Run frontend timezones tests
        run: bun run test-timezones

  # No CLJS compile: the CI-script specs don't import app code.
  fe-tests-ci-scripts:
    needs: files-changed
    if: ${{ !cancelled() && fromJSON(needs.files-changed.outputs.changes || '{}').ci_scripts != 'false' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Run CI script tests
        run: bun run test-ci-scripts

  # The custom-viz package is an isolated Bun workspace under
  # enterprise/frontend/src/custom-viz
  fe-custom-viz:
    needs: files-changed
    if: ${{ !cancelled() && !inputs.skip-custom-viz && fromJSON(needs.files-changed.outputs.changes || '{}').custom_viz_all != 'false' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: enterprise/frontend/src/custom-viz
    steps:
      - uses: actions/checkout@v6
      - name: Prepare Node + Bun environment
        uses: ./.github/actions/prepare-node-bun
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run type-check
      - name: Lint
        run: bun run lint
      - name: Build CLI
        run: bun run build
      - name: Run tests
        run: bun run test

  fe-tests-result:
    needs:
      - files-changed
      - fe-lint
      - fe-type-check
      - fe-tests-unit
      - fe-tests-timezones
      - fe-tests-ci-scripts
      - fe-custom-viz
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    env:
      needs: ${{ toJson(needs) }}
    steps:
      - name: Check frontend job status
        uses: actions/github-script@v9
        env:
          needs: ${{ toJson(needs) }}
        with:
          script: | # js
            const needs = JSON.parse(process.env.needs);
            const jobs = Object.entries(needs).map(
              ([jobName, jobValues]) => ({
                name: jobName,
                result: jobValues.result
              }));

            // are all jobs skipped or successful?
            if (jobs.every(job => (job.result === 'skipped' || job.result === 'success'))) {
              console.log('All jobs are skipped or successful');
              process.exit(0);
            }

            // otherwise, something failed
            console.log('Some frontend jobs failed');
            jobs.forEach((job) => {
              if (job.result !== 'success') {
                console.log(`${job.name} - ${job.result}`);
              }
            });
            process.exit(1);
