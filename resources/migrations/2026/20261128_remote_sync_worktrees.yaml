      comment: Make the unique key unique_transform_tag of transform_transform_tag unique per worktree, ending it with worktree_id; rolling back deletes the worktrees but the default one and their rows first, since the keys rolling back restores are not unique across worktrees
      dbms: postgresql
      changes:
        - sql:
            sql: >-
              ALTER TABLE transform_transform_tag DROP CONSTRAINT unique_transform_tag, ADD CONSTRAINT unique_transform_tag UNIQUE (transform_id, tag_id, worktree_id)
      rollback:
        - sql:
            sql: >-
              DELETE FROM remote_sync_worktree WHERE is_default = FALSE
        - sql:
            sql: >-
              ALTER TABLE transform_transform_tag DROP CONSTRAINT unique_transform_tag, ADD CONSTRAINT unique_transform_tag UNIQUE (transform_id, tag_id)

