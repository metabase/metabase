name: Run tests
run-name: Validate narrowed E2E selection for PR 82052

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  create-test-plan:
    name: Plan a DeprecationNotice change
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.compute.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
      - name: Create test plan for one frontend file
        id: compute
        uses: ./.github/actions/create-test-plan
        with:
          changed-files: frontend/src/metabase/admin/app/components/DeprecationNotice/DeprecationNotice.tsx
          fe-changed-files: frontend/src/metabase/admin/app/components/DeprecationNotice/DeprecationNotice.tsx
          be-changed-files: ''
          unit-infra-touched: 'false'
          loki-infra-touched: 'false'
          e2e-infra-touched: 'false'
          shared-sources-touched: 'false'
      - name: Require a nonempty narrowed E2E selection
        run: jq -e '.stats.e2e_specs_to_run_usage > 0 and .stats.e2e_specs_to_run_usage < .stats.e2e_specs_all' test-plan.json

  uberjar:
    uses: ./.github/workflows/uberjar.yml
    secrets: inherit

  e2e-cljs:
    name: Compile CLJS for e2e
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - name: Compile CLJS
        run: bun run build-pure:cljs
      - name: Upload compiled CLJS
        uses: actions/upload-artifact@v7
        with:
          name: e2e-cljs-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cljs_dev
          if-no-files-found: error
          # Uploads fail when an artifact of this name already exists in the run
          # replace it rather than fail on a re-run.
          overwrite: true

  e2e:
    needs: [create-test-plan, uberjar, e2e-cljs]
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit
    with:
      test-plan-artifact-id: ${{ needs.create-test-plan.outputs.artifact-id }}
