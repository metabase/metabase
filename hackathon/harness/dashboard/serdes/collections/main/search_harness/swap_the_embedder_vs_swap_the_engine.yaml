dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH d AS (
        SELECT engine, embedder, value
        FROM harness_scenario_metric
        WHERE corpus_id = {{corpus}} AND metric = 'ndcg@10' AND engine NOT IN ('appdb', 'in-place')
          AND embedding_text = {{variant}}
          [[AND data_scale = {{scale}}]]
      )
      SELECT 'Change the embedder' AS "Factor", split_part(embedder, '/', 2) AS "Level", avg(value) AS "Mean nDCG@10" FROM d GROUP BY 2
      UNION ALL
      SELECT 'Change the engine', engine, avg(value) FROM d GROUP BY 2
      ORDER BY 1, 3
