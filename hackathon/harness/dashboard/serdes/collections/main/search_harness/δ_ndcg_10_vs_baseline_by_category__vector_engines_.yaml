dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH t AS (
        SELECT * FROM (
        SELECT m.tag, m.embedding_text, m.scenario_id, m.value - b.value AS value
        FROM harness_tag_metric m
        JOIN harness_tag_metric b
          ON b.corpus_id = m.corpus_id AND b.data_scale IS NOT DISTINCT FROM m.data_scale AND b.embedder = m.embedder
         AND b.text_strategy = m.text_strategy
         AND b.embedding_text = 'baseline' AND b.metric = m.metric
         AND b.tag = m.tag AND b.engine = m.engine AND b.scenario_id = m.scenario_id
        WHERE m.corpus_id = {{corpus}} AND m.metric = 'ndcg@10' AND m.engine NOT IN ('appdb', 'in-place')
          AND m.embedding_text <> 'baseline'
          [[AND (m.data_scale = {{scale}} OR m.data_scale IS NULL)]]
          [[AND m.embedder = {{embedder}}]]
          AND m.text_strategy = {{strategy}}
        ) s WHERE tag IN ('paraphrase', 'concept', 'exact-name', 'rare-token', 'typo', 'cross-lingual', 'ambiguous', 'empty-expected')
      ), n AS (SELECT tag, count(DISTINCT scenario_id) AS n FROM t GROUP BY tag),
      a AS (
        SELECT t.tag, t.tag || '  (n=' || n.n || ')' AS category, t.embedding_text AS pivot, round(avg(t.value)::numeric, 2) AS v
        FROM t JOIN n USING (tag)
        GROUP BY 1, 2, 3
      )
      SELECT category AS "Category",
             max(v) FILTER (WHERE pivot = 'context') AS "context",
             max(v) FILTER (WHERE pivot = 'context-sql') AS "context-sql"
      FROM a
      GROUP BY tag, category
      ORDER BY array_position(ARRAY['paraphrase', 'concept', 'exact-name', 'rare-token', 'typo', 'cross-lingual', 'ambiguous', 'empty-expected'], tag)
