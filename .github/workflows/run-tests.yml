name: PR 82049 narrowing demo
run-name: 'PR 82049 narrowing: ${{ inputs.scenario }}'

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Frontend change to simulate against the exact PR source
        type: choice
        required: true
        options:
          - account
          - auth

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  plan:
    name: Plan simulated ${{ inputs.scenario }} change
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    outputs:
      unit-specs: ${{ steps.plan.outputs.fe_unit_specs_to_run }}
    steps:
      - uses: actions/checkout@v6
      - name: Choose changed source file
        id: change
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          case "$SCENARIO" in
            account) file=frontend/src/metabase/account/notifications/components/HelpModal/HelpModal.tsx ;;
            auth) file=frontend/src/metabase/auth/components/PasswordPanel/PasswordPanel.tsx ;;
            *) exit 1 ;;
          esac
          git ls-files --error-unmatch "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          {
            echo 'Controlled CI demonstration for PR #82049 at 62b44b2e11365cea10b48c167b691a16d8d8c914.'
            echo
            echo "Simulated changed source: \`$file\`."
            echo 'The planner, Jest configuration/filter, and called frontend workflow are unchanged from that commit.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/create-test-plan
        id: plan
        with:
          changed-files: ${{ steps.change.outputs.file }}
          fe-changed-files: ${{ steps.change.outputs.file }}
          be-changed-files: ''
          unit-infra-touched: 'false'
          loki-infra-touched: 'false'
          e2e-infra-touched: 'false'
          shared-sources-touched: 'false'
      - name: Assert narrowing and verify Jest receives exactly the plan
        run: |
          jq -e '.stats.unit_specs_to_run_usage > 0 and .stats.unit_specs_to_run_usage < .stats.unit_specs_all' test-plan.json
          jq -c '.fe_unit_specs_to_run' test-plan.json > selected-unit-specs.json
          JEST_TEST_PATHS_FILE=selected-unit-specs.json bunx jest --ignoreProjects ci-scripts --listTests --runInBand --json > jest-selected-specs.json
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const plan = JSON.parse(fs.readFileSync('selected-unit-specs.json', 'utf8'));
          const actual = JSON.parse(fs.readFileSync('jest-selected-specs.json', 'utf8'));
          assert.deepEqual(actual.map(file => path.relative(process.cwd(), file)).sort(), [...plan].sort());
          const message = `Jest selected exactly the ${plan.length} spec files produced by the planner.`;
          console.log(message);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\n' + message + '\n');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.scenario }}-narrowing-evidence
          path: |
            test-plan.json
            selected-unit-specs.json
            jest-selected-specs.json

  frontend-tests:
    needs: plan
    uses: ./.github/workflows/frontend.yml
    secrets: inherit
    with:
      unit-specs: ${{ needs.plan.outputs.unit-specs }}
      skip-lint: true
      skip-custom-viz: true
      skip-ci-scripts: true
