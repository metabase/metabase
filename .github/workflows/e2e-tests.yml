name: E2E Tests

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-e2e
  cancel-in-progress: true

jobs:
  # The shared verdict plus the spec narrowing, in one job: `.github/scripts/gate/e2e.ts` turns the
  # verdict and the changed files into whether the suite runs and which specs the matrix builder
  # chunks, so the test job carries a single condition and everything else is decided here. The
  # script is a plain module, unit tested by the ci-scripts jest project.
  gate:
    name: Decide whether to run
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      e2e-tests: ${{ steps.plan.outputs.e2e-tests }}
      specs: ${{ steps.plan.outputs.specs }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            /.nvmrc
            /package.json
          sparse-checkout-cone-mode: false
      - name: Apply the shared gate
        id: base
        uses: ./.github/actions/test-gate
        with:
          filters: e2e_all e2e_specs
      - name: Prepare Node + Bun environment
        uses: ./.github/actions/prepare-node-bun
      - name: Plan the e2e run
        id: plan
        env:
          RUN: ${{ steps.base.outputs.run }}
          FORCE_RUN: ${{ steps.base.outputs.force-run }}
          FILES: ${{ steps.base.outputs.files }}
          EVENT_NAME: ${{ github.event_name }}
        run: bun .github/scripts/gate/e2e.ts

  e2e-matrix-builder:
    needs: gate
    uses: ./.github/workflows/e2e-matrix-builder.yml
    with:
      chunks: 50
      # Empty leaves the builder on its default glob, which is every spec.
      specs: ${{ needs.gate.outputs.specs }}

  reset-e2e-test-comment:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
      - name: Remove test results comment
        uses: actions/github-script@v9
        with:
          script: | # js
            const { owner, repo } = context.repo;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
            }).catch(console.error);

            if (!comments) {
              return;
            }

            const comment = comments.find((comment) => comment.body.includes('## e2e tests failed on '));

            if (comment) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: comment.id,
              });
            }

  e2e-tests:
    name: ${{ matrix.name }}-${{ matrix.edition }}
    uses: ./.github/workflows/e2e-test.yml
    needs:
      - gate
      - e2e-matrix-builder
    # No status function, so a failed matrix builder keeps this out: the strategy below cannot
    # parse a matrix it never produced.
    if: ${{ needs.gate.outputs.e2e-tests != '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.e2e-matrix-builder.outputs.matrix) }}
    secrets: inherit
    with:
      name: ${{ matrix.name }}
      edition: ${{ matrix.edition }}
      specs: ${{ matrix.specs }}
      total_chunks: ${{ fromJson(needs.e2e-matrix-builder.outputs.regularChunks) }}
      split_index: ${{ strategy.job-index }}
      tags: ${{ matrix.tags }}
      runner: ${{ matrix.runner }}

  collect-timings:
    name: Collect E2E Timings
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    needs: e2e-tests
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            e2e/support
          sparse-checkout-cone-mode: false

      - name: Download all timing artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: timing-data-*
          path: timing-files
          merge-multiple: false
        continue-on-error: true

      - name: Merge split timings
        id: merge
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const globber = await glob.create('timing-files/*/chunkTimings.json');
            const chunkFiles = await globber.glob();

            const specs = new Map();
            chunkFiles.forEach(file => {
              const { durations = [] } = JSON.parse(fs.readFileSync(file, 'utf8'));
              durations.forEach(({ spec, duration }) => specs.set(spec, duration));
            });

            if (specs.size === 0) {
              throw new Error('No timing data found - no specs had timing changes');
            }

            const outputPath = 'e2e/support/runTimings.json';
            fs.mkdirSync(path.dirname(outputPath), { recursive: true });

            const runTimings = {
              durations: [...specs].map(([spec, duration]) => ({ spec, duration }))
            };

            fs.writeFileSync(outputPath, JSON.stringify(runTimings, null, 2));
            console.log(`Merged timing data for ${specs.size} specs`);

      - name: Upload merged timing files
        if: steps.merge.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: merged-e2e-timings
          path: e2e/support/runTimings.json
          retention-days: 7

  e2e-tests-result:
    needs:
      - gate
      - e2e-matrix-builder
      - e2e-tests
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    name: e2e-tests-result
    if: ${{ !cancelled() }}
    env:
      E2E_TESTS_RESULT: ${{ needs.e2e-tests.result }}
    steps:
      - name: Check the gate
        if: ${{ needs.gate.result == 'failure' }}
        run: |
          echo "The test gate failed, so the suite never ran"
          exit 1
      - name: Check the matrix builder
        if: ${{ needs.e2e-matrix-builder.result == 'failure' }}
        run: |
          echo "The matrix builder failed, so the suite never ran"
          exit 1
      - name: Stub
        if: ${{ needs.e2e-tests.result == 'skipped' }}
        run: |
          echo "Didn't run due to conditional filtering"
      - name: Test results
        if: ${{ needs.e2e-tests.result != 'skipped' }}
        run: | # sh
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"

          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "E2E Tests failed"
            exit 1
          fi
