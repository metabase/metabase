## Rename the (dead but API-still-used) workspace feature's tables out of the way so the
## `workspace` name can be reused by a different feature. Data-preserving renames: workspace
## -> workspace_deprecated and workspace_database -> workspace_database_deprecated. The
## table_remapping table keeps its name. renameTable is portable across all supported DBs and
## preserves rows, columns, indexes, and foreign keys.

databaseChangeLog:
  - changeSet:
      id: v64.2026-07-24T10:00:00
      author: ranquild
      comment: Rename workspace table to workspace_deprecated
      changes:
        - renameTable:
            oldTableName: workspace
            newTableName: workspace_deprecated
      rollback:
        - renameTable:
            oldTableName: workspace_deprecated
            newTableName: workspace

  - changeSet:
      id: v64.2026-07-24T10:00:01
      author: ranquild
      comment: Rename workspace_database table to workspace_database_deprecated
      changes:
        - renameTable:
            oldTableName: workspace_database
            newTableName: workspace_database_deprecated
      rollback:
        - renameTable:
            oldTableName: workspace_database_deprecated
            newTableName: workspace_database
