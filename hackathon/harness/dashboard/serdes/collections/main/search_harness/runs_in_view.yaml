dataset_query:
  database: Search Harness
  stages:
  - native: |-
      SELECT lr.corpus_id AS "Corpus", lr.data_scale AS "Scale", lr.embedder AS "Embedder", lr.embedding_text AS "Embedding text",
             lr.text_strategy AS "Text strategy",
             string_agg(lr.engine, ', ' ORDER BY array_position(ARRAY['semantic', 'semantic-pure', 'semantic-vector', 'sqlite-vec1', 'sqlite-vec1-pure', 'lucene', 'lucene-pure', 'appdb', 'in-place'], lr.engine)) AS "Engines", lr.run_id AS "Run",
             r.finished_at AS "Finished", r.git_sha AS "Git SHA",
             CASE WHEN c.overlapped THEN 'yes: left out of latency cards' ELSE 'no' END AS "Overlapped"
      FROM harness_latest_engine_run lr
      JOIN harness_run r USING (run_id)
      LEFT JOIN harness_run_concurrency c USING (run_id)
      WHERE (lr.corpus_id = {{corpus}} OR lr.corpus_id LIKE 'scale-%')
      GROUP BY 1, 2, 3, 4, 5, 7, 8, 9, 10
      ORDER BY 2, 3, 4, 5, 8
    template-tags:
    - default: northwind-golden-v1
      display-name: Corpus
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000001
      name: corpus
      required: true
      type: text
    lib/type: mbql.stage/native
  lib/type: mbql/query
