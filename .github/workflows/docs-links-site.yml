name: Check links against the live sites

on:
  schedule:
    # Sundays at 05:00 UTC
    - cron: "0 5 * * 0"
  workflow_dispatch:

jobs:
  live-links:
    name: Check links against the live sites
    if: ${{ github.event_name != 'schedule' || github.repository == 'metabase/metabase' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SLACK_CHANNEL: C0AL5E179P0 # #growth-alerts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .lychee
            .github/ISSUE_TEMPLATE
            .github/scripts
            docs
            frontend/src
            enterprise/frontend/src
            src
            enterprise/backend/src
            resources
            modules

      - name: Install lychee
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          archive=lychee-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfL -o "$archive" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$archive"
          echo "$LYCHEE_SHA256  $archive" | sha256sum -c -
          tar xzf "$archive"
          sudo install lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee

      - name: Check metabase.com and GitHub wiki links
        id: site
        continue-on-error: true
        env:
          # lychee uses it for github.com, which rate-limits anonymous requests.
          GITHUB_TOKEN: ${{ github.token }}
          LINKS_REPORT: site-links.txt
        run: docs/util/check-links.sh site

      - name: Check links to other sites
        id: external
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINKS_REPORT: external-links.txt
        run: docs/util/check-links.sh --external

      # The 7-day cache eviction window equals the weekly gap, so the quarantine travels as an artifact instead.
      - name: Restore the link quarantine
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh run list --workflow docs-links-site.yml --branch master --status completed --limit 10 \
                  --json databaseId --jq '.[].databaseId')
          for id in $ids; do
            if gh run download "$id" --name link-quarantine --dir .; then
              echo "Restored the link quarantine from run $id"
              exit 0
            fi
          done
          echo "No previous link quarantine"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"
          token: ${{ secrets.GITHUB_TOKEN }}

      # Keeps one open Linear issue: a run with links to list opens it or replaces its description, a run with nothing to list closes it.
      # Slack hears when it opens or closes. Only master reports: a manual run on a branch checks that branch.
      - name: Open, update, or close the broken links issue
        id: report
        if: github.ref == 'refs/heads/master'
        env:
          BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
          SITE_OUTCOME: ${{ steps.site.outcome }}
          EXTERNAL_OUTCOME: ${{ steps.external.outcome }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: fc363549-4f40-41ed-8f41-8fba461606ab # GRO
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: bun .github/scripts/report-links.ts --external external-links.txt --quarantine link-quarantine.json site-links.txt

      - name: Save the link quarantine
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@v7
        with:
          name: link-quarantine
          path: link-quarantine.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 90

      - name: Alert when the link check can't run
        if: failure() && github.ref == 'refs/heads/master'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          jq -n --arg channel "$SLACK_CHANNEL" --arg text ":x: The weekly metabase/metabase link check failed to run: $RUN_URL" \
            '{channel: $channel, text: $text}' |
            curl -sSf https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" --data @-

      # A link held in the quarantine doesn't fail the run.
      - name: Fail the run
        if: (steps.site.outcome == 'failure' || steps.external.outcome == 'failure') && steps.report.outputs.broken != 'false'
        run: exit 1
