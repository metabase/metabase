  - changeSet:
      id: ts7zwj
      author: ranquild
      comment: Index the root collection of each tenant, which the foreign key added next checks
      changes:
        - createIndex:
            tableName: tenant
            indexName: idx_tenant_tenant_collection_id
            columns:
              - column:
                  name: tenant_collection_id

  - changeSet:
      id: g5cjpm
      author: ranquild
      comment: Create a root collection, archived when the tenant is inactive, for each tenant whose root collection is missing, marking it with the id of its tenant in its description
      changes:
        - sql:
            dbms: postgresql
            sql: >-
              INSERT INTO collection (name, slug, type, namespace, location, entity_id, description, archived, archived_directly, archive_operation_id) SELECT 'Tenant Collection: ' || t.name, substr(lower(regexp_replace('Tenant Collection: ' || t.name, '[^a-zA-Z0-9]', '_', 'g')), 1, 510), 'tenant-specific-root-collection', 'tenant-specific', '/', substr(replace(gen_random_uuid()::text, '-', ''), 1, 21), 'tenant-collection-repair:' || t.id, CASE WHEN t.is_active THEN FALSE ELSE TRUE END, CASE WHEN t.is_active THEN NULL ELSE TRUE END, CASE WHEN t.is_active THEN NULL ELSE gen_random_uuid()::text END FROM tenant t WHERE NOT EXISTS (SELECT 1 FROM collection c WHERE c.id = t.tenant_collection_id)
        - sql:
            dbms: mysql,mariadb
            sql: >-
              INSERT INTO collection (name, slug, type, namespace, location, entity_id, description, archived, archived_directly, archive_operation_id) SELECT CONCAT('Tenant Collection: ', t.name), substr(lower(regexp_replace(CONCAT('Tenant Collection: ', t.name), '[^a-zA-Z0-9]', '_')), 1, 510), 'tenant-specific-root-collection', 'tenant-specific', '/', substr(replace(uuid(), '-', ''), 1, 21), CONCAT('tenant-collection-repair:', t.id), CASE WHEN t.is_active THEN FALSE ELSE TRUE END, CASE WHEN t.is_active THEN NULL ELSE TRUE END, CASE WHEN t.is_active THEN NULL ELSE uuid() END FROM tenant t WHERE NOT EXISTS (SELECT 1 FROM collection c WHERE c.id = t.tenant_collection_id)
        - sql:
            dbms: h2
            sql: >-
              INSERT INTO collection (name, slug, type, namespace, location, entity_id, description, archived, archived_directly, archive_operation_id) SELECT 'Tenant Collection: ' || t.name, substr(lower(regexp_replace('Tenant Collection: ' || t.name, '[^a-zA-Z0-9]', '_')), 1, 510), 'tenant-specific-root-collection', 'tenant-specific', '/', substr(replace(cast(random_uuid() as varchar), '-', ''), 1, 21), 'tenant-collection-repair:' || t.id, CASE WHEN t.is_active THEN FALSE ELSE TRUE END, CASE WHEN t.is_active THEN NULL ELSE TRUE END, CASE WHEN t.is_active THEN NULL ELSE cast(random_uuid() as varchar) END FROM tenant t WHERE NOT EXISTS (SELECT 1 FROM collection c WHERE c.id = t.tenant_collection_id)
      rollback:

  - changeSet:
      id: p813h9
      author: ranquild
      comment: Point each tenant whose root collection is missing at the collection marked with its id
      changes:
        - sql:
            dbms: postgresql
            sql: >-
              UPDATE tenant SET tenant_collection_id = (SELECT c.id FROM collection c WHERE c.description = 'tenant-collection-repair:' || tenant.id) WHERE EXISTS (SELECT 1 FROM collection c WHERE c.description = 'tenant-collection-repair:' || tenant.id)
        - sql:
            dbms: mysql,mariadb
            sql: >-
              UPDATE tenant SET tenant_collection_id = (SELECT c.id FROM collection c WHERE c.description = CONCAT('tenant-collection-repair:', tenant.id)) WHERE EXISTS (SELECT 1 FROM collection c WHERE c.description = CONCAT('tenant-collection-repair:', tenant.id))
        - sql:
            dbms: h2
            sql: >-
              UPDATE tenant SET tenant_collection_id = (SELECT c.id FROM collection c WHERE c.description = 'tenant-collection-repair:' || tenant.id) WHERE EXISTS (SELECT 1 FROM collection c WHERE c.description = 'tenant-collection-repair:' || tenant.id)
      rollback:

