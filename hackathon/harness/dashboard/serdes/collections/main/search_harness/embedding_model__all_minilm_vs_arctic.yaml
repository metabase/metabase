dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH m AS (
        SELECT engine, embedder, value
        FROM harness_scenario_metric
        WHERE corpus_id = 'northwind-golden-v1' AND metric = 'ndcg@10' AND embedding_text = 'baseline' AND text_strategy = 'none'
          AND embedder IN ('ollama/all-minilm', 'ollama/snowflake-arctic-embed2')
      ), both_models AS (SELECT engine FROM m GROUP BY engine HAVING count(DISTINCT embedder) = 2)
      SELECT engine AS "Engine", split_part(embedder, '/', 2) AS "Embedder", round(avg(value)::numeric, 3) AS "nDCG@10"
      FROM m JOIN both_models USING (engine)
      GROUP BY engine, embedder
      ORDER BY array_position(ARRAY['semantic', 'semantic-pure', 'semantic-vector', 'sqlite-vec1', 'sqlite-vec1-pure', 'lucene', 'lucene-pure', 'appdb', 'in-place'], engine), embedder
    lib/type: mbql.stage/native
  lib/type: mbql/query
