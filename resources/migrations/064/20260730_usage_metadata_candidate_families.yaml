databaseChangeLog:
  - changeSet:
      id: v64.um-candidate-display-name
      author: codex
      comment: Add the cluster-aware deterministic display name
      changes:
        - addColumn:
            tableName: usage_metadata_candidate
            columns:
              - column: {name: display_name, type: varchar(254), remarks: Cluster-aware deterministic display name}

  - changeSet:
      id: v64.um-candidate-family-key
      author: codex
      comment: Add the recommendation-family root signature
      changes:
        - addColumn:
            tableName: usage_metadata_candidate
            columns:
              - column: {name: family_key, type: char(64), remarks: Signature hash of the recommendation-family root}

  - changeSet:
      id: v64.um-candidate-family-order
      author: codex
      comment: Add the global recommendation-family order
      changes:
        - addColumn:
            tableName: usage_metadata_candidate
            columns:
              - column: {name: family_order, type: int, remarks: Global family order within the snapshot}

  - changeSet:
      id: v64.um-candidate-family-position
      author: codex
      comment: Add the recommendation position inside its family
      changes:
        - addColumn:
            tableName: usage_metadata_candidate
            columns:
              - column: {name: family_position, type: int, remarks: Depth-first position inside the recommendation family}

  - changeSet:
      id: v64.um-candidate-family-depth
      author: codex
      comment: Add the primary subset-parent depth inside the family
      changes:
        - addColumn:
            tableName: usage_metadata_candidate
            columns:
              - column: {name: family_depth, type: int, remarks: Primary subset-parent depth inside the recommendation family}

  - changeSet:
      id: v64.um-candidate-families-index
      author: codex
      comment: Index deterministic recommendation-family ordering
      changes:
        - createIndex:
            tableName: usage_metadata_candidate
            indexName: idx_um_candidate_family_order
            columns:
              - column: {name: run_id}
              - column: {name: family_order}
              - column: {name: family_position}
