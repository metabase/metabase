name: Test gate

# Decides whether a test suite should run, so each suite owns its own gating
# instead of the caller computing a `skip` input for it.
#
# `force-run` and `force-skip` are global overrides; `defer` hands the decision
# to the paths filter, which is the only path that pays for a checkout.
#
# In a stack of PRs, only the ends run CI: the lowest unmerged PR (the one whose
# base ref is the stack base) and the top PR (the one at the last position).
# Every PR in between is force-skipped and gets tested once it reaches the
# bottom of the stack, unless it carries the `ci:run-all` label. The top diffs
# against `diff-base`, where the stack forked from its base, so the whole stack
# decides what runs and not just the top PR's own slice.
on:
  workflow_call:
    inputs:
      filters:
        description: >-
          Filter names from .github/file-paths.yaml, comma- or
          whitespace-separated. The suite runs when the diff matches any of them.
          Leave empty to decide on the overrides alone and skip the paths filter.
        type: string
        default: ''
    outputs:
      run:
        description: Whether the calling suite should run.
        value: >-
          ${{ jobs.should-run.outputs.verdict != 'force-skip'
          && (inputs.filters == ''
          || jobs.should-run.outputs.verdict == 'force-run'
          || jobs.files-changed.outputs.any == 'true') }}
      matched:
        description: >-
          Which of the requested filters the diff touched, as a JSON array, for suites whose jobs
          map to different filters. A force-run reports every requested filter.
        value: >-
          ${{ (jobs.should-run.outputs.verdict == 'force-run' && jobs.should-run.outputs.filters)
          || jobs.files-changed.outputs.matched || '[]' }}
      force-run:
        description: Whether the suite should run in full, ignoring the diff.
        value: ${{ jobs.should-run.outputs.verdict == 'force-run' }}
      verdict:
        description: force-run, force-skip, or defer.
        value: ${{ jobs.should-run.outputs.verdict }}
      diff-base:
        description: >-
          The commit to diff against instead of the PR's own base: set only on the top PR of a
          stack, to where the stack forked from its base. Callers that narrow by diff should use it
          when it is set.
        value: ${{ jobs.should-run.outputs.diff-base }}

jobs:
  should-run:
    name: Decide whether to run
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
      filters: ${{ steps.decide.outputs.filters }}
      diff-base: ${{ steps.diff-base.outputs.sha }}
    steps:
      - name: Decide
        id: decide
        # Precedence matters for the conditions below.
        env:
          FILTERS: ${{ inputs.filters }}
          VERDICT: >-
            ${{ (github.ref_name == 'master' || startsWith(github.ref_name, 'release-x.')) && 'force-run'
            || contains(github.event.pull_request.labels.*.name, 'ci:run-all') && 'force-run'
            || contains(github.event.pull_request.labels.*.name, 'ci:skip') && 'force-skip'
            || (github.event.pull_request.stack != null
            && github.event.pull_request.stack.base.ref != github.event.pull_request.base.ref
            && github.event.pull_request.stack.position != github.event.pull_request.stack.size) && 'force-skip'
            || 'defer' }}
        run: |
          echo "verdict=$VERDICT" | tee -a "$GITHUB_OUTPUT"
          # Echoed back as JSON so a force-run can report every requested filter as matched.
          echo "filters=$(jq -Rc 'split("[,\\s]+";"") | map(select(length > 0))' <<< "$FILTERS")" | tee -a "$GITHUB_OUTPUT"
      # A stacked PR that defers is the bottom or the top, and only the top has a base ref other
      # than the stack's. The merge base, not the stack base's SHA, so commits that landed on the
      # base after the stack last synced don't count as the stack's changes.
      - name: Find where the stack forked from its base
        id: diff-base
        if: >-
          ${{ steps.decide.outputs.verdict == 'defer'
          && github.event.pull_request.stack != null
          && github.event.pull_request.stack.base.ref != github.event.pull_request.base.ref }}
        uses: actions/github-script@v9
        env:
          STACK_BASE_SHA: ${{ github.event.pull_request.stack.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: | # js
            const { data } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo,
              basehead: `${process.env.STACK_BASE_SHA}...${process.env.HEAD_SHA}`,
              per_page: 1,
            });
            core.info(`diff-base: ${data.merge_base_commit.sha}`);
            core.setOutput('sha', data.merge_base_commit.sha);

  files-changed:
    name: Detect changed files
    needs: should-run
    if: ${{ needs.should-run.outputs.verdict == 'defer' && inputs.filters != '' }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      matched: ${{ steps.match.outputs.matched }}
      any: ${{ steps.match.outputs.any }}
    steps:
      # The filter definitions are the only thing on disk that paths-filter reads.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      # No file lists: one filter's list can outgrow the 128 KiB a single environment variable may
      # hold on Linux, and every caller after the gate pays for it. A job that needs the paths runs
      # its own paths filter.
      - name: Test which files changed
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          # The API only lists the PR's own files, so a `diff-base` needs git, which an empty token
          # switches paths-filter to. It fetches the commit itself.
          token: ${{ needs.should-run.outputs.diff-base == '' && github.token || '' }}
          base: ${{ needs.should-run.outputs.diff-base }}
          filters: .github/file-paths.yaml
      - name: Match the diff against the requested filters
        id: match
        uses: actions/github-script@v9
        env:
          REQUESTED: ${{ inputs.filters }}
          # The names of every filter the diff matched, as a JSON array.
          CHANGED: ${{ steps.changes.outputs.changes }}
        with:
          script: | # js
            const fs = require('fs');

            const requested = process.env.REQUESTED.split(/[\s,]+/).filter(Boolean);
            const changed = JSON.parse(process.env.CHANGED);

            // A filter name that no longer exists would silently gate the suite off forever.
            const defined = [...fs.readFileSync('.github/file-paths.yaml', 'utf8')
              .matchAll(/^(\w+):/gm)].map(([, name]) => name);
            const unknown = requested.filter((filter) => !defined.includes(filter));
            if (unknown.length) {
              core.setFailed(`Unknown filter(s) in .github/file-paths.yaml: ${unknown.join(', ')}`);
              return;
            }

            const matched = requested.filter((filter) => changed.includes(filter));
            core.info(`requested: ${requested.join(', ')}`);
            core.info(`matched: ${matched.join(', ') || 'none'}`);
            core.setOutput('matched', JSON.stringify(matched));
            core.setOutput('any', matched.length > 0);
