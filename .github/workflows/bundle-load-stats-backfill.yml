name: Bundle Load Stats Backfill

# Measures recent master commits and imports each as its own point, so the chart
# reads as a trend before the per-merge job has had a month to build one.
#
# Uberjars are kept for 30 days. A commit older than that has nothing to
# measure, and the script skips it with a warning.

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many recent master commits to measure"
        required: false
        default: "3"

jobs:
  backfill:
    if: github.repository == 'metabase/metabase'
    # The same runner as the per-merge job. Load times are relative to the
    # machine, so backfilling anywhere else would put a step in the series.
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 60
    env:
      COUNT: ${{ inputs.count }}
      # Matches timeout-minutes above. The script drops the commits that would
      # not fit rather than letting the job be killed mid-measurement.
      TIMEOUT_MINUTES: "60"
      MB_JETTY_PORT: "4000"
      RUNS: "8"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-node-bun
      - name: Prepare JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Install Chrome v144
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 144
        id: setup-chrome
      - name: Measure and import each commit
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          ENG_STATS_URL: ${{ secrets.ENG_STATS_URL }}
          API_KEY: ${{ secrets.ENG_STATS_API_KEY }}
        run: bun .github/scripts/backfill-load-times.ts
      - name: Keep the logs when something goes wrong
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backfill-logs
          path: artifacts/
          retention-days: 5
