## Add a dedicated renewable lease for full search reindexes. Unlike metabase_cluster_lock, acquiring and renewing
## this lease uses short transactions and does not pin a connection or transaction for the duration of the reindex.

databaseChangeLog:

  - changeSet:
      id: v64.2026-08-18T13:57:56
      author: crisptrutski
      comment: Add granular renewable leases for search reindex jobs
      changes:
        - createTable:
            tableName: search_index_lease
            remarks: Coordinates full search reindexes across Metabase nodes without holding a transaction open.
            columns:
              - column:
                  name: engine
                  type: varchar(64)
                  remarks: The search engine whose index is being rebuilt.
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: varchar(254)
                  remarks: The search specification version being rebuilt.
                  constraints:
                    nullable: false
              - column:
                  name: lang_code
                  type: varchar(20)
                  remarks: The site locale used by this index.
                  constraints:
                    nullable: false
              - column:
                  name: owner
                  type: varchar(36)
                  remarks: A unique token for the process that currently owns this lease.
                  constraints:
                    nullable: false
              - column:
                  name: acquired_at
                  type: ${timestamp_type}
                  remarks: The app database time at which the current owner acquired or took over the lease.
                  constraints:
                    nullable: false
              - column:
                  name: last_renewed_at
                  type: ${timestamp_type}
                  remarks: The app database time of the current owner's most recent successful renewal.
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: ${timestamp_type}
                  remarks: The time after which another process may reclaim this lease.
                  constraints:
                    nullable: false

  - changeSet:
      id: v64.2026-08-18T13:57:57
      author: crisptrutski
      comment: Key search reindex leases by engine, version, and locale
      changes:
        - addPrimaryKey:
            tableName: search_index_lease
            columnNames: engine, version, lang_code
            constraintName: pk_search_index_lease
