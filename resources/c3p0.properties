c3p0.initialPoolSize=1
c3p0.minPoolSize=1
com.mchange.v2.c3p0.impl.DefaultConnectionTester.isValidTimeout=6
c3p0.unreturnedConnectionTimeout=300
c3p0.debugUnreturnedConnectionStackTraces=true
# Register no JMX MBeans (per pool, or the registry bean). Reading a pool's MBean while that pool is being built
# deadlocks inside c3p0 (https://github.com/swaldman/c3p0/issues/95); Metabase reads pool stats from the pool objects
# instead.
com.mchange.v2.c3p0.management.ManagementCoordinator=com.mchange.v2.c3p0.management.NullManagementCoordinator
