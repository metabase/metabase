databaseChangeLog:
  - changeSet:
      id: v65.2026-09-21T10:00:00
      author: ranquild
      comment: Create worktree table
      changes:
        - createTable:
            tableName: worktree
            remarks: One row per checked-out remote-sync branch (a git-worktree-style checkout of the synced content tree)
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch
                  type: varchar(254)
                  remarks: Git branch this worktree is checked out to
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: User who created this worktree; null once that user is deleted
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: When this worktree was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: When this worktree was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.2026-09-21T10:01:00
      author: ranquild
      comment: Unique index on worktree.branch - a branch can be checked out at most once
      changes:
        - createIndex:
            tableName: worktree
            indexName: idx_worktree_branch
            unique: true
            columns:
              - column:
                  name: branch

  - changeSet:
      id: v65.2026-09-21T10:02:00
      author: ranquild
      comment: FK worktree.creator_id -> core_user; SET NULL so the worktree survives its creator's deletion
      changes:
        - addForeignKeyConstraint:
            baseTableName: worktree
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_worktree_creator_id
            onDelete: SET NULL

  - changeSet:
      id: v65.2026-09-21T10:03:00
      author: ranquild
      comment: Index on worktree.creator_id - every foreign key is expected to be indexed
      changes:
        - createIndex:
            tableName: worktree
            indexName: idx_worktree_creator_id
            columns:
              - column:
                  name: creator_id
      # MySQL keeps an index on every foreign key column and refuses to drop the last one, so the constraint has
      # to come off first and go back on after -- re-added here rather than left to the changeset that created
      # it, which rolls back later and would find it already gone.
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: worktree
            constraintName: fk_worktree_creator_id
        - dropIndex:
            tableName: worktree
            indexName: idx_worktree_creator_id
        - addForeignKeyConstraint:
            baseTableName: worktree
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_worktree_creator_id
            onDelete: SET NULL

  - changeSet:
      id: v65.2026-09-21T11:00:00
      author: ranquild
      comment: Add remote_sync_object.worktree_id
      changes:
        - addColumn:
            tableName: remote_sync_object
            columns:
              - column:
                  name: worktree_id
                  type: int
                  remarks: Worktree this row was checked out into; null for the main app
                  constraints:
                    nullable: true

  - changeSet:
      id: v65.2026-09-21T11:01:00
      author: ranquild
      comment: Index on remote_sync_object.worktree_id (backs the FK below and every worktree-scoped query)
      changes:
        - createIndex:
            tableName: remote_sync_object
            indexName: idx_remote_sync_object_worktree_id
            columns:
              - column:
                  name: worktree_id

  - changeSet:
      id: v65.2026-09-21T11:02:00
      author: ranquild
      comment: FK remote_sync_object.worktree_id -> worktree; RESTRICT rather than CASCADE, since MySQL refuses a stored generated column over a cascading base column and worktree_id_helper below is one. Deleting a worktree deletes what it checked out from the application
      changes:
        - addForeignKeyConstraint:
            baseTableName: remote_sync_object
            baseColumnNames: worktree_id
            referencedTableName: worktree
            referencedColumnNames: id
            constraintName: fk_remote_sync_object_worktree_id
            onDelete: RESTRICT

  - changeSet:
      id: v65.2026-09-22T10:01:00
      author: ranquild
      comment: Add remote_sync_object.worktree_id_helper, a generated column restating worktree_id with 0 for the main app so unique keys and the world foreign keys below can hold it
      changes:
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE remote_sync_object ADD COLUMN worktree_id_helper INTEGER GENERATED ALWAYS AS (
                COALESCE(worktree_id, 0)
              ) STORED;
        - sql:
            dbms: mysql,mariadb
            sql: >-
              ALTER TABLE remote_sync_object ADD COLUMN worktree_id_helper INTEGER GENERATED ALWAYS AS (
                COALESCE(worktree_id, 0)
              ) STORED;
        - sql:
            dbms: h2
            sql: >-
              ALTER TABLE remote_sync_object ADD COLUMN worktree_id_helper INTEGER GENERATED ALWAYS AS (
                COALESCE(worktree_id, 0)
              );
      rollback:
        - sql:
            sql: ALTER TABLE remote_sync_object DROP COLUMN worktree_id_helper;

