## Drop exploration_block.type. It recorded whether a Research-plan block was anchored on its
## metric ("metric") or its dimension ("dimension"). Dimension-anchored blocks were removed, so
## every block is now a metric crossed with its dimensions and nothing reads or writes the
## column. The rollback recreates it in its pre-drop state (nullable, no default), so existing
## rows come back with a NULL type — the read path treated that as metric-anchored anyway.

databaseChangeLog:

  - changeSet:
      id: v64.2026-08-31T00:00:00
      author: nvoxland
      comment: Drop the unused exploration_block.type column
      changes:
        - dropColumn:
            tableName: exploration_block
            columnName: type
      rollback:
        - addColumn:
            tableName: exploration_block
            columns:
              - column:
                  name: type
                  type: ${text.type}
                  remarks: Block anchor — "metric" or "dimension"
                  constraints:
                    nullable: true
