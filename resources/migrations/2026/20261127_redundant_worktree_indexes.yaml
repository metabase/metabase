## Drop the single-column worktree_id indexes of the log tables, which no foreign key or query uses, and give the
## Postgres planner statistics for worktree_id.

databaseChangeLog:
  - changeSet:
      id: wix6ow
      author: ranquild
      comment: Drop idx_audit_log_worktree_id, which no foreign key or query uses
      changes:
        - dropIndex:
            tableName: audit_log
            indexName: idx_audit_log_worktree_id
      rollback:
        - createIndex:
            tableName: audit_log
            indexName: idx_audit_log_worktree_id
            columns:
              - column:
                  name: worktree_id

