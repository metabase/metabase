databaseChangeLog:
  - changeSet:
      id: mc21hy
      author: johnswanson
      comment: Add exploration_query.resolved_source_ids
      changes:
        - addColumn:
            tableName: exploration_query
            columns:
              - column:
                  name: resolved_source_ids
                  type: ${text.type}
                  remarks: JSON-encoded tables and cards the query reads, resolved when its data_access_token was stamped. NULL means resolve it from dataset_query.
                  constraints:
                    nullable: true

  - changeSet:
      id: t0u3ct
      author: johnswanson
      comment: Add exploration_thread.resolved_source_ids
      changes:
        - addColumn:
            tableName: exploration_thread
            columns:
              - column:
                  name: resolved_source_ids
                  type: ${text.type}
                  remarks: JSON-encoded tables and cards the thread's metric card reads, resolved when its data_access_token was stamped. NULL means resolve it from the card.
                  constraints:
                    nullable: true
