name: Loki Visual Regression Testing

on:
  workflow_call:
    inputs:
      skip:
        type: boolean
        default: false
      test-plan-artifact-id:
        description: "ID of this run's test-plan.json artifact, '' to run the full suite."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-loki
  cancel-in-progress: true

jobs:
  story-selection:
    if: ${{ !inputs.skip && inputs.test-plan-artifact-id != '' }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      count: ${{ steps.selection.outputs.count }}
      test-plan-artifact-id: ${{ steps.selection.outputs.paths-file && inputs.test-plan-artifact-id || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            /package.json
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"
      - name: Download test plan
        id: test-plan
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.test-plan-artifact-id }}
          path: ${{ runner.temp }}/test-plan
      - name: Prepare Loki story selection
        id: selection
        env:
          PLAN_DOWNLOADED: ${{ steps.test-plan.outcome }}
        run: bun .github/scripts/prepare-test-selection.ts loki

  visual-test:
    needs: story-selection
    if: ${{ !cancelled() && !inputs.skip && needs.story-selection.outputs.count != '0' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    services:
      docker:
        image: docker:19.03.12
        options: --privileged
        ports:
          - 2376:2376
        env:
          DOCKER_TLS_CERTDIR: /certs
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /tmp/docker-certs:/certs/client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare frontend environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        run: NODE_ENV=development bun run build-pure:cljs

      - name: Download test plan
        id: test-plan
        if: ${{ needs.story-selection.outputs.test-plan-artifact-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.story-selection.outputs.test-plan-artifact-id }}
          path: ${{ runner.temp }}/test-plan

      - name: Prepare Loki story selection
        id: selection
        if: ${{ needs.story-selection.outputs.test-plan-artifact-id != '' }}
        env:
          PLAN_DOWNLOADED: ${{ steps.test-plan.outcome }}
        run: bun .github/scripts/prepare-test-selection.ts loki

      - name: Build Storybook
        env:
          STORYBOOK_STORY_PATHS_FILE: ${{ steps.selection.outputs.paths-file }}
        run: bun run build-storybook

      - name: Run Loki Visual Tests
        # All selected stories can have parameters.loki.skip set.
        run: bun run test-visual:loki --reactUri file:./storybook-static --verboseRenderer ${{ steps.selection.outputs.paths-file && '--passWithNoStories' || '' }}

      - name: Generate Visual Report on Failure
        if: failure()
        run: bun run test-visual:loki-report

      - name: Upload Artifact
        id: artifact-upload-step
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: loki-report
          include-hidden-files: true
          path: .loki/
          if-no-files-found: ignore
