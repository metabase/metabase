name: CI for Perf tests
run-name: Run perf test for ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_call:
jobs:
  build:
    name: Build and dockerize Metabase image
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: ./.github/workflows/build-private-ee-docker-image.yml
    secrets:
      PR_ENV_IAM_ROLE: ${{ secrets.PR_ENV_IAM_ROLE }}
      PR_ENV_AWS_ACCOUNT_ID: ${{ secrets.PR_ENV_AWS_ACCOUNT_ID }}
  launch_perf_test:
    needs: [build]
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    name: Launch Perf Test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.PR_ENV_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PR_ENV_TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          version: 1.50.1
          sha256sum: d9fe6b480fb5078f0aa57dace686898dda7e2a768884271159faa74846bfb576
      - name: Create OIDC Token
        id: create-oidc-token
        shell: bash
        run: |
          export OIDC_URL_WITH_AUDIENCE="$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${PR_ENV_K8S_AUDIENCE}"
          IDTOKEN=$(curl -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" -H "Accept: application/json; api-version=2.0" "$OIDC_URL_WITH_AUDIENCE" | jq -r .value)
          echo "::add-mask::${IDTOKEN}"
          echo "idToken=${IDTOKEN}" >>"$GITHUB_OUTPUT"
        env:
          PR_ENV_K8S_AUDIENCE: ${{ secrets.PR_ENV_K8S_AUDIENCE }}
      - name: Setup Kube Context
        uses: azure/k8s-set-context@89b837d75b40a7bd2ddafde837473c212db8b313 # v5.0.0
        with:
          method: kubeconfig
          kubeconfig: |
            kind: Config
            apiVersion: v1
            current-context: default
            clusters:
            - name: default
              cluster:
                certificate-authority-data: ${{ secrets.PR_ENV_K8S_CERTIFICATE_AUTHORITY_DATA }}
                server: ${{ secrets.PR_ENV_K8S_SERVER }}
            users:
            - name: oidc-token
              user:
                token: ${{ steps.create-oidc-token.outputs.IDTOKEN }}
            contexts:
            - name: default
              context:
                cluster: default
                namespace: default
                user: oidc-token
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.PR_ENV_IAM_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: us-east-1
      - name: Download Deployment YAML template
        run: aws s3 cp s3://metabase-pr-env/perf-test-pr.yml.tmpl ./perf-test-pr.yml.tmpl
      - name: Trim SHA
        env:
          SHA: ${{ needs.build.outputs.tag }}
        id: split
        run: echo "fragment=${SHA:5}" >> "$GITHUB_OUTPUT"
      - name: Render Deployment YAML
        uses: nowactions/envsubst@c4b8e3977354d294659a7ec164279ce8fba5c2e1 # v1.0.1
        with:
          input: ./perf-test-pr.yml.tmpl
          output: ./perf-test-pr.yml
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          PR_NUMBER: ${{ github.event.number }}
          RUN_ID: ${{ steps.split.outputs.fragment }}
          SHA: ${{ needs.build.outputs.tag }}
          TEST_NAME: test
      - name: Deploy PR Review ENV
        run: |
          kubectl apply -f ./perf-test-pr.yml
