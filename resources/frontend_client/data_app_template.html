<!DOCTYPE html>
<html lang="{{{language}}}" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="base-href" content="{{{baseHref}}}" />
    <meta name="uri" content="{{{uri}}}" />

    {{{embedCode}}}

    <title>{{{applicationName}}}</title>

    <base href="{{{baseHref}}}" />

    <script type="application/json" id="_metabaseBootstrap">
      {{{bootstrapJSON}}}
    </script>

    <script type="application/json" id="_metabaseLocales">
      {"user": "{{{userLocale}}}", "site": "{{{siteLocale}}}"}
    </script>

    <script type="application/json" id="_metabaseUserColorScheme">
      {{{userColorScheme}}}
    </script>

    <!-- If you modify this script, make sure you update the whitelisted Content-Security-Policy hash in metabase.server.middleware.security -->
    <!-- The nonce is here so index_bootstrap.js can read it off `document.currentScript.nonce`.
         The browser blanks the attribute after parsing, so the value stays out of the DOM. -->
    <script type="text/javascript" nonce="{{{nonce}}}">{{{bootstrapJS}}}</script>
    <script type="text/javascript">{{{assetOnErrorJS}}}</script>

    <!-- The catalogue chunks this request needs. They install themselves, so the
         app's `import()` of them resolves without a request. Below
         index_bootstrap.js, which repairs <base href> when the Site URL setting
         is wrong, and these resolve against it. -->
    {{{localeScripts}}}
  </head>

  <!--
    No `mb-wrapper` class on body: SDK components add it to their own
    wrappers via `PublicComponentStylesWrapper`. Setting it on the body
    would put the entire iframe (including the bundle's own chrome) under
    Metabase's `.mb-wrapper`-scoped resets, which is what we're trying to
    avoid.
  -->
  <body dir="ltr">
    <div id="root"></div>
  </body>
</html>
