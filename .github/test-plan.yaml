      be-tests-bigquery-cloud-sdk-ee:
        run:
          paths:
            - backend_all
      be-tests-bigquery-transforms-python-ee:
        run:
          paths:
            - backend_all
      be-tests-clickhouse-ee:
        run:
          paths:
            - backend_all
      be-tests-druid-jdbc-ee:
        run:
          paths:
            - backend_all
      be-tests-databricks-ee:
        run:
          paths:
            - backend_all
      be-tests-h2:
        run:
          paths:
            - backend_all
      be-tests-h2-oss:
        run:
          paths:
            - backend_all
      be-tests-mysql-mariadb:
        run:
          paths:
            - backend_all
      be-tests-mongo:
        run:
          paths:
            - backend_all
      be-tests-mongo-ssl:
        run:
          paths:
            - backend_all
      be-tests-mongo-sharded-cluster-ee:
        run:
          paths:
            - backend_all
      be-tests-oracle:
        run:
          paths:
            - backend_all
      be-tests-postgres:
        run:
          paths:
            - backend_all
      be-tests-presto-jdbc-ee:
        run:
          paths:
            - backend_all
      be-tests-redshift-ee:
        run:
          paths:
            - backend_all
      be-tests-snowflake-ee:
        run:
          paths:
            - backend_all
      be-tests-sparksql-ee:
        run:
          paths:
            - backend_all
      be-tests-sqlite-ee:
        run:
          paths:
            - backend_all
      be-tests-sqlserver:
