dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH runs AS (
        SELECT DISTINCT run_id FROM harness_latest_engine_run
        WHERE corpus_id = {{corpus}}
          AND embedding_text = {{variant}}
          AND text_strategy = {{strategy}}
          [[AND (data_scale = {{scale}} OR data_scale IS NULL)]]
          [[AND embedder = {{embedder}}]]
      ), names AS (
        -- Display names as the engines returned them, matched by id within the same run (ids differ per instance).
        SELECT l.run_id, x ->> 'model' AS model, x ->> 'id' AS id, max(x ->> 'name') AS name
        FROM harness_latest_list l
        CROSS JOIN LATERAL jsonb_array_elements(l.returned) x
        WHERE l.scenario_id = {{scenario}} AND l.run_id IN (SELECT run_id FROM runs)
        GROUP BY 1, 2, 3
      ), a AS (
        SELECT s.scenario_id, s.query, s.tags, s.lang, s.notes,
               -- Fixture runs predate refs; they run on a single instance, so model/id is unambiguous there.
               coalesce(e ->> 'ref', (e ->> 'model') || '/' || (e ->> 'id')) AS ref, (e ->> 'grade')::int AS grade, n.name
        FROM harness_scenario s
        JOIN runs USING (run_id)
        LEFT JOIN LATERAL jsonb_array_elements(s.expected) e ON true
        LEFT JOIN names n ON n.run_id = s.run_id AND n.model = e ->> 'model' AND n.id = e ->> 'id'
        WHERE s.scenario_id = {{scenario}}
      )
      SELECT scenario_id AS "Scenario", query AS "Query", array_to_string(tags, ', ') AS "Tags", lang AS "Lang",
             ref AS "Right answer", coalesce(max(name), '(no engine returned it)') AS "Name as shown in results", grade AS "Grade",
             notes AS "Why this question is tricky"
      FROM a
      GROUP BY scenario_id, query, tags, lang, notes, ref, grade
      ORDER BY "Grade" DESC NULLS LAST, "Right answer"
    template-tags:
    - default: baseline
      display-name: Embedding text
