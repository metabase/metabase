dataset_query:
  database: Search Harness
  stages:
  - native: |-
      SELECT source || '  (' || n_scenarios || ' scenarios)' AS "Source",
             round((100 * share)::numeric, 1) AS "% of nDCG@10 variance"
      FROM harness_variance_share
      WHERE corpus_id = {{corpus}} AND metric = 'ndcg@10'
        AND embedding_text = {{variant}}
        [[AND data_scale = {{scale}}]]
      ORDER BY ord
