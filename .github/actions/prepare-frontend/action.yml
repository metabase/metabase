name: Prepare front-end environment
description: "Prepare the front-end environment for the CI build"
inputs:
  node-version:
    description: "The version of Node.js to use, overriding .nvmrc"
    required: false
  apply-patches:
    description: "Whether to patch frontend dependencies with patch-package."
    required: true
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Prepare Node + Bun environment
      uses: ./.github/actions/prepare-node-bun
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache spec
      id: cache-spec
      shell: bash
      run: .github/scripts/cache-keys.sh | tee -a "$GITHUB_OUTPUT"

    # The spec names the store path rather than discovering it, so that a job can restore the cache
    # before bun exists. Exported job-wide rather than per-step because every later bun invocation has
    # to resolve against the same store. Confirm bun agreed: if the variable stopped taking effect, bun
    # would fill its default directory and the cache would silently save an empty tree.
    - name: Point bun at the cached store
      shell: bash
      env:
        STORE: ${{ steps.cache-spec.outputs.bun-store-path }}
      run: |
        echo "BUN_INSTALL_CACHE_DIR=$STORE" >> "$GITHUB_ENV"
        ACTUAL=$(BUN_INSTALL_CACHE_DIR="$STORE" bun pm cache)
        if [ "$ACTUAL" != "$STORE" ]; then
          echo "::error::bun reports its store at $ACTUAL, not $STORE; BUN_INSTALL_CACHE_DIR is not taking effect"
          exit 1
        fi

    - name: Restore bun store
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.cache-spec.outputs.bun-store-path }}
        key: ${{ steps.cache-spec.outputs.bun-store-key }}
        restore-keys: ${{ steps.cache-spec.outputs.bun-store-restore-key }}

    # postinstall lifecycle hook can be dangerous in CI so we only run it locally (see package.json)
    # If a job wants to patch packages, it does so explicitly in the CI. This setting is opt-out.
    - name: Install front-end dependencies
      run: bun install --frozen-lockfile
      shell: bash
    - name: Patch frontend dependencies
      if: inputs.apply-patches == 'true'
      run: bun run patch-package
      shell: bash
