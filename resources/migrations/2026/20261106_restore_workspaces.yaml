## Restore the app-DB schema of the workspaces backend.
##
## - workspace, workspace_database and table_remapping, which 064/20260724_drop_workspace_tables dropped, in the shape
##   that migration's rollbacks describe. The changesets are those of 066/20261021_recreate_workspace_tables.yaml in
##   #85175 (v66.2026-10-21T00:00:00 to :11), with version-less ids. Parent tables come first so the foreign keys
##   resolve. Each changeset is MARK_RAN when its object already exists: app DBs that ran #85175's v66 changesets
##   have them, and so do release lines below 64 that this file may be backported to.
## - metabase_database.admin_details, which 065/20261026_drop_admin_details dropped, for the admin connection that
##   workspace provisioning uses. The changeset is 062/20260504_admin_details.yaml's v62.2026-05-04T00:00:00, with a
##   version-less id.

databaseChangeLog:

  - changeSet:
      id: ucb8em
      author: escherize
      comment: Recreate workspace table
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: workspace
      changes:
        - createTable:
            tableName: workspace
            remarks: Groups one or more databases with override credentials and per-database schema config
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(254)
                  remarks: Display name of the workspace
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: User who created this workspace
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: When this workspace was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: When this workspace was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  ## The explicit creator_id index precedes the FK, as in v63.2026-07-14T00:00:18.
  - changeSet:
      id: qut0vn
      author: escherize
      comment: Index workspace.creator_id
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: workspace
                indexName: idx_workspace_creator_id
      changes:
        - createIndex:
            tableName: workspace
            indexName: idx_workspace_creator_id
            columns:
              - column:
                  name: creator_id

  - changeSet:
      id: oufckc
      author: escherize
      comment: FK workspace.creator_id -> core_user.id (set null on delete so deleting a user doesn't cascade)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyTableName: workspace
                foreignKeyName: fk_workspace_creator_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: workspace
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_workspace_creator_id
            onDelete: SET NULL

  - changeSet:
      id: x8x5te
      author: escherize
      comment: Recreate workspace_database table
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: workspace_database
      changes:
        - createTable:
            tableName: workspace_database
            remarks: Associates a workspace with a database, with override credentials and schema config
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workspace_id
                  type: int
                  remarks: The workspace this row belongs to
                  constraints:
                    nullable: false
              - column:
                  name: database_id
                  type: int
                  remarks: The underlying database this row configures
                  constraints:
                    nullable: false
              - column:
                  name: database_details
                  type: ${text.type}
                  remarks: JSON-encoded override connection details
                  constraints:
                    nullable: false
              - column:
                  name: output_namespace
                  type: varchar(254)
                  remarks: Driver-opaque namespace string where workspace output tables are written (schema on Postgres-shaped drivers, database name on MySQL)
                  constraints:
                    nullable: false
              - column:
                  name: input_schemas
                  type: ${text.type}
                  remarks: JSON array of input schema names
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(254)
                  defaultValue: unprovisioned
                  remarks: Provisioning state
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: When this row was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: When this row was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: osowga
      author: escherize
      comment: Unique constraint on workspace_database (workspace_id, database_id)
      preConditions:
        - onFail: MARK_RAN
        - not:
            # MySQL/MariaDB implement the constraint as an index of the same name, which uniqueConstraintExists misses
            - or:
                - uniqueConstraintExists:
                    tableName: workspace_database
                    constraintName: idx_unique_workspace_database
                - indexExists:
                    tableName: workspace_database
                    indexName: idx_unique_workspace_database
      changes:
        - addUniqueConstraint:
            tableName: workspace_database
            constraintName: idx_unique_workspace_database
            columnNames: workspace_id, database_id

  - changeSet:
      id: q9zjzl
      author: escherize
      comment: FK workspace_database.workspace_id -> workspace.id (cascade on delete)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyTableName: workspace_database
                foreignKeyName: fk_workspace_database_workspace_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: workspace_database
            baseColumnNames: workspace_id
            referencedTableName: workspace
            referencedColumnNames: id
            constraintName: fk_workspace_database_workspace_id
            deleteCascade: true

  - changeSet:
      id: syt3fm
      author: escherize
      comment: FK workspace_database.database_id -> metabase_database.id (restrict on delete)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyTableName: workspace_database
                foreignKeyName: fk_workspace_database_database_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: workspace_database
            baseColumnNames: database_id
            referencedTableName: metabase_database
            referencedColumnNames: id
            constraintName: fk_workspace_database_database_id
            onDelete: RESTRICT

  - changeSet:
      id: xj2pfn
      author: escherize
      comment: Index workspace_database.workspace_id for hydration lookups
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: workspace_database
                indexName: idx_workspace_database_workspace_id
      changes:
        - createIndex:
            tableName: workspace_database
            indexName: idx_workspace_database_workspace_id
            columns:
              - column:
                  name: workspace_id
      ## No-op rollback: H2 re-binds fk_workspace_database_workspace_id to this index, so the
      ## auto-generated DROP INDEX fails and aborts the whole downgrade. Any rollback that crosses
      ## this changeset also rolls back the createTable above, which removes the index with the table.
      rollback: []

  - changeSet:
      id: gve1yq
      author: escherize
      comment: Recreate table_remapping table
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: table_remapping
      changes:
        - createTable:
            tableName: table_remapping
            remarks: Maps production tables to workspace tables for query remapping
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: database_id
                  type: int
                  remarks: Database this remapping applies to
                  constraints:
                    nullable: false
              - column:
                  name: from_db
                  type: varchar(254)
                  remarks: Source database/project (top-level identifier; e.g. BigQuery project, ClickHouse db). Empty string when driver does not emit this level.
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: from_schema
                  type: varchar(254)
                  remarks: Source schema name. Empty string for schema-less drivers.
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: from_table_name
                  type: varchar(254)
                  remarks: Source table name
                  constraints:
                    nullable: false
              - column:
                  name: to_db
                  type: varchar(254)
                  remarks: Target database/project (top-level identifier). Empty string when driver does not emit this level.
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: to_schema
                  type: varchar(254)
                  remarks: Target schema name. Empty string for schema-less drivers.
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: to_table_name
                  type: varchar(254)
                  remarks: Target table name
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: When this remapping was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  ## This constraint's leading column is `database_id`, so MySQL reuses its index to satisfy the FK
  ## added below; no separate `idx_..._database_id` is needed.
  - changeSet:
      id: 5stg1n
      author: escherize
      comment: Unique constraint on table_remapping (database_id, from_db, from_schema, from_table_name)
      preConditions:
        - onFail: MARK_RAN
        - not:
            # MySQL/MariaDB implement the constraint as an index of the same name, which uniqueConstraintExists misses
            - or:
                - uniqueConstraintExists:
                    tableName: table_remapping
                    constraintName: idx_unique_table_remapping_source
                - indexExists:
                    tableName: table_remapping
                    indexName: idx_unique_table_remapping_source
      changes:
        - addUniqueConstraint:
            tableName: table_remapping
            constraintName: idx_unique_table_remapping_source
            columnNames: database_id, from_db, from_schema, from_table_name

  - changeSet:
      id: lt5wi6
      author: escherize
      comment: Unique constraint on table_remapping (database_id, to_db, to_schema, to_table_name) so two source tables can't map to the same target
      preConditions:
        - onFail: MARK_RAN
        - not:
            # MySQL/MariaDB implement the constraint as an index of the same name, which uniqueConstraintExists misses
            - or:
                - uniqueConstraintExists:
                    tableName: table_remapping
                    constraintName: idx_unique_table_remapping_target
                - indexExists:
                    tableName: table_remapping
                    indexName: idx_unique_table_remapping_target
      changes:
        - addUniqueConstraint:
            tableName: table_remapping
            constraintName: idx_unique_table_remapping_target
            columnNames: database_id, to_db, to_schema, to_table_name

  - changeSet:
      id: m6tckg
      author: escherize
      comment: FK table_remapping.database_id -> metabase_database.id (cascade on delete)
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyTableName: table_remapping
                foreignKeyName: fk_table_remapping_database_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: table_remapping
            baseColumnNames: database_id
            referencedTableName: metabase_database
            referencedColumnNames: id
            constraintName: fk_table_remapping_database_id
            deleteCascade: true

  - changeSet:
      id: h8xlm4
      author: galdre
      comment: Add admin_details column to metabase_database for separate admin (highest-privilege) connection credentials
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: metabase_database
                columnName: admin_details
      changes:
        - addColumn:
            tableName: metabase_database
            columns:
              - column:
                  name: admin_details
                  type: ${text.type}
                  remarks: Encrypted JSON containing connection details for admin (highest-privilege) operations such as DDL and ownership changes
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: metabase_database
            columnName: admin_details
