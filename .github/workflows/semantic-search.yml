name: Semantic Search Tests

on:
  workflow_call:

  # Run one semantic-search job on demand, against the ref you dispatch on, optionally under a
  # profiler. Everything else about the job -- services, matrix legs, test args, quarantine gating --
  # is whatever the normal CI run uses, because it is the same job.
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which semantic-search job to run. Only this one runs; the others are skipped.'
        type: choice
        required: true
        options:
          - h2
          - mariadb
          - mysql
          - postgres
          - appdb-mode
      tests:
        description: 'Optional: run only these tests, comma- or space-separated, e.g. metabase-enterprise.semantic-search.index-test/some-test. Bare namespaces work too. Blank runs the job''s usual set.'
        type: string
        required: false
        default: ''
      profile:
        description: 'Profile the test run and attach a flamegraph to the job. Adds sampling overhead.'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-semantic-search
  cancel-in-progress: true

# Exposed to every job so the test-driver action can report failures to
# ci-conductor (secrets: inherit is already set on the semantic-search call in
# run-tests.yml). See DEV-2224.
env:
  CI_CONDUCTOR_BASE_URL: ${{ vars.CI_CONDUCTOR_BASE_URL }}
  CI_CONDUCTOR_WEBHOOK_SECRET: ${{ secrets.CI_CONDUCTOR_WEBHOOK_SECRET }}
  # Both read by the test-driver action, which is what actually runs the tests. Set here rather than
  # passed as inputs to each job so that turning either on is one line, not one line per job.
  # Empty (and so off) on workflow_call, where neither input exists.
  #
  # ONLY_TESTS replaces the job's own test selection, so every matrix leg of the chosen job runs the
  # whole list.
  PROFILE_TESTS: ${{ inputs.profile }}
  ONLY_TESTS: ${{ inputs.tests }}

jobs:
  # The shared verdict plus the semantic-search plan, in one job:
  # `.github/scripts/gate/semantic-search.ts` turns the verdict, the PR labels and the dispatch input
  # into the `strategy.matrix` each test job runs, or nothing when the job should sit the run out. A
  # CI run is a smoke run -- Postgres Latest alone, to keep PRs cheap -- and the rule that says so
  # lives there once rather than in every job's condition. The script is a plain module, unit tested
  # by the ci-scripts jest project.
  gate:
    name: Decide whether to run
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      semantic-search-tests-h2: ${{ steps.plan.outputs.semantic-search-tests-h2 }}
      semantic-search-tests-mariadb: ${{ steps.plan.outputs.semantic-search-tests-mariadb }}
      semantic-search-tests-mysql: ${{ steps.plan.outputs.semantic-search-tests-mysql }}
      semantic-search-tests-postgres: ${{ steps.plan.outputs.semantic-search-tests-postgres }}
      semantic-search-tests-appdb-mode: ${{ steps.plan.outputs.semantic-search-tests-appdb-mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            /.nvmrc
            /package.json
          sparse-checkout-cone-mode: false
      - name: Apply the shared gate
        id: base
        uses: ./.github/actions/test-gate
        with:
          filters: backend_all
          # A direct dispatch names one job and runs it whatever the diff says.
          ignore-diff: ${{ inputs.suite != '' }}
      - name: Prepare Node + Bun environment
        uses: ./.github/actions/prepare-node-bun
      - name: Plan the semantic search matrices
        id: plan
        env:
          RUN: ${{ steps.base.outputs.run }}
          FORCE_RUN: ${{ steps.base.outputs.force-run }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          SUITE: ${{ inputs.suite }}
        run: bun .github/scripts/gate/semantic-search.ts

  semantic-search-tests-h2:
    needs: gate
    if: ${{ needs.gate.outputs.semantic-search-tests-h2 != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.semantic-search-tests-h2) }}
    services:
      pgvector:
        image: ${{ matrix.version.pgvector-image }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: mb_semantic_search
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
    env:
      MB_PGVECTOR_DB_URL: 'jdbc:postgres://localhost:5432/mb_semantic_search?user=postgres&password=postgres'
      CI: 'true'
    name: "${{ matrix.version.name }} ${{ matrix.job.name }}"
    steps:
      - uses: actions/checkout@v6
      - name: Test ${{ matrix.version.name }}
        id: test-driver
        uses: ./.github/actions/test-driver
        with:
          build-static-viz: ${{ matrix.job.build-static-viz }}
          junit-name: ${{ matrix.version.junit-name }}
          artifact-suffix: ${{ matrix.job.name }}
          test-args: >-
            ${{ matrix.job.test-args }}
            :exclude-tags '[${{ matrix.job.exclude-tag }}]'

  semantic-search-tests-mariadb:
    needs: gate
    if: ${{ needs.gate.outputs.semantic-search-tests-mariadb != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.semantic-search-tests-mariadb) }}
    services:
      pgvector:
        image: ${{ matrix.version.pgvector-image }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: mb_semantic_search
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
      mysql:
        image: ${{ matrix.version.mariadb-image }}
        # disposable CI database: a RAM-backed datadir makes DDL/insert fsyncs free
        options: --tmpfs /var/lib/mysql:rw
        ports:
          - "3306:3306"
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: true
          MARIADB_DATABASE: mb_test
    env:
      CI: 'true'
      DRIVERS: mysql
      MB_DB_TYPE: mysql
      MB_DB_HOST: localhost
      MB_DB_PORT: 3306
      MB_DB_DBNAME: mb_test
      MB_DB_USER: root
      MB_MYSQL_TEST_USER: root
      MB_PGVECTOR_DB_URL: 'jdbc:postgres://localhost:5432/mb_semantic_search?user=postgres&password=postgres'
    name: "${{ matrix.version.name }} ${{ matrix.job.name }}"
    steps:
      - uses: actions/checkout@v6
      - name: Test ${{ matrix.version.name }}
        id: test-driver
        uses: ./.github/actions/test-driver
        with:
          build-static-viz: ${{ matrix.job.build-static-viz }}
          junit-name: ${{ matrix.version.junit-name }}
          artifact-suffix: ${{ matrix.job.name }}
          test-args: >-
            ${{ matrix.job.test-args }}
            :exclude-tags '[${{ matrix.job.exclude-tag }}]'

  semantic-search-tests-mysql:
    needs: gate
    if: ${{ needs.gate.outputs.semantic-search-tests-mysql != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.semantic-search-tests-mysql) }}
    services:
      pgvector:
        image: ${{ matrix.version.pgvector-image }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: mb_semantic_search
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
      mysql:
        image: ${{ matrix.version.mysql-image }}
        # disposable CI database: a RAM-backed datadir makes DDL/insert fsyncs free
        options: --tmpfs /var/lib/mysql:rw
        ports:
          - "3306:3306"
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: mb_test
    env:
      CI: 'true'
      DRIVERS: mysql
      MB_DB_TYPE: mysql
      MB_DB_HOST: localhost
      MB_DB_PORT: 3306
      MB_DB_DBNAME: mb_test
      MB_DB_USER: root
      MB_MYSQL_TEST_USER: root
      MB_PGVECTOR_DB_URL: 'jdbc:postgres://localhost:5432/mb_semantic_search?user=postgres&password=postgres'
    name: "${{ matrix.version.name }} ${{ matrix.job.name }}"
    steps:
      - uses: actions/checkout@v6
      - name: Test ${{ matrix.version.name }}
        id: test-driver
        uses: ./.github/actions/test-driver
        with:
          build-static-viz: ${{ matrix.job.build-static-viz }}
          junit-name: ${{ matrix.version.junit-name }}
          artifact-suffix: ${{ matrix.job.name }}
          test-args: >-
            ${{ matrix.job.test-args }}
            :exclude-tags '[${{ matrix.job.exclude-tag }}]'

  semantic-search-tests-postgres:
    needs: gate
    if: ${{ needs.gate.outputs.semantic-search-tests-postgres != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.semantic-search-tests-postgres) }}
    services:
      pgvector:
        image: ${{ matrix.version.pgvector-image }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: mb_semantic_search
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
      postgres:
        image: ${{ matrix.version.postgres-image }}
        ports:
          - "5433:5432"
        env:
          POSTGRES_USER: mb_test
          POSTGRES_DB: mb_test
          POSTGRES_HOST_AUTH_METHOD: trust
    env:
      CI: 'true'
      DRIVERS: postgres
      MB_DB_TYPE: postgres
      MB_DB_PORT: 5433
      MB_DB_HOST: localhost
      MB_DB_DBNAME: mb_test
      MB_DB_USER: mb_test
      MB_POSTGRESQL_TEST_USER: mb_test
      MB_PGVECTOR_DB_URL: 'jdbc:postgres://localhost:5432/mb_semantic_search?user=postgres&password=postgres'
    name: "${{ matrix.version.name }} ${{ matrix.job.name }}"
    steps:
      - uses: actions/checkout@v6
      - name: Test ${{ matrix.version.name }}
        id: test-driver
        uses: ./.github/actions/test-driver
        with:
          build-static-viz: ${{ matrix.job.build-static-viz }}
          junit-name: ${{ matrix.version.junit-name }}
          artifact-suffix: ${{ matrix.job.name }}
          test-args: >-
            ${{ matrix.job.test-args }}
            :exclude-tags '[${{ matrix.job.exclude-tag }}]'

  # pgvector-on-the-app-db mode: the app db itself is a pgvector-capable Postgres and
  # MB_PGVECTOR_DB_URL is deliberately unset. The dedicated-harness tests gate themselves off; the
  # appdb-pgvector-mode round trip (and the URL-independent unit tests) run for real.
  semantic-search-tests-appdb-mode:
    needs: gate
    if: ${{ needs.gate.outputs.semantic-search-tests-appdb-mode != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.semantic-search-tests-appdb-mode) }}
    services:
      postgres:
        image: ${{ matrix.version.appdb-image }}
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: mb_test
          POSTGRES_DB: mb_test
          POSTGRES_HOST_AUTH_METHOD: trust
    env:
      CI: 'true'
      MB_DB_TYPE: postgres
      MB_DB_PORT: 5432
      MB_DB_HOST: localhost
      MB_DB_DBNAME: mb_test
      MB_DB_USER: mb_test
      # opts this job into the destructive appdb-pgvector-mode round trip, which then FAILS (rather
      # than silently skipping) if the app db can't actually host pgvector
      MB_APPDB_PGVECTOR_MODE_TEST: 'true'
    name: "${{ matrix.version.name }} ${{ matrix.job.name }}"
    steps:
      - uses: actions/checkout@v6
      - name: Test ${{ matrix.version.name }}
        id: test-driver
        uses: ./.github/actions/test-driver
        with:
          build-static-viz: ${{ matrix.job.build-static-viz }}
          junit-name: ${{ matrix.version.junit-name }}
          artifact-suffix: ${{ matrix.job.name }}
          test-args: >-
            ${{ matrix.job.test-args }}
            :exclude-tags '[${{ matrix.job.exclude-tag }}]'

  semantic-search-tests-result:
    needs:
      - gate
      - semantic-search-tests-h2
      - semantic-search-tests-mariadb
      - semantic-search-tests-mysql
      - semantic-search-tests-postgres
      - semantic-search-tests-appdb-mode
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    name: semantic-search-tests-result
    if: ${{ !cancelled() }}
    steps:
      - name: Check job status
        uses: actions/github-script@v9
        env:
          needs: ${{ toJson(needs) }}
        with:
          script: | # js
            const needs = JSON.parse(process.env.needs);

            const jobs = Object.entries(needs).map(
              ([jobName, jobValues]) => ({
                name: jobName,
                result: jobValues.result
              }));

            // are all jobs skipped or successful?
            if (jobs.every(job => (job.result === 'skipped' || job.result === 'success'))) {
                console.log("");
                console.log("        _------.        ");
                console.log("       /  ,     \_      ");
                console.log("     /   /  /{}\ |o\_   ");
                console.log("    /    \  `--' /-' \  ");
                console.log("   |      \      \    | ");
                console.log("  |              |`-, | ");
                console.log("  /              /__/)/ ");
                console.log(" |              |       ");
                console.log("");
                console.log("All semantic search tests have passed (or have been skipped). Cam is very proud of you.");
              process.exit(0);
            }

            // otherwise, something failed
            console.log("");
            console.log("       .::::::::::.                          .::::::::::.       ");
            console.log("     .::::''''''::::.                      .::::''''''::::.     ");
            console.log("   .:::'          `::::....          ....::::'          `:::.   ");
            console.log("  .::'             `:::::::|        |:::::::'             `::.  ");
            console.log(" .::|               |::::::|_ ___ __|::::::|               |::. ");
            console.log(" `--'               |::::::|_()__()_|::::::|               `--' ");
            console.log("  :::               |::-o::|        |::o-::|               :::  ");
            console.log("  `::.             .|::::::|        |::::::|.             .::'  ");
            console.log("   `:::.          .::\-----'        `-----/::.          .:::'   ");
            console.log("     `::::......::::'                      `::::......::::'     ");
            console.log("       `::::::::::'                          `::::::::::'       ");
            console.log("");
            console.log("Semantic search tests have failed. You have been sentenced to MetaJail.");

            jobs.forEach((job) => {
              if (job.result !== 'success') {
                console.log(`${job.name} - ${job.result}`);
              }
            });

            process.exit(1);
