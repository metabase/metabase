name: Loki Visual Stress Test Flake Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**/*.stories.tsx'
      - 'enterprise/frontend/**/*.stories.tsx'
  workflow_dispatch:
    inputs:
      story_files:
        description: "Comma-separated story file paths relative to repo root"
        type: string
        required: true
      burn_in:
        description: "Number of times to run the test (e.g. 10)"
        type: string
        required: true
        default: "10"

jobs:
  detect-changed-stories:
    name: Detect changed stories
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      story_files: ${{ steps.detect.outputs.story_files }}
      dropped_files: ${{ steps.detect.outputs.dropped_files }}
      should_run: ${{ steps.detect.outputs.should_run }}
    steps:
      - name: Detect changed story files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          validate_paths() {
            local files="$1"
            for file in $(echo "$files" | tr ',' '\n'); do
              file=$(echo "$file" | xargs)  # trim whitespace
              if [[ -z "$file" ]]; then
                continue
              fi
              if [[ ! "$file" =~ ^(frontend/|enterprise/frontend/).+\.stories\. ]]; then
                echo "::error::Invalid story path: $file"
                echo "Paths must start with 'frontend/' or 'enterprise/frontend/' and contain '.stories.'"
                return 1
              fi
            done
            return 0
          }

          # Drop story files whose default export is loki-skipped, because loki then finds no stories in them and fails every run.
          # Only the `export default {` block is read, so a per-story skip or a named `export default meta` is not detected.
          drop_skipped_files() {
            local ref="$1"
            local files="$2"
            local kept=()
            DROPPED=()
            for file in $(echo "$files" | tr ',' '\n'); do
              if gh api "repos/${{ github.repository }}/contents/$file?ref=$ref" --jq '.content' \
                  | base64 -d \
                  | sed -n '/^export default {/,/^};/p' \
                  | tr -d ' \n' \
                  | grep -q 'loki:{skip:true}'; then
                DROPPED+=("$file")
              else
                kept+=("$file")
              fi
            done
            KEPT=$(IFS=','; echo "${kept[*]}")
            DROPPED_LIST=$(IFS=','; echo "${DROPPED[*]}")
            for file in "${DROPPED[@]}"; do
              echo "Dropping $file: its default export has loki skip set, so it contains no stories loki can run"
            done
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FILES=$(echo "${{ inputs.story_files }}" | tr ',' '\n' | xargs -n1 | paste -sd',')
            if ! validate_paths "$FILES"; then
              exit 1
            fi
            drop_skipped_files "${{ github.sha }}" "$FILES"
            if [[ -z "$KEPT" ]]; then
              echo "::error::Every requested story file is loki-skipped: $DROPPED_LIST"
              exit 1
            fi
            echo "story_files=$KEPT" >> "$GITHUB_OUTPUT"
            echo "dropped_files=$DROPPED_LIST" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$( \
            gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate \
              --jq '.[] | select(.status != "removed") | .filename' \
            | grep '\.stories\.tsx$' \
            | xargs -n1 \
            | sort -u \
            | paste -sd',' \
          )

          if [[ -z "$FILES" ]]; then
            echo "No changed story files found"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! validate_paths "$FILES"; then
            exit 1
          fi

          echo "Changed story files: $FILES"
          drop_skipped_files "${{ github.event.pull_request.head.sha }}" "$FILES"
          if [[ -z "$KEPT" ]]; then
            echo "Every changed story file is loki-skipped, nothing to stress test"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Story files to stress test: $KEPT"
          echo "story_files=$KEPT" >> "$GITHUB_OUTPUT"
          echo "dropped_files=$DROPPED_LIST" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  workflow-summary:
    name: Summary
    needs: detect-changed-stories
    if: needs.detect-changed-stories.outputs.should_run == 'true'
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
      - name: Generate workflow summary
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          STORY_FILES: ${{ needs.detect-changed-stories.outputs.story_files }}
          DROPPED_FILES: ${{ needs.detect-changed-stories.outputs.dropped_files }}
          BURN_IN: ${{ inputs.burn_in || 10 }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo '## Loki Stress Test'
            echo ''
            echo "**Branch:** \`${BRANCH_NAME}\`"
            echo ''
            echo '**Story files:**'
            echo "${STORY_FILES}" | tr ',' '\n' | while read -r file; do
              echo "- \`$file\`"
            done
            echo ''
            if [[ -n "${DROPPED_FILES}" ]]; then
              echo '**Skipped (every story is loki-skipped):**'
              echo "${DROPPED_FILES}" | tr ',' '\n' | while read -r file; do
                echo "- \`$file\`"
              done
              echo ''
            fi
            echo "**Burn-in:** ${BURN_IN} runs"
            echo ''
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              echo "Triggered by PR #${PR_NUMBER} from @${PR_ACTOR}"
            else
              echo "Triggered manually by @${ACTOR}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  stress-test-loki:
    needs: detect-changed-stories
    if: needs.detect-changed-stories.outputs.should_run == 'true'
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 60
    name: Stress test Loki visual tests
    services:
      docker:
        image: docker:19.03.12
        options: --privileged
        ports:
          - 2376:2376
        env:
          DOCKER_TLS_CERTDIR: /certs
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /tmp/docker-certs:/certs/client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare frontend environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        run: NODE_ENV=development bun run build-pure:cljs

      - name: Build Storybook
        run: bun run build-storybook
        env:
          STORYBOOK_STORIES_FILTER: ${{ needs.detect-changed-stories.outputs.story_files }}

      - name: Stress-test Loki
        run: |
          BURN_IN=${{ inputs.burn_in || '10' }}
          STORY_FILES='${{ needs.detect-changed-stories.outputs.story_files }}'

          echo "Story files: $STORY_FILES"
          echo "Running Loki $BURN_IN times"
          echo ""

          FAILED=0
          for i in $(seq 1 $BURN_IN); do
            echo "=========================================="
            echo "Run $i of $BURN_IN"
            echo "=========================================="

            if bun run test-visual:loki \
              --reactUri file:./storybook-static \
              --verboseRenderer; then
              echo "✅ Run $i passed"
            else
              echo "❌ Run $i FAILED"
              FAILED=$((FAILED + 1))

              mkdir -p ".loki/failures/run-$i"
              cp -r .loki/difference/* ".loki/failures/run-$i/" 2>/dev/null || true
            fi
            echo ""
          done

          echo "=========================================="
          echo "Summary: $((BURN_IN - FAILED))/$BURN_IN passed, $FAILED failed"
          echo "=========================================="

          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED out of $BURN_IN runs failed"
            exit 1
          fi

      - name: Generate Visual Report on Failure
        if: failure()
        run: bun run test-visual:loki-report

      - name: Upload Artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: loki-stress-test-report
          include-hidden-files: true
          path: .loki/
          if-no-files-found: ignore
