## Index report_card.enable_embedding, which the anonymous-reach query filters on.

databaseChangeLog:
  - changeSet:
      id: v66.cos3xf
      author: johnswanson
      comment: Index report_card.enable_embedding for the anonymous-reach query
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: report_card
                indexName: idx_report_card_enable_embedding
      changes:
        - createIndex:
            tableName: report_card
            indexName: idx_report_card_enable_embedding
            columns:
              - column:
                  name: enable_embedding
