name: Chromatic Storybook deployment

on:
  push:
    branches:
      - "master"
  pull_request:
    types: [synchronize, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  should-run:
    uses: ./.github/workflows/util.should-run.yml
    with:
      any-of: frontend_all

  fe-chromatic:
    needs: should-run
    if: contains(github.event.pull_request.labels.*.name, 'chromatic') || (github.ref_name == 'master' && needs.should-run.outputs.changed == 'true')
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - name: Compile CLJS
        run: NODE_ENV=development bun run build-pure:cljs
      - name: Publish to Chromatic
        uses: chromaui/action@0b8c883861c1663076150cf1f4592b19d1ff6a54 # v17.0.1
        env:
          PUBLISH_CHROMATIC: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          STORYBOOK_BUILD_TIMEOUT: 900000
        if: env.PUBLISH_CHROMATIC != null
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
