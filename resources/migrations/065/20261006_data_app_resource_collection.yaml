## Every data app owns a resource collection, a root collection of the `data-apps` namespace, from its insert on.
## Apps created before the namespace existed hold theirs in the default namespace, and an app whose collection
## was deleted has none: give the first the namespace and the second a collection.

databaseChangeLog:
  ## MySQL, MariaDB, and H2 index a foreign key's column themselves; Postgres doesn't. On MySQL a second index
  ## would take over the constraint and refuse to be dropped on rollback, so this one is Postgres-only.
  - changeSet:
      id: v65.2026-10-06T00:00:00
      author: timofei
      comment: Index data apps by their resource collection (PostgreSQL)
      dbms: postgresql
      changes:
        - createIndex:
            tableName: data_app
            indexName: idx_data_app_resource_collection_id
            columns:
              - column:
                  name: resource_collection_id
      rollback:
        - dropIndex:
            tableName: data_app
            indexName: idx_data_app_resource_collection_id

  - changeSet:
      id: v65.2026-10-06T00:00:01
      author: timofei
      comment: Put every data app's resource collection in the data-apps namespace, creating the missing ones
      changes:
        - customChange:
            class: metabase.app_db.custom_migrations.MoveDataAppResourceCollectionsToTheirNamespace
      rollback: []
