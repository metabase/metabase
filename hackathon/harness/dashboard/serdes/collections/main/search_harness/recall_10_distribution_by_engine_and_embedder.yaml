dataset_query:
  database: Search Harness
  stages:
  - native: |-
      SELECT engine AS "Engine", split_part(embedder, '/', 2) AS "Embedder", value AS "Recall@10"
      FROM harness_scenario_metric
      WHERE corpus_id = {{corpus}} AND metric = 'recall@10'
        AND embedding_text = {{variant}}
        [[AND data_scale = {{scale}}]]
      ORDER BY 1, 2
    template-tags:
