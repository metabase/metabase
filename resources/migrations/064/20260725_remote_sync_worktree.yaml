## Remote sync worktrees: a checked-out branch materialized as its own copy of the git-synced
## content tree (collections, cards, dashboards, ...), so multiple branches' content can coexist
## side-by-side in the same app DB. remote_sync_worktree holds one row per checkout; main-app content
## (including default-branch remote sync) simply has a NULL worktree_id.
##
## Every git-synced content table (see metabase-enterprise.remote-sync.spec/remote-sync-specs, plus
## its serdes children) gains a nullable worktree_id FK + index. core_user also gets one, scoped
## SET NULL on delete so a deleted worktree doesn't dangle a user's worktree reference; content-table
## FKs are left at the default (NO ACTION) since deleting a worktree's content is handled by app code,
## not the DB -- SET NULL there would silently reparent worktree rows into the main app.
##
## Tables that previously had a single-column unique on entity_id need per-worktree uniqueness instead:
## the same entity_id is checked out into every worktree, so global uniqueness would collide. Each such
## table gets a generated worktree_id_helper column (COALESCE(worktree_id, 0), so NULL/main-app rows
## all collapse into the same bucket) and a composite (entity_id, worktree_id_helper) unique index,
## replacing the old single-column one. The generated-column syntax is dialect-specific: MySQL uses
## VIRTUAL here (STORED generated columns have historically been unreliable alongside other foreign
## keys on the same table in MySQL); MariaDB and Postgres use STORED; H2 takes neither keyword. Tables
## without an existing entity_id unique (dashboardcard_series, parameter_card) just get the plain
## worktree_id column.

databaseChangeLog:
  - changeSet:
      id: v64.2026-07-25T10:00:00
      author: ranquild
      comment: Create remote_sync_worktree table
      changes:
        - createTable:
            tableName: remote_sync_worktree
            remarks: One row per checked-out remote-sync branch (a git-worktree-style checkout of the synced content tree)
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch
                  type: varchar(254)
                  remarks: Git branch this worktree is checked out to
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: User who created this worktree; null if that user was later deleted
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: When this worktree was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: When this worktree was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: v64.2026-07-25T10:00:01
      author: ranquild
      comment: Unique index on remote_sync_worktree.branch
      changes:
        - createIndex:
            tableName: remote_sync_worktree
            indexName: idx_remote_sync_worktree_branch
            unique: true
            columns:
              - column:
                  name: branch

  - changeSet:
      id: v64.2026-07-25T10:00:02
      author: ranquild
      comment: FK remote_sync_worktree.creator_id -> core_user; SET NULL so the worktree survives its creator's deletion
      changes:
