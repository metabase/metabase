name: Prepare cypress environment
description: Cypress preparation steps

inputs:
  working-directory:
    description: "Optional working directory for bun commands"
    required: false
    default: "."

outputs:
  chrome-path:
    description: Path to the custom Chrome executable
    value: ${{ steps.setup-chrome.outputs.chrome-path }}

runs:
  using: "composite"
  steps:
    # e2e/support/config.js imports the reporter, so it has to be in place before Cypress bundles.
    - name: Prepare CI Conductor
      uses: ./.github/actions/prepare-ci-conductor

    - name: Install Chrome v144
      uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
      with:
        chrome-version: 144
      id: setup-chrome

    - name: Cache spec
      id: cache-spec
      shell: bash
      run: .github/scripts/cache-keys.sh | tee -a "$GITHUB_OUTPUT"

    - name: Restore Cypress binary
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.cache-spec.outputs.cypress-path }}
        key: ${{ steps.cache-spec.outputs.cypress-key }}
        restore-keys: ${{ steps.cache-spec.outputs.cypress-restore-key }}

    - name: Ensure that Cypress executable is ready
      run: |
        bun run cypress install
        bun run cypress cache path
        bun run cypress cache list
        bun run cypress verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
