## Drop the single-column `entity_id` unique constraints from the content tables that remote-sync
## worktrees scope by `worktree_id`. They are replaced by composite uniques in
## 20260730_remote_sync_worktree.yaml, which runs after this file.
##
## These constraints were created in 001_update_migrations.yaml as column-level `unique: true`
## without a `uniqueConstraintName`, so their names are engine-generated and differ per dialect:
## Postgres names them `<table>_entity_id_key`, MySQL and MariaDB name the index after its first
## column (`entity_id`), and H2 assigns an arbitrary `CONSTRAINT_*`. Only MySQL/MariaDB can be
## dropped by a name we know up front; Postgres and H2 have to look the name up. Each dialect
## therefore gets one block covering every table rather than a block per table.
##
## Every lookup is restricted to uniques whose only column is `entity_id`, so a composite unique
## that happens to include `entity_id` is left alone. The rollback recreates each constraint --
## this time with an explicit name, so a future migration can drop it portably.

databaseChangeLog:

  - changeSet:
      id: v64.2026-07-30T09:00:00
      author: ranquild
      comment: Drop the single-column entity_id uniques; superseded by the composite (entity_id, worktree_id) uniques
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              DO $$
              DECLARE r record;
              BEGIN
                FOR r IN
                  SELECT tc.table_name, tc.constraint_name
                    FROM information_schema.table_constraints tc
                    JOIN information_schema.key_column_usage k
                      ON k.constraint_name = tc.constraint_name
                     AND k.table_schema = tc.table_schema
                   WHERE tc.constraint_type = 'UNIQUE'
                     AND tc.table_schema = current_schema()
                     AND tc.table_name IN ('collection', 'report_card', 'report_dashboard',
                                           'report_dashboardcard', 'dashboard_tab', 'document',
                                           'timeline', 'native_query_snippet', 'action',
                                           'transform', 'transform_transform_tag')
                   GROUP BY tc.table_name, tc.constraint_name
                  HAVING count(*) = 1 AND min(k.column_name) = 'entity_id'
                LOOP
                  EXECUTE format('ALTER TABLE %I DROP CONSTRAINT %I', r.table_name, r.constraint_name);
                END LOOP;
              END $$;
        - sql:
            dbms: mysql,mariadb
            sql: |
              ALTER TABLE `collection` DROP INDEX `entity_id`;
              ALTER TABLE `report_card` DROP INDEX `entity_id`;
              ALTER TABLE `report_dashboard` DROP INDEX `entity_id`;
              ALTER TABLE `report_dashboardcard` DROP INDEX `entity_id`;
              ALTER TABLE `dashboard_tab` DROP INDEX `entity_id`;
              ALTER TABLE `document` DROP INDEX `entity_id`;
              ALTER TABLE `timeline` DROP INDEX `entity_id`;
              ALTER TABLE `native_query_snippet` DROP INDEX `entity_id`;
              ALTER TABLE `action` DROP INDEX `entity_id`;
              ALTER TABLE `transform` DROP INDEX `entity_id`;
              ALTER TABLE `transform_transform_tag` DROP INDEX `entity_id`;
        - sql:
            dbms: h2
            sql: |
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE COLLECTION DROP CONSTRAINT ' || k.CONSTRAINT_NAME FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k WHERE k.TABLE_NAME = 'COLLECTION' AND k.COLUMN_NAME = 'ENTITY_ID' AND k.CONSTRAINT_NAME IN (SELECT CONSTRAINT_NAME FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_TYPE = 'UNIQUE' AND TABLE_NAME = 'COLLECTION') AND (SELECT count(*) FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k2 WHERE k2.CONSTRAINT_NAME = k.CONSTRAINT_NAME AND k2.TABLE_NAME = k.TABLE_NAME) = 1), '');
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE REPORT_CARD DROP CONSTRAINT ' || k.CONSTRAINT_NAME FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k WHERE k.TABLE_NAME = 'REPORT_CARD' AND k.COLUMN_NAME = 'ENTITY_ID' AND k.CONSTRAINT_NAME IN (SELECT CONSTRAINT_NAME FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_TYPE = 'UNIQUE' AND TABLE_NAME = 'REPORT_CARD') AND (SELECT count(*) FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k2 WHERE k2.CONSTRAINT_NAME = k.CONSTRAINT_NAME AND k2.TABLE_NAME = k.TABLE_NAME) = 1), '');
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE REPORT_DASHBOARD DROP CONSTRAINT ' || k.CONSTRAINT_NAME FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k WHERE k.TABLE_NAME = 'REPORT_DASHBOARD' AND k.COLUMN_NAME = 'ENTITY_ID' AND k.CONSTRAINT_NAME IN (SELECT CONSTRAINT_NAME FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_TYPE = 'UNIQUE' AND TABLE_NAME = 'REPORT_DASHBOARD') AND (SELECT count(*) FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k2 WHERE k2.CONSTRAINT_NAME = k.CONSTRAINT_NAME AND k2.TABLE_NAME = k.TABLE_NAME) = 1), '');
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE REPORT_DASHBOARDCARD DROP CONSTRAINT ' || k.CONSTRAINT_NAME FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k WHERE k.TABLE_NAME = 'REPORT_DASHBOARDCARD' AND k.COLUMN_NAME = 'ENTITY_ID' AND k.CONSTRAINT_NAME IN (SELECT CONSTRAINT_NAME FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_TYPE = 'UNIQUE' AND TABLE_NAME = 'REPORT_DASHBOARDCARD') AND (SELECT count(*) FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k2 WHERE k2.CONSTRAINT_NAME = k.CONSTRAINT_NAME AND k2.TABLE_NAME = k.TABLE_NAME) = 1), '');
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE DASHBOARD_TAB DROP CONSTRAINT ' || k.CONSTRAINT_NAME FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k WHERE k.TABLE_NAME = 'DASHBOARD_TAB' AND k.COLUMN_NAME = 'ENTITY_ID' AND k.CONSTRAINT_NAME IN (SELECT CONSTRAINT_NAME FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_TYPE = 'UNIQUE' AND TABLE_NAME = 'DASHBOARD_TAB') AND (SELECT count(*) FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k2 WHERE k2.CONSTRAINT_NAME = k.CONSTRAINT_NAME AND k2.TABLE_NAME = k.TABLE_NAME) = 1), '');
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE DOCUMENT DROP CONSTRAINT ' || k.CONSTRAINT_NAME FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k WHERE k.TABLE_NAME = 'DOCUMENT' AND k.COLUMN_NAME = 'ENTITY_ID' AND k.CONSTRAINT_NAME IN (SELECT CONSTRAINT_NAME FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_TYPE = 'UNIQUE' AND TABLE_NAME = 'DOCUMENT') AND (SELECT count(*) FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k2 WHERE k2.CONSTRAINT_NAME = k.CONSTRAINT_NAME AND k2.TABLE_NAME = k.TABLE_NAME) = 1), '');
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE TIMELINE DROP CONSTRAINT ' || k.CONSTRAINT_NAME FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k WHERE k.TABLE_NAME = 'TIMELINE' AND k.COLUMN_NAME = 'ENTITY_ID' AND k.CONSTRAINT_NAME IN (SELECT CONSTRAINT_NAME FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_TYPE = 'UNIQUE' AND TABLE_NAME = 'TIMELINE') AND (SELECT count(*) FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k2 WHERE k2.CONSTRAINT_NAME = k.CONSTRAINT_NAME AND k2.TABLE_NAME = k.TABLE_NAME) = 1), '');
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE NATIVE_QUERY_SNIPPET DROP CONSTRAINT ' || k.CONSTRAINT_NAME FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k WHERE k.TABLE_NAME = 'NATIVE_QUERY_SNIPPET' AND k.COLUMN_NAME = 'ENTITY_ID' AND k.CONSTRAINT_NAME IN (SELECT CONSTRAINT_NAME FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_TYPE = 'UNIQUE' AND TABLE_NAME = 'NATIVE_QUERY_SNIPPET') AND (SELECT count(*) FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k2 WHERE k2.CONSTRAINT_NAME = k.CONSTRAINT_NAME AND k2.TABLE_NAME = k.TABLE_NAME) = 1), '');
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE ACTION DROP CONSTRAINT ' || k.CONSTRAINT_NAME FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k WHERE k.TABLE_NAME = 'ACTION' AND k.COLUMN_NAME = 'ENTITY_ID' AND k.CONSTRAINT_NAME IN (SELECT CONSTRAINT_NAME FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_TYPE = 'UNIQUE' AND TABLE_NAME = 'ACTION') AND (SELECT count(*) FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k2 WHERE k2.CONSTRAINT_NAME = k.CONSTRAINT_NAME AND k2.TABLE_NAME = k.TABLE_NAME) = 1), '');
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE TRANSFORM DROP CONSTRAINT ' || k.CONSTRAINT_NAME FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k WHERE k.TABLE_NAME = 'TRANSFORM' AND k.COLUMN_NAME = 'ENTITY_ID' AND k.CONSTRAINT_NAME IN (SELECT CONSTRAINT_NAME FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_TYPE = 'UNIQUE' AND TABLE_NAME = 'TRANSFORM') AND (SELECT count(*) FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k2 WHERE k2.CONSTRAINT_NAME = k.CONSTRAINT_NAME AND k2.TABLE_NAME = k.TABLE_NAME) = 1), '');
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE TRANSFORM_TRANSFORM_TAG DROP CONSTRAINT ' || k.CONSTRAINT_NAME FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k WHERE k.TABLE_NAME = 'TRANSFORM_TRANSFORM_TAG' AND k.COLUMN_NAME = 'ENTITY_ID' AND k.CONSTRAINT_NAME IN (SELECT CONSTRAINT_NAME FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_TYPE = 'UNIQUE' AND TABLE_NAME = 'TRANSFORM_TRANSFORM_TAG') AND (SELECT count(*) FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE k2 WHERE k2.CONSTRAINT_NAME = k.CONSTRAINT_NAME AND k2.TABLE_NAME = k.TABLE_NAME) = 1), '');
      rollback:
        - addUniqueConstraint:
            tableName: collection
            columnNames: entity_id
            constraintName: unique_collection_entity_id
        - addUniqueConstraint:
