dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH s AS (
      WITH src AS (
        SELECT engine AS arm, 1 AS pair, scenario_id, value
        FROM harness_scenario_metric
        WHERE corpus_id = 'northwind-golden-v1' AND metric = 'ndcg@10' AND embedder = 'ollama/all-minilm' AND embedding_text = 'baseline' AND text_strategy = 'none'
      ), d AS (
        SELECT a.arm, a.pair, a.value, a.value - r.value AS delta
        FROM src a JOIN src r ON r.arm = 'semantic' AND r.pair = a.pair AND r.scenario_id = a.scenario_id
        WHERE a.arm <> 'semantic'
      )
      SELECT arm, pair, count(*) AS n, avg(value) AS v, avg(delta) AS mean, 1.96 * stddev_samp(delta) / sqrt(count(*)) AS ci
      FROM d GROUP BY 1, 2
      )
      SELECT arm AS "Engine",
             round(mean::numeric, 3) AS "Δ vs semantic", round(ci::numeric, 3) AS "± 95% CI",
             CASE WHEN n < 5 THEN 'too few questions'
                  WHEN mean - ci > 0 THEN 'better'
                  WHEN mean + ci < 0 THEN 'worse'
                  ELSE 'no proven difference' END AS "Verdict",
             n AS "n questions"
      FROM s
      ORDER BY array_position(ARRAY['semantic', 'semantic-pure', 'semantic-vector', 'sqlite-vec1', 'sqlite-vec1-pure', 'lucene', 'lucene-pure', 'appdb', 'in-place'], arm)
    lib/type: mbql.stage/native
  lib/type: mbql/query
