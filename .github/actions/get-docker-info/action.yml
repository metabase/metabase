name: Get Docker Info
description: Determines the registry, repository, and tag a container image is pushed to.

inputs:
  registry:
    description: Registry the image is pushed to, either "docker" or "ecr".
    required: false
    default: docker
  repo:
    description: Repository name, e.g. "metabase-enterprise". Overrides a branch derived repo.
    required: false
    default: ''
  tag:
    description:  Image tag, e.g. v1.87.2. Overrides a branch derived tag.
    required: false
    default: ''
  branch:
    description: Branch name (defaults to current branch)
    required: false
    default: ${{ github.head_ref || github.ref_name }}
  edition:
    description: Edition (ee or oss)
    required: false
    default: ee
  aws-account-id:
    description: AWS account id hosting the ECR registry. Required for the ecr registry.
    required: false
    default: ''
  aws-region:
    description: Region of the ECR registry.
    required: false
    default: us-east-1

outputs:
  repo:
    description: Docker repository, including the registry host (ecr) or the owner (docker)
    value: ${{ steps.docker-info.outputs.repo }}
  tag:
    description: Docker tag
    value: ${{ steps.docker-info.outputs.tag }}
  full_image:
    description: Full Docker image name (repo:tag)
    value: ${{ steps.docker-info.outputs.full_image }}

runs:
  using: "composite"
  steps:
    - name: Determine Docker info
      id: docker-info
      uses: actions/github-script@v9
      env:
        REGISTRY: ${{ inputs.registry }}
        REPO: ${{ inputs.repo }}
        TAG: ${{ inputs.tag }}
        BRANCH: ${{ inputs.branch }}
        EDITION: ${{ inputs.edition }}
        AWS_ACCOUNT_ID: ${{ inputs.aws-account-id }}
        AWS_REGION: ${{ inputs.aws-region }}
      with:
        script: | # js
          const { REGISTRY, BRANCH, EDITION, AWS_ACCOUNT_ID, AWS_REGION } = process.env;

          let tag = process.env.TAG;
          if (!tag) {
            tag = BRANCH === 'master' ? 'latest' : `${BRANCH.replaceAll('/', '-')}-${EDITION}`;
          }

          let name = process.env.REPO;
          if (!name) {
            if (BRANCH === 'master') {
              name = EDITION === 'ee' ? 'metabase-enterprise-head' : 'metabase-head';
            } else {
              name = 'metabase-dev';
            }
          }

          let repo;
          if (REGISTRY === 'ecr') {
            if (!AWS_ACCOUNT_ID) {
              core.setFailed('Pushing to AWS ECR requires aws-account-id to be set.');
              return;
            }
            repo = `${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${name}`;
          } else if (REGISTRY === 'docker') {
            repo = `metabase/${name}`;
          } else {
            core.setFailed(`Unknown registry "${REGISTRY}", expected "docker" or "ecr".`);
            return;
          }

          core.setOutput('repo', repo);
          core.setOutput('tag', tag);
          core.setOutput('full_image', `${repo}:${tag}`);

          console.log(`Resolved: registry = ${REGISTRY}, repo = ${repo}, tag = ${tag}`);
