name: Notify release failure
description: Sends one failure message to the release thread and marks the thread as failed

inputs:
  title:
    description: What failed (e.g. "Publishing"). The generic version is added when a version is set.
    required: true
  version:
    description: Release version to find the release thread. Empty posts to the channel.
    required: false
    default: ""
  needs:
    description: toJSON(needs) of the calling job. Empty sends no job list.
    required: false
    default: "{}"
  warning:
    description: Send a warning that does not block the release and does not change the thread reaction
    required: false
    default: "false"
  slack-channel:
    description: Slack release channel name
    required: true
  slack-bot-token:
    description: Slack bot token
    required: true

runs:
  using: composite
  steps:
    - name: Prepare release scripts
      uses: ./.github/actions/prepare-release-scripts
    - name: Send failure message
      uses: actions/github-script@v9
      env:
        TITLE: ${{ inputs.title }}
        VERSION: ${{ inputs.version }}
        NEEDS: ${{ inputs.needs }}
        WARNING: ${{ inputs.warning }}
        SLACK_RELEASE_CHANNEL: ${{ inputs.slack-channel }}
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
      with:
        script: | # js
          const { sendReleaseSlackMessage, githubRunLink, getGenericVersion } = require('${{ github.workspace }}/release/dist/index.cjs');

          const { owner, repo } = context.repo;
          const { TITLE: title, VERSION: version } = process.env;
          const isWarning = process.env.WARNING === 'true';
          const jobs = Object.entries(JSON.parse(process.env.NEEDS))
            .filter(([, job]) => ['failure', 'cancelled'].includes(job.result))
            .map(([name, job]) => `${name} (${job.result})`)
            .join(', ');
          const label = version ? `${title} ${getGenericVersion(version)} failed` : `${title} failed`;
          const runLink = githubRunLink(label, context.runId.toString(), owner, repo);
          const text = isWarning ? `${runLink}. The release is not blocked.` : runLink;

          await sendReleaseSlackMessage({
            channelName: process.env.SLACK_RELEASE_CHANNEL,
            version: version || undefined,
            emoji: isWarning ? 'warning' : 'x',
            message: jobs ? `${text}\n${jobs}` : text,
            status: isWarning ? undefined : 'failure',
          });
