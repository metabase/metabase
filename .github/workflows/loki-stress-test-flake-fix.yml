name: Loki Visual Stress Test Flake Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**/*.stories.tsx'
      - 'enterprise/frontend/**/*.stories.tsx'
  workflow_dispatch:
    inputs:
      story_files:
        description: "Comma-separated story file paths relative to repo root"
        type: string
        required: true
      burn_in:
        description: "Number of times to run the test (e.g. 10)"
        type: string
        required: true
        default: "10"

jobs:
  detect-changed-stories:
    name: Detect changed stories
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      story_files: ${{ steps.detect.outputs.story_files }}
      should_run: ${{ steps.detect.outputs.should_run }}
    steps:
      - name: Detect changed story files
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          validate_paths() {
            local files="$1"
            for file in $(echo "$files" | tr ',' '\n'); do
              file=$(echo "$file" | xargs)  # trim whitespace
              if [[ -z "$file" ]]; then
                continue
              fi
              if [[ ! "$file" =~ ^(frontend/|enterprise/frontend/).+\.stories\. ]]; then
                echo "::error::Invalid story path: $file"
                echo "Paths must start with 'frontend/' or 'enterprise/frontend/' and contain '.stories.'"
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FILES=$(echo "${{ inputs.story_files }}" | tr ',' '\n' | xargs -n1 | paste -sd',')
            if ! validate_paths "$FILES"; then
              exit 1
            fi
            echo "story_files=$FILES" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILES=$( \
            gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate \
              --jq '.[] | select(.status != "removed") | .filename' \
            | grep '\.stories\.tsx$' \
            | xargs -n1 \
            | sort -u \
            | paste -sd',' \
          )

          if [[ -z "$FILES" ]]; then
            echo "No changed story files found"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! validate_paths "$FILES"; then
            exit 1
          fi

          echo "Changed story files: $FILES"
          echo "story_files=$FILES" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

  workflow-summary:
    name: Summary
    needs: detect-changed-stories
    if: needs.detect-changed-stories.outputs.should_run == 'true'
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
      - name: Generate workflow summary
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          STORY_FILES: ${{ needs.detect-changed-stories.outputs.story_files }}
          BURN_IN: ${{ inputs.burn_in || 10 }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo '## Loki Stress Test'
            echo ''
            echo "**Branch:** \`${BRANCH_NAME}\`"
            echo ''
            echo '**Story files:**'
            echo "${STORY_FILES}" | tr ',' '\n' | while read -r file; do
              echo "- \`$file\`"
            done
            echo ''
            echo "**Burn-in:** ${BURN_IN} runs"
            echo ''
            if [[ "${EVENT_NAME}" == "pull_request" ]]; then
              echo "Triggered by PR #${PR_NUMBER} from @${PR_ACTOR}"
            else
              echo "Triggered manually by @${ACTOR}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  stress-test-loki:
    needs: detect-changed-stories
    if: needs.detect-changed-stories.outputs.should_run == 'true'
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 60
    name: Stress test Loki visual tests
    services:
      docker:
        image: docker:19.03.12
        options: --privileged
        ports:
          - 2376:2376
        env:
          DOCKER_TLS_CERTDIR: /certs
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /tmp/docker-certs:/certs/client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare frontend environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        run: NODE_ENV=development bun run build-pure:cljs

      - name: Build Storybook
        run: bun run build-storybook
        env:
          STORYBOOK_STORIES_FILTER: ${{ needs.detect-changed-stories.outputs.story_files }}

      # Loki builds the story list inside the built storybook, so it is the only thing that knows every way a story can be skipped.
      # The first run doubles as the check, and it counts as run 1 of the burn-in.
      - name: Check for stories
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          STORY_FILES: ${{ needs.detect-changed-stories.outputs.story_files }}
        run: |
          echo "=========================================="
          echo "Run 1 (checking that loki finds stories to run)"
          echo "=========================================="

          if bun run test-visual:loki \
              --reactUri file:./storybook-static \
              --verboseRenderer 2>&1 | tee .loki-first-run.log; then
            STATUS=0
          else
            STATUS=1
          fi

          if grep -q 'No stories were found' .loki-first-run.log; then
            echo "Story files: $STORY_FILES"
            if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::Every story in the requested files is loki-skipped, nothing to stress test"
              exit 1
            fi
            echo "::notice::Every story in the changed files is loki-skipped, nothing to stress test"
            echo "has_stories=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_stories=true" >> "$GITHUB_OUTPUT"
          if [[ $STATUS -eq 0 ]]; then
            echo "✅ Run 1 passed"
            echo "first_run_failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Run 1 FAILED"
            mkdir -p .loki/failures/run-1
            cp -r .loki/difference/* .loki/failures/run-1/ 2>/dev/null || true
            echo "first_run_failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stress-test Loki
        if: steps.check.outputs.has_stories == 'true'
        run: |
          BURN_IN=${{ inputs.burn_in || '10' }}
          STORY_FILES='${{ needs.detect-changed-stories.outputs.story_files }}'

          echo "Story files: $STORY_FILES"
          echo "Running Loki $BURN_IN times (run 1 already done)"
          echo ""

          FAILED=0
          if [[ "${{ steps.check.outputs.first_run_failed }}" == "true" ]]; then
            FAILED=1
          fi
          for i in $(seq 2 $BURN_IN); do
            echo "=========================================="
            echo "Run $i of $BURN_IN"
            echo "=========================================="

            if bun run test-visual:loki \
              --reactUri file:./storybook-static \
              --verboseRenderer; then
              echo "✅ Run $i passed"
            else
              echo "❌ Run $i FAILED"
              FAILED=$((FAILED + 1))

              mkdir -p ".loki/failures/run-$i"
              cp -r .loki/difference/* ".loki/failures/run-$i/" 2>/dev/null || true
            fi
            echo ""
          done

          echo "=========================================="
          echo "Summary: $((BURN_IN - FAILED))/$BURN_IN passed, $FAILED failed"
          echo "=========================================="

          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED out of $BURN_IN runs failed"
            exit 1
          fi

      - name: Generate Visual Report on Failure
        if: failure() && steps.check.outputs.has_stories == 'true'
        run: bun run test-visual:loki-report

      - name: Upload Artifact
        if: failure() && steps.check.outputs.has_stories == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: loki-stress-test-report
          include-hidden-files: true
          path: .loki/
          if-no-files-found: ignore
