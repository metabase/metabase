## Re-add metabase_database.admin_details, which 065/20261026_drop_admin_details dropped. Workspace provisioning
## needs the admin (highest-privilege) connection again. Values dropped by that migration are not recoverable.

databaseChangeLog:

  - changeSet:
      id: v66.2026-11-06T00:00:00
      author: escherize
      comment: Re-add admin_details column to metabase_database for the admin connection used by workspace provisioning
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: metabase_database
                columnName: admin_details
      changes:
        - addColumn:
            tableName: metabase_database
            columns:
              - column:
                  name: admin_details
                  type: ${text.type}
                  remarks: Encrypted JSON containing connection details for admin (highest-privilege) operations such as DDL and ownership changes
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: metabase_database
            columnName: admin_details
