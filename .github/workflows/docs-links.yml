name: Check doc links

on:
  pull_request:
  workflow_dispatch:

jobs:
  link-checker:
    name: Check documentation links
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            docs
            .lychee

      - name: Cache lychee
        uses: actions/cache@v5
        with:
          path: ~/.cache/lychee
          key: lychee-${{ runner.os }}-${{ hashFiles('.lychee/config.toml') }}

      - name: Run link checker
        id: link-check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: docs --config ./.lychee/config.toml --offline
          format: markdown

      # The nav sidebar is a YAML tree, not markdown, so lychee cannot read it directly. The script
      # renders it as markdown, runs lychee (on PATH after the step above), and reports nav.yml lines.
      - name: Check nav.yml links
        if: ${{ !cancelled() }}
        run: docs/util/check-nav-links.sh
