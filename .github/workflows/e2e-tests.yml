name: E2E Tests

on:
  workflow_call:
    inputs:
      test-plan-artifact-id:
        description: "ID of this run's test-plan.json artifact, '' to run the full suite."
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-e2e
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/test.gate.yml
    with:
      filters: e2e_all

  e2e-matrix-builder:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    uses: ./.github/workflows/e2e-matrix-builder.yml
    with:
      chunks: 50
      test-plan-artifact-id: ${{ inputs.test-plan-artifact-id }}

  e2e-snapshots:
    name: Generate E2E snapshots
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    env:
      MB_EDITION: ee
      CYPRESS_VIDEO: "false"
      CYPRESS_MB_ALL_FEATURES_TOKEN: ${{ secrets.STAGING_MB_ALL_FEATURES_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare Docker containers
        uses: ./.github/actions/e2e-prepare-containers
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          maildev: false
          openldap: false
          mocksaml: false
          postgres: true
          mysql: true
          mongo: true

      - name: Retrieve uberjar artifact for ee
        uses: ./.github/actions/fetch-artifact
        with:
          commit: ${{ github.event.pull_request.head.sha || github.sha }}
          edition: ee
          extract-path: "target/uberjar"
          output-name: "metabase.jar"

      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Prepare Cypress environment
        id: cypress-prep
        uses: ./.github/actions/prepare-cypress

      - name: Download pre-built CLJS
        id: prebuilt-cljs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-cljs-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cljs_dev

      - name: Compile CLJS
        if: steps.prebuilt-cljs.outcome != 'success'
        run: bun run build-pure:cljs

      - name: Run Metabase
        run: node e2e/runner/run_cypress_ci.js start

      - uses: ./.github/actions/resolve-job-id

      - name: Generate database snapshots
        env:
          CYPRESS_BROWSER: ${{ steps.cypress-prep.outputs.chrome-path }}
        run: node e2e/runner/run_cypress_ci.js snapshot

      - name: Upload snapshots
        uses: actions/upload-artifact@v7
        with:
          name: e2e-snapshots-ee-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            e2e/snapshots/
            e2e/support/cypress_sample_database.json
            e2e/support/cypress_sample_instance_data.json
          if-no-files-found: error
          overwrite: true

  e2e-tests:
    name: ${{ matrix.name }}-${{ matrix.edition }}
    uses: ./.github/workflows/e2e-test.yml
    needs:
      - e2e-matrix-builder
      - e2e-snapshots
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.e2e-matrix-builder.outputs.matrix) }}
    secrets: inherit
    with:
      name: ${{ matrix.name }}
      edition: ${{ matrix.edition }}
      specs: ${{ matrix.specs }}
      test-plan-artifact-id: ${{ needs.e2e-matrix-builder.outputs.test-plan-artifact-id }}
      snapshots-artifact: e2e-snapshots-ee-${{ github.event.pull_request.head.sha || github.sha }}
      total_chunks: ${{ fromJson(needs.e2e-matrix-builder.outputs.regularChunks) }}
      split_index: ${{ strategy.job-index }}
      tags: ${{ matrix.tags }}
      runner: ${{ matrix.runner }}

  collect-timings:
    name: Collect E2E Timings
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    needs: e2e-tests
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            e2e/support
          sparse-checkout-cone-mode: false

      - name: Download all timing artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: timing-data-*
          path: timing-files
          merge-multiple: false
        continue-on-error: true

      - name: Merge split timings
        id: merge
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const globber = await glob.create('timing-files/*/chunkTimings.json');
            const chunkFiles = await globber.glob();

            const specs = new Map();
            chunkFiles.forEach(file => {
              const { durations = [] } = JSON.parse(fs.readFileSync(file, 'utf8'));
              durations.forEach(({ spec, duration }) => specs.set(spec, duration));
            });

            if (specs.size === 0) {
              throw new Error('No timing data found - no specs had timing changes');
            }

            const outputPath = 'e2e/support/runTimings.json';
            fs.mkdirSync(path.dirname(outputPath), { recursive: true });

            const runTimings = {
              durations: [...specs].map(([spec, duration]) => ({ spec, duration }))
            };

            fs.writeFileSync(outputPath, JSON.stringify(runTimings, null, 2));
            console.log(`Merged timing data for ${specs.size} specs`);

      - name: Upload merged timing files
        if: steps.merge.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: merged-e2e-timings
          path: e2e/support/runTimings.json
          retention-days: 7

  e2e-tests-result:
    needs:
      - gate
      - e2e-matrix-builder
      - e2e-tests
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    name: e2e-tests-result
    if: ${{ !cancelled() }}
    env:
      E2E_TESTS_RESULT: ${{ needs.e2e-tests.result }}
      MATRIX_RESULT: ${{ needs.e2e-matrix-builder.result }}
      HAS_TESTS: ${{ needs.e2e-matrix-builder.outputs.hasTests }}
      GATE_RESULT: ${{ needs.gate.result }}
      RUN: ${{ needs.gate.outputs.run }}
    steps:
      - name: Test results
        run: | # sh
          if [ "$GATE_RESULT" != "success" ]; then
            echo "The test gate failed, so the suite never ran"
            exit 1
          elif [ "$RUN" != "true" ]; then
            echo "Didn't run due to conditional filtering"
          elif [ "$MATRIX_RESULT" != "success" ]; then
            echo "E2E matrix builder failed"
            exit 1
          elif [ "$HAS_TESTS" = "false" ]; then
            echo "The plan selected no E2E specs"
          elif [ "$E2E_TESTS_RESULT" != "success" ]; then
            echo "E2E Tests failed"
            exit 1
          else
            echo "E2E Tests passed"
          fi
