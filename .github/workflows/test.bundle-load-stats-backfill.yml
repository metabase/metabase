name: Bundle Load Stats Backfill

# Measures the master commits listed in `.github/backfill-load-times-commits.tsv`
# with the current benchmark, one after another on one runner. Load times are
# relative to the machine, so one runner keeps the points comparable.
#
# Uberjars are kept for 30 days. A listed commit older than that is built first,
# EE only, since that is all the benchmark boots. It only measures: each result
# is kept as an artifact, and the rows are merged into the table by hand, since
# the importer only appends and the table can only be truncated whole.
#
# It runs on a push to its own branch, so it never needs to merge.

on:
  push:
    branches: [backfill-load-times]

concurrency:
  group: bundle-load-stats-backfill
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  plan:
    if: ${{ github.repository == 'metabase/metabase' }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      missing: ${{ steps.plan.outputs.missing }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      - name: Find the commits with no uberjar
        id: plan
        run: |
          missing=$(cut -f1 .github/backfill-load-times-commits.tsv | while read -r sha; do
            found=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=metabase-ee-${sha}-uberjar&per_page=1" \
              --jq '[.artifacts[] | select(.expired == false)] | length')
            if [ "$found" = 0 ]; then echo "$sha"; fi
          done | jq -Rsc 'split("\n") | map(select(. != ""))')
          echo "missing=${missing}" >> "$GITHUB_OUTPUT"
          echo "To build: ${missing}"

  build:
    needs: [plan]
    if: ${{ needs.plan.outputs.missing != '[]' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        sha: ${{ fromJson(needs.plan.outputs.missing) }}
    env:
      MB_EDITION: ee
      INTERACTIVE: false
      SKIP_LICENSES: true
    steps:
      - name: Check out the commit
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.sha }}
      # The commit's own actions, with their own defaults: the JDK moved from 21
      # to 25 in July, and each action still names the one its commit needs.
      - uses: ./.github/actions/prepare-frontend
      - uses: ./.github/actions/prepare-backend
      - name: Build
        run: ./bin/build.sh
      - name: Keep the uberjar
        uses: actions/upload-artifact@v7
        with:
          # The name the lookups below and in the per-merge job search for.
          name: metabase-ee-${{ matrix.sha }}-uberjar
          path: ./target/uberjar/metabase.jar
          retention-days: 30

  # Four runners, each taking a contiguous block of dates. Runners of the same
  # class differ by about 10%, so handing neighbouring commits to different ones
  # turns that difference into a sawtooth across the whole series. A block keeps
  # neighbours on one machine.
  #
  # The blocks overlap by two commits, so each seam is measured by both runners
  # and the offset between them is a measurement rather than a guess.
  backfill:
    needs: [build]
    # A commit whose build failed has no jar, and the loop skips it with a warning.
    if: ${{ !cancelled() && github.repository == 'metabase/metabase' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - { block: 0, from: 1, to: 16 }
    env:
      MB_JETTY_PORT: "4000"
      SITE: http://localhost:4000
      RUNS: "8"
      LOCALES: "de en"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-node-bun
      - name: Prepare JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Install Chrome v144
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 144
        id: setup-chrome
      - name: Measure each commit
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          mkdir -p artifacts
          measured=0
          failed=0

          measure() {
            local sha=$1
            local artifact_id
            artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=metabase-ee-${sha}-uberjar&per_page=1" \
              --jq '[.artifacts[] | select(.expired == false)][0].id // empty')
            if [ -z "$artifact_id" ]; then
              echo "::warning::No uberjar for ${sha}, it has expired or was never built"
              return 1
            fi

            rm -rf jar && mkdir jar
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > jar.zip
            unzip -q jar.zip -d jar && rm jar.zip
            local jar_path
            jar_path=$(find jar -name metabase.jar | head -1)
            if [ -z "$jar_path" ]; then
              echo "::warning::The artifact for ${sha} holds no metabase.jar"
              return 1
            fi

            # A fresh app db per commit, so each one migrates and signs in the
            # way the per-merge job does.
            MB_DB_FILE="${RUNNER_TEMP}/bench-${sha}.db" \
              java --add-opens java.base/java.nio=ALL-UNNAMED \
              -jar "$jar_path" > "artifacts/${sha}.metabase.log" 2>&1 &
            local java_pid=$!

            local session
            session=$(bun frontend/test/bench/sign-in.ts "$SITE") || { kill "$java_pid"; wait "$java_pid" 2>/dev/null; return 1; }
            echo "::add-mask::$session"
            for _ in 1 2 3 4 5; do curl -sS -o /dev/null "$SITE/"; done

            # `measure.ts` waits on the debugging WebSocket without a bound, so a
            # Chrome that dies there hangs the whole backfill. One commit takes
            # about six minutes, so cap it well above that and move on.
            # Both locales here, on this machine, so the difference between them
            # for a commit is the locale rather than the runner. Runners of the
            # same class differ by up to 30%.
            local status=0
            for locale in $LOCALES; do
              curl -sS -X PUT -o /dev/null \
                -H "X-Metabase-Session: ${session}" \
                -H "content-type: application/json" \
                -d "{\"value\":\"${locale}\"}" \
                "$SITE/api/setting/site-locale"
              curl -sS -o /dev/null "$SITE/"
              timeout 900 env SESSION_COOKIE="$session" \
                bun frontend/test/bench/matrix.ts "$SITE/" "$RUNS" \
                > "artifacts/${sha}-${locale}.json" || status=1
            done

            kill "$java_pid"
            wait "$java_pid" 2>/dev/null || true
            pkill -f "remote-debugging-port" 2>/dev/null || true
            return $status
          }

          while IFS=$'\t' read -r sha date subject; do
            echo "::group::${date} ${sha:0:9} ${subject}"
            if measure "$sha" "$subject" "$date"; then
              measured=$((measured + 1))
              printf '%s\t%s\t%s\n' "$sha" "$date" "$subject" >> artifacts/measured.tsv
            else
              failed=$((failed + 1))
              echo "::warning::Could not measure ${sha}"
            fi
            echo "::endgroup::"
          done < <(awk -v from=${{ matrix.from }} -v to=${{ matrix.to }} 'NR >= from && NR <= to' .github/backfill-load-times-commits.tsv)

          echo "Measured ${measured}, failed ${failed}"
          [ "$measured" -gt 0 ]
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-load-times-backfill-${{ matrix.block }}
          path: artifacts/
          retention-days: 30
