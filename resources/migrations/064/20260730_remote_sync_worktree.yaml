            referencedColumnNames: id
            constraintName: fk_collection_worktree_id

  - changeSet:
      id: v64.2026-07-30T10:00:12
      author: ranquild
      comment: Add collection.worktree_id_helper generated column - COALESCE(worktree_id, 0), so entity_id uniqueness can be scoped per worktree with NULLs (main-app rows) collapsing into one bucket
      changes:
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE "collection" ADD COLUMN "worktree_id_helper" integer GENERATED ALWAYS AS (COALESCE("worktree_id", 0)) STORED;
        - sql:
            dbms: mysql
            sql: |
              ALTER TABLE `collection` ADD COLUMN `worktree_id_helper` INT GENERATED ALWAYS AS (COALESCE(`worktree_id`, 0)) VIRTUAL;
        - sql:
            dbms: mariadb
            sql: |
              ALTER TABLE `collection` ADD COLUMN `worktree_id_helper` INT GENERATED ALWAYS AS (COALESCE(`worktree_id`, 0)) STORED;
        - sql:
            dbms: h2
            sql: |
              ALTER TABLE collection ADD COLUMN worktree_id_helper int GENERATED ALWAYS AS (COALESCE(worktree_id, 0));
      rollback:
        - dropColumn:
            tableName: collection
            columnName: worktree_id_helper

  - changeSet:
      id: v64.2026-07-30T10:00:13
      author: ranquild
      comment: Drop the single-column entity_id unique on collection; superseded by the composite (entity_id, worktree_id_helper) unique below
      changes:
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE "collection" DROP CONSTRAINT IF EXISTS "collection_entity_id_key";
        - sql:
            dbms: mysql,mariadb
            sql: |
              ALTER TABLE `collection` DROP INDEX `entity_id`;
        - sql:
            dbms: h2
            splitStatements: false
            sql: |
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE ' || tc.table_name || ' DROP CONSTRAINT ' || tc.constraint_name FROM information_schema.table_constraints tc WHERE tc.table_name = 'COLLECTION' AND tc.constraint_type = 'UNIQUE' AND EXISTS (SELECT 1 FROM information_schema.key_column_usage k WHERE k.constraint_name = tc.constraint_name AND k.table_name = tc.table_name AND k.column_name = 'ENTITY_ID') AND NOT EXISTS (SELECT 1 FROM information_schema.key_column_usage k2 WHERE k2.constraint_name = tc.constraint_name AND k2.table_name = tc.table_name AND k2.column_name <> 'ENTITY_ID')), '');
      rollback:
        - addUniqueConstraint:
            tableName: collection
            columnNames: entity_id
            constraintName: unique_collection_entity_id

  - changeSet:
      id: v64.2026-07-30T10:00:14
      author: ranquild
      comment: Per-worktree entity_id uniqueness for collection - worktree_id_helper collapses NULL/main-app rows to 0, so entity_id stays globally unique outside worktrees and per-worktree inside them
      changes:
        - addUniqueConstraint:
            tableName: collection
            columnNames: entity_id, worktree_id_helper
            constraintName: unique_collection_entity_id_worktree

