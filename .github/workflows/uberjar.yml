name: Build Uberjar

concurrency:
  group: uberjar-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Optional full-length commit SHA-1 hash"
        type: string
        default: ''
        required: false
      containerize:
        description: "Set if the uberjar should be containerized and pushed to Dockerhub."
        type: boolean
        default: false
        required: false
  workflow_call:
    inputs:
      commit:
        description: "Optional full-length commit SHA-1 hash"
        type: string
        default: ''
        required: false
      containerize:
        description: "Set if the uberjar should be containerized and pushed to Dockerhub."
        type: boolean
        default: false
        required: false

jobs:
  setup:
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      build_editions: ${{ steps.matrix.outputs.build_editions }}
      java_version: ${{ steps.dependencies.outputs.java_version }}
      node_version: ${{ steps.dependencies.outputs.node_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check for existing EE uberjar
        id: check-ee
        uses: ./.github/actions/fetch-artifact
        continue-on-error: true
        with:
          name: metabase-ee-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}-uberjar
          download: false

      - name: Check for existing OSS uberjar
        id: check-oss
        uses: ./.github/actions/fetch-artifact
        continue-on-error: true
        with:
          name: metabase-oss-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}-uberjar
          download: false

      - name: Create build matrix
        id: matrix
        uses: actions/github-script@v7
        with:
          script: | # js
            const hit = {
              ee: "${{ steps.check-ee.outputs.fetch-hit }}" === "true",
              oss: "${{ steps.check-oss.outputs.fetch-hit }}" === "true",
            };

            const editions = ['ee', 'oss'].filter((edition) => !hit[edition]);

            core.info(`build: ${editions.join(', ') || '(nothing, both artifacts already exist)'}`);

            core.setOutput('build_editions', JSON.stringify(editions));

      - name: Prepare release scripts
        if: ${{ contains(github.ref, 'release-x') }}
        run: cd ${{ github.workspace }}/release && yarn && yarn build

      - name: Get build dependencies
        if: ${{ contains(github.ref, 'release-x') }}
        uses: actions/github-script@v7
        id: dependencies
        with:
          script: | # js
            const { getBuildRequirements, getVersionFromReleaseBranch } = require('${{ github.workspace }}/release/dist/index.cjs');

            const version = getVersionFromReleaseBranch('${{ github.ref }}');
            const requirements = getBuildRequirements(version);

            core.setOutput('java_version', requirements.java);
            core.setOutput('node_version', requirements.node);

  build:
    needs: [setup]
    if: ${{ needs.setup.outputs.build_editions != '[]' }}
    name: build (${{ matrix.edition }})
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    strategy:
      matrix:
        edition: ${{ fromJson(needs.setup.outputs.build_editions) }}
    env:
      MB_EDITION: ${{ matrix.edition }}
      INTERACTIVE: false
      SKIP_LICENSES: ${{ github.event_name == 'pull_request' && !inputs.containerize }}  # faster builds for dev
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
        with:
          node-version: "${{ needs.setup.outputs.node_version || '22' }}"
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
        with:
          java-version: "${{ needs.setup.outputs.java_version || 21 }}"
      - name: Build
        run: ./bin/build.sh
      - name: Prepare uberjar artifact
        uses: ./.github/actions/prepare-uberjar-artifact
        with:
          name: metabase-${{ matrix.edition }}-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}-uberjar

  jar-healthcheck:
    needs: [setup, build]
    if: ${{ !failure() && !cancelled() && (inputs.containerize || github.ref_name == 'master' || startsWith(github.ref_name, 'release-')) }}
    name:  jar-healthcheck (${{ matrix.edition }})
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    strategy:
      matrix:
        edition: [ee, oss]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Prepare JRE (Java Run-time Environment)
        uses: actions/setup-java@v4
        with:
          java-package: jre
          java-version: ${{ needs.setup.outputs.java_version || 21 }}
          distribution: "temurin"
      - run: java -version
      - name: Retrieve uberjar artifact
        uses: ./.github/actions/fetch-artifact
        with:
          name: metabase-${{ matrix.edition }}-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}-uberjar
      - name: Launch uberjar
        run: >-
          java --add-opens java.base/java.nio=ALL-UNNAMED -jar ./metabase.jar &
      - name: Wait for Metabase to start
        run: while ! curl 'http://localhost:3000/api/health' | grep '{"status":"ok"}'; do sleep 1; done

  containerize:
    needs: [build, jar-healthcheck]
    if: ${{ inputs.containerize && !failure() && !cancelled() }}
    name: containerize (${{ matrix.edition }})
    strategy:
      matrix:
        edition: [ee, oss]
    uses: ./.github/workflows/containerize-jar.yml
    secrets: inherit
    with:
      edition: ${{ matrix.edition }}
      artifact-name: metabase-${{ matrix.edition }}-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}-uberjar
      commit: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
      release: ${{ 'false' }}
      build-args: |
        GIT_COMMIT_SHA=${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
