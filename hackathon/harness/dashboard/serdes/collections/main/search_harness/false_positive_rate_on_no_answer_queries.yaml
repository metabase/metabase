dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH x AS (
        SELECT engine AS "Engine", split_part(embedder, '/', 2) AS "Embedder", avg(value) AS "False-positive rate",
             count(*) AS "n"
        FROM harness_scenario_metric
        WHERE corpus_id = {{corpus}} AND metric = 'false_positive_rate'
          AND embedding_text = {{variant}}
          AND text_strategy = {{strategy}}
          [[AND (data_scale = {{scale}} OR data_scale IS NULL)]]
        GROUP BY 1, 2
      )
      SELECT * FROM x
      -- Say why the card is empty rather than showing nothing.
      UNION ALL
      SELECT 'this corpus has no no-answer questions', NULL, NULL, NULL WHERE NOT EXISTS (SELECT 1 FROM x)
      ORDER BY 1, 2
