name: Loki Visual Regression Testing

on:
  pull_request:
  merge_group:

jobs:
  files-changed:
    name: Check which files changed
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 3
    outputs:
      frontend_ci: ${{ steps.changes.outputs.frontend_ci }}
      frontend_sources: ${{ steps.changes.outputs.frontend_sources }}
      frontend_loki_ci: ${{ steps.changes.outputs.frontend_loki_ci }}
    steps:
      - uses: actions/checkout@v6
      - name: Test which files changed
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-paths.yaml

  visual-test:
    needs: files-changed
    if: needs.files-changed.outputs.frontend_ci == 'true' || needs.files-changed.outputs.frontend_sources == 'true' || needs.files-changed.outputs.frontend_loki_ci == 'true'
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    services:
      docker:
        image: docker:19.03.12
        options: --privileged
        ports:
          - 2376:2376
        env:
          DOCKER_TLS_CERTDIR: /certs
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /tmp/docker-certs:/certs/client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Test which files changed
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          token: ${{ github.token }}
          list-files: csv
          filters: .github/file-paths.yaml

      - name: Prepare frontend environment
        uses: ./.github/actions/prepare-frontend

      # Only narrow on pull requests; the merge queue runs the full suite.
      # A plan failure falls back to the full suite via the "all" mode below.
      - name: Create test plan
        id: plan
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        uses: ./.github/actions/create-test-plan
        with:
          changed-files: ${{ steps.changes.outputs.all_changed_files }}
          fe-changed-files: ${{ steps.changes.outputs.frontend_sources_files }}
          be-changed-files: ${{ steps.changes.outputs.backend_sources_files }}
          unit-infra-touched: ${{ steps.changes.outputs.frontend_unit_infra }}
          loki-infra-touched: ${{ steps.changes.outputs.frontend_loki_infra }}
          e2e-infra-touched: ${{ steps.changes.outputs.e2e_infra }}
          shared-sources-touched: ${{ steps.changes.outputs.shared_sources }}

      - name: Select affected stories
        id: stories
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: |
          if [ "$PLAN_OUTCOME" != "success" ] || [ ! -f test-plan.json ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(jq '.loki_stories_to_run | length' test-plan.json)
          total=$(jq '.stats.loki_stories_all' test-plan.json)
          if [ "$count" -eq 0 ]; then
            echo "Test plan selected no stories for this change."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          elif [ "$count" -lt "$total" ]; then
            echo "Narrowing to $count of $total story files."
            echo "mode=filter" >> "$GITHUB_OUTPUT"
          else
            echo "mode=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare back-end environment
        if: ${{ steps.stories.outputs.mode != 'none' }}
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        if: ${{ steps.stories.outputs.mode != 'none' }}
        run: NODE_ENV=development bun run build-pure:cljs

      - name: Build Storybook
        if: ${{ steps.stories.outputs.mode != 'none' }}
        run: bun run build-storybook

      # Maps the plan's affected story files to concrete story names via the
      # storybook index, re-applying the loki.config.js whitelist (a CLI
      # --storiesFilter replaces it rather than combining with it).
      - name: Compute stories filter
        id: filter
        if: ${{ steps.stories.outputs.mode == 'filter' }}
        run: |
          node .github/scripts/loki-affected-stories.mjs \
            test-plan.json storybook-static/index.json > loki-filter.json
          count=$(jq .count loki-filter.json)
          echo "$count affected stories pass the whitelist."
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "regex<<LOKI_FILTER_EOF"
            jq -r .regex loki-filter.json
            echo "LOKI_FILTER_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Loki Visual Tests
        if: |
          steps.stories.outputs.mode == 'all' ||
          (steps.stories.outputs.mode == 'filter' && steps.filter.outputs.count != '0')
        env:
          STORIES_MODE: ${{ steps.stories.outputs.mode }}
          STORIES_REGEX: ${{ steps.filter.outputs.regex }}
        run: |
          if [ "$STORIES_MODE" = "filter" ]; then
            bun run test-visual:loki --reactUri file:./storybook-static \
              --verboseRenderer --storiesFilter "$STORIES_REGEX"
          else
            bun run test-visual:loki --reactUri file:./storybook-static --verboseRenderer
          fi

      - name: Generate Visual Report on Failure
        if: failure()
        run: bun run test-visual:loki-report

      - name: Upload Artifact
        id: artifact-upload-step
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: loki-report
          include-hidden-files: true
          path: .loki/
          if-no-files-found: ignore
