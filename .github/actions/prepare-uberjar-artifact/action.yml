name: Prepare Uberjar Artifact
description: Prepare and upload Metabase JAR as a GitHub artifact.

inputs:
  edition:
    required: false
    default: "ee"
    description: Metabase edition (ee or oss)
  commit:
    required: false
    default: ""
    description: |
      Commit the artifact is keyed on. Must match what `fetch-artifact` will later look up —
      callers building a commit other than the event's own have to pass it, or the upload lands
      under a name nothing will find. Defaults to the event's commit.

runs:
  using: "composite"
  steps:
    - name: Mark with the commit hash
      run: git rev-parse --short HEAD > COMMIT-ID
      shell: bash
    - name: Calculate SHA256 checksum
      run: sha256sum ./target/uberjar/metabase.jar > SHA256.sum
      shell: bash
    - name: Upload JARs as artifact
      uses: actions/upload-artifact@v7
      with:
        name: metabase-${{ inputs.edition }}-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}-uberjar
        path: |
          ./target/uberjar/metabase.jar
          ./COMMIT-ID
          ./SHA256.sum
