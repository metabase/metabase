dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH m AS (
        SELECT engine, embedder, data_scale, embedding_text, text_strategy, scenario_id, value
        FROM harness_scenario_metric
        WHERE corpus_id = {{corpus}} AND metric = 'ndcg@10'
          AND embedding_text = {{variant}}
          AND text_strategy = {{strategy}}
          [[AND (data_scale = {{scale}} OR data_scale IS NULL)]]
      ), d AS (
        SELECT o.engine, r.embedder, r.data_scale, r.value - o.value AS delta
        FROM m r
        JOIN m o ON o.scenario_id = r.scenario_id AND o.embedding_text = r.embedding_text AND o.text_strategy = r.text_strategy
                AND o.embedder IS NOT DISTINCT FROM r.embedder AND o.data_scale IS NOT DISTINCT FROM r.data_scale
                AND o.engine <> r.engine
        WHERE r.engine = 'semantic'
      ), s AS (
        SELECT engine, embedder, data_scale, count(*) AS n, avg(delta) AS mean,
               1.96 * stddev_samp(delta) / sqrt(count(*)) AS ci,
               count(*) FILTER (WHERE delta > 1e-9) AS wins,
               count(*) FILTER (WHERE abs(delta) <= 1e-9) AS ties,
               count(*) FILTER (WHERE delta < -1e-9) AS losses
        FROM d
        GROUP BY 1, 2, 3
      )
      SELECT 'semantic vs ' || engine AS "Comparison", split_part(embedder, '/', 2) AS "Embedder",
             CASE WHEN n < 5 THEN 'too few questions'
                  WHEN mean - ci > 0 THEN 'semantic better'
                  WHEN mean + ci < 0 THEN engine || ' better'
                  ELSE 'no proven difference' END AS "Verdict",
             round(mean::numeric, 3) AS "Avg. difference", round(ci::numeric, 3) AS "± 95% CI",
             wins AS "semantic better", ties AS "Tie", losses AS "semantic worse", n AS "n questions",
             data_scale AS "Scale"
      FROM s
      ORDER BY data_scale, embedder, array_position(ARRAY['semantic', 'semantic-pure', 'semantic-vector', 'sqlite-vec1', 'sqlite-vec1-pure', 'lucene', 'lucene-pure', 'appdb', 'in-place'], engine)
    template-tags:
    - default: baseline
      display-name: Embedding text
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000005
      name: variant
      required: true
      type: text
    - default: none
      display-name: Text strategy
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000006
      name: strategy
      required: true
      type: text
    - default: northwind-golden-v1
      display-name: Corpus
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000001
      name: corpus
      required: true
      type: text
    - display-name: Scale
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000002
      name: scale
      required: false
      type: number
    lib/type: mbql.stage/native
  lib/type: mbql/query
