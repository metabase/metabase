## Record the SAML SessionIndex per session so single logout can name the session to end.

databaseChangeLog:
  - changeSet:
      id: v64.3ete20
      author: Bryan Maass
      comment: Add saml_session_index to core_session
      changes:
        - addColumn:
            tableName: core_session
            columns:
              - column:
                  name: saml_session_index
                  type: varchar(254)
                  remarks: SessionIndex from the SAML login assertion, sent back in the SLO LogoutRequest to identify this session. NULL for non-SAML sessions and for sessions created before this column existed.
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: core_session
            columnName: saml_session_index
