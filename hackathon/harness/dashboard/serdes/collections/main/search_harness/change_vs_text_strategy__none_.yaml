dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH m AS (
        SELECT engine, text_strategy, embedding_text, data_scale, embedder, scenario_id, value
        FROM harness_scenario_metric
        WHERE corpus_id = {{corpus}} AND metric = 'ndcg@10'
          AND embedding_text = {{variant}}
          [[AND (data_scale = {{scale}} OR data_scale IS NULL)]]
          [[AND embedder = {{embedder}}]]
      ), d AS (
        SELECT m.text_strategy, m.engine, m.embedder, m.data_scale, m.value, m.value - b.value AS delta
        FROM m
        JOIN m b ON b.text_strategy = 'none' AND b.engine = m.engine AND b.scenario_id = m.scenario_id
                AND b.embedding_text = m.embedding_text AND b.data_scale IS NOT DISTINCT FROM m.data_scale AND b.embedder = m.embedder
      ), s AS (
        SELECT text_strategy, engine, embedder, data_scale, count(*) AS n, avg(value) AS v, avg(delta) AS mean,
               1.96 * stddev_samp(delta) / sqrt(count(*)) AS ci,
               count(*) FILTER (WHERE delta > 1e-9) AS wins,
               count(*) FILTER (WHERE abs(delta) <= 1e-9) AS ties,
               count(*) FILTER (WHERE delta < -1e-9) AS losses
        FROM d
        GROUP BY 1, 2, 3, 4
      )
      SELECT text_strategy AS "Text strategy", engine AS "Engine",
             CASE WHEN text_strategy = 'none' THEN 'reference' ELSE
             CASE WHEN n < 5 THEN 'too few questions'
                  WHEN mean - ci > 0 THEN 'strategy better'
                  WHEN mean + ci < 0 THEN 'none better'
                  ELSE 'no proven difference' END END AS "Verdict",
             round(v::numeric, 3) AS "nDCG@10", round(mean::numeric, 3) AS "Avg. difference", round(ci::numeric, 3) AS "± 95% CI",
             wins AS "Strategy better", ties AS "Tie", losses AS "Strategy worse", n AS "n questions",
             split_part(embedder, '/', 2) AS "Embedder", data_scale AS "Scale"
      FROM s
      ORDER BY data_scale, embedder, text_strategy <> 'none', text_strategy, array_position(ARRAY['semantic', 'semantic-pure', 'semantic-vector', 'sqlite-vec1', 'sqlite-vec1-pure', 'lucene', 'lucene-pure', 'appdb', 'in-place'], engine)
    template-tags:
    - default: baseline
      display-name: Embedding text
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000005
      name: variant
      required: true
      type: text
    - default: northwind-golden-v1
      display-name: Corpus
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000001
      name: corpus
      required: true
      type: text
    - display-name: Scale
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000002
      name: scale
      required: false
      type: number
    - display-name: Embedder
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000003
      name: embedder
      required: false
      type: text
    lib/type: mbql.stage/native
  lib/type: mbql/query
