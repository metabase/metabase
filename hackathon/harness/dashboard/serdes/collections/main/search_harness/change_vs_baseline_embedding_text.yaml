dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH m AS (
        SELECT engine, embedding_text, text_strategy, data_scale, embedder, scenario_id, metric, value
        FROM harness_scenario_metric
        WHERE corpus_id = {{corpus}} AND metric IN ('ndcg@10', 'recall@10')
          [[AND (data_scale = {{scale}} OR data_scale IS NULL)]]
          [[AND embedder = {{embedder}}]]
          AND text_strategy = {{strategy}}
      )
      SELECT m.engine AS "Engine", m.embedding_text AS "Embedding text", m.data_scale AS "Scale", split_part(m.embedder, '/', 2) AS "Embedder",
             count(DISTINCT m.scenario_id) FILTER (WHERE m.metric = 'ndcg@10') AS "n scenarios",
             round(avg(m.value) FILTER (WHERE m.metric = 'ndcg@10')::numeric, 3) AS "nDCG@10",
             round(avg(m.value - b.value) FILTER (WHERE m.metric = 'ndcg@10')::numeric, 3) AS "Δ nDCG vs baseline",
             round((1.96 * stddev_samp(m.value - b.value) FILTER (WHERE m.metric = 'ndcg@10')
                    / sqrt(nullif(count(b.value) FILTER (WHERE m.metric = 'ndcg@10'), 0)))::numeric, 3) AS "Δ ± 95% CI",
             round(avg(m.value) FILTER (WHERE m.metric = 'recall@10')::numeric, 3) AS "Recall@10",
             round(avg(m.value - b.value) FILTER (WHERE m.metric = 'recall@10')::numeric, 3) AS "Δ recall vs baseline"
      FROM m
      -- Pair within the slice (scale, embedder): a cleared filter must never pair one model's baseline with another's.
      LEFT JOIN m b ON b.embedding_text = 'baseline' AND b.engine = m.engine AND b.scenario_id = m.scenario_id AND b.metric = m.metric
                   AND b.data_scale IS NOT DISTINCT FROM m.data_scale AND b.embedder = m.embedder AND b.text_strategy = m.text_strategy
      -- A baseline row only matters as the reference for a variant in the same slice; alone it is just Δ 0.
      WHERE m.embedding_text <> 'baseline'
         OR EXISTS (SELECT 1 FROM m v WHERE v.embedding_text <> 'baseline' AND v.engine = m.engine
                    AND v.data_scale IS NOT DISTINCT FROM m.data_scale AND v.embedder = m.embedder AND v.text_strategy = m.text_strategy)
      GROUP BY 1, 2, 3, 4
      ORDER BY 3, 4, 1, 2
