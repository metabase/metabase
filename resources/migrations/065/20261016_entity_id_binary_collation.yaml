## Serialization orders the entities it exports by entity_id, which decides the de-dup suffix of same-named files
## (`foo.yaml`, `foo_2.yaml`). The entity_id columns used the app DB's default collation, which sorts mixed-case and
## punctuated NanoIDs differently on Postgres (per locale) and MySQL/MariaDB (case-insensitive) than on H2, so instances
## syncing one repo named those files differently. Byte-wise collations make every app DB sort them alike.
##
## One changeset per table: each runs in its own transaction, so it locks one table at a time. The change locks its
## table until it commits (Postgres blocks reads and writes while it rebuilds the column's indexes; MySQL and MariaDB
## block writes while they copy the whole table). A single changeset over every table would hold those locks on all
## of them at once, blocking the nodes still serving on the old version during a rolling upgrade.

databaseChangeLog:
  - changeSet:
      id: v65.2026-10-16T12:00:00
      author: ranquild
      comment: Compare action.entity_id byte by byte on Postgres, MySQL, and MariaDB
      changes:
        - sql:
            dbms: postgresql
            sql: ALTER TABLE action ALTER COLUMN entity_id TYPE char(21) COLLATE "C";
        - sql:
            dbms: mysql,mariadb
            sql: ALTER TABLE action MODIFY entity_id CHAR(21) CHARACTER SET utf8mb4 COLLATE utf8mb4_bin NOT NULL;
      rollback:
        - sql:
            dbms: postgresql
            sql: ALTER TABLE action ALTER COLUMN entity_id TYPE char(21) COLLATE "default";
        - sql:
            dbms: mysql,mariadb
            sql: ALTER TABLE action MODIFY entity_id CHAR(21) CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci NOT NULL;

