## Adds action_test: a test of one action, replacing the tables it modifies and reads with fixture data, running it
## with the test's parameter values, and checking the tables afterwards. The parameters, inputs and expectations are JSON
## documents validated by metabase-enterprise.data-testing.schema, as for card_test. An action's tests are deleted with it.

databaseChangeLog:
  - changeSet:
      id: emkt4b
      author: galdre
      comment: Add action_test
      changes:
        - createTable:
            tableName: action_test
            remarks: A test of an action, with fixture inputs, parameter values, and expectations on the tables after it runs
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_id
                  type: ${entity_id.type}
                  remarks: NanoID for serdes
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: action_id
                  type: int
                  remarks: The action under test
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: The user who created the test
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: ${text.type}
                  remarks: The name of the test
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: ${text.type}
                  remarks: A description of the test
              - column:
                  name: parameters
                  type: ${text.type}
                  remarks: JSON object of the value of each parameter of the action, by parameter id or slug
              - column:
                  name: inputs
                  type: ${text.type}
                  remarks: JSON array of the input tables replaced with fixture data
                  constraints:
                    nullable: false
              - column:
                  name: expectations
                  type: ${text.type}
                  remarks: JSON array of the expectations checked against the tables after the action runs
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: The timestamp this test was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: The timestamp this test was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: 0dju5i
      author: galdre
      comment: Index action_test.action_id
      changes:
        - createIndex:
            tableName: action_test
            indexName: idx_action_test_action_id
            columns:
              - column:
                  name: action_id

  - changeSet:
      id: 3kl2oi
      author: galdre
      comment: Add FK constraint on action_test.action_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: action_test
            baseColumnNames: action_id
            referencedTableName: action
            referencedColumnNames: id
            constraintName: fk_action_test_action_id
            onDelete: CASCADE

  - changeSet:
      id: hhn6kq
      author: galdre
      comment: Index action_test.creator_id
      changes:
        - createIndex:
            tableName: action_test
            indexName: idx_action_test_creator_id
            columns:
              - column:
                  name: creator_id

  - changeSet:
      id: lpbxqj
      author: galdre
      comment: Add FK constraint on action_test.creator_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: action_test
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_action_test_creator_id
            onDelete: CASCADE
