      changes:
        - sql:
            sql: >-
              DELETE FROM DATABASECHANGELOG WHERE id IN ('wtw01tb', 'wtw02df', 'wtw03wu', 'wtw04wu', 'wtw05wu', 'wtw06wu', 'wtw07wu', 'wtw08co', 'wtw09ix', 'wtw10fk', 'wtw11uq', 'wtw12ix', 'wtw13fk', 'wtw14up', 'wtw14um', 'wtw14uh', 'wtw15tx', 'wtw16ti', 'wtw16tu', 'wtw16tc', 'wtw17tf', 'wtw18mc', 'wtw19mx', 'wtw20mf', 'wtw21cd', 'wtw22cx', 'wtw23cf', 'h2cn7q', 'wtw17vt', 'wtw18vf', 'ccf72f', 'ccfo9f', 'ccfytl', 'ccfi8e', 'ccfs9q', 'ccf55p', 'ccfekf', 'ccfmhv', 'ccfg52', 'ccfm5a', 'ccfdxt', 'ccfegg', 'ccfp59', 'ccf63u', 'ccfl1x', 'ccfo2f', 'usbx2uq', 'usbx3fk', 'usbx4ix', 'usbx5co', 'uprm2uq', 'uprm3fk', 'uprm4ix', 'uprm5co', 'wlfk00', 'wlfk01', 'wlfk02', 'wlfk03', 'wlfk04', 'wlfk05', 'wlfk06', 'wlfk07', 'wlfk08', 'wlfk09', 'wixct0') AND author = 'ranquild'
      rollback:

  - changeSet:
      id: ohgazy
      author: ranquild
      comment: Add remote_sync_worktree, a checkout of a remote sync branch whose content lives in the same tables as the main app
      changes:
        - createTable:
            tableName: remote_sync_worktree
            remarks: A checkout of a remote sync branch whose content lives in the same tables as the main app
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  remarks: Unique ID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch
                  type: varchar(254)
                  remarks: The remote sync branch the worktree checks out, empty for the default worktree
                  constraints:
                    nullable: false
              - column:
                  name: is_default
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: Whether this is the default worktree, the main app
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: The user who created the worktree
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: The timestamp of when the worktree was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: The timestamp of when the worktree was last updated
                  constraints:
                    nullable: false

  - changeSet:
      id: l9dowg
      author: ranquild
      comment: Add the default worktree, the main app, which the new table gives id 1
      changes:
        - insert:
            tableName: remote_sync_worktree
            columns:
              - column:
                  name: branch
                  value: ''
              - column:
                  name: is_default
                  valueBoolean: true
      rollback:
        - delete:
            tableName: remote_sync_worktree
            where: is_default = TRUE

  - changeSet:
      id: u5m4rx
      author: ranquild
      comment: Add remote_sync_worktree_user, the worktree other than the default one a user has checked out
      changes:
        - createTable:
            tableName: remote_sync_worktree_user
            remarks: The worktree other than the default one a user has checked out, at most one per user
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  remarks: Unique ID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: worktree_id
                  type: int
                  remarks: The worktree the user has checked out
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: int
                  remarks: The user
                  constraints:
                    nullable: false

  - changeSet:
      id: xc7ho0
