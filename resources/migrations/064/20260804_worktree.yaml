  - changeSet:
      id: v64.2026-08-04T10:00:21
      author: ranquild
      comment: Create worktree_remapping table
      changes:
        - createTable:
            tableName: worktree_remapping
            remarks: Maps the entity_id an entity has on the branch to the entity_id of the copy a worktree checked out for it, so a worktree can hold its own copy of an entity the main app already has
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: worktree_id
                  type: int
                  remarks: Worktree this remapping belongs to
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(254)
                  remarks: Serdes model name the remapped entity_ids belong to (e.g. Transform)
                  constraints:
                    nullable: false
              - column:
                  name: source_entity_id
                  type: char(21)
                  remarks: entity_id as it appears on the branch, and in every serialized file
                  constraints:
                    nullable: false
              - column:
                  name: local_entity_id
                  type: char(21)
                  remarks: entity_id of the row this worktree checked the entity out into
                  constraints:
                    nullable: false

  - changeSet:
      id: v64.2026-08-04T10:00:22
      author: ranquild
      comment: Unique index on (worktree_id, source_entity_id) - a branch entity is checked out at most once per worktree
      changes:
        - createIndex:
            tableName: worktree_remapping
            indexName: idx_worktree_remapping_source
            unique: true
            columns:
              - column:
                  name: worktree_id
              - column:
                  name: source_entity_id

  - changeSet:
      id: v64.2026-08-04T10:00:23
      author: ranquild
      comment: Unique index on local_entity_id - entity_id is globally unique, so a checked-out row backs exactly one remapping
      changes:
        - createIndex:
            tableName: worktree_remapping
            indexName: idx_worktree_remapping_target
            unique: true
            columns:
              - column:
                  name: local_entity_id

  - changeSet:
