name: Prepare front-end environment
inputs:
  node-version:
    description: "The version of Node.js to use, overriding .nvmrc"
    required: false
  apply-patches:
    description: "Whether to patch frontend dependencies with patch-package."
    required: true
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Prepare Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }} # this overrides, if present
        node-version-file: ".nvmrc"

    - name: Cache spec
      id: cache-spec
      shell: bash
      run: .github/scripts/cache-keys.sh | tee -a "$GITHUB_OUTPUT"

    # The spec names the cache folder rather than discovering it, so that a job can restore the cache
    # before yarn has run. Exported job-wide rather than per-step because every later yarn invocation has
    # to resolve against the same folder. Confirm yarn agreed: if the variable stopped taking effect,
    # yarn would fill its default directory and the cache would silently save an empty tree.
    #
    # `yarn cache dir` reports the versioned `vN` directory *inside* YARN_CACHE_FOLDER, so the match is
    # by prefix; an exact comparison would fail on every run. It also prefixes its output with terminal
    # control sequences even when stdout is not a tty, which a raw comparison would never match.
    - name: Point yarn at the cached store
      shell: bash
      env:
        STORE: ${{ steps.cache-spec.outputs.yarn-cache-path }}
      run: |
        echo "YARN_CACHE_FOLDER=$STORE" >> "$GITHUB_ENV"
        ACTUAL=$(YARN_CACHE_FOLDER="$STORE" yarn cache dir | sed $'s/\033\[[0-9;]*[A-Za-z]//g' | tail -1)
        case "$ACTUAL" in
          "$STORE"|"$STORE"/*) ;;
          *)
            echo "::error::yarn reports its cache at $ACTUAL, which is not under $STORE; YARN_CACHE_FOLDER is not taking effect"
            exit 1
            ;;
        esac

    - name: Restore yarn cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.cache-spec.outputs.yarn-cache-path }}
        key: ${{ steps.cache-spec.outputs.yarn-cache-key }}
        restore-keys: ${{ steps.cache-spec.outputs.yarn-cache-restore-key }}

    # postinstall lifecycle hook can be dangerous in CI so we only run it locally (see package.json)
    # If a job wants to patch packages, it does so explicitly in the CI. This setting is opt-out.
    - name: Install front-end dependencies
      run: yarn install --frozen-lockfile --prefer-offline
      shell: bash
    - name: Patch frontend dependencies
      if: inputs.apply-patches == 'true'
      run: yarn patch-package
      shell: bash
