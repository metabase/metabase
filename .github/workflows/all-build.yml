name: Build ALL Portal BI (Metabase OSS fork)

# Gera a imagem Docker do fork e publica no GitHub Container Registry (ghcr.io).
# Dispara quando você cria uma tag no formato v0.63.18.4-all.1, ou manualmente.
on:
  push:
    tags:
      - "v*-all*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: v0.63.18.4-all.1)"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Liberar espaço em disco no runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o build lê a versão do git

      - name: Definir versão e nome da imagem
        id: meta
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portal-bi"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push (edição OSS)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            MB_EDITION=oss
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
