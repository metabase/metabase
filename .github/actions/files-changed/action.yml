name: Files changed
description: >
  Answer questions about a commit — did it touch these parts of the repo? —
  using dorny/paths-filter against .github/file-paths.yaml.

  Checks the repository out when it needs to, runs the diff once, and turns it
  into plain booleans, so a caller states which filters it cares about instead
  of spelling the same OR out across a job's `if:` conditions.

inputs:
  any-of:
    description: >
      Filter names from the filter file, comma- or newline-separated. `changed`
      is 'true' when the commit matched at least one of them. `name: true` is
      accepted alongside a bare `name`, so a multi-line list reads either way.
      A name the filter file doesn't define is an error, not a quiet 'false'.
    required: false
    default: ""
  all-of:
    description: >
      Filter names, in the same forms `any-of` accepts, that must *all* have
      matched. Give both and the commit has to satisfy the `any-of` OR and the
      `all-of` AND together.
    required: false
    default: ""
  questions:
    description: >
      Several named questions of one diff, answered into the `answers` JSON:

        frontend:
          all-of: frontend_sources
        backend:
          any-of: backend_all, drivers
        docs: documentation

      Each name takes `any-of` and/or `all-of` with the same meaning they have
      above; the last line is shorthand for a question that is only an `any-of`.
      Mutually exclusive with the top-level `any-of`/`all-of`.
    required: false
    default: ""
  filters:
    description: "Path to the paths-filter configuration, relative to the repo root."
    required: false
    default: .github/file-paths.yaml
  list-files:
    description: >
      Format for the `files` output: none, csv, shell, json or escape. `none`
      (the default) skips it, which keeps the outputs small.
    required: false
    default: none
  base:
    description: >
      Git ref to diff against. Leave empty to let paths-filter decide: the PR
      base for pull requests, the pushed-over commit for pushes.
    required: false
    default: ""
  token:
    description: "Token used to read the changed file list from the API. Defaults to github.token."
    required: false
    default: ""
  checkout:
    description: >
      `auto` (the default) checks the repository out only when the filter file
      isn't already in the workspace, so a job that has already checked out — or
      that sparse-checked-out `.github` just to reach this action — doesn't pay
      for a second clone. `true` always checks out, `false` never does.
    required: false
    default: auto
  fetch-depth:
    description: "fetch-depth for the checkout this action performs, when it performs one."
    required: false
    default: "1"

outputs:
  changed:
    description: >
      'true' when the commit satisfied `any-of` (at least one matched) and
      `all-of` (every one matched). Under `questions`, 'true' when any question
      answered yes — a cheap gate for "is there anything to do at all?".
      'false' when no question was asked.
    value: ${{ steps.evaluate.outputs.changed }}
  answers:
    description: >
      One JSON boolean per named question, for use as
      fromJSON(steps.<id>.outputs.answers).frontend. `{}` unless `questions`
      was given.
    value: ${{ steps.evaluate.outputs.answers }}
  files:
    description: >
      Files matched by the named filters, in the `list-files` format. Empty
      when `list-files` is `none`. Several filters are concatenated rather than
      merged, so overlapping ones can list a file twice.
    value: ${{ steps.evaluate.outputs.files }}
  results:
    description: >
      Every paths-filter output as a JSON object, for a job that needs more than
      one answer out of a single diff:
      fromJSON(steps.<id>.outputs.results).frontend_all.
    value: ${{ steps.evaluate.outputs.results }}

runs:
  using: composite
  steps:
    # `auto` means: only clone if the filter config isn't already here. A job that
    # checked the repo out to reach this action in the first place — which a local
    # action always requires — has nothing to gain from doing it twice.
    - name: Decide whether to check out
      id: plan
      shell: bash
      env:
        FILTERS: ${{ inputs.filters }}
        CHECKOUT: ${{ inputs.checkout }}
      run: |
        set -euo pipefail
        case "$CHECKOUT" in
          true|false) needed="$CHECKOUT" ;;
          auto) if [ -f "$FILTERS" ]; then needed=false; else needed=true; fi ;;
          *) echo "::error::checkout must be one of auto, true, false (got '$CHECKOUT')" >&2; exit 1 ;;
        esac
        echo "checkout=$needed" >> "$GITHUB_OUTPUT"

    - name: Checkout repository
      if: steps.plan.outputs.checkout == 'true'
      uses: actions/checkout@v6
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Test which files changed
      id: filter
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
      with:
        token: ${{ inputs.token || github.token }}
        filters: ${{ inputs.filters }}
        list-files: ${{ inputs.list-files }}
        base: ${{ inputs.base }}

    - name: Answer the questions
      id: evaluate
      shell: bash
      env:
        RESULTS: ${{ toJSON(steps.filter.outputs) }}
        FILTERS: ${{ inputs.filters }}
        ANY_OF: ${{ inputs.any-of }}
        ALL_OF: ${{ inputs.all-of }}
        QUESTIONS: ${{ inputs.questions }}
        LIST_FILES: ${{ inputs.list-files }}
      run: |
        set -euo pipefail

        # A delimiter no file list can accidentally terminate.
        delim="ghadelim-$RANDOM$RANDOM-$$"
        emit() { printf '%s<<%s\n%s\n%s\n' "$1" "$delim" "$2" "$delim" >> "$GITHUB_OUTPUT"; }
        blank() { [ -z "${1//[[:space:]]/}" ]; }

        # Parked on disk so the jq lookups below can all read the same file.
        FILE="$RUNNER_TEMP/files-changed-results.json"
        printf '%s' "$RESULTS" | jq -c . > "$FILE"
        emit results "$(cat "$FILE")"

        if ! blank "$QUESTIONS" && { ! blank "$ANY_OF" || ! blank "$ALL_OF"; }; then
          echo "::error::Ask with questions or with any-of/all-of, not both." >&2
          exit 1
        fi

        # Filter names: `a, b`, one per line, or the `a: true` map form. Anything
        # other than `true` on the right is a typo we would rather not guess at.
        # Errors go to stderr so command substitution can't swallow them.
        parse() {
          local entry name value
          while IFS= read -r entry; do
            name="${entry%%:*}"
            value="${entry#"$name"}"
            name="$(printf '%s' "$name" | tr -d '[:space:]')"
            value="$(printf '%s' "${value#:}" | tr -d '[:space:]')"
            [ -n "$name" ] || continue
            if [ -n "$value" ] && [ "$value" != "true" ]; then
              echo "::error::Don't know what to do with the $2 entry '$entry' — write '$name' or '$name: true'." >&2
              return 1
            fi
            printf '%s\n' "$name"
          done < <(printf '%s\n' "$1" | tr ',' '\n')
        }

        # `questions` is a deliberately small YAML subset — a name, then any-of
        # and/or all-of under it, or a name with the any-of inline. Anything else
        # is rejected rather than guessed at.
        q_names=(); q_any=(); q_all=(); current=-1
        while IFS= read -r line; do
          trimmed="${line#"${line%%[![:space:]]*}"}"
          if [ -z "$trimmed" ] || [ "${trimmed:0:1}" = "#" ]; then
            continue
          fi
          if [[ "$line" =~ ^([A-Za-z0-9_-]+):[[:space:]]*$ ]]; then
            q_names+=("${BASH_REMATCH[1]}"); q_any+=(""); q_all+=("")
            current=$(( ${#q_names[@]} - 1 ))
          elif [[ "$line" =~ ^([A-Za-z0-9_-]+):[[:space:]]+(.+)$ ]]; then
            q_names+=("${BASH_REMATCH[1]}"); q_any+=("${BASH_REMATCH[2]}"); q_all+=("")
            current=$(( ${#q_names[@]} - 1 ))
          elif [[ "$line" =~ ^[[:space:]]+(any-of|all-of):[[:space:]]*(.*)$ ]]; then
            if [ "$current" -lt 0 ]; then
              echo "::error::questions: '$trimmed' is not under a question name." >&2
              exit 1
            fi
            if [ "${BASH_REMATCH[1]}" = "any-of" ]; then
              q_any[$current]="${BASH_REMATCH[2]}"
            else
              q_all[$current]="${BASH_REMATCH[2]}"
            fi
          else
            echo "::error::questions: don't know what to do with '$trimmed'." >&2
            exit 1
          fi
        done <<< "$QUESTIONS"

        # The shorthand inputs are just a single question with no name.
        if [ ${#q_names[@]} -eq 0 ]; then
          q_names=(""); q_any=("$ANY_OF"); q_all=("$ALL_OF")
        fi

        # Every filter any question mentions, in order, without repeats. Parsed in
        # one pass so a syntax error stops us before we start answering.
        combined=""
        for i in "${!q_names[@]}"; do
          combined="$combined${q_any[$i]}"$'\n'"${q_all[$i]}"$'\n'
        done
        parsed="$(parse "$combined" question)" || exit 1
        referenced=()
        while IFS= read -r name; do
          if [ -n "$name" ]; then
            referenced+=("$name")
          fi
        done < <(printf '%s\n' "$parsed" | awk 'NF && !seen[$0]++')

        if [ ${#referenced[@]} -eq 0 ]; then
          emit changed false
          emit answers "{}"
          emit files ""
          echo "Nothing asked; read the answer from the results output."
          exit 0
        fi

        # A name with no filter behind it would otherwise report false forever,
        # quietly switching off whatever job depends on it.
        missing=()
        for name in "${referenced[@]}"; do
          jq -e --arg k "$name" 'has($k)' "$FILE" >/dev/null || missing+=("$name")
        done
        if [ ${#missing[@]} -gt 0 ]; then
          echo "::error::$FILTERS defines no filter named: ${missing[*]}" >&2
          exit 1
        fi

        matched() { [ "$(jq -r --arg k "$1" '.[$k]' "$FILE")" = "true" ]; }

        # any-of is an OR, all-of an AND, and asking both means both must hold.
        answer() {
          local -a any=() all=()
          local name raw line ok=true
          raw="$(parse "$1" any-of)" || return 1
          while IFS= read -r line; do
            if [ -n "$line" ]; then any+=("$line"); fi
          done <<< "$raw"
          raw="$(parse "$2" all-of)" || return 1
          while IFS= read -r line; do
            if [ -n "$line" ]; then all+=("$line"); fi
          done <<< "$raw"

          if [ ${#any[@]} -eq 0 ] && [ ${#all[@]} -eq 0 ]; then
            printf 'false'
            return 0
          fi
          if [ ${#any[@]} -gt 0 ]; then
            ok=false
            for name in "${any[@]}"; do
              if matched "$name"; then ok=true; break; fi
            done
          fi
          if [ "$ok" = true ] && [ ${#all[@]} -gt 0 ]; then
            for name in "${all[@]}"; do
              if ! matched "$name"; then ok=false; break; fi
            done
          fi
          printf '%s' "$ok"
        }

        answers="{}"
        changed=false
        for i in "${!q_names[@]}"; do
          verdict="$(answer "${q_any[$i]}" "${q_all[$i]}")" || exit 1
          if [ "$verdict" = true ]; then
            changed=true
          fi
          if [ -n "${q_names[$i]}" ]; then
            answers="$(printf '%s' "$answers" |
              jq -c --arg k "${q_names[$i]}" --argjson v "$verdict" '.[$k] = $v')"
            echo "${q_names[$i]}=$verdict"
          fi
        done

        parts=()
        for name in "${referenced[@]}"; do
          matched_files="$(jq -r --arg k "${name}_files" '.[$k] // ""' "$FILE")"
          if [ -n "$matched_files" ] && [ "$matched_files" != "[]" ]; then
            parts+=("$matched_files")
          fi
        done

        files=""
        if [ ${#parts[@]} -gt 0 ]; then
          # Concatenate rather than merge: `shell` and `escape` values are quoted
          # for a shell, so splitting them back apart on whitespace would maul any
          # path containing a space.
          case "$LIST_FILES" in
            json) files="$(printf '%s\n' "${parts[@]}" | jq -sc 'add')" ;;
            csv) files="$(IFS=','; printf '%s' "${parts[*]}")" ;;
            *) files="$(IFS=' '; printf '%s' "${parts[*]}")" ;;
          esac
        fi

        emit changed "$changed"
        emit answers "$answers"
        emit files "$files"
        echo "changed=$changed for: ${referenced[*]}"
