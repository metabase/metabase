dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH s AS (
      WITH src AS (
        SELECT embedder AS arm, engine AS pair, scenario_id, value
        FROM harness_scenario_metric
        WHERE corpus_id = 'northwind-golden-v1' AND metric = 'ndcg@10' AND embedding_text = 'baseline' AND text_strategy = 'none'
          AND embedder IN ('ollama/all-minilm', 'ollama/snowflake-arctic-embed2')
      ), d AS (
        SELECT a.arm, a.pair, a.value, a.value - r.value AS delta
        FROM src a JOIN src r ON r.arm = 'ollama/all-minilm' AND r.pair = a.pair AND r.scenario_id = a.scenario_id
        WHERE a.arm <> 'ollama/all-minilm'
      )
      SELECT arm, pair, count(*) AS n, avg(value) AS v, avg(delta) AS mean, 1.96 * stddev_samp(delta) / sqrt(count(*)) AS ci
      FROM d GROUP BY 1, 2
      )
      SELECT pair AS "Engine",
             round(mean::numeric, 3) AS "Δ vs all-minilm", round(ci::numeric, 3) AS "± 95% CI",
             CASE WHEN n < 5 THEN 'too few questions'
                  WHEN mean - ci > 0 THEN 'arctic better'
                  WHEN mean + ci < 0 THEN 'all-minilm better'
                  ELSE 'no proven difference' END AS "Verdict",
             n AS "n questions"
      FROM s
      ORDER BY array_position(ARRAY['semantic', 'semantic-pure', 'semantic-vector', 'sqlite-vec1', 'sqlite-vec1-pure', 'lucene', 'lucene-pure', 'appdb', 'in-place'], pair)
    lib/type: mbql.stage/native
  lib/type: mbql/query
