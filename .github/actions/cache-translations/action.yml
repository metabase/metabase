name: Cache translation catalogs
description: Restore and save the translation catalogs pinned in locales/metabase-i18n.commit.
runs:
  using: composite
  steps:
    - name: Cache translation catalogs
      if: hashFiles('locales/metabase-i18n.commit') != ''
      uses: actions/cache@v5
      with:
        path: locales/metabase-i18n
        key: i18n-catalogs-${{ hashFiles('locales/metabase-i18n.commit') }}
