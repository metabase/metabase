## Views of Tables and Fields as each remote sync worktree sees them, with the values its users set.

databaseChangeLog:
  - changeSet:
      id: wtw17vt
      author: ranquild
      comment: Add v_worktree_table, a row of metabase_table for each worktree with the values set in its metabase_table_user_settings, and its worktree_id
      changes:
        - sqlFile:
            path: ../worktree_views/table/v1/worktree_table.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: DROP VIEW v_worktree_table
  - changeSet:
      id: wtw18vf
      author: ranquild
      comment: Add v_worktree_field, a row of metabase_field for each worktree with the values set in its metabase_field_user_settings, and its worktree_id
      changes:
        - sqlFile:
            path: ../worktree_views/field/v1/worktree_field.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: DROP VIEW v_worktree_field
