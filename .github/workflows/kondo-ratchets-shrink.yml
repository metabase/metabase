name: Shrink ratchets

# Lowers the budgets in .clj-kondo/ratchets.edn to match master and delivers the result through one
# automation PR, because the rulesets require a pull request for every change to master. A merge of that
# PR touches only ratchets.edn, which matches `.clj-kondo/**` below, so it triggers one more run that
# finds nothing to lower and stops: a single no-op, not a loop.

on:
  push:
    branches: [master]
    paths:
      - "**.clj"
      - "**.cljc"
      - "**.cljs"
      - ".clj-kondo/**"
      - "bb.edn"
  workflow_dispatch:

# pull-requests: read lets the compare step ask whether the automation PR is still open with the
# default token; everything that writes uses the automation user's token in the last step.
permissions:
  contents: read
  pull-requests: read

# Overlapping master pushes converge: the newest run cancels the older one, recomputes from the master it
# checked out, and force-updates the automation branch, so the PR always reflects one master commit.
concurrency:
  group: kondo-ratchets-shrink
  cancel-in-progress: true

env:
  AUTOMATION_BRANCH: automation/shrink-ratchets
  RATCHETS_FILE: .clj-kondo/ratchets.edn

jobs:
  shrink:
    name: Shrink ratchets
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    steps:
      # `ref: master` checks out the branch head at checkout time rather than the pushed commit, so a run
      # that queued behind another one starts from the newest master it can see.
      - uses: actions/checkout@v6
        with:
          ref: master
      - name: Set up Java for cold dependency resolution
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: 25
      - name: Shrink ignore limits
        run: ./bin/mage fix-kondo-ratchets
      - name: Compare with master and the automation PR
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- "$RATCHETS_FILE"; then
            echo "Ratchets are already tight on master $(git rev-parse --short HEAD)"
            echo "deliver=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only an open PR counts. A branch left behind by a PR closed without merging is overwritten
          # below and gets a new PR, so a closed one never stops the budgets from being lowered.
          open_pr=$(gh pr list --head "$AUTOMATION_BRANCH" --base master --state open \
            --json number --jq '.[0].number // empty')
          echo "pr=$open_pr" >> "$GITHUB_OUTPUT"

          # The automation branch holds exactly one commit on top of some earlier master. Depth 2 fetches
          # that commit and its master parent, which is all the comparison below needs.
          if [ -n "$open_pr" ] \
             && git fetch --quiet --depth=2 origin "refs/heads/$AUTOMATION_BRANCH" 2>/dev/null \
             && git diff --quiet FETCH_HEAD -- "$RATCHETS_FILE" \
             && git diff --quiet FETCH_HEAD^ HEAD -- "$RATCHETS_FILE"; then
            echo "The automation PR #$open_pr already carries this result; master has not touched $RATCHETS_FILE since"
            echo "deliver=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --stat -- "$RATCHETS_FILE"
          echo "deliver=true" >> "$GITHUB_OUTPUT"
      - name: Update the automation PR
        if: steps.compare.outputs.deliver == 'true'
        # The automation user's token is needed here and only here: a branch pushed with GITHUB_TOKEN
        # starts no pull_request workflows, so the PR would never get its checks, and the PR is opened as
        # that user. Nothing raises a budget and nothing bypasses review; the PR merges like any other.
        env:
          GH_TOKEN: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}
        run: |
          git config user.name "Metabase Automation"
          git config user.email "github-automation@metabase.com"
          git add -- "$RATCHETS_FILE"
          git commit --quiet -m "Tighten ratchets"
          git push --force --quiet \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$AUTOMATION_BRANCH"

          existing=$(gh pr list --head "$AUTOMATION_BRANCH" --base master --state open \
            --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Updated the automation PR #$existing"
            exit 0
          fi

          gh pr create \
            --base master \
            --head "$AUTOMATION_BRANCH" \
            --title "Tighten ratchets" \
            --label "no-backport" \
            --body "\`./bin/mage fix-kondo-ratchets\` lowered \`$RATCHETS_FILE\` to match master.
          The shrink workflow force-updates this branch from master whenever the result changes, so the
          diff is always one commit on top of a recent master. Merge it to land the lower budgets; nothing
          is raised."
