name: Decide which jobs should run

on:
  workflow_call:
    outputs:
      plan:
        description: >-
          The CI test plan, as JSON. Every downstream job gates on it.
        value: ${{ jobs.test-plan.outputs.plan }}
      frontend-plan-id:
        description: >-
          Artifact ID of the frontend test plan, consumed by the frontend and
          loki workflows.
        value: ${{ jobs.frontend-test-plan.outputs.frontend-plan-id }}
      stats:
        description: >-
          Affected-tests stats, as JSON, uploaded to eng-stats.
        value: ${{ jobs.frontend-test-plan.outputs.stats }}
      static_viz:
        description: >-
          Whether static-viz sources changed.
        value: ${{ jobs.static-viz.outputs.static_viz }}

jobs:
  test-plan:
    name: Create test plan
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.decide.outputs.plan }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-node-bun

      - name: Create test plan
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR" ]; then
            bun .github/scripts/test-plan.ts create --pr "$PR" --repo "$GITHUB_REPOSITORY"
          else
            bun .github/scripts/test-plan.ts create \
              --event "$GITHUB_EVENT_NAME" \
              --ref "$GITHUB_REF_NAME" \
              --base "$BEFORE"
          fi

  frontend-test-plan:
    name: Create frontend test plan
    needs: [test-plan]
    if: ${{ fromJSON(needs.test-plan.outputs.plan).workflows.should-run.jobs.frontend-test-plan.run }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 10
    outputs:
      frontend-plan-id: ${{ steps.compute.outputs.artifact-id }}
      stats: ${{ steps.compute.outputs.stats }}
    steps:
      - uses: actions/checkout@v6

      - name: Test which files changed
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          token: ${{ github.token }}
          # comma separated list of files
          list-files: csv
          filters: .github/file-paths.yaml

      - name: Create test plan
        id: compute
        uses: ./.github/actions/create-test-plan
        with:
          changed-files: ${{ steps.changes.outputs.all_changed_files }}
          fe-changed-files: ${{ steps.changes.outputs.frontend_sources_files }}
          be-changed-files: ${{ steps.changes.outputs.backend_sources_files }}
          unit-infra-touched: ${{ steps.changes.outputs.frontend_unit_infra }}
          loki-infra-touched: ${{ steps.changes.outputs.frontend_loki_infra }}
          e2e-infra-touched: ${{ steps.changes.outputs.e2e_infra }}
          shared-sources-touched: ${{ steps.changes.outputs.shared_sources }}

  static-viz:
    name: Check static viz
    needs: [test-plan]
    if: ${{ fromJSON(needs.test-plan.outputs.plan).workflows.should-run.jobs.static-viz.run }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 10
    outputs:
      static_viz: ${{ steps.static_viz.outputs.static_viz }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-frontend
      - uses: ./.github/actions/prepare-backend

      - name: Build static-viz frontend
        run: bun run build-static-viz
        env:
          MB_EDITION: ee

      - name: Check for static viz changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: static_viz
        with:
          token: ${{ github.token }}
          filters: .github/static-viz-sources.yaml
