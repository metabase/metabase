name: Run tests

on:
  push:
    branches:
      - "master"
      - "release-**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  should-run:
    name: Decide which jobs should run
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.decide.outputs.plan }}
      frontend-plan-id: ${{ steps.compute.outputs.artifact-id }}
      stats: ${{ steps.compute.outputs.stats }}
      static_viz: ${{ steps.static_viz.outputs.static_viz }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/prepare-frontend
      - uses: ./.github/actions/prepare-backend

      - name: Create test plan
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR" ]; then
            bun .github/scripts/test-plan.ts create --pr "$PR" --repo "$GITHUB_REPOSITORY"
          else
            bun .github/scripts/test-plan.ts create \
              --event "$GITHUB_EVENT_NAME" \
              --ref "$GITHUB_REF_NAME" \
              --base "$BEFORE"
          fi

      # TODO: update create-test-plan to use file-paths script instead of separate dorny/paths-filter call
      - name: Test which files changed
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          token: ${{ github.token }}
          # comma separated list of files
          list-files: csv
          filters: .github/file-paths.yaml

      # TODO: see if this can be a single script so we can run in parallel instead of as a composite action   
      - name: Create test plan
        id: compute
        uses: ./.github/actions/create-test-plan
        with:
          changed-files: ${{ steps.changes.outputs.all_changed_files }}
          fe-changed-files: ${{ steps.changes.outputs.frontend_sources_files }}
          be-changed-files: ${{ steps.changes.outputs.backend_sources_files }}
          unit-infra-touched: ${{ steps.changes.outputs.frontend_unit_infra }}
          loki-infra-touched: ${{ steps.changes.outputs.frontend_loki_infra }}
          e2e-infra-touched: ${{ steps.changes.outputs.e2e_infra }}
          shared-sources-touched: ${{ steps.changes.outputs.shared_sources }}
      
      # TODO: this needs to be wired into test plan somehow, also need to avoid ~1 minute of build time it adds.     
      - name: Build static-viz frontend
        run: bun run build-static-viz
        env:
          MB_EDITION: ee
      
      # TODO: update static-viz check/build to use file-paths script instead of separate dorny/paths-filter call
      - name: Check for static viz changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: static_viz
        with:
          token: ${{ github.token }}
          filters: .github/static-viz-sources.yaml

  upload-affected-tests-stats:
    needs: [should-run]
    # don't let forks pollute the data
    if: ${{ github.event.pull_request.head.repo.full_name == 'metabase/metabase' }}
    continue-on-error: true
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-node-bun
      - name: Upload affected tests stats
        env:
          STATS_JSON: ${{ needs.should-run.outputs.stats }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ENG_STATS_URL: ${{ secrets.ENG_STATS_URL }}
          API_KEY: ${{ secrets.ENG_STATS_API_KEY }}
        run: bun .github/scripts/upload-affected-tests-stats.ts

  uberjar:
    needs: [should-run]
    uses: ./.github/workflows/uberjar.yml
    secrets: inherit
    with:
      plan: ${{ needs.should-run.outputs.plan }}

  containerize:
    needs: [should-run, uberjar]
    if: ${{ fromJSON(needs.should-run.outputs.plan).workflows.run-tests.jobs.containerize.run }}
    name: containerize (${{ matrix.edition }})
    strategy:
      matrix:
        edition: ['ee', 'oss']
    uses: ./.github/workflows/containerize-jar.yml
    secrets: inherit
    with:
      plan: ${{ needs.should-run.outputs.plan }}
      build-args: |
        GIT_COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      edition: ${{ matrix.edition }}
      release: false

  e2e-cljs:
    name: Compile CLJS for e2e
    needs: [should-run]
    if: ${{ fromJSON(needs.should-run.outputs.plan).workflows.run-tests.jobs.e2e-cljs.run }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - name: Compile CLJS
        run: bun run build-pure:cljs
      - name: Upload compiled CLJS
        uses: actions/upload-artifact@v7
        with:
          name: e2e-cljs-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cljs_dev
          if-no-files-found: error
          overwrite: true

  backend-tests:
    needs: [should-run]
    uses: ./.github/workflows/backend.yml
    secrets: inherit
    with:
      plan: ${{ needs.should-run.outputs.plan }}

  semantic-search-tests:
    needs: [should-run]
    uses: ./.github/workflows/semantic-search.yml
    secrets: inherit
    with:
      plan: ${{ needs.should-run.outputs.plan }}

  app-db-tests:
    needs: [should-run]
    uses: ./.github/workflows/app-db.yml
    secrets: inherit
    with:
      plan: ${{ needs.should-run.outputs.plan }}

  driver-tests:
    needs: [should-run]
    uses: ./.github/workflows/drivers.yml
    secrets: inherit
    with:
      plan: ${{ needs.should-run.outputs.plan }}

  frontend-tests:
    needs: [should-run]
    uses: ./.github/workflows/frontend.yml
    secrets: inherit
    with:
      plan: ${{ needs.should-run.outputs.plan }}
      test-plan-artifact-id: ${{ needs.should-run.outputs.frontend-plan-id }}

  loki-tests:
    needs: [should-run]
    uses: ./.github/workflows/loki.yml
    with:
      plan: ${{ needs.should-run.outputs.plan }}
      test-plan-artifact-id: ${{ needs.should-run.outputs.frontend-plan-id }}

  e2e-tests:
    needs: [should-run, uberjar]
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit
    with:
      plan: ${{ needs.should-run.outputs.plan }}

  sdk-tests:
    needs: [should-run, uberjar]
    uses: ./.github/workflows/embedding-sdk.yml
    secrets: inherit
    with:
      plan: ${{ needs.should-run.outputs.plan }}

  build-scripts-tests:
    needs: [should-run]
    uses: ./.github/workflows/build-scripts.yml
    secrets: inherit
    with:
      plan: ${{ needs.should-run.outputs.plan }}

  bundle-size:
    needs: [should-run, uberjar]
    if: ${{ fromJSON(needs.should-run.outputs.plan).workflows.run-tests.jobs.bundle-size.run }}
    uses: ./.github/workflows/bundle-size.yml
    secrets: inherit
    with:
      plan: ${{ needs.should-run.outputs.plan }}
