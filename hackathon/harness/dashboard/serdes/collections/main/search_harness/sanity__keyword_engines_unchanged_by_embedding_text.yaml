dataset_query:
  database: Search Harness
  stages:
  - native: |-
      SELECT l.engine AS "Engine", l.embedding_text AS "Embedding text", count(*) AS "Scenarios",
             count(*) FILTER (WHERE l.top10 IS DISTINCT FROM b.top10) AS "Top-10 differs"
      FROM harness_latest_list l
      JOIN harness_latest_list b
        ON b.corpus_id = l.corpus_id AND b.data_scale IS NOT DISTINCT FROM l.data_scale AND b.embedder = l.embedder
       AND b.text_strategy = l.text_strategy
       AND b.engine = l.engine AND b.scenario_id = l.scenario_id AND b.embedding_text = 'baseline'
      WHERE l.corpus_id = {{corpus}} AND l.embedding_text <> 'baseline' AND l.engine IN ('appdb', 'in-place')
        [[AND (l.data_scale = {{scale}} OR l.data_scale IS NULL)]]
        [[AND l.embedder = {{embedder}}]]
        AND l.text_strategy = {{strategy}}
      GROUP BY 1, 2
      ORDER BY 1, 2
    template-tags:
    - default: northwind-golden-v1
      display-name: Corpus
