## Keep sandboxes in the main app, shared across remote sync worktrees as data permissions are, so that a sandbox and
## the data permission of its group never come from different worktrees, and let a sandbox name only a main app card.
## Metabot prompts and tenants, which stay in the main app too, likewise name only a main app card and collection.

databaseChangeLog:
  - changeSet:
      id: usbx1del
      author: ranquild
      comment: Delete the sandboxes of remote sync worktrees other than the main app
      changes:
        - sql:
            sql: DELETE FROM sandboxes WHERE worktree_id <> 1
      rollback:
  - changeSet:
      id: usbx2uq
      author: ranquild
      comment: Make a sandbox unique per table and group again
      changes:
        - sql:
            dbms: postgresql
            sql: ALTER TABLE sandboxes DROP CONSTRAINT unique_gtap_table_id_group_id, ADD CONSTRAINT unique_gtap_table_id_group_id UNIQUE (table_id, group_id)
        - sql:
            dbms: mysql,mariadb
            sql: ALTER TABLE sandboxes DROP INDEX unique_gtap_table_id_group_id, ADD CONSTRAINT unique_gtap_table_id_group_id UNIQUE (table_id, group_id)
        - sql:
            dbms: h2
            sql: >-
              ALTER TABLE sandboxes DROP CONSTRAINT unique_gtap_table_id_group_id;
              ALTER TABLE sandboxes ADD CONSTRAINT unique_gtap_table_id_group_id UNIQUE (table_id, group_id)
      rollback:
        - sql:
            dbms: postgresql
            sql: ALTER TABLE sandboxes DROP CONSTRAINT unique_gtap_table_id_group_id, ADD CONSTRAINT unique_gtap_table_id_group_id UNIQUE (table_id, group_id, worktree_id)
        - sql:
            dbms: mysql,mariadb
            sql: ALTER TABLE sandboxes DROP INDEX unique_gtap_table_id_group_id, ADD CONSTRAINT unique_gtap_table_id_group_id UNIQUE (table_id, group_id, worktree_id)
        - sql:
            dbms: h2
            sql: >-
              ALTER TABLE sandboxes DROP CONSTRAINT unique_gtap_table_id_group_id;
              ALTER TABLE sandboxes ADD CONSTRAINT unique_gtap_table_id_group_id UNIQUE (table_id, group_id, worktree_id)
  - changeSet:
      id: usbx3ix
      author: ranquild
      comment: Index the worktree and card of a sandbox for the foreign key to the card of the main app
      changes:
        - createIndex:
            tableName: sandboxes
            indexName: idx_sandboxes_card_wt
            columns:
              - column:
                  name: worktree_id
              - column:
                  name: card_id
  - changeSet:
      id: usbx4fk
      author: ranquild
      comment: Make the card of a sandbox, always of the main app, a card of the main app
      changes:
        - addForeignKeyConstraint:
            baseTableName: sandboxes
            baseColumnNames: worktree_id, card_id
            referencedTableName: report_card
            referencedColumnNames: worktree_id, id
            constraintName: fk_sandboxes_card_wt
            onDelete: CASCADE
  - changeSet:
      id: umbp1co
      author: ranquild
      comment: Add worktree_id to metabot_prompt, always the main app's, for the foreign key to a main app report_card
      changes:
        - addColumn:
            tableName: metabot_prompt
            columns:
              - column:
                  name: worktree_id
                  type: INTEGER
                  defaultValueNumeric: 1
                  remarks: The remote sync worktree of the report_card the row names, always 1, the main app
                  constraints:
                    nullable: false
  - changeSet:
      id: umbp2ix
      author: ranquild
      comment: Index the worktree and card_id of metabot_prompt for the foreign key to a main app report_card
      changes:
        - createIndex:
            tableName: metabot_prompt
            indexName: idx_metabot_prompt_card_wt
            columns:
              - column:
                  name: worktree_id
              - column:
                  name: card_id
  - changeSet:
      id: umbp3fk
      author: ranquild
      comment: Make the card_id of metabot_prompt, always of the main app, a report_card of the main app
      changes:
        - addForeignKeyConstraint:
            baseTableName: metabot_prompt
            baseColumnNames: worktree_id, card_id
            referencedTableName: report_card
            referencedColumnNames: worktree_id, id
            constraintName: fk_metabot_prompt_card_wt
            onDelete: CASCADE
  - changeSet:
      id: utnt1co
      author: ranquild
      comment: Add worktree_id to tenant, always the main app's, for the foreign key to a main app collection
      changes:
        - addColumn:
            tableName: tenant
            columns:
              - column:
                  name: worktree_id
                  type: INTEGER
                  defaultValueNumeric: 1
                  remarks: The remote sync worktree of the collection the row names, always 1, the main app
                  constraints:
                    nullable: false
  - changeSet:
      id: utnt2ix
      author: ranquild
      comment: Index the worktree and tenant_collection_id of tenant for the foreign key to a main app collection
      changes:
        - createIndex:
            tableName: tenant
            indexName: idx_tenant_tenant_collection_wt
            columns:
              - column:
                  name: worktree_id
              - column:
                  name: tenant_collection_id
  - changeSet:
      id: utnt3fk
      author: ranquild
      comment: Make the tenant_collection_id of tenant, always of the main app, a collection of the main app
      changes:
        - addForeignKeyConstraint:
            baseTableName: tenant
            baseColumnNames: worktree_id, tenant_collection_id
            referencedTableName: collection
            referencedColumnNames: worktree_id, id
            constraintName: fk_tenant_tenant_collection_wt
