name: Backend

on:
  workflow_call:

  # Run the backend test suite on demand, against the ref you dispatch on, optionally under a
  # profiler. Everything else about the jobs -- matrix legs, tag filters, quarantine gating -- is
  # whatever the normal CI run uses, because they are the same jobs.
  workflow_dispatch:
    inputs:
      tests:
        description: 'Optional: run only these tests, comma- or space-separated, e.g. metabase.query-processor-test/some-test. Bare namespaces work too. Blank runs each leg''s usual set.'
        type: string
        required: false
        default: ''
      profile:
        description: 'Profile the test run and attach a flamegraph to the job. Adds sampling overhead.'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-backend
  cancel-in-progress: true

# Exposed to the test jobs so they can report failures to ci-conductor
# (secrets: inherit is already set on the backend call in run-tests.yml).
# See DEV-2224.
env:
  CI_CONDUCTOR_BASE_URL: ${{ vars.CI_CONDUCTOR_BASE_URL }}
  CI_CONDUCTOR_WEBHOOK_SECRET: ${{ secrets.CI_CONDUCTOR_WEBHOOK_SECRET }}
  # Both read by the be-tests run step below. Set here rather than passed per job so that turning
  # either on is one line. Empty (and so off) on workflow_call, where neither input exists.
  #
  # ONLY_TESTS replaces the leg's own test selection, so every matrix leg runs the whole list: the
  # partition args no longer apply, and legs that hold none of the named tests run nothing.
  PROFILE_TESTS: ${{ inputs.profile }}
  ONLY_TESTS: ${{ inputs.tests }}

jobs:
  # The shared verdict, the static-viz probe and the backend plan, in one job:
  # `.github/scripts/gate/backend.ts` turns them into what each job runs -- a `strategy.matrix`, or
  # nothing at all -- so those jobs carry a single condition and everything else is decided here.
  # The script is a plain module, unit tested by the ci-scripts jest project.
  gate:
    name: Decide whether to run
    # The static-viz probe builds the frontend, so this is not a slim-runner job.
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    outputs:
      project-checks: ${{ steps.plan.outputs.project-checks }}
      project-checks-backend: ${{ steps.plan.outputs.project-checks-backend }}
      project-checks-migrations: ${{ steps.plan.outputs.project-checks-migrations }}
      project-checks-ratchets: ${{ steps.plan.outputs.project-checks-ratchets }}
      be-linter-clj-kondo: ${{ steps.plan.outputs.be-linter-clj-kondo }}
      be-linter-eastwood: ${{ steps.plan.outputs.be-linter-eastwood }}
      be-linter-eastwood-test: ${{ steps.plan.outputs.be-linter-eastwood-test }}
      be-linter-eastwood-test-changed: ${{ steps.plan.outputs.be-linter-eastwood-test-changed }}
      be-check: ${{ steps.plan.outputs.be-check }}
      be-cljfmt: ${{ steps.plan.outputs.be-cljfmt }}
      be-tests: ${{ steps.plan.outputs.be-tests }}
    steps:
      - uses: actions/checkout@v6
      - name: Apply the shared gate
        id: base
        uses: ./.github/actions/test-gate
        with:
          filters: >-
            backend_all project_backend_checks project_migration_checks project_ratchet_checks

      # Generated static-viz output can shift without any backend source changing, so the suite
      # follows it too. Building it is expensive and only ever turns the suite on, so the probe is
      # skipped whenever something has already decided the suite runs.
      - name: Decide whether to probe static-viz
        id: probe
        env:
          PROBE: >-
            ${{ steps.base.outputs.verdict == 'defer'
            && !contains(fromJSON(steps.base.outputs.matched), 'backend_all') }}
        run: echo "probe=$PROBE" | tee -a "$GITHUB_OUTPUT"
      - name: Prepare front-end environment
        if: ${{ steps.probe.outputs.probe == 'true' }}
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        if: ${{ steps.probe.outputs.probe == 'true' }}
        uses: ./.github/actions/prepare-backend
      - name: Build static-viz frontend
        if: ${{ steps.probe.outputs.probe == 'true' }}
        run: bun run build-static-viz
        env:
          MB_EDITION: ee
      - name: Check for static viz changes
        if: ${{ steps.probe.outputs.probe == 'true' }}
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: static-viz
        with:
          token: ${{ github.token }}
          filters: .github/static-viz-sources.yaml

      - name: Prepare Node + Bun environment
        uses: ./.github/actions/prepare-node-bun
      - name: Plan the backend jobs
        id: plan
        env:
          MATCHED: ${{ steps.base.outputs.matched }}
          FORCE_RUN: ${{ steps.base.outputs.force-run }}
          STATIC_VIZ: ${{ steps.static-viz.outputs.static_viz }}
          EVENT_NAME: ${{ github.event_name }}
        run: bun .github/scripts/gate/backend.ts

  project-checks:
    name: 'Project tests: Suites'
    needs: gate
    if: ${{ needs.gate.outputs.project-checks != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      # Bootstrap the shared Mage runtime before concurrent commands try to install it themselves.
      - name: Prepare Mage
        run: ./bin/mage
      - parallel:
        - name: Run backend checks
          if: ${{ needs.gate.outputs.project-checks-backend != '' }}
          run: ./bin/mage project-tests backend
        - name: Run migration checks
          if: ${{ needs.gate.outputs.project-checks-migrations != '' }}
          run: ./bin/mage project-tests migrations
        # Babashka, not a JVM test run, so it is cheap enough to run alongside the backend checks.
        # It still needs the JDK prepare-backend installs, to resolve clj-kondo on a cold cache.
        - name: Run ratchet checks
          if: ${{ needs.gate.outputs.project-checks-ratchets != '' }}
          run: ./bin/mage kondo-ratchets

  project-tests:
    name: Project tests
    needs: project-checks
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
      - name: Check Project tests status
        uses: actions/github-script@v9
        env:
          needs: ${{ toJson(needs) }}
        with:
          script: | # js
            const needs = JSON.parse(process.env.needs);
            const jobs = Object.entries(needs).map(
              ([jobName, jobValues]) => ({
                name: jobName,
                result: jobValues.result
              }));

            if (jobs.every(job => job.result === 'skipped' || job.result === 'success')) {
              console.log('');
              console.log('          |>>>             |>>>             |>>>');
              console.log('          |                |                |');
              console.log('      _  _|_  _        _  _|_  _        _  _|_  _');
              console.log('     | |_| |_| |______| |_| |_| |______| |_| |_| |');
              console.log('     |         |      |         |      |         |');
              console.log('     | []   [] |      | []   [] |      | []   [] |');
              console.log('     |         |______|         |______|         |');
              console.log('     |                    ___                    |');
              console.log('     |___________________|   |___________________|');
              console.log('                         |___|');
              console.log('');
              console.log('Everything is up to code and structurally sound.');
              process.exit(0);
            }

            console.log('');
            console.log('              .-===========-.____');
            console.log('             /_______________\\   \\____');
            console.log('            |  .-----------.  |        \\___');
            console.log('            |  |  x     x  |  |            \\__');
            console.log('            |  |     ~     |  |              _\\_');
            console.log("            |  `-----------'  |             /___\\");
            console.log('            |    o     o      |');
            console.log("            `-----------------'");
            console.log('              /=============\\');
            console.log('             / O O O O O O O \\');
            console.log('             \\_______________/');
            console.log('');
            console.log('One or more project checks are off the blueprint. Hard hats required.');

            jobs.forEach((job) => {
              if (job.result !== 'success' && job.result !== 'skipped') {
                console.log(`${job.name} - ${job.result}`);
              }
            });

            process.exit(1);

  be-linter-clj-kondo:
    needs: gate
    if: ${{ needs.gate.outputs.be-linter-clj-kondo != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    name: Clj-Kondo
    steps:
      - uses: actions/checkout@v6
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - name: Run clj-kondo
        run: ./bin/mage kondo

  be-linter-eastwood:
    needs: gate
    if: ${{ needs.gate.outputs.be-linter-eastwood != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 20
    name: Eastwood
    steps:
      - uses: actions/checkout@v6
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - run: clojure -X:dev:ee:ee-dev:drivers:drivers-dev:test:eastwood
        name: Run Eastwood linter

  be-linter-eastwood-test:
    needs: gate
    if: ${{ needs.gate.outputs.be-linter-eastwood-test != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 45
    name: Eastwood (tests only)
    steps:
      - uses: actions/checkout@v6
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - run: clojure -X:dev:dev/test:ee:ee-dev:drivers:drivers-dev:test:eastwood/test
        name: Run Eastwood linter on our backend tests

  be-linter-eastwood-test-changed:
    needs: gate
    if: ${{ needs.gate.outputs.be-linter-eastwood-test-changed != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    name: Eastwood (changed tests only)
    steps:
      - uses: actions/checkout@v6
        with:
          # Enough history for `git merge-base` on a typical PR.
          fetch-depth: 200
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - name: Compute changed test namespaces
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Diff from the merge-base so changes that landed on the base branch after the PR was
          # last synced don't widen our scope. Falls back to BASE_SHA if older than fetched depth.
          git fetch --no-tags --depth=200 origin "$BASE_SHA"
          DIFF_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "$BASE_SHA")
          # Test roots we lint: core, EE, dev/test, and each driver module's test tree.
          # :eastwood/test derives matching :source-paths from the classpath, so any
          # namespace we name here is reachable. Include renames (R) so a test that
          # was just renamed still gets linted under its new name.
          FILES=$(git diff --name-only --diff-filter=AMR "$DIFF_BASE" "$HEAD_SHA" \
                    -- 'test/**/*.clj' 'test/**/*.cljc' \
                       'enterprise/backend/test/**/*.clj' 'enterprise/backend/test/**/*.cljc' \
                       'dev/test/**/*.clj' 'dev/test/**/*.cljc' \
                       'modules/drivers/**/test/**/*.clj' 'modules/drivers/**/test/**/*.cljc')

          if [ -z "$FILES" ]; then
            echo "No backend test files changed; skipping lint."
            echo "namespaces=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Defence-in-depth: paths flow into a subsequent shell command via $GITHUB_OUTPUT.
          if grep -Eqv '^[A-Za-z0-9_./-]+$' <<<"$FILES"; then
            echo "Refusing to lint: unexpected characters in changed file paths:" >&2
            echo "$FILES" >&2
            exit 1
          fi

          # Convert each test path to a Clojure namespace: strip its known test root and
          # extension, then translate path separators and underscores. Keep these roots
          # aligned with FILES above and the Eastwood classpath aliases below.
          NS=$(sed -E \
                 -e 's#^(test/|enterprise/backend/test/|dev/test/|modules/drivers/[^/]+/test/)##' \
                 -e 's#\.cljc?$##' \
                 -e 's#/#.#g' \
                 -e 's#_#-#g' <<<"$FILES" \
                 | sort -u \
                 | paste -sd' ' -)
          echo "Changed test namespaces: $NS"
          echo "namespaces=$NS" >> "$GITHUB_OUTPUT"
      - name: Run Eastwood on changed test namespaces
        if: steps.changed.outputs.namespaces != ''
        env:
          NAMESPACES: ${{ steps.changed.outputs.namespaces }}
        run: clojure -X:dev:dev/test:ee:ee-dev:drivers:drivers-dev:test:eastwood/test :namespaces "[$NAMESPACES]"

  be-tests:
    needs: gate
    if: ${{ needs.gate.outputs.be-tests != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.be-tests) }}
    name: "Java ${{ matrix.java-version }} ${{ matrix.job.name }}"
    env:
      # __ADDITIONAL_EXCLUDED_TAG__: ${{ !inputs.force-run && ':mb/old-migrations-test' || '' }}
      # GDGT-3126: re-enable and properly fix old migrations tests
      __ADDITIONAL_EXCLUDED_TAG__: ':mb/old-migrations-test'
    steps:
      - uses: actions/checkout@v6
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
        with:
          java-version: "${{ matrix.java-version }}"
      - name: Build static-viz frontend
        run: bun run build-static-viz
        env:
          MB_EDITION: ${{ matrix.job.edition }}

      - name: Resolve current job id
        # Resolve JOB_ID before the long test step so the ci-conductor reporter
        # below can link failures to this exact job. Best-effort.
        uses: ./.github/actions/resolve-job-id

      # Granular rerun: on a re-run of a failed job, restore the list of tests
      # that failed on the previous attempt (uploaded below) so the test step
      # can target only those instead of the whole partition. Best-effort: a
      # missing/empty artifact leaves no file and the run falls back to the full
      # partition. First attempts skip this entirely.
      #
      # Scoped to the IMMEDIATELY preceding attempt: an attempt that passed, or
      # that failed with nothing attributable to a var, uploads no artifact, and
      # a narrow set must not outlive it. Reading `attempt - 1` means "only what
      # the last attempt actually recorded" — anything else falls back to the
      # full partition. Workflow expressions have no arithmetic, so the shell
      # computes it.
      - name: Resolve previous attempt
        if: ${{ github.run_attempt != '1' }}
        run: echo "RERUN_PREV_ATTEMPT=$((GITHUB_RUN_ATTEMPT - 1))" >> "$GITHUB_ENV"

      # `pattern` (not `name`) because the artifact is legitimately absent whenever the
      # previous attempt recorded nothing: `name` treats that as an error, `pattern`
      # downloads nothing and moves on. The value is a literal — no glob metacharacters —
      # so it matches exactly one artifact, which lands at `target/failed-tests`. A pattern
      # that ever matched two would nest them under their artifact names instead, leaving
      # the file absent and falling back to the full partition.
      - name: Restore previously-failed tests
        if: ${{ github.run_attempt != '1' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: failed-tests-be-tests-java-${{ matrix.java-version }}-${{ matrix.job.test-group-name }}-attempt-${{ env.RERUN_PREV_ATTEMPT }}
          path: target

      - name: "Test Java ${{ matrix.java-version }} ${{ matrix.job.name }}"
        id: run-java-tests
        # On a rerun with a non-empty failed-tests file, target only those vars
        # via hawk `:only`, dropping the tag/partition args — the listed vars are
        # exactly this job's failures, already filtered and partitioned on the
        # first attempt. Otherwise run exactly as before. Quote the file so the
        # whole `[ns/var ...]` vector reaches clojure -X as a single argument.
        run: |
          BASE="clojure -X:dev:ci:test:${{ matrix.job.edition }}:${{ matrix.job.edition }}-dev"
          # `:profile-tests` overrides `:test`'s exec-fn, so it has to come last. See dev.profile-tests.
          # The `profiled` output is what the collection steps below key off, so that the decision is
          # recorded by the step that acts on it rather than re-derived from the environment.
          if [ "$PROFILE_TESTS" = "true" ]; then
            echo "Profiling this run; a flamegraph will be attached to the job."
            echo "profiled=true" >> "$GITHUB_OUTPUT"
            BASE="$BASE:profile-tests"
          fi
          # An explicit selection wins over the rerun narrowing below: it was asked for by hand, on this
          # attempt. Names may be separated by commas or spaces; hawk wants them as one vector argument.
          if [ -n "$ONLY_TESTS" ]; then
            ONLY="[$(echo "$ONLY_TESTS" | tr ',' ' ')]"
            echo "Running only: $ONLY"
            $BASE :only "$ONLY"
          elif [ "${{ github.run_attempt }}" != "1" ] && [ -s target/failed-tests ]; then
            echo "Granular rerun of previously-failed tests: $(cat target/failed-tests)"
            $BASE :only "$(cat target/failed-tests)"
          else
            $BASE :exclude-tags '[:mb/driver-tests ${{ env.__ADDITIONAL_EXCLUDED_TAG__ }}]' ${{ matrix.job.test-args }}
          fi
        # Keep this step continue-on-error because the quarantine logic controls whether it ultimately fails.
        continue-on-error: true

      - name: Collect profile
        if: ${{ !cancelled() }}
        uses: ./.github/actions/collect-profile
        with:
          profiled: ${{ steps.run-java-tests.outputs.profiled }}
          artifact-name: profile-be-tests-java-${{ matrix.java-version }}-${{ matrix.job.test-group-name }}

      - name: Report failed tests to ci-conductor
        if: ${{ !cancelled() && ( steps.run-java-tests.outcome == 'failure' || github.run_attempt != '1' ) }}
        # This step should NEVER fail the job!
        continue-on-error: true
        uses: ./.github/actions/report-failures-to-ci-conductor
        with:
          test-suite: be-tests-java-${{ matrix.java-version }}-${{ matrix.job.test-group-name }}
          adapter: backend

      # Granular rerun: record which tests failed so a re-run of this job targets
      # only those (restored above). Reuses the backend JUnit adapter from the
      # ci-conductor sources the report step just prepared. Best-effort: writes
      # nothing unless every failure is attributable to a var, so an
      # unattributable failure falls back to a full partition rerun.
      - name: Collect failed tests for rerun
        if: ${{ !cancelled() && steps.run-java-tests.outcome == 'failure' }}
        continue-on-error: true
        # Clear the restored set first, so a collector that dies before deciding
        # can't leave the previous attempt's file to be uploaded as this one's.
        run: |
          rm -f target/failed-tests
          bun release/ci-conductor/src/collect-failed-backend.ts

      - name: Upload failed tests for rerun
        if: ${{ !cancelled() && steps.run-java-tests.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: failed-tests-be-tests-java-${{ matrix.java-version }}-${{ matrix.job.test-group-name }}-attempt-${{ github.run_attempt }}
          path: target/failed-tests
          if-no-files-found: ignore

      - name: Quarantine gate
        if: ${{ !cancelled() && steps.run-java-tests.outcome == 'failure' }}
        continue-on-error: ${{ vars.QUARANTINE_ENGINE != 'ci-conductor' }}
        timeout-minutes: 3
        uses: ./.github/actions/quarantine-gate
        with:
          adapter: backend
          test-suite: be-tests-java-${{ matrix.java-version }}-${{ matrix.job.test-group-name }}
          enforce-quarantine: ${{ vars.QUARANTINE_ENGINE == 'ci-conductor' }}

      - name: Publish Test Report (JUnit)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: failure()
        with:
          path: "target/junit/**/*_test.xml"
          name: JUnit Test Report be-tests-java-${{ matrix.java-version }}-${{ matrix.job.edition }}
          reporter: java-junit
          list-suites: failed
          list-tests: failed
          fail-on-error: false

      - name: Upload Logs on Failure
        if: always() && !success()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.java-version }}-${{ matrix.job.edition }}-${{ github.job }}-${{ matrix.job.test-group-name }}
          path: logs/test-log.json
          retention-days: 1

  # checks that all the namespaces we actually ship can be compiled, without any dependencies that we don't ship (such
  # as `:dev` dependencies). See #27009 for more context.
  be-check:
    needs: gate
    if: ${{ needs.gate.outputs.be-check != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    strategy:
      matrix:
        java-version: [25]
    name: "Check Java ${{ matrix.java-version }}"
    steps:
      - uses: actions/checkout@v6
      - name: Prepare backend
        uses: ./.github/actions/prepare-backend
      # TODO -- we should probably also check WITHOUT ee -- do a check with only OSS namespaces on the classpath
      - name: Check namespaces
        run: clojure -M:ee:drivers:load-namespaces

  be-cljfmt:
    needs: gate
    if: ${{ needs.gate.outputs.be-cljfmt != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    name: Cljfmt
    steps:
      - uses: actions/checkout@v6
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - name: Run cljfmt
        run: ./bin/mage cljfmt-all --force-check

  be-tests-result:
    needs:
      - gate
      - project-tests
      - be-linter-eastwood
      - be-linter-eastwood-test
      - be-linter-eastwood-test-changed
      - be-linter-clj-kondo
      - be-cljfmt
      - be-check
      - be-tests
    if: ${{ !cancelled() }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    env:
      needs: ${{ toJson(needs) }}
    steps:
      - name: Check backend job status
        uses: actions/github-script@v9
        env:
          needs: ${{ toJson(needs) }}
        with:
          script: | # js
            const needs = JSON.parse(process.env.needs);
            const jobs = Object.entries(needs).map(
              ([jobName, jobValues]) => ({
                name: jobName,
                result: jobValues.result
              }));

            // are all jobs skipped or successful?
            if (jobs.every(job => (job.result === 'skipped' || job.result === 'success'))) {
              console.log('All jobs are skipped or successful');
              process.exit(0);
            }

            // otherwise, something failed
            console.log('Some backend jobs failed');
            jobs.forEach((job) => {
              if (job.result !== 'success') {
                console.log(`${job.name} - ${job.result}`);
              }
            });
            process.exit(1);
