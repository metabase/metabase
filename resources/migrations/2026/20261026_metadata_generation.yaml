# Runs and per-field proposals for LLM metadata generation (GHY-4721). A run proposes values for some attributes
# of the fields of one database and upserts one proposal per field and attribute; a person reviews the proposals
# before any value is written. The run row is the job record only.
#
# Index changesets have no rollback: the createTable rollback drops them. Their leading columns can back an FK
# on MySQL, so a separate dropIndex fails there.

databaseChangeLog:
  - changeSet:
      id: oqir62
      author: tplude
      comment: Add metadata_generation_run
      changes:
        - createTable:
            tableName: metadata_generation_run
            remarks: One LLM metadata generation run over a database, a list of schemas or a list of tables
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: database_id
                  type: int
                  remarks: The database the run reads
                  constraints:
                    nullable: false
                    referencedTableName: metabase_database
                    referencedColumnNames: id
                    foreignKeyName: fk_metadata_generation_run_database_id
                    deleteCascade: true
              - column:
                  name: scope
                  type: ${text.type}
                  remarks: "JSON: the part of the database the run covers, the whole database, schema names or table ids"
                  constraints:
                    nullable: false
              - column:
                  name: attributes
                  type: ${text.type}
                  remarks: "JSON: the field attributes the run proposes values for"
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  remarks: pending, running, canceling, succeeded, failed, canceled or usage_limit
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: ${boolean.type}
                  remarks: True while the run is pending, running or canceling, NULL after; with database_id unique, so a database has at most one active run
                  constraints:
                    nullable: true
              - column:
                  name: total_tables
                  type: int
                  remarks: Number of tables in the run
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: done_tables
                  type: int
                  remarks: Number of tables processed successfully
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: failed_tables
                  type: int
                  remarks: Number of tables that failed
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: table_errors
                  type: ${text.type}
                  remarks: "JSON: per-table errors, each with the table id, name and schema, a message, an error code and the elapsed time"
                  constraints:
                    nullable: true
              - column:
                  name: done_table_ids
                  type: ${text.type}
                  remarks: "JSON: ids of the tables processed successfully"
                  constraints:
                    nullable: true
              - column:
                  name: message
                  type: ${text.type}
                  remarks: Message for the whole run, the error of a failed run, or why it was canceled or stopped
                  constraints:
                    nullable: true
              - column:
                  name: usage
                  type: ${text.type}
                  remarks: "JSON: token usage and cost of the run's LLM calls"
                  constraints:
                    nullable: true
              - column:
                  name: creator_id
                  type: int
                  remarks: The user who started the run
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: When the run was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: When the run row was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: ${timestamp_type}
                  remarks: When the run started processing; NULL while pending
                  constraints:
                    nullable: true
              - column:
                  name: ended_at
                  type: ${timestamp_type}
                  remarks: When the run reached a terminal status; NULL while active
                  constraints:
                    nullable: true
              - column:
                  name: last_heartbeat
                  type: ${timestamp_type}
                  remarks: Stamped while the run executes; a stale value means the owning process died
                  constraints:
                    nullable: true

  - changeSet:
      id: qwc142
      author: tplude
      comment: Add FK on metadata_generation_run.creator_id; SET NULL keeps the run when the user is deleted
      changes:
        - addForeignKeyConstraint:
            baseTableName: metadata_generation_run
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_metadata_generation_run_creator_id
            onDelete: SET NULL
      rollback: # dropped with table

  - changeSet:
      id: lwpplm
      author: tplude
      comment: At most one active metadata_generation_run per database
      changes:
        - addUniqueConstraint:
            tableName: metadata_generation_run
            constraintName: idx_unique_active_metadata_generation_run
            columnNames: database_id, is_active
      rollback: # dropped with table

  - changeSet:
      id: ws8xgq
      author: tplude
      comment: Index metadata_generation_run by database and status
      changes:
        - createIndex:
            tableName: metadata_generation_run
            indexName: idx_metadata_generation_run_database_id_status
            columns:
              - column:
                  name: database_id
              - column:
                  name: status
      rollback: # dropped with table

  - changeSet:
      id: fk17dw
      author: tplude
      comment: Index metadata_generation_run.creator_id
      changes:
        - createIndex:
            tableName: metadata_generation_run
            indexName: idx_metadata_generation_run_creator_id
            columns:
              - column:
                  name: creator_id
      rollback: # dropped with table

  - changeSet:
      id: w8zxtq
      author: tplude
      comment: Add metadata_generation_proposal
      changes:
        - createTable:
            tableName: metadata_generation_proposal
            remarks: The pending or rejected value that the AI proposes for one attribute of one field; one row per field and attribute
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: last_run_id
                  type: int
                  remarks: The run that made the proposal last; NULL when that run is gone
                  constraints:
                    nullable: true
              - column:
                  name: table_id
                  type: int
                  remarks: The table of the field
                  constraints:
                    nullable: false
                    referencedTableName: metabase_table
                    referencedColumnNames: id
                    foreignKeyName: fk_metadata_generation_proposal_table_id
                    deleteCascade: true
              - column:
                  name: field_id
                  type: int
                  remarks: The field the proposal is for
                  constraints:
                    nullable: false
                    referencedTableName: metabase_field
                    referencedColumnNames: id
                    foreignKeyName: fk_metadata_generation_proposal_field_id
                    deleteCascade: true
              - column:
                  name: attribute
                  type: varchar(32)
                  remarks: data_sensitivity, semantic_type or description
                  constraints:
                    nullable: false
              - column:
                  name: proposed_value
                  type: ${text.type}
                  remarks: The value the model proposes
                  constraints:
                    nullable: false
              - column:
                  name: confidence
                  type: varchar(16)
                  remarks: high, medium or low, as reported by the model
                  constraints:
                    nullable: true
              - column:
                  name: reasoning
                  type: ${text.type}
                  remarks: The model's short reason for the proposal
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: varchar(16)
                  remarks: pending; apply and reject delete the row
                  defaultValue: pending
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: When the proposal was saved first
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: When the proposal was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: nbtkef
      author: tplude
      comment: One proposal per field and attribute
      changes:
        - addUniqueConstraint:
            tableName: metadata_generation_proposal
            constraintName: idx_unique_metadata_generation_proposal_field_attribute
            columnNames: field_id, attribute
      rollback: # dropped with table

  - changeSet:
      id: he9xtk
      author: tplude
      comment: Index metadata_generation_proposal.last_run_id
      changes:
        - createIndex:
            tableName: metadata_generation_proposal
            indexName: idx_metadata_generation_proposal_last_run_id
            columns:
              - column:
                  name: last_run_id
      rollback: # dropped with table

  - changeSet:
      id: qzr7gb
      author: tplude
      comment: Add FK on metadata_generation_proposal.last_run_id; SET NULL keeps the proposal when the run is deleted
      changes:
        - addForeignKeyConstraint:
            baseTableName: metadata_generation_proposal
            baseColumnNames: last_run_id
            referencedTableName: metadata_generation_run
            referencedColumnNames: id
            constraintName: fk_metadata_generation_proposal_last_run_id
            onDelete: SET NULL
      rollback: # dropped with table

  - changeSet:
      id: si8rzd
      author: tplude
      comment: Index metadata_generation_proposal.table_id
      changes:
        - createIndex:
            tableName: metadata_generation_proposal
            indexName: idx_metadata_generation_proposal_table_id
            columns:
              - column:
                  name: table_id
      rollback: # dropped with table
