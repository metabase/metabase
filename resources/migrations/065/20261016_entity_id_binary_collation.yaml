## Serialization orders the entities it exports by entity_id, which decides the de-dup suffix of same-named files
## (`foo.yaml`, `foo_2.yaml`). The entity_id columns used the app DB's default collation, which sorts mixed-case and
## punctuated NanoIDs differently on Postgres (per locale) and MySQL/MariaDB (case-insensitive) than on H2, so instances
## syncing one repo named those files differently. Byte-wise collations make every app DB sort them alike.

databaseChangeLog:
  - changeSet:
      id: v65.eidb7c
      author: ranquild
      comment: Compare entity_id columns byte by byte on Postgres, MySQL, and MariaDB
