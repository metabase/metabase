name: Check doc links

on:
  pull_request:
  workflow_dispatch:

jobs:
  link-checker:
    name: Check documentation links
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            docs
            .lychee
            .github/ISSUE_TEMPLATE
            frontend/src
            enterprise/frontend/src
            src
            enterprise/backend/src
            resources
            modules

      - name: Install lychee
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          archive=lychee-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfL -o "$archive" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$archive"
          echo "$LYCHEE_SHA256  $archive" | sha256sum -c -
          tar xzf "$archive"
          sudo install lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee

      - name: Check links in docs/
        run: docs/util/check-links.sh docs

      # lychee can't read the YAML nav, so this script renders it as markdown first.
      - name: Check nav.yml links
        if: ${{ !cancelled() }}
        run: docs/util/check-links.sh nav

      - name: Check docs links in the source code
        if: ${{ !cancelled() }}
        run: docs/util/check-links.sh src

  gate:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test.gate.yml
    with:
      filters: in_product_docs_links

  # Runs when the docs change too, so a docs-only PR that renames a page can't break in-product links.
  in-product-links:
    name: Check in-product docs links
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
        with:
          apply-patches: "false"
      - name: Check in-product docs links
        run: bun bin/verify-doc-links/verify-doc-links.ts
