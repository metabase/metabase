## Real root collection for the snippets namespace, mirroring the transforms one: create the row, repoint
## rootless snippets at it, and make `native_query_snippet.collection_id` NOT NULL.
## No permissions move. `collection-readwrite-path` resolves an `is_root` row to
## `/collection/namespace/snippets/root/`, the path existing grants already carry, so the snippet
## permission graph keeps working against the rows it has.

databaseChangeLog:
  - changeSet:
      id: v64.2026-08-04T11:00:00
      author: ranquild
      comment: Create the SQL snippets root collection
      changes:
        - insert:
            tableName: collection
            columns:
              - column:
                  name: name
                  value: SQL snippets
              - column:
                  name: slug
                  value: snippets
              - column:
                  name: entity_id
                  value: root-snippets--------
              - column:
                  name: namespace
                  value: snippets
              - column:
                  name: is_root
                  valueBoolean: true
      rollback:
        - delete:
            tableName: collection
            where: is_root = TRUE AND namespace = 'snippets'

  - changeSet:
      id: v64.2026-08-04T11:00:01
      author: ranquild
      comment: Move rootless snippets into the SQL snippets root collection
      changes:
        - sql:
            sql: >-
              UPDATE native_query_snippet
              SET collection_id = (SELECT id FROM collection WHERE is_root = TRUE AND namespace = 'snippets')
              WHERE collection_id IS NULL;
      rollback:
        - sql:
            sql: >-
              UPDATE native_query_snippet
              SET collection_id = NULL
              WHERE collection_id = (SELECT id FROM collection WHERE is_root = TRUE AND namespace = 'snippets');

  ## The FK was ON DELETE SET NULL, which MySQL and MariaDB refuse to combine with a NOT NULL column. Nothing
  ## relied on it: `before-delete` on Collection already deletes the snippets in a collection before the row goes,
  ## so it comes back without an action, matching `fk_transform_collection_id`.
  - changeSet:
      id: v64.2026-08-04T11:00:02
      author: ranquild
      comment: Drop the SET NULL fk_snippet_collection_id
      changes:
        - dropForeignKeyConstraint:
            baseTableName: native_query_snippet
            constraintName: fk_snippet_collection_id
      rollback:
        - addForeignKeyConstraint:
            baseTableName: native_query_snippet
            baseColumnNames: collection_id
            referencedTableName: collection
            referencedColumnNames: id
            constraintName: fk_snippet_collection_id
            onDelete: SET NULL

  - changeSet:
      id: v64.2026-08-04T11:00:03
      author: ranquild
      comment: Make native_query_snippet.collection_id NOT NULL
      changes:
        - addNotNullConstraint:
            tableName: native_query_snippet
            columnName: collection_id
            columnDataType: int

  - changeSet:
      id: v64.2026-08-04T11:00:04
      author: ranquild
      comment: Restore fk_snippet_collection_id without an on-delete action
      changes:
        - addForeignKeyConstraint:
            baseTableName: native_query_snippet
            baseColumnNames: collection_id
            referencedTableName: collection
            referencedColumnNames: id
            constraintName: fk_snippet_collection_id
