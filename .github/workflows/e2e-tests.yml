name: E2E Tests

on:
  workflow_call:
    inputs:
      plan:
        description: >-
          The CI test plan, as JSON. The caller builds it; the `e2e-tests`
          workflow in it decides the jobs below. `{}` means there is no
          plan, and everything runs.
        type: string
        default: '{}'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-e2e
  cancel-in-progress: true

jobs:
  # Which specs to run is this workflow's own question, so it asks it here off
  # its own diff rather than having the caller hand it an answer. The plan gates
  # this to pull requests where narrowing is allowed at all; on a push, or when
  # an override settled the run, the job is skipped, `specs` comes out empty and
  # the full suite runs.
  changed-specs:
    name: Decide which specs to run
    if: ${{ inputs.plan == '{}' || fromJSON(inputs.plan).workflows.e2e-tests.jobs.changed-specs.run }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      specs: ${{ steps.pick.outputs.specs }}
    steps:
      - uses: actions/checkout@v6
      - name: Test which files changed
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          token: ${{ github.token }}
          # comma separated list of files
          list-files: csv
          filters: .github/file-paths.yaml
      - name: Narrow to the specs the diff touched
        id: pick
        env:
          # e.g. e2e/test/scenarios/onboarding/command-palette.cy.spec.js,e2e/test/scenarios/question/document-title.cy.spec.js
          ALL_FILES: ${{ steps.changes.outputs.all_changed_files }}
          SPEC_FILES: ${{ steps.changes.outputs.e2e_specs_files }}
        run: | # sh
          # Only when the diff is specs and nothing else can the run be narrowed
          # to the specs it touched -- anything else in it could change how any
          # spec behaves. Both lists come off the same diff in the same order,
          # so equal strings mean the spec list is the whole diff.
          if [ "$ALL_FILES" = "$SPEC_FILES" ]; then
            echo "Running only the specs this diff touched: $SPEC_FILES"
            echo "specs=$SPEC_FILES" >> "$GITHUB_OUTPUT"
          else
            echo "Diff is not specs alone -- running the full suite"
            echo "specs=" >> "$GITHUB_OUTPUT"
          fi

  e2e-matrix-builder:
    needs: [changed-specs]
    # A skipped or failed `changed-specs` supplies no specs, so the suite runs
    # in full.
    if: >-
      ${{ !cancelled() &&
      (inputs.plan == '{}' || fromJSON(inputs.plan).workflows.e2e-tests.jobs.e2e-matrix-builder.run) }}
    uses: ./.github/workflows/e2e-matrix-builder.yml
    with:
      plan: ${{ inputs.plan }}
      chunks: 50
      specs: ${{ needs.changed-specs.outputs.specs }}

  reset-e2e-test-comment:
    if: ${{ inputs.plan == '{}' || fromJSON(inputs.plan).workflows.e2e-tests.jobs.reset-e2e-test-comment.run }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
      - name: Remove test results comment
        uses: actions/github-script@v9
        with:
          script: | # js
            const { owner, repo } = context.repo;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
            }).catch(console.error);

            if (!comments) {
              return;
            }

            const comment = comments.find((comment) => comment.body.includes('## e2e tests failed on '));

            if (comment) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: comment.id,
              });
            }

  e2e-tests:
    name: ${{ matrix.name }}-${{ matrix.edition }}
    uses: ./.github/workflows/e2e-test.yml
    needs:
      - e2e-matrix-builder
    if: >-
      ${{ !cancelled() &&
      (inputs.plan == '{}' || fromJSON(inputs.plan).workflows.e2e-tests.jobs.e2e-tests.run) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.e2e-matrix-builder.outputs.matrix) }}
    secrets: inherit
    with:
      plan: ${{ inputs.plan }}
      name: ${{ matrix.name }}
      edition: ${{ matrix.edition }}
      specs: ${{ matrix.specs }}
      total_chunks: ${{ fromJson(needs.e2e-matrix-builder.outputs.regularChunks) }}
      split_index: ${{ strategy.job-index }}
      tags: ${{ matrix.tags }}
      runner: ${{ matrix.runner }}

  collect-timings:
    name: Collect E2E Timings
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    needs: e2e-tests
    if: >-
      ${{ always() && !cancelled() &&
      (inputs.plan == '{}' || fromJSON(inputs.plan).workflows.e2e-tests.jobs.collect-timings.run) }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            e2e/support
          sparse-checkout-cone-mode: false

      - name: Download all timing artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: timing-data-*
          path: timing-files
          merge-multiple: false
        continue-on-error: true

      - name: Merge split timings
        id: merge
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const globber = await glob.create('timing-files/*/chunkTimings.json');
            const chunkFiles = await globber.glob();

            const specs = new Map();
            chunkFiles.forEach(file => {
              const { durations = [] } = JSON.parse(fs.readFileSync(file, 'utf8'));
              durations.forEach(({ spec, duration }) => specs.set(spec, duration));
            });

            if (specs.size === 0) {
              throw new Error('No timing data found - no specs had timing changes');
            }

            const outputPath = 'e2e/support/runTimings.json';
            fs.mkdirSync(path.dirname(outputPath), { recursive: true });

            const runTimings = {
              durations: [...specs].map(([spec, duration]) => ({ spec, duration }))
            };

            fs.writeFileSync(outputPath, JSON.stringify(runTimings, null, 2));
            console.log(`Merged timing data for ${specs.size} specs`);

      - name: Upload merged timing files
        if: steps.merge.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: merged-e2e-timings
          path: e2e/support/runTimings.json
          retention-days: 7

  e2e-tests-result:
    needs:
      - e2e-tests
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    name: e2e-tests-result
    if: always() && !cancelled()
    env:
      E2E_TESTS_RESULT: ${{ needs.e2e-tests.result }}
    steps:
      - name: Stub
        if: ${{ needs.e2e-tests.result == 'skipped' }}
        run: |
          echo "Didn't run due to conditional filtering"
      - name: Test results
        if: ${{ needs.e2e-tests.result != 'skipped' }}
        run: | # sh
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"

          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "E2E Tests failed"
            exit 1
          fi
