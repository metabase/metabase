info:
  name: Metabase BigQuery Cloud SDK Driver
  version: 1.0.0-SNAPSHOT-1.131.1
  description: Allows Metabase to connect to Google BigQuery databases using the Google Cloud SDK.
driver:
  name: bigquery-cloud-sdk
  display-name: BigQuery
  lazy-load: true
  connection-properties:
    - name: billing-project-id
      display-name: Billing project ID
      helper-text: Google Cloud project where query jobs run and are billed. Defaults to the service account key's project, or to the Metabase server's default Google Cloud project with other credentials.
      placeholder: my-billing-project
      required: false
      type: string
    - name: project-id
      display-name: Data project ID
      helper-text: Google Cloud project that owns the datasets you want to query. Defaults to the service account key's project, or to the Metabase server's default Google Cloud project with other credentials.
      required: false
      placeholder: my-warehouse-project
    - name: service-account-json
      display-name: Service account JSON file
      helper-text: The key file of the service account Metabase uses to read and query your datasets. Leave empty to authenticate with a credential configuration file or with the Application Default Credentials of the Metabase server.
      required: false
      type: textFile
    - name: credential-config-json
      display-name: Credential configuration file
      helper-text: Workload Identity Federation configuration from `gcloud iam workload-identity-pools create-cred-config`, to authenticate without a service account key (for example from AKS or EKS). Leave empty when using a service account JSON file.
      required: false
      type: textFile
    - name: dataset-filters
      type: schema-filters
      display-name: Datasets
    - cloud-ip-address-info
    - advanced-options-start
    - name: use-jvm-timezone
      display-name: Use JVM Time Zone
      default: false
      type: boolean
      visible-if:
        advanced-options: true
    - name: include-user-id-and-hash
      display-name: Include User ID and query hash in queries
      default: true
      type: boolean
      visible-if:
        advanced-options: true
    - name: host
      display-name: Alternate hostname
      helper-text: Alternate hostname used to connect to BigQuery
      placeholder: https://<hostname>:<port>
      required: false
      type: string
      visible-if:
        advanced-options: true
    - name: universe-domain
      display-name: Universe Domain
      helper-text: The Google Cloud Universe Domain to use (e.g. googleapis.com or s3nsapis.fr).
      placeholder: googleapis.com
      required: false
      type: string
      visible-if:
        advanced-options: true
    - default-advanced-options
extra:
  db-routing-info:
    text: Route queries on this database to a different BigQuery **project** or Google Cloud account based on the person's user attribute. Each BigQuery destination must have identical schemas.
init:
  - step: load-namespace
    namespace: metabase.driver.bigquery-cloud-sdk
