## Index report_dashboard.enable_embedding, which the anonymous-reach query filters on.

databaseChangeLog:
  - changeSet:
      id: v66.6tmxt4
      author: johnswanson
      comment: Index report_dashboard.enable_embedding for the anonymous-reach query
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: report_dashboard
                indexName: idx_report_dashboard_enable_embedding
      changes:
        - createIndex:
            tableName: report_dashboard
            indexName: idx_report_dashboard_enable_embedding
            columns:
              - column:
                  name: enable_embedding
