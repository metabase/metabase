  - changeSet:
      id: v65.upols4
      author: ranquild
      comment: Create result_metadata_status
      changes:
        - createTable:
            tableName: result_metadata_status
            remarks: The version of each entity the result metadata job last processed, re-deriving MBQL cards and having the entities depending on it processed
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_type
                  type: varchar(254)
                  remarks: The type of the entity
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: int
                  remarks: The ID of the entity
                  constraints:
                    nullable: false
              - column:
                  name: entity_version
                  type: bigint
                  remarks: The version of the entity, its own and its parts' counters summed, it was processed from, or null to process it again
              - column:
                  name: analysis_version
                  type: int
                  remarks: The version of the result metadata logic that processed the entity
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: result_metadata_status

