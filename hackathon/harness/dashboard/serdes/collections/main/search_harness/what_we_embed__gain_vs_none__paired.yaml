dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH s AS (
      WITH src AS (
        SELECT CASE WHEN embedding_text = 'context-sql' THEN 'embed the SQL (context-sql)' WHEN text_strategy = 'none' THEN 'none' ELSE text_strategy END AS arm, embedder AS pair, scenario_id, value
        FROM harness_scenario_metric
        WHERE corpus_id = 'northwind-sql-v1' AND metric = 'ndcg@10' AND engine = 'semantic-vector'
          AND 'split-heldout' = ANY (tags)
          AND ((embedding_text = 'baseline') OR (embedding_text = 'context-sql' AND text_strategy = 'none'))
      ), d AS (
        SELECT a.arm, a.pair, a.value, a.value - r.value AS delta
        FROM src a JOIN src r ON r.arm = 'none' AND r.pair = a.pair AND r.scenario_id = a.scenario_id
        WHERE a.arm <> 'none'
      )
      SELECT arm, pair, count(*) AS n, avg(value) AS v, avg(delta) AS mean, 1.96 * stddev_samp(delta) / sqrt(count(*)) AS ci
      FROM d GROUP BY 1, 2
      )
      SELECT arm AS "Text", split_part(pair, '/', 2) AS "Embedder",
             round((v - mean)::numeric, 3) AS "nDCG@10 none", round(v::numeric, 3) AS "nDCG@10 with",
             round(mean::numeric, 3) AS "Δ vs none", round(ci::numeric, 3) AS "± 95% CI",
             CASE WHEN n < 5 THEN 'too few questions'
                  WHEN mean - ci > 0 THEN 'better'
                  WHEN mean + ci < 0 THEN 'worse'
                  ELSE 'no proven difference' END AS "Verdict",
             n AS "n questions"
      FROM s
      ORDER BY pair, mean DESC
    lib/type: mbql.stage/native
  lib/type: mbql/query
