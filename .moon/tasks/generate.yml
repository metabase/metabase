# Code and artifact generation: parsers, API types, OpenAPI and licence data.

tasks:
  generate-expression-parser:
    # lezer-generator emits unformatted code, so the committed files only match
    # after eslint --fix (import ordering) and oxfmt --write. Without both, every
    # run of this task dirties the tree against what is checked in.
    script: |-
      lezer-generator --typeScript \
                      frontend/src/metabase/querying/expressions/tokenizer/grammar.lezer \
                      -o frontend/src/metabase/querying/expressions/tokenizer/lezer.ts \
      && eslint --no-warn-ignored --fix \
                frontend/src/metabase/querying/expressions/tokenizer/lezer.ts \
                frontend/src/metabase/querying/expressions/tokenizer/lezer.terms.ts \
      && oxfmt --write \
               frontend/src/metabase/querying/expressions/tokenizer/lezer.ts \
               frontend/src/metabase/querying/expressions/tokenizer/lezer.terms.ts
    inputs:
      - frontend/src/metabase/querying/expressions/tokenizer/grammar.lezer
      - eslint.config.mjs
      - .oxfmtrc.json
    outputs:
      - frontend/src/metabase/querying/expressions/tokenizer/lezer.ts
      - frontend/src/metabase/querying/expressions/tokenizer/lezer.terms.ts

  generate-license-disclaimer:
    script: |-
      node bin/generate-license-disclaimer.js
    options:
      cache: false

  generate-openapi:
    script: |-
      clojure -M:run:ee generate-openapi-spec
    options:
      cache: false

  types-generate:
    script: |-
      openapi-ts -f ./frontend/build/openapi/openapi-ts.config.ts
    options:
      cache: false

  types-generate-watch:
    script: |-
      npx chokidar 'resources/openapi/openapi.json' \
                   --initial \
                   -c 'openapi-ts -f ./frontend/build/openapi/openapi-ts.config.ts' \
                   --debounce 1000
    options:
      persistent: true
      cache: false
      runInCI: false
      outputStyle: stream
