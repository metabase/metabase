                  name: archived_directly
                  type: ${boolean.type}
                  remarks: Whether the NativeQuerySnippet was archived directly, rather than along with its collection
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: nq4d1y
      author: ranquild
      comment: Mark already-archived native_query_snippet rows as archived directly unless their collection is archived
      changes:
        - sql:
            sql: >-
              UPDATE native_query_snippet
              SET archived_directly = TRUE
              WHERE archived = TRUE AND NOT EXISTS (SELECT 1 FROM collection WHERE collection.id = native_query_snippet.collection_id AND collection.archived = TRUE);
      rollback: # nothing to do; rolling back the preceding changeset drops the column

  - changeSet:
      id: tl5e3m
      author: ranquild
      comment: Add timeline.archived_directly
