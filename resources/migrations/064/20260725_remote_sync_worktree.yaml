            sql: |
              EXECUTE IMMEDIATE COALESCE((SELECT 'ALTER TABLE ' || tc.table_name || ' DROP CONSTRAINT ' || tc.constraint_name FROM information_schema.table_constraints tc WHERE tc.table_name = 'COLLECTION' AND tc.constraint_type = 'UNIQUE' AND EXISTS (SELECT 1 FROM information_schema.key_column_usage k WHERE k.constraint_name = tc.constraint_name AND k.table_name = tc.table_name AND k.column_name = 'ENTITY_ID') AND NOT EXISTS (SELECT 1 FROM information_schema.key_column_usage k2 WHERE k2.constraint_name = tc.constraint_name AND k2.table_name = tc.table_name AND k2.column_name <> 'ENTITY_ID')), '');
