name: Check links against the live sites

on:
  schedule:
    # Sundays at 05:00 UTC
    - cron: "0 5 * * 0"
  workflow_dispatch:

jobs:
  live-links:
    name: Check links against the live sites
    if: ${{ github.event_name != 'schedule' || github.repository == 'metabase/metabase' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      LINKS_REPORT: broken-links.txt
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SLACK_CHANNEL: C0AL5E179P0 # #growth-alerts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .lychee
            .github/ISSUE_TEMPLATE
            .github/scripts
            docs
            frontend/src
            enterprise/frontend/src
            src
            enterprise/backend/src
            resources
            modules

      - name: Install lychee
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          archive=lychee-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfL -o "$archive" "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/$archive"
          echo "$LYCHEE_SHA256  $archive" | sha256sum -c -
          tar xzf "$archive"
          sudo install lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee

      - name: Check links
        id: check
        continue-on-error: true
        env:
          # lychee uses it for github.com, which rate-limits anonymous requests.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          status=0
          docs/util/check-links.sh site || status=1
          docs/util/check-links.sh --external || status=1
          exit "$status"

      - name: Build the broken links report
        if: steps.check.outcome == 'failure'
        env:
          BLOB_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
        run: |
          max_rows=300
          {
            echo "> Generated by [\`docs-links-site.yml\`]($BLOB_URL/.github/workflows/docs-links-site.yml). Each weekly run replaces this description, so edits here are lost: comment instead."
            echo
            if [ -s "$LINKS_REPORT" ]; then
              failures=$(sort -u "$LINKS_REPORT")
              count=$(grep -c '' <<<"$failures")
              echo "The weekly link check found **$count broken links** on $(date -u +%Y-%m-%d) ([run]($RUN_URL))."
              echo "A redirect counts as broken for metabase.com and our GitHub wikis: see \`docs/util/README.md\`."
              echo
              echo "| Where | Link | Status |"
              echo "| --- | --- | --- |"
              head -n "$max_rows" <<<"$failures" | while IFS= read -r failure; do
                location=${failure%%: *}
                rest=${failure#*: }
                url=${rest%%: *}
                status=$(sed -E 's/^Rejected status code: ([0-9]+).*/\1/' <<<"${rest#*: }")
                echo "| [\`$location\`]($BLOB_URL/${location%:*}#L${location##*:}) | ${url//|/\\|} | ${status//|/\\|} |"
              done
              if [ "$count" -gt "$max_rows" ]; then
                echo
                echo "…and $((count - max_rows)) more in the run."
              fi
            else
              echo "The weekly link check failed on $(date -u +%Y-%m-%d) without listing any links. See the [run]($RUN_URL)."
            fi
          } > broken-links-issue.md

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"
          token: ${{ secrets.GITHUB_TOKEN }}

      # Keeps one open Linear issue: a failing run opens it or replaces its description, a passing run closes it.
      # Slack hears when it opens or closes. Only master reports: a manual run on a branch checks that branch.
      - name: Open, update, or close the broken links issue
        if: github.ref == 'refs/heads/master'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: fc363549-4f40-41ed-8f41-8fba461606ab # GRO
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: bun .github/scripts/report-links.ts broken-links-issue.md

      - name: Alert when the link check can't run
        if: failure() && github.ref == 'refs/heads/master'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          jq -n --arg channel "$SLACK_CHANNEL" --arg text ":x: The weekly metabase/metabase link check failed to run: $RUN_URL" \
            '{channel: $channel, text: $text}' |
            curl -sSf https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" --data @-

      - name: Fail the run
        if: steps.check.outcome == 'failure'
        run: exit 1
