dataset_query:
  database: Search Harness
  stages:
  - native: |-
      SELECT CASE WHEN data_scale IS NULL THEN '235 (golden)' WHEN data_scale >= 1000 THEN (data_scale / 1000) || 'k'
                  ELSE data_scale::text END AS "Corpus size",
             engine AS "Engine",
             percentile_cont(0.95) WITHIN GROUP (ORDER BY latency_ms) AS "p95 latency (ms)"
      FROM harness_latest_observation
      WHERE (corpus_id = {{corpus}} OR corpus_id LIKE 'scale-%') AND run_id NOT IN (SELECT run_id FROM harness_run_concurrency WHERE overlapped) AND error IS NULL
        AND embedding_text = {{variant}}
        AND text_strategy = {{strategy}}
        [[AND embedder = {{embedder}}]]
      GROUP BY data_scale, 1, 2
      ORDER BY coalesce(data_scale, 235), 2
    template-tags:
    - default: baseline
      display-name: Embedding text
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000005
      name: variant
      required: true
      type: text
    - default: none
      display-name: Text strategy
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000006
      name: strategy
      required: true
      type: text
    - default: northwind-golden-v1
      display-name: Corpus
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000001
      name: corpus
      required: true
      type: text
    - display-name: Embedder
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000003
      name: embedder
      required: false
      type: text
    lib/type: mbql.stage/native
  lib/type: mbql/query
