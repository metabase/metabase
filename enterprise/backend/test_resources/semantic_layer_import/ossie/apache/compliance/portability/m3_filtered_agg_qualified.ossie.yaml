# M3 ladder rung: a filtered aggregate in the spec's portable form
# SUM(CASE WHEN ... THEN x ELSE 0 END). Variant: QUALIFIED reference form,
# carried as primary per #486.
version: "0.2.0.dev0"
name: m3_sales
description: "M3: conditional aggregation, qualified reference form."
datasets:
  - name: sales
    source: samples.sales.orders
    fields:
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount
        datatype: Decimal
      - name: status
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: status
        datatype: String
metrics:
  - name: completed_amount
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN sales.status = 'completed' THEN sales.amount ELSE 0 END)
    datatype: Decimal
