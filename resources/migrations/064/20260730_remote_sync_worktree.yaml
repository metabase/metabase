databaseChangeLog:
  - changeSet:
      id: v64.2026-07-30T10:00:00
      author: ranquild
      comment: Create remote_sync_worktree table
      changes:
        - createTable:
            tableName: remote_sync_worktree
            remarks: One row per checked-out remote-sync branch (a git-worktree-style checkout of the synced content tree)
            columns:
              - column:
                  name: id
                  type: int
                  remarks: Unique ID
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch
                  type: varchar(254)
                  remarks: Git branch this worktree is checked out to
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: User who created this worktree; null once that user is deleted
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: When this worktree was created
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: When this worktree was last updated
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: v64.2026-07-30T10:00:01
      author: ranquild
      comment: Unique index on remote_sync_worktree.branch - a branch can be checked out at most once
      changes:
        - createIndex:
            tableName: remote_sync_worktree
            indexName: idx_remote_sync_worktree_branch
            unique: true
            columns:
              - column:
                  name: branch

  - changeSet:
      id: v64.2026-07-30T10:00:02
      author: ranquild
      comment: FK remote_sync_worktree.creator_id -> core_user; SET NULL so the worktree survives its creator's deletion
      changes:
        - addForeignKeyConstraint:
            baseTableName: remote_sync_worktree
            baseColumnNames: creator_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_remote_sync_worktree_creator_id
            onDelete: SET NULL

  - changeSet:
      id: v64.2026-07-30T10:00:03
      author: ranquild
      comment: Add remote_sync_object.worktree_id
      changes:
        - addColumn:
            tableName: remote_sync_object
            columns:
              - column:
                  name: worktree_id
                  type: int
                  remarks: Worktree whose sync ledger this row belongs to; null for main-app remote sync
                  constraints:
                    nullable: true

  - changeSet:
      id: v64.2026-07-30T10:00:04
      author: ranquild
      comment: Index on remote_sync_object.worktree_id (backs the FK below and every worktree-scoped query)
      changes:
        - createIndex:
            tableName: remote_sync_object
            indexName: idx_remote_sync_object_worktree_id
            columns:
              - column:
                  name: worktree_id

  - changeSet:
