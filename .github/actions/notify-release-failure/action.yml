name: Notify release failure
description: Sends a failure or warning message to the release thread

inputs:
  title:
    description: What failed (e.g. "Publishing"). The generic version is added when a version is set.
    required: true
  version:
    description: Release version for the message.
    required: false
    default: ""
  commit:
    description: Release commit SHA. It finds the release thread. Empty posts to the channel.
    required: false
    default: ""
  level:
    description: failure marks the thread as failed. warning does not block the release or change the thread reaction.
    required: false
    default: failure
  needs:
    description: The needs context as JSON (toJSON(needs)). The message then names the failed and cancelled jobs.
    required: false
    default: ""
  slack-channel:
    description: Slack release channel name
    required: true
  slack-bot-token:
    description: Slack bot token
    required: true

runs:
  using: composite
  steps:
    - name: Prepare release scripts
      uses: ./.github/actions/prepare-release-scripts
    - name: Send failure message
      uses: actions/github-script@v9
      env:
        TITLE: ${{ inputs.title }}
        VERSION: ${{ inputs.version }}
        COMMIT: ${{ inputs.commit }}
        LEVEL: ${{ inputs.level }}
        NEEDS: ${{ inputs.needs }}
        SLACK_RELEASE_CHANNEL: ${{ inputs.slack-channel }}
        SLACK_BOT_TOKEN: ${{ inputs.slack-bot-token }}
      with:
        script: | # js
          const { sendReleaseSlackMessage, githubRunLink, getGenericVersion, formatJobResults } = require('${{ github.workspace }}/release/dist/index.cjs');

          const { owner, repo } = context.repo;
          const { TITLE: title, VERSION: version, COMMIT: commit, LEVEL: level } = process.env;
          const label = version ? `${title} ${getGenericVersion(version)} failed` : `${title} failed`;
          const runLink = githubRunLink(label, context.runId.toString(), owner, repo);
          const jobResults = formatJobResults(process.env.NEEDS);
          const summary = jobResults ? `${runLink}. ${jobResults}` : runLink;

          console.log(`sending Slack message: ${summary}`);

          await sendReleaseSlackMessage({
            channelName: process.env.SLACK_RELEASE_CHANNEL,
            version: version || undefined,
            commit: commit || undefined,
            ...(level === 'warning'
              ? { emoji: 'warning', message: `${summary}. The release is not blocked.` }
              : { emoji: 'x', message: summary, status: 'failure' }),
          });
