## MCP audience binding. An OAuth token's stored RFC 8707 `resource` decides where it works, and a token with no
## resource is a REST token, refused at the MCP endpoint. This brings tokens minted before binding in line with what
## /oauth/authorize grants as of this release, frozen against later edits:
## - No resource, MCP scopes only (agent:resource:read aside): bound to the MCP endpoint, keeping only the MCP scopes.
## - No resource, a mix of MCP and other scopes: the MCP scopes are dropped; the token stays a REST token.
## - No resource, anything else (agent:resource:read alone included): unchanged.
## - Bound to the MCP endpoint: keeps only its MCP scopes. Bound to anything else: loses its MCP scopes. Either is
##   deleted when no scope is left.
## Tokens with an empty or unparsable scope or an unparsable resource are unchanged.

databaseChangeLog:
  - changeSet:
      id: v64.2026-10-05T00:00:00
      author: ericnormand
      comment: Bind and narrow OAuth tokens minted before MCP audience binding
      changes:
        - customChange:
            class: metabase.app_db.custom_migrations.BindLegacyMcpOAuthTokens
      rollback: []
