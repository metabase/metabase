name: PR 82050 Loki narrowing demo
run-name: 'PR 82050 Loki narrowing: ${{ inputs.scenario }}'

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Frontend change to simulate against the exact PR source
        type: choice
        required: true
        options:
          - admin-deprecation-notice
          - downloads-status
          - full-plan
          - no-plan

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  plan:
    name: Plan simulated ${{ inputs.scenario }} change
    if: ${{ inputs.scenario != 'no-plan' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.plan.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
      - name: Choose changed source file
        id: change
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          loki_infra=false
          case "$SCENARIO" in
            admin-deprecation-notice) file=frontend/src/metabase/admin/app/components/DeprecationNotice/DeprecationNotice.tsx ;;
            downloads-status) file=frontend/src/metabase/status/components/DownloadsStatusLarge/DownloadsStatusLarge.tsx ;;
            full-plan) file=frontend/src/metabase/admin/app/components/DeprecationNotice/DeprecationNotice.tsx; loki_infra=true ;;
            *) exit 1 ;;
          esac
          git ls-files --error-unmatch "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "loki-infra=$loki_infra" >> "$GITHUB_OUTPUT"
          {
            echo "Controlled CI demonstration for PR #82050 at bc2d747ede8."
            echo
            echo "Simulated changed source: \`$file\` (loki-infra-touched: $loki_infra)."
            echo 'The planner, the test plan artifact handoff, Storybook story selection, and the called Loki workflow are unchanged from that commit.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/create-test-plan
        id: plan
        with:
          changed-files: ${{ steps.change.outputs.file }}
          fe-changed-files: ${{ steps.change.outputs.file }}
          be-changed-files: ''
          unit-infra-touched: 'false'
          loki-infra-touched: ${{ steps.change.outputs.loki-infra }}
          e2e-infra-touched: 'false'
          shared-sources-touched: 'false'
      - name: Assert Loki narrowing
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          if [ "$SCENARIO" = full-plan ]; then
            jq -e '.stats.loki_stories_to_run_usage == .stats.loki_stories_all' test-plan.json
            echo "Planner selected all $(jq '.stats.loki_stories_all' test-plan.json) story files." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            jq -e '.stats.loki_stories_to_run_usage > 0 and .stats.loki_stories_to_run_usage < .stats.loki_stories_all' test-plan.json
            {
              echo
              echo "Planner selected $(jq '.stats.loki_stories_to_run_usage' test-plan.json) of $(jq '.stats.loki_stories_all' test-plan.json) story files:"
              jq -r '.loki_stories_to_run[] | "- `" + . + "`"' test-plan.json
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  loki-tests:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result == 'success' || inputs.scenario == 'no-plan') }}
    uses: ./.github/workflows/loki.yml
    with:
      test-plan-artifact-id: ${{ inputs.scenario != 'no-plan' && needs.plan.outputs.artifact-id || '' }}

  frontend-tests:
    needs: plan
    if: ${{ !cancelled() && (needs.plan.result == 'success' || inputs.scenario == 'no-plan') }}
    uses: ./.github/workflows/frontend.yml
    secrets: inherit
    with:
      skip-lint: true
      skip-custom-viz: true
      skip-ci-scripts: true
      test-plan-artifact-id: ${{ inputs.scenario != 'no-plan' && needs.plan.outputs.artifact-id || '' }}
