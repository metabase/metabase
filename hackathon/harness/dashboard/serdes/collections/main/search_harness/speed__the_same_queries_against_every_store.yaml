dataset_query:
  database: Search Harness
  stages:
  - native: |-
      SELECT engine AS "Engine", CASE WHEN data_scale IS NULL THEN '235 (golden)' WHEN data_scale >= 1000 THEN (data_scale / 1000) || 'k' ELSE data_scale::text END AS "Catalogue size",
             round(percentile_cont(0.5) WITHIN GROUP (ORDER BY latency_ms)::numeric) AS "Median ms"
      FROM harness_latest_observation
      WHERE (corpus_id = 'northwind-golden-v1' OR corpus_id LIKE 'scale-%') AND error IS NULL
        AND embedder = 'ollama/all-minilm' AND embedding_text = 'baseline' AND text_strategy = 'none'
      GROUP BY engine, data_scale
      ORDER BY array_position(ARRAY['semantic', 'semantic-pure', 'semantic-vector', 'sqlite-vec1', 'sqlite-vec1-pure', 'lucene', 'lucene-pure', 'appdb', 'in-place'], engine), data_scale NULLS FIRST
    lib/type: mbql.stage/native
  lib/type: mbql/query
