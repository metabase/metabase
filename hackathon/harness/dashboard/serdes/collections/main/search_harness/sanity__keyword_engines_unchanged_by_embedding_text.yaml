name: 'Sanity: keyword engines unchanged by embedding text'
description: |-
  Were the variant runs comparable? Keyword engines never see embeddings, so Top-10 differs must be 0. Anything else means: don't trust this tab. Keyword engines never see embeddings, so their top-10 must match baseline exactly. Anything non-zero means the runs are not comparable.

  **Vector vs keyword engine**: A vector engine matches by meaning, using embeddings (semantic is hybrid: meaning and words). A keyword engine (appdb, in-place) matches words only.

  **Embedding text**: Which fields of an item get embedded. baseline = item type + name + description; context = + collection, table, chart type; context-sql = + the query's SQL.

  **Baseline**: The reference setup everything else is compared against.
entity_id: d6BCRY6hsbCJ70FOaFW7S
created_at: '2026-09-23T14:33:01.840162Z'
