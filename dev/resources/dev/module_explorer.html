<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metabase modules</title>
<!-- Built by dev.module-explorer; the module data is embedded below as DATA. -->
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f8fa; --panel:#ffffff; --panel-2:#fbfcfd; --ink:#1a1f27; --ink-soft:#5b6572;
  --line:#e4e8ee; --line-strong:#d2d8e0; --accent:#4a6fe8; --accent-soft:#e8eeff;
  --group:#8a94a3; --chip:#eef1f6; --chip-ink:#3a4350; --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);
  --uses:#e8892b; --usedby:#2fa36b;
}
/* explicit color-scheme per theme keeps native controls matched and opts out of Chrome auto-darkening */
:root[data-theme=light],:root[data-theme=solarized-light]{color-scheme:only light}
:root[data-theme=dark],:root[data-theme=solarized-dark],:root[data-theme=gruvbox],:root[data-theme=nord]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1319; --panel:#161b23; --panel-2:#12161d; --ink:#e6eaf0; --ink-soft:#8b96a6;
  --line:#252c37; --line-strong:#323a48; --accent:#6d8bff; --accent-soft:#1c2740;
  --group:#5a6472; --chip:#1c222c; --chip-ink:#b9c3d1; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
  --uses:#e89a4d; --usedby:#4cc98a;
}}
:root[data-theme=light]{
  --bg:#f7f8fa; --panel:#ffffff; --panel-2:#fbfcfd; --ink:#1a1f27; --ink-soft:#5b6572;
  --line:#e4e8ee; --line-strong:#d2d8e0; --accent:#4a6fe8; --accent-soft:#e8eeff;
  --group:#8a94a3; --chip:#eef1f6; --chip-ink:#3a4350; --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);
  --uses:#e8892b; --usedby:#2fa36b;
}
:root[data-theme=dark]{
  --bg:#0f1319; --panel:#161b23; --panel-2:#12161d; --ink:#e6eaf0; --ink-soft:#8b96a6;
  --line:#252c37; --line-strong:#323a48; --accent:#6d8bff; --accent-soft:#1c2740;
  --group:#5a6472; --chip:#1c222c; --chip-ink:#b9c3d1; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35);
  --uses:#e89a4d; --usedby:#4cc98a;
}
:root[data-theme=solarized-light]{
  --bg:#eee8d5; --panel:#fdf6e3; --panel-2:#f4eeda; --ink:#586e75; --ink-soft:#93a1a1;
  --line:#e3ddc8; --line-strong:#d3ccb4; --accent:#268bd2; --accent-soft:#dceaf4;
  --group:#93a1a1; --chip:#e7e0cc; --chip-ink:#586e75; --shadow:0 1px 2px rgba(88,110,117,.12),0 10px 26px rgba(88,110,117,.14);
  --uses:#cb4b16; --usedby:#859900;
}
:root[data-theme=solarized-dark]{
  --bg:#002b36; --panel:#073642; --panel-2:#053039; --ink:#93a1a1; --ink-soft:#657b83;
  --line:#0a3f4c; --line-strong:#164955; --accent:#2aa7d8; --accent-soft:#0f4657;
  --group:#586e75; --chip:#08313c; --chip-ink:#93a1a1; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.4);
  --uses:#cb4b16; --usedby:#859900;
}
:root[data-theme=gruvbox]{
  --bg:#282828; --panel:#32302f; --panel-2:#3c3836; --ink:#ebdbb2; --ink-soft:#a89984;
  --line:#3c3836; --line-strong:#504945; --accent:#83a598; --accent-soft:#374446;
  --group:#928374; --chip:#3c3836; --chip-ink:#d5c4a1; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.4);
  --uses:#fe8019; --usedby:#b8bb26;
}
:root[data-theme=nord]{
  --bg:#2e3440; --panel:#3b4252; --panel-2:#353c4a; --ink:#e5e9f0; --ink-soft:#94a0b8;
  --line:#434c5e; --line-strong:#4c566a; --accent:#88c0d0; --accent-soft:#3d4a5c;
  --group:#7b88a1; --chip:#434c5e; --chip-ink:#d8dee9; --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.4);
  --uses:#d08770; --usedby:#a3be8c;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);
  background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;font-weight:650;margin:0;letter-spacing:-.01em;white-space:nowrap}
header h1 .dim{color:var(--ink-soft);font-weight:400}
.stats{color:var(--ink-soft);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
.grow{flex:1}
.search{position:relative}
.search input{width:230px;padding:7px 11px 7px 30px;border:1px solid var(--line-strong);border-radius:8px;
  background:var(--panel-2);color:var(--ink);font-size:13px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:9px;top:8px;width:15px;height:15px;color:var(--ink-soft)}
.ghost{border:1px solid var(--line-strong);background:var(--panel-2);color:var(--ink-soft);
  border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--accent)}
.ghost:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--panel-2)}
.seg button{border:none;background:transparent;color:var(--ink-soft);font:inherit;font-size:12.5px;
  padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.themepick:focus-within{color:var(--ink);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.themepick{display:inline-flex;align-items:center;gap:6px;padding:0 9px}
.themepick .ticon{color:var(--ink-soft);flex-shrink:0}
.themepick:hover .ticon,.themepick:hover .tchev{color:var(--ink)}
.themepick select{border:none;background:transparent;color:inherit;font:inherit;font-size:12.5px;
  padding:6px 0;cursor:pointer;-webkit-appearance:none;appearance:none;outline:none}
.themepick .tchev{color:var(--ink-soft);font-size:10px;pointer-events:none}
.legend{display:flex;gap:6px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line);
  background:var(--panel-2);align-items:center}
.legend .lbl{color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;
  border:1px solid var(--line-strong);background:var(--panel);cursor:pointer;user-select:none;color:var(--ink)}
.tchip .dot{width:9px;height:9px;border-radius:50%}
.tchip.off{opacity:.4}
.tchip .ct{color:var(--ink-soft);font-size:11px}
main{flex:1;display:flex;min-height:0}
.tree{flex:1;overflow:auto;padding:10px 8px 40px;min-width:0;overflow-anchor:none}
.detail{width:380px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);
  overflow:auto;padding:0}
.row{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:7px;cursor:pointer;
  white-space:nowrap;position:relative}
.row:hover{background:var(--panel-2)}
.row.sel{background:var(--accent-soft)}
.row.dim{opacity:.32}
.caret{width:14px;height:14px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-soft);transition:transform .12s;font-size:10px}
.caret.none{visibility:hidden}
.row.open>.caret{transform:rotate(90deg)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot.group{background:transparent;border:1.5px solid var(--group)}
.name{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.name.group{color:var(--group)}
.name.nsmoved{text-decoration:underline dotted var(--group);text-underline-offset:3px;text-decoration-thickness:1px}
.badge{font-size:9px;font-weight:700;padding:1px 4px;border-radius:4px;letter-spacing:.03em}
.badge.ent{background:var(--accent-soft);color:var(--accent);opacity:.85}
.badge.debt{background:transparent;border:1px solid var(--uses);color:var(--uses);padding:0 4px}
.badge.bypass{background:transparent;border:1px dashed var(--group);color:var(--group);padding:0 4px}
.submini{font-size:10px;color:var(--group);margin-left:5px}
.row.flat{padding-left:8px}
.ghost.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.mini{font-size:10.5px;color:var(--ink-soft);margin-left:4px;opacity:.55;font-variant-numeric:tabular-nums}
.row:hover .mini,.row.sel .mini{opacity:1}
.cnt-in{color:var(--usedby);font-weight:600}
.cnt-out{color:var(--uses);font-weight:600}
/* hotspots and graph toolbars */
.viewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 8px 10px;padding:9px 14px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.viewbar b{font-size:12.5px;font-weight:650}
.viewbar .desc{color:var(--ink-soft);font-size:12px;flex:1;min-width:260px}
.viewbar .desc code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;color:var(--uses)}
.viewbar .swatch{display:inline-block;width:8px;height:8px;border-radius:2px;vertical-align:baseline;margin:0 3px 0 1px}
.viewbar select,.viewbar input{border:1px solid var(--line-strong);background:var(--panel-2);color:var(--ink);
  border-radius:7px;padding:4px 7px;font:inherit;font-size:12px;outline:none}
.viewbar select{cursor:pointer}
.rank{width:26px;text-align:right;color:var(--group);font-size:10.5px;flex-shrink:0;font-variant-numeric:tabular-nums}
.hname{display:inline-flex;align-items:center;gap:7px;width:300px;flex-shrink:0;overflow:hidden}
.hname .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hname .badge{flex-shrink:0}
.track{flex:1;max-width:360px;height:7px;border-radius:4px;background:var(--chip);overflow:hidden;display:flex}
.track .in{background:var(--usedby)}
.track .out{background:var(--uses)}
.hcounts{margin-left:12px;font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums;flex-shrink:0}
.dep-mark{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-left:3px;vertical-align:middle}
.dep-mark.uses{background:var(--uses)}
.dep-mark.usedby{background:var(--usedby)}
.kids{margin-left:15px;border-left:1px solid var(--line);padding-left:2px}
.kids.hidden{display:none}
/* graph view */
.graph{flex:1;display:flex;flex-direction:column;min-width:0;padding-top:6px}
.graph .viewbar{margin-bottom:0}
#cy{flex:1;min-height:0}
.graph .note{color:var(--ink-soft);font-size:12px;padding:40px;text-align:center}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 8px;border-radius:20px;font-size:11.5px;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.fchip button{border:none;background:transparent;color:inherit;cursor:pointer;padding:0 3px;font-size:13px;line-height:1}
.ctxmenu{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;
  box-shadow:var(--shadow);padding:4px 0;font-size:12.5px;min-width:190px}
.ctxmenu div{padding:6px 12px;cursor:pointer}
.ctxmenu div:hover{background:var(--accent-soft)}
/* detail panel */
.d-empty{padding:60px 26px;color:var(--ink-soft);text-align:center;font-size:13px;line-height:1.7}
.d-empty .keys{margin-top:24px;font-size:11.5px;color:var(--group);line-height:2.2}
kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;color:var(--ink-soft);
  background:var(--chip);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;
  padding:1px 5px;margin:0 3px}
.d-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.d-title{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;font-weight:600;
  word-break:break-all;display:flex;align-items:center;gap:8px}
.d-title .dot{width:11px;height:11px}
.d-sub{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.d-sub a{color:var(--accent);font-size:12px;text-decoration:none}
.d-sub a:hover{text-decoration:underline}
.d-body{padding:6px 20px 40px}
.d-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:16px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 5px;text-align:center}
.stat b{display:block;font-size:16px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:9px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
.sec{margin-top:18px}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:0 0 8px;
  display:flex;align-items:center;gap:7px}
.sec h3 .n{background:var(--chip);color:var(--chip-ink);border-radius:20px;padding:0 7px;font-size:10.5px;
  letter-spacing:0;font-weight:600}
.sec h3 .swatch{width:8px;height:8px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;padding:3px 8px;
  border-radius:6px;background:var(--chip);color:var(--chip-ink);border:1px solid transparent}
.chip.link{cursor:pointer}
.chip.link:hover{border-color:var(--accent);color:var(--accent)}
.nsuse{margin-bottom:9px}
.nsuse .nsname{font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;word-break:break-all}
.empty-note{color:var(--ink-soft);font-size:12px;font-style:italic}
.d-team{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink)}
.nsnote{margin-top:10px;font-size:12px;color:var(--ink-soft);background:var(--panel-2);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.45}
.nsnote code{color:var(--uses)}
@media (max-width:820px){.detail{position:fixed;right:0;top:0;bottom:0;box-shadow:var(--shadow);width:min(380px,90vw);
  transform:translateX(100%);transition:transform .2s}.detail.show{transform:none}}
</style></head><body>
<header>
  <h1>Metabase <span class=dim>modules</span></h1>
  <div class=stats id=stats></div>
  <div class=grow></div>
  <div class=search>
    <svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='m21 21-4.3-4.3'/></svg>
    <input id=q type=search list=modlist placeholder='Filter modules…' autocomplete=off spellcheck=false title='Enter selects the first match'>
    <datalist id=modlist></datalist>
  </div>
  <div class=seg role=group aria-label='View'>
    <button id=view-tree class=on>Tree</button>
    <button id=view-hotspots title='Rank modules by coupling'>Hotspots</button>
    <button id=view-graph title='Dependency graph around the focused modules'>Graph</button>
  </div>
  <button class=ghost id=debt title='Show only modules with an unfilled boundary (:api :any, :uses :any, or :model-imports :bypass)'>Unfilled only</button>
  <div class=seg id=foldctl role=group aria-label='Folding'>
    <button id=expand title='Expand all groups'>Expand</button>
    <button id=collapse title='Collapse all groups'>Collapse</button>
  </div>
  <label class='themepick ghost' title='Theme'>
    <svg class=ticon viewBox='0 0 24 24' width='15' height='15' fill='none' stroke='currentColor' stroke-width='2'><circle cx='12' cy='12' r='9'/><path d='M12 3a9 9 0 0 0 0 18' fill='currentColor' stroke='none'/></svg>
    <select id=theme>
      <option value=''>System</option>
      <option value='light'>Light</option>
      <option value='dark'>Dark</option>
      <option value='solarized-light'>Solarized Light</option>
      <option value='solarized-dark'>Solarized Dark</option>
      <option value='gruvbox'>Gruvbox</option>
      <option value='nord'>Nord</option>
    </select>
    <span class=tchev>▾</span>
  </label>
</header>
<div class=legend id=legend></div>
<main>
  <div class=tree id=tree></div>
  <div class=graph id=graph hidden>
    <div class=viewbar id=graphbar></div>
    <div id=cy></div>
  </div>
  <aside class=detail id=detail></aside>
</main>
<script>const DATA = /*DATA*/null;</script>
<script>
'use strict';
const MODULES = DATA.modules;
const byId = Object.fromEntries(MODULES.map(m => [m.id, m]));
const GITHUB = 'https://github.com/metabase/metabase/';
// team -> color (stable palette, assigned in first-seen order over sorted teams)
const TEAMS = [...new Set(MODULES.map(m => m.team).filter(Boolean))].sort();
const PALETTE = ['#4a6fe8','#e8892b','#2fa36b','#c0468a','#7d5fe0','#2fa8c0','#d0443b','#b0952f','#5a7a3a','#8a5a3a','#607080'];
const teamColor = {}; TEAMS.forEach((t,i)=>teamColor[t]=PALETTE[i%PALETTE.length]);
const teamCount = {}; MODULES.forEach(m=>{ if(m.team) teamCount[m.team]=(teamCount[m.team]||0)+1; });

// ---- build the display tree from each module's `path` --------------------
function makeNode(seg){ return {seg, children:new Map(), module:null}; }
const root = makeNode('');
for(const m of MODULES){
  let cur = root;
  m.path.forEach((seg,i)=>{
    if(!cur.children.has(seg)) cur.children.set(seg, makeNode(seg));
    cur = cur.children.get(seg);
    if(i===m.path.length-1) cur.module = m;
  });
}
// number of modules under each node (shown as a count on group/parent rows)
(function countSub(node){ let n=0; for(const k of node.children.values()){ n += (k.module?1:0)+countSub(k); } node.sub=n; return n; })(root);
function sortedKids(node){
  return [...node.children.values()].sort((a,b)=>{
    const ax=a.seg==='enterprise'?1:0, bx=b.seg==='enterprise'?1:0;   // enterprise sorts last
    return ax-bx || a.seg.localeCompare(b.seg);
  });
}

// ---- state ---------------------------------------------------------------
const open = new Set();            // node dom-path keys currently expanded
// team focus: empty = passive (every team shown); non-empty = show only these.
// toggling a team in/out; emptying the set returns to passive.
const focusTeams = new Set();
function teamActive(t){ return focusTeams.size===0 || focusTeams.has(t); }
function refreshTeamChips(){
  for(const el of legend.querySelectorAll('.tchip'))
    el.classList.toggle('off', focusTeams.size>0 && !focusTeams.has(el.dataset.team));
}
let selected = null;               // module id
let query = '';
let debtOnly = false, view = 'tree', sortBy = 'used-by';
// graph view: modules whose neighbourhood is drawn, how far out, which show their API namespaces, and what to leave out
let focus = new Set(), degree = 1, expanded = new Set(), hidden = new Set(), hideRe = '';
function isDebt(m){ return !!(m && (m['uses-any'] || m['api-any'] || m['model-imports-bypass'])); }
function teamOk(m){ return !m || !m.team || teamActive(m.team); }

// ---- header stats + legend ----------------------------------------------
const ent = MODULES.filter(m=>m.enterprise).length;
const starred = MODULES.filter(m=>m['ns-prefix']).length;
const debtN = MODULES.filter(isDebt).length;
document.getElementById('stats').innerHTML =
  `<span><b>${MODULES.length}</b> modules</span><span><b>${ent}</b> enterprise</span>`+
  `<span title='namespaces not yet moved to match the module name'><b>${starred}</b> ns-prefixed</span>`+
  `<span title='modules with an unfilled boundary (:api :any, :uses :any, or :model-imports :bypass)'><b>${debtN}</b> unfilled</span>`+
  `<span><b>${TEAMS.length}</b> teams</span>`;
document.getElementById('modlist').append(...MODULES.map(m=>{ const o=document.createElement('option'); o.value=m.id; return o; }));

const legend = document.getElementById('legend');
legend.innerHTML = '<span class=lbl>Teams</span>';
for(const t of TEAMS){
  const el = document.createElement('span');
  el.className='tchip'; el.dataset.team=t; el.title='Show only this team';
  el.innerHTML=`<span class=dot style='background:${teamColor[t]}'></span>${t}<span class=ct>${teamCount[t]}</span>`;
  el.onclick=()=>{ focusTeams.has(t)?focusTeams.delete(t):focusTeams.add(t); refreshTeamChips(); render(); };
  legend.appendChild(el);
}

// ---- tree rendering ------------------------------------------------------
const treeEl = document.getElementById('tree');
const graphEl = document.getElementById('graph');

// which module ids match the current query (module + its ancestors stay visible)
function matches(m){
  if(debtOnly && !isDebt(m)) return false;
  if(!query) return true;
  return m.id.toLowerCase().includes(query) || (m.team||'').toLowerCase().includes(query);
}
// precompute, for an active filter, the set of node-keys that must remain visible
function visibleKeys(){
  if(!query && !debtOnly) return null;
  const keep = new Set();
  (function walk(node, path){
    let any=false;
    for(const kid of sortedKids(node)){
      const kpath = path.concat(kid.seg);
      const key = kpath.join('/');
      const self = kid.module && matches(kid.module);
      const below = walk(kid, kpath);
      if(self||below){ keep.add(key); any=true; }
    }
    return any;
  })(root, []);
  return keep;
}

// Append dependency dots directly to the row as flex children (7px each). Wrapping them in a span
// would make that span a flex item whose line box inherits line-height:1.5 (~21px), taller than the
// row text — so related rows would grow/shrink by ~1px as selection moves. Direct children don't.
function appendDepMarks(row, m){
  if(!selected || !m) return;
  const s = byId[selected];
  const mark=(cls,title)=>{ const d=document.createElement('span'); d.className='dep-mark '+cls; d.title=title; row.appendChild(d); };
  if(s.uses.includes(m.id)) mark('uses', 'used by '+selected);
  if(s['used-by'].includes(m.id)) mark('usedby', 'uses '+selected);
}

let visibleIds = [];   // module ids currently rendered, in visual order (for keyboard nav)

function appendBadges(row, m){

  if(m['api-any']||m['uses-any']){ const b=document.createElement('span'); b.className='badge debt'; b.textContent='any';
    b.title=[m['api-any']?'no API namespace (:api :any)':'', m['uses-any']?'unrestricted deps (:uses :any)':''].filter(Boolean).join(' · '); row.appendChild(b); }
  if(m['model-imports-bypass']){ const b=document.createElement('span'); b.className='badge bypass'; b.textContent='bypass'; b.title='imports any model (:model-imports :bypass)'; row.appendChild(b); }
}
// ns-prefixed modules get a dotted underline instead of a badge — quieter at 70+ occurrences
function makeName(m, label, extraClass){

  if(m&&m['ns-prefix']){ name.classList.add('nsmoved'); name.title='namespaces still at '+m['ns-prefix']+' — not yet moved to match the module name'; }

function appendCounts(row, m){

// Build a row's shared content (caret slot, team dot, name, badges, counts, dep-marks).
function buildRow(m, label, hasKids){
  const row=document.createElement('div');
  row.className='row'+(m&&m.id===selected?' sel':'')+((m&&!teamOk(m))?' dim':'');
  if(m) row.dataset.id=m.id;

  const dot=document.createElement('span'); dot.className='dot'+(m?'':' group');

  row.appendChild(dot);
  row.appendChild(makeName(m, label, m?'':' group'));

// Shown while the unfilled-boundaries filter is active, so the lens explains itself.
function debtNotice(){
  const d=document.createElement('div'); d.className='viewbar';
  d.innerHTML=`<b>Unfilled boundaries</b><span class=desc>the ${debtN} modules whose config still has an `+
    `escape hatch instead of a real boundary: <code>:api :any</code> (no API namespace — every namespace is `+
    `public), <code>:uses :any</code> (may depend on any module), or <code>:model-imports :bypass</code> `+
    `(may use any module&#39;s models). The badge on each row says which.</span>`;
  return d;
}

function render(){
  visibleIds=[];
  treeEl.hidden = view==='graph';
  graphEl.hidden = view!=='graph';
  if(view==='graph') return renderGraph();
  if(view==='hotspots') return renderHotspots();
  const scroll = treeEl.scrollTop;   // full rebuild resets scroll; restore it so selecting a node doesn't jump
  const keep = visibleKeys();
  treeEl.innerHTML='';
  if(debtOnly) treeEl.appendChild(debtNotice());
  const frag = document.createDocumentFragment();
  (function walk(node, path, container, visible){
    for(const kid of sortedKids(node)){
      const kpath = path.concat(kid.seg);
      const key = kpath.join('/');
      if(keep && !keep.has(key)) continue;
      const m = kid.module;
      const hasKids = kid.children.size>0;
      const {row, caret} = buildRow(m, kid.seg, hasKids);
      const isOpen = open.has(key) || (keep && keep.has(key));
      if(hasKids && isOpen) row.classList.add('open');
      if(hasKids){ const sc=document.createElement('span'); sc.className='submini'; sc.textContent=kid.sub; sc.title=kid.sub+' modules below'; row.appendChild(sc); }
      if(m && visible) visibleIds.push(m.id);   // only rows whose ancestors are all open are keyboard-reachable
      const kidsBox=document.createElement('div');
      kidsBox.className='kids'+(hasKids&&isOpen?'':' hidden');
      const toggle=()=>{ if(open.has(key)) open.delete(key); else open.add(key); render(); };
      if(hasKids) caret.onclick=(e)=>{ e.stopPropagation(); toggle(); };
      row.onclick=(e)=>{ e.stopPropagation(); if(m) select(m.id); else if(hasKids) toggle(); };
      container.appendChild(row);
      container.appendChild(kidsBox);
      if(hasKids) walk(kid, kpath, kidsBox, visible && isOpen);
    }
  })(root, [], frag, true);
  treeEl.appendChild(frag);
  treeEl.scrollTop = scroll;
}

// Flat coupling view: rank modules by direct dependency counts. All edges come from the module
// config, so a hotspot is a graph-coupling fact, not a code-quality judgement.
const SORTS = {
  'used-by': {label:'dependents (fan-in)',
              metric:m=>m['used-by'].length,
              desc:'how many modules depend on it directly — a change here has the widest blast radius'},
  'uses':    {label:'dependencies (fan-out)',
              metric:m=>m.uses.length,
              desc:'how many modules it depends on directly — the most entangled consumers in the graph'},
  'coupling':{label:'total coupling (in + out)',
              metric:m=>m['used-by'].length+m.uses.length,
              desc:'dependents plus dependencies — modules that are both load-bearing and entangled'},

  const scroll = treeEl.scrollTop;

  bar.appendChild(d);

  const maxTotal = Math.max(1, ...list.map(m=>m['used-by'].length+m.uses.length));

    const rank=document.createElement('span'); rank.className='rank'; rank.textContent=i+1; row.appendChild(rank);
    const nm=document.createElement('span'); nm.className='hname';
    const dot=document.createElement('span'); dot.className='dot';
    dot.style.background=m.team?teamColor[m.team]:'var(--group)'; nm.appendChild(dot);
    const name=makeName(m, m.id, '');
    name.title=m.id+(m['ns-prefix']?' · namespaces still at '+m['ns-prefix']: '');
    nm.appendChild(name);
    appendBadges(nm,m); row.appendChild(nm);
    const track=document.createElement('span'); track.className='track';
    const inSeg=document.createElement('span'); inSeg.className='in';
    inSeg.style.width=(m['used-by'].length/maxTotal*100)+'%'; track.appendChild(inSeg);
    const outSeg=document.createElement('span'); outSeg.className='out';
    outSeg.style.width=(m.uses.length/maxTotal*100)+'%'; track.appendChild(outSeg);
    track.title=`${m['used-by'].length} dependents · ${m.uses.length} dependencies`;
    row.appendChild(track);
    const c=document.createElement('span'); c.className='hcounts';
    const inN=document.createElement('span'); inN.className='cnt-in'; inN.textContent=m['used-by'].length;
    const outN=document.createElement('span'); outN.className='cnt-out'; outN.textContent=m.uses.length;
    c.append(inN, ' in · ', outN, ' out'); row.appendChild(c);
    appendDepMarks(row,m);
    row.onclick=(e)=>{ e.stopPropagation(); select(m.id); };
    visibleIds.push(m.id);
    frag.appendChild(row);
  });
  treeEl.appendChild(frag);
  treeEl.scrollTop = scroll;
}

// ---- graph view ------------------------------------------------------------
// Edges are [consumer, producer, namespace]. With namespace data (dev.module-explorer/open!) they come from the
// source scan; otherwise from each module's :uses, and a `:uses :any` module draws none rather than one to everything.
const NS_EDGES = DATA['ns-edges'];
const NS_FILES = DATA['ns-files'] || {};
const EDGES = NS_EDGES || MODULES.flatMap(m => m['uses-any'] ? [] : m.uses.map(u => [m.id, u, null]));
const edgesByMod = {};
for(const e of EDGES){ (edgesByMod[e[0]] ||= []).push(e); if(e[1]!==e[0]) (edgesByMod[e[1]] ||= []).push(e); }
const GRAPH_LIBS = ['https://unpkg.com/cytoscape@3.30.1/dist/cytoscape.min.js',
                    'https://unpkg.com/webcola@3.4.0/WebCola/cola.min.js',
                    'https://unpkg.com/cytoscape-cola@2.5.1/cytoscape-cola.js'];
let graphLibs = null, cy = null, layout = null, locked = [];
function loadGraphLibs(){
  const load = src => new Promise((ok, fail) => {
    const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>fail(new Error('could not load '+src));
    document.head.appendChild(s);
  });
  graphLibs ||= GRAPH_LIBS.reduce((p, src) => p.then(() => load(src)), Promise.resolve())
    .then(() => cytoscape.use(cytoscapeCola))
    .catch(e => { graphLibs = null; throw e; });
  return graphLibs;
}
function hiddenFromGraph(id){
  if(focus.has(id)) return false;   // a focused module stays even when a hide rule matches it
  let re=null; try{ re = hideRe && new RegExp(hideRe); }catch(e){}
  return hidden.has(id) || !!(re && re.test(id)) || !teamOk(byId[id]);
}
// union of each focused module's `degree`-hop neighbourhood, ignoring edge direction
function neighbourhood(){
  const visible = new Set();
  for(const start of focus){
    const seen = new Set([start]);
    let frontier = [start];
    for(let hop=0; hop<degree && frontier.length; hop++){
      const next = [];
      for(const m of frontier) for(const [c,p] of edgesByMod[m]||[])
        for(const n of [c,p]) if(!seen.has(n) && byId[n] && !hiddenFromGraph(n)){ seen.add(n); next.push(n); }
      frontier = next;
    }
    seen.forEach(n => visible.add(n));
  }
  return visible;
}
const nsNodeId = (m, ns) => 'ns:'+m+'/'+ns;
// Edges into an expanded module point at the API namespace they use; all others collapse to one weighted
// edge per module pair.
function graphElements(visible){
  const nodes = [], edges = [], pairs = new Map();
  for(const id of visible){
    const m = byId[id];
    nodes.push({data:{id:'mod:'+id, label:id, type:'module', module:id, team:m.team||'', loc:m.stats?m.stats.loc:0}});
    if(expanded.has(id) && !m['api-any'])
      for(const ns of m.api) nodes.push({data:{id:nsNodeId(id,ns), label:ns, type:'ns', parent:'mod:'+id, module:id}});
  }
  for(const [c,p,ns] of EDGES){
    if(c===p || !visible.has(c) || !visible.has(p)) continue;
    if(ns && expanded.has(p) && byId[p].api.includes(ns)){
      edges.push({data:{id:'e:'+c+'->'+ns, source:'mod:'+c, target:nsNodeId(p,ns), sourceModule:c, targetModule:p}});
    } else {
      const k = c+'->'+p;
      if(!pairs.has(k)) pairs.set(k, {c, p, n:0});
      pairs.get(k).n++;
    }
  }
  for(const {c,p,n} of pairs.values())
    edges.push({data:{id:'agg:'+c+'->'+p, source:'mod:'+c, target:'mod:'+p, sourceModule:c, targetModule:p,
                      aggregate:true, weight:NS_EDGES?n:1}});
  return {nodes, edges};
}
function graphStyle(){
  const v = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const ink=v('--ink'), soft=v('--ink-soft'), panel=v('--panel'), accent=v('--accent'), line=v('--line-strong'), group=v('--group');
  const color = n => teamColor[n.data('team')] || group;
  const size = n => Math.max(36, Math.min(180, Math.sqrt(n.data('loc')||0)*1.4));
  return [
    {selector:'node[type="module"]', style:{'background-color':color, 'background-opacity':.22, 'border-width':1, 'border-color':color,
      label:'data(label)', 'font-size':16, 'font-weight':600, color:ink, 'text-outline-width':3, 'text-outline-color':panel,
      'text-valign':'top', 'text-halign':'center', 'text-margin-y':-6, padding:'12px', shape:'round-rectangle'}},
    {selector:'node[type="module"]:childless', style:{'background-opacity':.85, width:size, height:size}},
    {selector:'node[type="ns"]', style:{'background-color':panel, 'border-width':1, 'border-color':soft, label:'data(label)',
      'font-size':9, color:ink, 'text-valign':'center', 'text-halign':'center', shape:'round-rectangle', width:160, height:18}},
    {selector:'edge', style:{'curve-style':'bezier', width:1, 'line-color':line, 'target-arrow-color':line,
      'target-arrow-shape':'triangle', 'arrow-scale':1.4, opacity:.8}},
    {selector:'edge[?aggregate]', style:{width:e=>Math.min(10, 1+Math.log2(e.data('weight')+1)*1.6),
      label:e=>e.data('weight')>1?String(e.data('weight')):'', 'font-size':9, color:soft,
      'text-background-color':panel, 'text-background-opacity':.85, 'text-background-padding':2}},
    {selector:'.focused', style:{'border-color':accent, 'border-width':3}},
    {selector:'edge.focused', style:{'line-color':accent, 'target-arrow-color':accent, width:2, opacity:1}},
    {selector:'.sel', style:{'overlay-color':accent, 'overlay-opacity':.15, 'overlay-padding':6}},
  ];
}
function initCy(){
  cy = cytoscape({container:document.getElementById('cy'), style:graphStyle(), wheelSensitivity:.2});
  cy.on('tap', 'node', e => {
    const id = e.target.data('module'), ev = e.originalEvent;
    if(ev && ev.shiftKey) return setFocus(id, focus.has(id) ? 'remove' : 'add');
    if(selected!==id) select(id);
  });
  cy.on('dbltap', 'node[type="module"]', e => setFocus(e.target.data('module'), 'replace'));
  // The native event, because cytoscape's cxttap can stop firing after a drag.
  document.getElementById('cy').addEventListener('contextmenu', ev => {
    ev.preventDefault();
    const box = ev.currentTarget.getBoundingClientRect(), pan = cy.pan(), zoom = cy.zoom();
    const x = (ev.clientX-box.left-pan.x)/zoom, y = (ev.clientY-box.top-pan.y)/zoom;
    const hit = cy.nodes().filter(n => { const b=n.boundingBox(); return x>=b.x1 && x<=b.x2 && y>=b.y1 && y<=b.y2; }).last();
    if(hit.nonempty()) showNodeMenu(hit, ev.clientX, ev.clientY);
  });
}
const menuEl = document.createElement('div'); menuEl.className='ctxmenu'; menuEl.hidden=true; document.body.appendChild(menuEl);
document.addEventListener('click', () => { menuEl.hidden = true; });
function showNodeMenu(node, x, y){
  const id = node.data('module'), m = byId[id];
  const items = [];
  if(node.data('type')==='ns'){
    const file = NS_FILES[node.data('label')];
    items.push(['Select '+id, () => select(id)]);
    if(file) items.push(['Open source ↗', () => window.open(GITHUB+'blob/master/'+file, '_blank', 'noopener')]);
  } else {
    items.push(['Focus only this', () => setFocus(id, 'replace')],
               focus.has(id) ? ['Remove from focus', () => setFocus(id, 'remove')] : ['Add to focus', () => setFocus(id, 'add')]);
    if(NS_EDGES && !m['api-any'])
      items.push([expanded.has(id) ? 'Collapse API namespaces' : 'Expand API namespaces', () => {
        expanded.has(id) ? expanded.delete(id) : expanded.add(id); syncHash(true); renderGraph(); }]);
    if(!focus.has(id)) items.push(['Hide', () => { hidden.add(id); syncHash(true); renderGraph(); }]);
    if(m.source) items.push(['Open source ↗', () => window.open(GITHUB+'tree/master/'+m.source, '_blank', 'noopener')]);
  }
  menuEl.innerHTML = '';
  for(const [label, fn] of items){ const d=document.createElement('div'); d.textContent=label; d.onclick=fn; menuEl.appendChild(d); }
  menuEl.style.left = x+'px'; menuEl.style.top = y+'px'; menuEl.hidden = false;
}
function setFocus(id, mode){
  if(mode==='replace') focus = new Set([id]);
  else if(mode==='add') focus.add(id);

}
function renderGraphBar(visible){
  const bar = document.getElementById('graphbar');

  const b = document.createElement('b'); b.textContent = 'Focus'; bar.appendChild(b);

  deg.value = degree; deg.onchange = () => { degree = +deg.value; syncHash(true); renderGraph(); };
  bar.appendChild(deg);

  if(expanded.size) btn('Collapse all', 'Hide every API namespace', () => { expanded.clear(); syncHash(true); renderGraph(); });
  if(cy && focus.size) btn('Re-layout', 'Run the layout again', runLayout);
  const d = document.createElement('span'); d.className = 'desc';
  d.textContent = (visible ? visible.size+' modules · '+cy.edges().length+' edges · ' : '') +
    'click selects · shift-click adds to focus · double-click focuses · right-click for more' +
    (NS_EDGES ? '' : ' · run (dev.module-explorer/open!) in a dev REPL for namespace-level edges');

function runLayout(){
  if(layout) layout.stop();
  layout = cy.layout({name:'cola', animate:true, maxSimulationTime:3000, randomize:true, fit:true, padding:60,
                      avoidOverlap:true, handleDisconnected:true,
                      nodeSpacing: n => n.data('type')==='module' ? 80 : 20,
                      // heavily used pairs sit closer together
                      edgeLength: e => Math.max(220, 500 - Math.log2((e.data('weight')||1)+1)*50)});
  layout.one('layoutstop', () => { locked.forEach(n => n.unlock()); locked = []; });
  layout.run();
}
function markGraph(){
  if(!cy) return;
  cy.elements().removeClass('focused sel');
  focus.forEach(id => cy.getElementById('mod:'+id).addClass('focused'));
  cy.edges().filter(e => focus.has(e.data('sourceModule')) || focus.has(e.data('targetModule'))).addClass('focused');
  if(selected) cy.getElementById('mod:'+selected).addClass('sel');
}
async function renderGraph(){
  renderGraphBar(null);
  if(!focus.size){ if(cy) cy.elements().remove(); return; }
  try{ await loadGraphLibs(); }
  catch(e){ document.getElementById('cy').innerHTML = `<div class=note>The graph needs cytoscape from unpkg.com: ${e.message}</div>`; return; }
  if(!cy) initCy();
  cy.resize();
  const visible = neighbourhood();
  const {nodes, edges} = graphElements(visible);
  // modules that stay on screen keep their place while the new ones settle around them
  const old = {}; cy.nodes().forEach(n => { old[n.id()] = {...n.position()}; });
  locked.forEach(n => n.unlock()); locked = [];
  cy.batch(() => { cy.elements().remove(); cy.add(nodes); cy.add(edges); });
  for(const id in old){ const n=cy.getElementById(id); if(n.nonempty()){ n.position(old[id]); n.lock(); locked.push(n); } }
  markGraph();
  renderGraphBar(visible);
  runLayout();
}

// with namespace data: for each namespace of `m` another module requires, the modules that require it
function nsUsage(m){
  const byNs = {};
  for(const [c,p,ns] of NS_EDGES) if(p===m.id) (byNs[ns] ||= new Set()).add(c);
  const names = Object.keys(byNs).sort();
  if(!names.length) return null;
  const s=document.createElement('div'); s.className='sec';
  const h=document.createElement('h3'); h.append('Used through');
  const n=document.createElement('span'); n.className='n'; n.textContent=names.length; h.appendChild(n);
  s.appendChild(h);
  for(const ns of names){
    const row=document.createElement('div'); row.className='nsuse';
    const nm=document.createElement('div'); nm.className='nsname mono'; nm.textContent=ns; row.appendChild(nm);
    const box=document.createElement('div'); box.className='chips';
    for(const c of [...byNs[ns]].sort()) box.appendChild(chip(c, true));
    row.appendChild(box); s.appendChild(row);
  }
  return s;
}
function expandAncestors(id){ const p=byId[id]&&byId[id].path; if(!p) return; for(let i=1;i<p.length;i++) open.add(p.slice(0,i).join('/')); }
function scrollToSelected(){ if(!selected) return; const el=treeEl.querySelector('[data-id='+JSON.stringify(selected)+']'); if(el) el.scrollIntoView({block:'center'}); }
// The hash holds the selection and the graph state, so reloads and deep links restore the same view.
function stateHash(){
  const p=new URLSearchParams();
  if(selected) p.set('m', selected);
  if(view!=='tree') p.set('view', view);
  if(focus.size) p.set('focus', [...focus].join(','));
  if(degree!==1) p.set('deg', degree);
  if(expanded.size) p.set('exp', [...expanded].join(','));
  if(hidden.size) p.set('hide', [...hidden].join(','));
  if(hideRe) p.set('hre', hideRe);
  const s=p.toString();
  return s ? '#'+s : location.pathname+location.search;
}
function syncHash(push){ (push ? history.pushState : history.replaceState).call(history, null, '', stateHash()); }
function applyHash(){
  const h=location.hash.slice(1);
  const p=new URLSearchParams(h.includes('=') ? h : (h ? 'm='+h : ''));   // a bare #module is a selection
  const ids=k=>(p.get(k)||'').split(',').filter(id=>byId[id]);
  view = ['hotspots','graph'].includes(p.get('view')) ? p.get('view') : 'tree';
  focus = new Set(ids('focus')); expanded = new Set(ids('exp')); hidden = new Set(ids('hide'));
  degree = Math.min(3, Math.max(1, parseInt(p.get('deg'))||1));
  hideRe = p.get('hre')||'';
  const m = byId[p.get('m')] ? p.get('m') : null;
  if(view==='graph' && !focus.size && m) focus.add(m);
  syncView();
  endKbRun();
  if(view==='graph') render();
  applySelected(m);
}
function applySelected(id){   // id may be null; updates the view + detail, never touches history
  selected = id;
  if(view==='graph'){ markGraph(); renderDetail(); return; }
  if(selected && view==='tree') expandAncestors(selected);   // reveal: open the path down to it
  render();
  if(selected) scrollToSelected();
  renderDetail();
}
function select(id){   // user selection → push a history entry
  endKbRun();          // a committed (click/chip/Escape) selection ends any in-flight arrow run
  applySelected(selected===id ? null : id);
  syncHash(true);
}
function navigate(id){   // go to a module from a link: selects it, and in the graph also focuses it
  endKbRun();
  if(view==='graph') focus = new Set([id]);
  applySelected(id);
  syncHash(true);
  if(view==='graph') renderGraph();
}
let kbRunTimer=null;
function endKbRun(){ clearTimeout(kbRunTimer); kbRunTimer=null; }
function keyboardSelect(id){   // coalesce a run of arrow moves into one history entry ending at the resting selection
  const startOfRun = kbRunTimer===null;
  applySelected(id);
  syncHash(startOfRun);        // push on the first move of a run, replace as it continues
  clearTimeout(kbRunTimer);
  kbRunTimer=setTimeout(endKbRun, 500);
}
const EMPTY_DETAIL='<div class=d-empty>Select a module to see its team, API surface, and dependencies.'+
  '<br>Its relatives light up in the tree: <span class="dep-mark uses"></span> ones it uses, <span class="dep-mark usedby"></span> ones that use it.'+
  '<div class=keys><kbd>/</kbd> search &nbsp; <kbd>↵</kbd> go to match &nbsp; <kbd>↑</kbd><kbd>↓</kbd> move selection &nbsp; <kbd>Esc</kbd> clear</div></div>';
function renderDetail(){
  if(!selected){ detailEl.classList.remove('show'); detailEl.innerHTML=EMPTY_DETAIL; return; }
  const m=byId[selected];
  detailEl.classList.add('show');
  detailEl.innerHTML='';
  const head=document.createElement('div'); head.className='d-head';
  const t=document.createElement('div'); t.className='d-title';
  const dot=document.createElement('span'); dot.className='dot'; dot.style.background=m.team?teamColor[m.team]:'var(--group)';
  t.appendChild(dot); t.append(m.id); head.appendChild(t);
  const sub=document.createElement('div'); sub.className='d-sub';
  if(m.team){ const tm=document.createElement('span'); tm.className='d-team';
    tm.innerHTML=`<span class=dot style='width:9px;height:9px;background:${teamColor[m.team]}'></span>${m.team}`; sub.appendChild(tm); }
  if(m.enterprise){ const b=document.createElement('span'); b.className='badge ent'; b.textContent='ENTERPRISE'; sub.appendChild(b); }
  if(m.source){ const a=document.createElement('a'); a.href=GITHUB+'tree/master/'+m.source; a.target='_blank'; a.rel='noopener';
    a.textContent='source ↗'; a.title=m.source; sub.appendChild(a); }
  head.appendChild(sub);
  if(m['ns-prefix']){ const n=document.createElement('div'); n.className='nsnote';
    n.innerHTML=`Namespaces not yet moved to match the module name — still at <code>${m['ns-prefix']}</code>`; head.appendChild(n); }
  detailEl.appendChild(head);

  const body=document.createElement('div'); body.className='d-body';
  if(m.stats){
    const st=document.createElement('div'); st.className='d-stats';
    for(const [k,v] of [['namespaces',m.stats.namespaces],['lines',m.stats.loc],['tests',m.stats.tests],['commits',m.stats.commits]]){
      const d=document.createElement('div'); d.className='stat';
      d.innerHTML=`<b>${(v||0).toLocaleString()}</b><span>${k}</span>`;
      if(k==='tests'&&m.stats['test-files']) d.title=`${m.stats.tests} deftest across ${m.stats['test-files']} files`;
      st.appendChild(d);
    }
    body.appendChild(st);
  }
  const api = m['api-any']?['(any — no API namespace yet)']:m.api;
  const secs=[
    section('API namespaces', api),
    m['uses-any']
      ? section('Uses', ['(any — unrestricted)'])
      : section('Uses', m.uses, {link:true, swatch:'var(--uses)'}),
    section('Used by', m['used-by'], {link:true, swatch:'var(--usedby)'}),
    NS_EDGES && nsUsage(m),
    section('Friends', m.friends, {link:true}),
    section('Module exports', m['module-exports'], {link:true}),
    section('Model exports', m['model-exports']),
    section(m['model-imports-bypass']?'Model imports (bypass)':'Model imports',
            m['model-imports-bypass']?['(bypass — imports any model)']:m['model-imports']),
  ].filter(Boolean);
  if(secs.length) secs.forEach(s=>body.appendChild(s));
  else { const e=document.createElement('div'); e.className='empty-note'; e.textContent='No declared dependencies or surface.'; body.appendChild(e); }
  detailEl.appendChild(body);
}

// ---- controls ------------------------------------------------------------
const qInput=document.getElementById('q');
qInput.addEventListener('input', e=>{ query=e.target.value.trim().toLowerCase(); if(view!=='graph') render(); });
qInput.addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const q=qInput.value.trim(), lower=q.toLowerCase();
  const id = byId[q] ? q : (MODULES.find(m => m.id.toLowerCase().includes(lower)) || {}).id;
  if(id) navigate(id);
});
function expandAll(){ (function all(node,path){ for(const kid of node.children.values()){ const kp=path.concat(kid.seg);
  if(kid.children.size) open.add(kp.join('/')); all(kid,kp); } })(root,[]); }
document.getElementById('expand').onclick=()=>{ expandAll(); render(); };
document.getElementById('collapse').onclick=()=>{ open.clear(); render(); };
const rootEl=document.documentElement;
const themeSel=document.getElementById('theme');
function applyTheme(v){ v ? rootEl.setAttribute('data-theme',v) : rootEl.removeAttribute('data-theme'); if(cy) cy.style(graphStyle()); }
try{ const saved=localStorage.getItem('mb-modtree-theme'); if(saved!==null){ themeSel.value=saved; applyTheme(saved); } }catch(e){}
themeSel.onchange=()=>{ applyTheme(themeSel.value); try{ localStorage.setItem('mb-modtree-theme', themeSel.value); }catch(e){} };

// unfilled-boundaries lens + tree/hotspots/graph view
const debtBtn=document.getElementById('debt');
debtBtn.onclick=()=>{ debtOnly=!debtOnly; debtBtn.classList.toggle('on',debtOnly); render(); };
function syncView(){
  for(const v of ['tree','hotspots','graph']) document.getElementById('view-'+v).classList.toggle('on', view===v);
  document.getElementById('foldctl').style.display = view==='tree' ? '' : 'none';
  debtBtn.style.display = view==='graph' ? 'none' : '';
}
function setView(v){
  if(view===v) return;
  view=v; syncView();
  if(view==='graph' && !focus.size && selected) focus.add(selected);
  if(view==='tree'&&selected) expandAncestors(selected);
  render();
  if(view==='tree'&&selected) scrollToSelected();
  syncHash(true);
}
for(const v of ['tree','hotspots','graph']) document.getElementById('view-'+v).onclick=()=>setView(v);
syncView();

// keyboard: / focuses search, Esc clears/deselects, ↑/↓ move selection through visible rows
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement!==qInput){ e.preventDefault(); qInput.focus(); qInput.select(); return; }
  if(e.key==='Escape'){
    menuEl.hidden=true;
    if(document.activeElement===qInput && qInput.value){ qInput.value=''; query=''; if(view!=='graph') render(); qInput.blur(); }
    else if(selected){ select(selected); }
    return;
  }
  if((e.key==='ArrowDown'||e.key==='ArrowUp') && visibleIds.length){
    const ae=document.activeElement, tag=ae&&ae.tagName;
    if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||(ae&&ae.isContentEditable)) return;   // don't hijack native controls
    e.preventDefault();
    let i=visibleIds.indexOf(selected);
    if(e.key==='ArrowDown') i = i<0 ? 0 : Math.min(i+1, visibleIds.length-1);
    else                    i = i<0 ? visibleIds.length-1 : Math.max(i-1, 0);
    if(visibleIds[i] && visibleIds[i]!==selected) keyboardSelect(visibleIds[i]);
  }
});
// back/forward restores the whole view
window.addEventListener('popstate', applyHash);

// fully expanded by default
expandAll();
applyHash();
</script>
</body></html>
