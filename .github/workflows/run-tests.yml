name: Run tests

on:
  push:
    branches:
      - "master"
      - "release-**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  # `force-run` and `force-skip` are global overrides; `defer` means this
  # job has no opinion and every downstream gate behaves as it always has.
  # The one file check run-tests makes for itself: it supplies the force-run
  # signal and the answers its own two jobs need. Every suite asks
  # util.should-run its own question from inside its own workflow.
  should-run:
    uses: ./.github/workflows/util.should-run.yml
    with:
      any-of: frontend_all, e2e_all, custom_viz_all

  create-test-plan:
    name: Create test plan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    outputs:
      stats: ${{ steps.compute.outputs.stats }}
      fe_unit_specs_to_run: ${{ steps.compute.outputs.fe_unit_specs_to_run }}
      loki_stories_to_run: ${{ steps.compute.outputs.loki_stories_to_run }}
      e2e_specs_to_run: ${{ steps.compute.outputs.e2e_specs_to_run }}
    steps:
      - uses: actions/checkout@v6
      - name: Test which files changed
        id: changes
        uses: ./.github/actions/files-changed
        with:
          # comma separated list of files
          list-files: csv
      - name: Create test plan
        id: compute
        uses: ./.github/actions/create-test-plan
        with:
          changed-files: ${{ fromJSON(steps.changes.outputs.results).all_changed_files }}
          fe-changed-files: ${{ fromJSON(steps.changes.outputs.results).frontend_sources_files }}
          be-changed-files: ${{ fromJSON(steps.changes.outputs.results).backend_sources_files }}
          unit-infra-touched: ${{ fromJSON(steps.changes.outputs.results).frontend_unit_infra }}
          loki-infra-touched: ${{ fromJSON(steps.changes.outputs.results).frontend_loki_infra }}
          e2e-infra-touched: ${{ fromJSON(steps.changes.outputs.results).e2e_infra }}
          shared-sources-touched: ${{ fromJSON(steps.changes.outputs.results).shared_sources }}

  upload-affected-tests-stats:
    needs: create-test-plan
    # Only land rows for PRs from the upstream repo so forks don't pollute the table.
    if: |
      !cancelled() &&
      needs.create-test-plan.result == 'success' &&
      github.event.pull_request.head.repo.full_name == 'metabase/metabase'
    # Stats upload is best-effort — a failure here shouldn't fail the PR run.
    continue-on-error: true
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-node-bun
      - name: Upload affected tests stats
        env:
          STATS_JSON: ${{ needs.create-test-plan.outputs.stats }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ENG_STATS_URL: ${{ secrets.ENG_STATS_URL }}
          API_KEY: ${{ secrets.ENG_STATS_API_KEY }}
        run: bun .github/scripts/upload-affected-tests-stats.ts

  uberjar:
    needs: should-run
    if: ${{ needs.should-run.outputs.changed == 'true' }}
    uses: ./.github/workflows/uberjar.yml
    secrets: inherit

  # Compile CLJS in parallel with the uberjar and pass it to each e2e group.
  # The compile doesn't depend on MB_EDITION.
  e2e-cljs:
    name: Compile CLJS for e2e
    needs: should-run
    if: ${{ needs.should-run.outputs.changed == 'true' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - name: Compile CLJS
        run: bun run build-pure:cljs
      - name: Upload compiled CLJS
        uses: actions/upload-artifact@v7
        with:
          name: e2e-cljs-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cljs_dev
          if-no-files-found: error
          # Uploads fail when an artifact of this name already exists in the run
          # replace it rather than fail on a re-run.
          overwrite: true

  backend-tests:
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  semantic-search-tests:
    uses: ./.github/workflows/semantic-search.yml
    secrets: inherit

  app-db-tests:
    uses: ./.github/workflows/app-db.yml
    secrets: inherit

  driver-tests:
    uses: ./.github/workflows/drivers.yml
    secrets: inherit

  frontend-tests:
    uses: ./.github/workflows/frontend.yml
    secrets: inherit

  e2e-tests:
    needs: uberjar
    # Skip e2e tests when the uberjar build failed or was cancelled — the
    # downstream tests can't fetch a missing artifact, and we don't want to
    # mask the uberjar failure with a wave of misleading e2e errors. We still
    # enter the workflow when uberjar is `skipped` (docs-only PRs), because the
    # suite's own gate handles that path and reports the required
    # `e2e-tests-result` check as success. When the uberjar genuinely failed,
    # this whole job is skipped, the inner required checks never report, and
    # branch protection blocks the merge as pending.
    if: |
      !cancelled() &&
      needs.uberjar.result != 'failure' &&
      needs.uberjar.result != 'cancelled'
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit

  sdk-tests:
    needs: uberjar
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/embedding-sdk.yml
    secrets: inherit
    with:
      uberjar-built: ${{ needs.uberjar.result == 'success' }}

  bundle-size:
    needs: uberjar
    if: |
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.uberjar.result == 'success'
    uses: ./.github/workflows/bundle-size.yml
    secrets: inherit

  pr-env:
    needs: [uberjar]
    if: |
      !cancelled() &&
      contains(github.event.pull_request.labels.*.name, 'PR-Env') &&
      !contains(github.event.pull_request.labels.*.name, 'PR-Env-self-hosting') &&
      !contains(github.event.pull_request.labels.*.name, 'PR-Env-analytics-dev')
    uses: ./.github/workflows/pr-env.yml
    secrets: inherit
    with:
      self_hosting: false
      analytics_dev_mode: false

  pr-env-self-hosting:
    needs: [uberjar]
    if: |
      !cancelled() &&
      contains(github.event.pull_request.labels.*.name, 'PR-Env-self-hosting')
    uses: ./.github/workflows/pr-env.yml
    secrets: inherit
    with:
      self_hosting: true
      analytics_dev_mode: false

  pr-env-analytics-dev:
    needs: [uberjar]
    if: |
      !cancelled() &&
      contains(github.event.pull_request.labels.*.name, 'PR-Env-analytics-dev')
    uses: ./.github/workflows/pr-env.yml
    secrets: inherit
    with:
      self_hosting: false
      analytics_dev_mode: true

  pr-env-stats-dump:
    needs: [uberjar]
    if: |
      !cancelled() &&
      contains(github.event.pull_request.labels.*.name, 'PR-Env-Stats-Dump')
    uses: ./.github/workflows/pr-env.yml
    secrets: inherit
    with:
      self_hosting: false
      analytics_dev_mode: false
      stats_dump: true

  containerize:
    needs: [uberjar]
    if: |
      !cancelled() &&
      needs.uberjar.result == 'success' &&
      (
        (github.event_name == 'push' && contains(fromJson('["master", "metabot-v3-main", "internal-tools"]'), github.ref_name)) ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-docker-uberjar'))
      )
    uses: ./.github/workflows/containerize-uberjar.yml
    secrets: inherit
