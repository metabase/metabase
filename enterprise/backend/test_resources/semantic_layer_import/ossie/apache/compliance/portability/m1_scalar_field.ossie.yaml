# M1 ladder rung: baseline plus one scalar field expression (calculated
# column), no aggregation. Element under test: the amount_with_tax field.
# Reference-form note: a field expression resolves inside its own dataset, so
# it references the sibling column bare (amount). The qualified/bare axis that
# #486 and #343 settle applies to metric references, not to intra-dataset field
# expressions, so this rung has a single fixture.
version: "0.2.0.dev0"
name: m1_sales
description: "M1: single dataset, one scalar calculated-column field expression."
datasets:
  - name: sales
    source: samples.sales.orders
    fields:
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount
        datatype: Decimal
      - name: amount_with_tax
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount * 1.1
        datatype: Decimal
metrics:
  - name: total_amount
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(sales.amount)
    datatype: Decimal
