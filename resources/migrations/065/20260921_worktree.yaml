  - changeSet:
      id: v65.2026-09-22T10:44:00
      author: ranquild
      comment: Drop the global unique constraint on public_uuid everywhere a worktree checks content out - each is replaced by a per-worktree one below. The constraints were declared inline, so postgres and mysql named them after the table and the column while h2 picked a name of its own that has to be looked up
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE report_card DROP CONSTRAINT report_card_public_uuid_key;
              ALTER TABLE report_dashboard DROP CONSTRAINT report_dashboard_public_uuid_key;
        - sql:
            dbms: mysql,mariadb
            splitStatements: true
            sql: |
              ALTER TABLE report_card DROP INDEX public_uuid;
              ALTER TABLE report_dashboard DROP INDEX public_uuid;
        - sql:
            dbms: h2
            splitStatements: true
            sql: |
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE REPORT_CARD DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
                  ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND kcu.TABLE_NAME = tc.TABLE_NAME
                WHERE tc.TABLE_NAME = 'REPORT_CARD'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'PUBLIC_UUID'
              );
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE REPORT_DASHBOARD DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu
                  ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME AND kcu.TABLE_NAME = tc.TABLE_NAME
                WHERE tc.TABLE_NAME = 'REPORT_DASHBOARD'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'PUBLIC_UUID'
              );
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: true
            sql: |
              ALTER TABLE report_card ADD CONSTRAINT report_card_public_uuid_key UNIQUE (public_uuid);
              ALTER TABLE report_dashboard ADD CONSTRAINT report_dashboard_public_uuid_key UNIQUE (public_uuid);
        - sql:
            dbms: mysql,mariadb
            splitStatements: true
            sql: |
              ALTER TABLE report_card ADD UNIQUE KEY public_uuid (public_uuid);
              ALTER TABLE report_dashboard ADD UNIQUE KEY public_uuid (public_uuid);
        - sql:
            dbms: h2
            splitStatements: true
            sql: |
              ALTER TABLE report_card ADD CONSTRAINT uq_report_card_public_uuid UNIQUE (public_uuid);
              ALTER TABLE report_dashboard ADD CONSTRAINT uq_report_dashboard_public_uuid UNIQUE (public_uuid);

