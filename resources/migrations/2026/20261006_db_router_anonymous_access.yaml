## Admins state, per router database, that anonymous traffic may query it. Routers that already have published guest
## embeds are backfilled as granted.

databaseChangeLog:
  - changeSet:
      id: 3i2jpz
      author: johnswanson
      comment: Add db_router.anonymous_access_granted
      changes:
        - addColumn:
            tableName: db_router
            columns:
              - column:
                  name: anonymous_access_granted
                  type: ${boolean.type}
                  remarks: Whether an admin has granted anonymous traffic permission to query this router database
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  - changeSet:
      id: 6m7im9
      author: johnswanson
      comment: Grant anonymous access to routers that already have published guest embeds
      changes:
        - sql:
            sql: >-
              UPDATE db_router
              SET anonymous_access_granted = TRUE
              WHERE EXISTS (SELECT 1
                            FROM report_card
                            WHERE report_card.database_id = db_router.database_id
                              AND report_card.enable_embedding = TRUE)
                 OR EXISTS (SELECT 1
                            FROM report_dashboard
                            JOIN report_dashboardcard ON report_dashboardcard.dashboard_id = report_dashboard.id
                            JOIN report_card ON report_card.id = report_dashboardcard.card_id
                            WHERE report_dashboard.enable_embedding = TRUE
                              AND report_card.database_id = db_router.database_id)
                 OR EXISTS (SELECT 1
                            FROM report_dashboard
                            JOIN report_dashboardcard ON report_dashboardcard.dashboard_id = report_dashboard.id
                            JOIN dashboardcard_series ON dashboardcard_series.dashboardcard_id = report_dashboardcard.id
                            JOIN report_card ON report_card.id = dashboardcard_series.card_id
                            WHERE report_dashboard.enable_embedding = TRUE
                              AND report_card.database_id = db_router.database_id);
      rollback: # nothing to do; rolling back the preceding changeset drops the column
