## Add a nullable data_sensitivity classification label to metabase_field and to its user-settings
## mirror table.
##
## The label is metadata only. Nothing in the query processor, permissions, or sandboxing reads it;
## it neither masks nor filters anything. It is orthogonal to visibility_type, which hides a field
## rather than classifying it.
##
## The value is one of a closed set of classification codes (see remarks below) or NULL. NULL means
## "never classified": no human has set a label and no automated classifier has suggested one. A
## PUBLIC label is a deliberate "reviewed, not sensitive" and is distinct from NULL.
##
## The column lives in two tables for the same reason every other user-settable field attribute
## does. metabase_field holds the effective value that sync, classifiers, and the API all write to.
## metabase_field_user_settings holds only values a human set through the API; the Field model's
## before-update hook overlays a non-NULL mirror value on top of any automated write, so a human's
## label always wins over a classifier's.

databaseChangeLog:
  - changeSet:
      id: v64.2026-09-01T00:00:00
      author: tplude
      comment: Add nullable data_sensitivity classification column to metabase_field
      changes:
        - addColumn:
            tableName: metabase_field
            columns:
              - column:
                  name: data_sensitivity
                  type: varchar(32)
                  remarks: "Data sensitivity classification of the field. One of PII, SEC_KEY, PHI, PCI_FIN, BIO_GEN, SENS_PERS, CORP_IP, SYS_TELEMETRY, BIZ_CONF, PUBLIC. NULL means the field has never been classified."
                  constraints:
                    nullable: true

  - changeSet:
      id: v64.2026-09-01T00:00:01
      author: tplude
      comment: Add nullable data_sensitivity column to metabase_field_user_settings
      changes:
        - addColumn:
            tableName: metabase_field_user_settings
            columns:
              - column:
                  name: data_sensitivity
                  type: varchar(32)
                  remarks: "User-set data_sensitivity for the Field. A non-NULL value here overrides any value an automated writer puts in metabase_field.data_sensitivity."
                  constraints:
                    nullable: true
