name: E2E Tests

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-e2e
  cancel-in-progress: true

jobs:
  # csv so the narrowing below can compare the two changed-file lists.
  should-run:
    uses: ./.github/workflows/util.should-run.yml
    with:
      any-of: e2e_all
      list-files: csv

  e2e-matrix-builder:
    needs: should-run
    uses: ./.github/workflows/e2e-matrix-builder.yml
    with:
      chunks: 50
      # e2e_all_files lists every change that triggers e2e at all. When it is
      # identical to the changed spec list, only specs moved and we can run just
      # those. Never narrow on a forced run or outside a pull request — there we
      # always want the full suite, even though the file lists still compute.
      specs: >-
        ${{ needs.should-run.outputs.force-run != 'true' &&
        github.event_name == 'pull_request' &&
        fromJSON(needs.should-run.outputs.results).e2e_all_files == fromJSON(needs.should-run.outputs.results).e2e_specs_files &&
        fromJSON(needs.should-run.outputs.results).e2e_specs_files || '' }}

  reset-e2e-test-comment:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
      - name: Remove test results comment
        uses: actions/github-script@v9
        with:
          script: | # js
            const { owner, repo } = context.repo;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
            }).catch(console.error);

            if (!comments) {
              return;
            }

            const comment = comments.find((comment) => comment.body.includes('## e2e tests failed on '));

            if (comment) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: comment.id,
              });
            }

  e2e-tests:
    name: ${{ matrix.name }}-${{ matrix.edition }}
    uses: ./.github/workflows/e2e-test.yml
    needs:
      - should-run
      - e2e-matrix-builder
    if: ${{ needs.should-run.outputs.changed == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.e2e-matrix-builder.outputs.matrix) }}
    secrets: inherit
    with:
      name: ${{ matrix.name }}
      edition: ${{ matrix.edition }}
      specs: ${{ matrix.specs }}
      total_chunks: ${{ fromJson(needs.e2e-matrix-builder.outputs.regularChunks) }}
      split_index: ${{ strategy.job-index }}
      tags: ${{ matrix.tags }}
      runner: ${{ matrix.runner }}

  collect-timings:
    name: Collect E2E Timings
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    needs: e2e-tests
    if: always() && !cancelled() && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            e2e/support
          sparse-checkout-cone-mode: false

      - name: Download all timing artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: timing-data-*
          path: timing-files
          merge-multiple: false
        continue-on-error: true

      - name: Merge split timings
        id: merge
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const globber = await glob.create('timing-files/*/chunkTimings.json');
            const chunkFiles = await globber.glob();

            const specs = new Map();
            chunkFiles.forEach(file => {
              const { durations = [] } = JSON.parse(fs.readFileSync(file, 'utf8'));
              durations.forEach(({ spec, duration }) => specs.set(spec, duration));
            });

            if (specs.size === 0) {
              throw new Error('No timing data found - no specs had timing changes');
            }

            const outputPath = 'e2e/support/runTimings.json';
            fs.mkdirSync(path.dirname(outputPath), { recursive: true });

            const runTimings = {
              durations: [...specs].map(([spec, duration]) => ({ spec, duration }))
            };

            fs.writeFileSync(outputPath, JSON.stringify(runTimings, null, 2));
            console.log(`Merged timing data for ${specs.size} specs`);

      - name: Upload merged timing files
        if: steps.merge.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: merged-e2e-timings
          path: e2e/support/runTimings.json
          retention-days: 7

  e2e-tests-result:
    needs:
      - should-run
      - e2e-matrix-builder
      - e2e-tests
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    name: e2e-tests-result
    # ci:skip turns the run off outright, so this check skips with it rather than
    # reporting green for tests nobody asked to run.
    if: ${{ !cancelled() && needs.should-run.outputs.force-skip != 'true' }}
    env:
      E2E_TESTS_RESULT: ${{ needs.e2e-tests.result }}
    steps:
      # A gate that failed instead of answering also leaves e2e-tests `skipped`,
      # which the steps below would otherwise read as "nothing to run".
      - name: Check that the gate answered
        if: >-
          ${{ needs.should-run.result != 'success'
          || (needs.e2e-matrix-builder.result != 'success'
          && needs.e2e-matrix-builder.result != 'skipped') }}
        env:
          SHOULD_RUN_RESULT: ${{ needs.should-run.result }}
          MATRIX_RESULT: ${{ needs.e2e-matrix-builder.result }}
        run: | # sh
          echo "::error::The e2e gate never produced an answer (should-run: $SHOULD_RUN_RESULT, e2e-matrix-builder: $MATRIX_RESULT)"
          exit 1
      - name: Stub
        if: ${{ needs.e2e-tests.result == 'skipped' }}
        run: |
          echo "Didn't run due to conditional filtering"
      - name: Test results
        if: ${{ needs.e2e-tests.result != 'skipped' }}
        run: | # sh
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"

          if [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "E2E Tests failed"
            exit 1
          fi
