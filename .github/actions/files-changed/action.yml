    value: ${{ steps.filter.outputs.changes || steps.hydrate.outputs.changes }}
  results:
    description: >
      Every paths-filter output as a JSON object. An escape hatch for filters
      added to file-paths.yaml but not yet declared as outputs above — read them
      with fromJSON(steps.<id>.outputs.results).<filter>.
    value: ${{ steps.hydrate.outputs.results || toJSON(steps.filter.outputs) }}
  cache-hit:
    description: "'true' when the results were reused from a previous run on this commit."
    value: ${{ steps.hydrate.outputs.cached || 'false' }}

runs:
  using: composite
  steps:
    # The cache key has to pin everything the answer depends on: which commit we
    # are filtering, what we are filtering it against, and the filter config
    # itself. The config is covered by the commit — for a pull_request, GITHUB_SHA
    # is the merge commit, so it moves whenever either the head or the base does.
    - name: Work out the cache key
      id: key
      shell: bash
      env:
        FILTERS: ${{ inputs.filters }}
        LIST_FILES: ${{ inputs.list-files }}
        BASE: ${{ inputs.base }}
        CHECKOUT: ${{ inputs.checkout }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        PUSH_BEFORE_SHA: ${{ github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail

        # Cache keys may not contain commas, and we want them readable, so fold
        # anything that isn't key-safe into a dash.
        slug() { printf '%s' "$1" | tr -c '[:alnum:]._-' '-'; }

        base_sha="${PR_BASE_SHA:-}"
        [ -n "$base_sha" ] || base_sha="${MERGE_GROUP_BASE_SHA:-}"
        [ -n "$base_sha" ] || base_sha="${PUSH_BEFORE_SHA:-}"
        [ -n "$base_sha" ] || base_sha="none"

        key="files-changed-v1"
        key="$key-$(slug "$GITHUB_EVENT_NAME")"
        key="$key-$(slug "$FILTERS")"
        key="$key-$(slug "$LIST_FILES")"
        key="$key-$(slug "${BASE:-auto}")"
        key="$key-$base_sha-${HEAD_SHA}-${GITHUB_SHA}"

        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "file=$RUNNER_TEMP/files-changed/$key.txt" >> "$GITHUB_OUTPUT"

        # `auto` means: only clone if the filter config isn't already here. A job
        # that checked the repo out to reach this action in the first place has
        # nothing to gain from doing it twice.
        case "$CHECKOUT" in
          true|false) needed="$CHECKOUT" ;;
          auto) if [ -f "$FILTERS" ]; then needed=false; else needed=true; fi ;;
          *) echo "::error::checkout must be one of auto, true, false (got '$CHECKOUT')"; exit 1 ;;
        esac
        echo "checkout=$needed" >> "$GITHUB_OUTPUT"

    - name: Look for results from an earlier run on this commit
      id: restore
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.key.outputs.file }}
        key: ${{ steps.key.outputs.key }}

    # The cached file is already in $GITHUB_OUTPUT's own format, so replaying it
    # needs no parser — which means the fast path can't fail on a missing tool.
    # `cached=true` is written last, so its presence on the final line proves the
    # file was written completely.
    - name: Replay the cached results
      id: hydrate
      if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      env:
        FILE: ${{ steps.key.outputs.file }}
      run: |
        set -euo pipefail
        if [ ! -s "$FILE" ] || [ "$(tail -n 1 "$FILE")" != "cached=true" ]; then
          echo "Cache entry is truncated or malformed; filtering from scratch."
          exit 0
        fi
        cat "$FILE" >> "$GITHUB_OUTPUT"
        echo "Reused paths-filter results cached for this commit."

    - name: Checkout repository
      if: steps.hydrate.outputs.cached != 'true' && steps.key.outputs.checkout == 'true'
      uses: actions/checkout@v6
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Test which files changed
      id: filter
      if: steps.hydrate.outputs.cached != 'true'
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
      with:
        token: ${{ inputs.token || github.token }}
        filters: ${{ inputs.filters }}
        list-files: ${{ inputs.list-files }}
        base: ${{ inputs.base }}

    - name: Cache the results for the rest of this commit's workflows
      if: steps.hydrate.outputs.cached != 'true' && inputs.cache == 'true'
      shell: bash
      env:
        FILE: ${{ steps.key.outputs.file }}
        OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
      run: |
        set -euo pipefail

        if ! command -v jq >/dev/null 2>&1; then
          echo "::warning::jq is not on this runner, so the files-changed results can't be cached."
          exit 0
        fi

        # Filters live in file-paths.yaml but have to be declared as outputs here
        # to be readable by name, so a new filter is easy to add and easy to
        # forget — and a forgotten one reads as an empty string, silently
        # skipping whatever job depends on it. Say so loudly.
        declared=$(awk '/^outputs:/ {inside=1; next} /^[a-z]/ {inside=0} inside && /^  [A-Za-z_]/ {gsub(/[ :]/, ""); print}' "$GITHUB_ACTION_PATH/action.yml")
        undeclared=""
        if [ -n "$declared" ]; then
          undeclared=$(printf '%s' "$OUTPUTS" | jq -r 'keys[]' | grep -vxF "$declared" || true)
        fi
        if [ -n "$undeclared" ]; then
          echo "::error::These paths-filter outputs are missing from .github/actions/files-changed/action.yml, so callers can't read them by name (use the 'results' output until they're added): $(echo "$undeclared" | tr '\n' ' ')"
        fi

        mkdir -p "$(dirname "$FILE")"

        # A random delimiter so a file list can never terminate its own heredoc.
        delim="ghadelim-$RANDOM$RANDOM$RANDOM-$$"
        if ! printf '%s' "$OUTPUTS" | jq -r --arg d "$delim" '
              to_entries[] | "\(.key)<<\($d)\n\(.value | tostring)\n\($d)"' > "$FILE"; then
          echo "::warning::Could not serialise the paths-filter results; skipping the cache."
          rm -f "$FILE"
          exit 0
        fi
        printf 'results<<%s\n%s\n%s\n' "$delim" "$(printf '%s' "$OUTPUTS" | jq -c .)" "$delim" >> "$FILE"
        printf 'cached=true\n' >> "$FILE"

    # Losing this race against a sibling workflow on the same commit is fine:
    # whoever got there first cached the same answer.
    - name: Save the results
      if: steps.hydrate.outputs.cached != 'true' && inputs.cache == 'true'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.key.outputs.file }}
        key: ${{ steps.key.outputs.key }}
