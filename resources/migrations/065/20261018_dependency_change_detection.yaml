## The dependency jobs find changed entities by comparing their updated_at with the version their status row last
## recorded, instead of reading stale flags that every write had to set. The status rows lose the flag and the retry
## state, and the rows a dependency's version is made of get the timestamps they lacked.

databaseChangeLog:
  - changeSet:
      id: v65.k3vq8d
      author: ranquild
      comment: Drop the index on dependency_status.stale, which the jobs no longer read
      changes:
        - dropIndex:
            tableName: dependency_status
            indexName: idx_dependency_status_stale
      rollback:
        - sql:
            dbms: postgresql
            sql: CREATE INDEX idx_dependency_status_stale ON dependency_status(stale) WHERE stale = true
        - sql:
            dbms: mysql,mariadb,h2
            sql: CREATE INDEX idx_dependency_status_stale ON dependency_status(stale)

  - changeSet:
      id: v65.r7mw2x
      author: ranquild
      comment: Drop the stale flag and the retry state of dependency_status
      changes:
        - dropColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: stale
              - column:
                  name: fail_count
              - column:
                  name: next_retry_at
              - column:
                  name: terminal
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: stale
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity needs dependency recalculation
                  constraints:
                    nullable: false
              - column:
                  name: fail_count
                  type: int
                  defaultValueNumeric: 0
                  remarks: Number of consecutive failed dependency calculation attempts
                  constraints:
                    nullable: false
              - column:
                  name: next_retry_at
                  type: ${timestamp_type}
                  remarks: Earliest time at which a failed entity can be retried (null means immediately processable)
              - column:
                  name: terminal
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity has exceeded max retries and should not be retried until modified
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.b5tn0e
      author: ranquild
      comment: Record the version of the entity that dependency_status was computed from, and when
      changes:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: seen_updated_at
                  type: ${timestamp_type}
                  remarks: The latest updated_at of the entity and the rows it is made of when its dependencies were computed, or null to compute them again
              - column:
                  name: seen_count
                  type: int
                  remarks: The number of rows the entity is made of when its dependencies were computed
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last written
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: seen_updated_at
              - column:
                  name: seen_count
              - column:
                  name: created_at
              - column:
                  name: updated_at

  - changeSet:
      id: v65.p9cx4h
      author: ranquild
      comment: Add created_at and updated_at to dashboardcard_series
      changes:
        - addColumn:
            tableName: dashboardcard_series
            columns:
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last updated
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: dashboardcard_series
            columns:
              - column:
                  name: created_at
              - column:
                  name: updated_at

  - changeSet:
      id: v65.w2fj6s
      author: ranquild
      comment: Add created_at and updated_at to query_action
      changes:
        - addColumn:
            tableName: query_action
            columns:
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last updated
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: query_action
            columns:
              - column:
                  name: created_at
              - column:
                  name: updated_at

  - changeSet:
      id: v65.g8ld1u
      author: ranquild
      comment: Add created_at and updated_at to sandboxes
      changes:
        - addColumn:
            tableName: sandboxes
            columns:
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last updated
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: sandboxes
            columns:
              - column:
                  name: created_at
              - column:
                  name: updated_at

  - changeSet:
      id: v65.t4hz9n
      author: ranquild
      comment: Drop the index on analysis_finding.stale, which the analysis finding job no longer reads
      changes:
        - dropIndex:
            tableName: analysis_finding
            indexName: idx_analysis_finding_stale
      rollback:
        - sql:
            dbms: postgresql
            sql: CREATE INDEX idx_analysis_finding_stale ON analysis_finding(stale) WHERE stale = true
        - sql:
            dbms: mysql,mariadb,h2
            sql: CREATE INDEX idx_analysis_finding_stale ON analysis_finding(stale)

  - changeSet:
      id: v65.c6ue3m
      author: ranquild
      comment: Replace analysis_finding.stale with the version of the entity the finding was analyzed from
      changes:
        - dropColumn:
            tableName: analysis_finding
            columnName: stale
        - addColumn:
            tableName: analysis_finding
            columns:
              - column:
                  name: seen_updated_at
                  type: ${timestamp_type}
                  remarks: The latest updated_at of the entity and the rows it is made of when it was analyzed, or null to analyze it again
              - column:
                  name: seen_count
                  type: int
                  remarks: The number of rows the entity is made of when it was analyzed
      rollback:
        - dropColumn:
            tableName: analysis_finding
            columns:
              - column:
                  name: seen_updated_at
              - column:
                  name: seen_count
        - addColumn:
            tableName: analysis_finding
            columns:
              - column:
                  name: stale
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity needs re-analysis due to upstream changes
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.y1ra7q
      author: ranquild
      comment: Create analysis_finding_status for re-analyzing the dependents of changed entities
      changes:
        - createTable:
            tableName: analysis_finding_status
            remarks: The version of each entity the findings of its transitive dependents were last analyzed from
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_type
                  type: varchar(254)
                  remarks: The type of the entity
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: int
                  remarks: The ID of the entity
                  constraints:
                    nullable: false
              - column:
                  name: seen_updated_at
                  type: ${timestamp_type}
                  remarks: The latest updated_at of the entity and the rows it is made of when its dependents were analyzed, or null to analyze them again
              - column:
                  name: seen_count
                  type: int
                  remarks: The number of rows the entity is made of when its dependents were analyzed
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last written, which guards recording a version over a row written again meanwhile
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: analysis_finding_status

  - changeSet:
      id: v65.e0vk5w
      author: ranquild
      comment: Unique constraint to prevent duplicate analysis_finding_status entries
      changes:
        - addUniqueConstraint:
            tableName: analysis_finding_status
            columnNames: entity_type, entity_id
            constraintName: idx_unique_analysis_finding_status
      rollback:
        - dropUniqueConstraint:
            tableName: analysis_finding_status
            constraintName: idx_unique_analysis_finding_status
