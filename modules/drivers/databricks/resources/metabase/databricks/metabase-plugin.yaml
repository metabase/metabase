info:
  name: Metabase Databricks Driver
  version: 1.2.0
  description: Allows Metabase to connect to Databricks SQL warehouse with personal access tokens, OAuth M2M, or workload identity federation (OIDC JWT)
dependencies:
  - plugin: Metabase Hive Like Abstract Driver
driver:
  - name: databricks
    display-name: Databricks
    lazy-load: true
    parent: hive-like
    connection-properties:
      - merge:
        - host
        - display-name: Host
          required: true
          placeholder: xxxxxxxxxx.cloud.databricks.com
          helper-text: The Databricks host URL. Could also be adb-xxxxx.azuredatabricks.net
      - name: http-path
        display-name: HTTP Path
        helper-text: Found in SQL Warehouses > Connection details
        required: true
        placeholder: /sql/1.0/endpoints/abcdef1234567890
      - name: auth-mode
        display-name: Authentication method
        type: select
        default: m2m
        required: true
        options:
          - {name: "OAuth M2M (service principal)",      value: "m2m"}
          - {name: "Personal Access Token",              value: "pat"}
          - {name: "Workload Identity Federation (JWT)", value: "wif"}
      - merge:
        - password
        - name: token
          display-name: Personal Access Token
          required: true
          helper-text: Personal Access Token for authentication.
          placeholder: dapiXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
          visible-if:
            auth-mode: pat
      - name: client-id
        display-name: Service Principal Client ID
        placeholder: e26ce240-0a12-454f-934f-4c646603cb61
        helper-text: For M2M OAuth, the service principal's Client ID.
        required: true
        visible-if:
          auth-mode: m2m
      - merge:
        - password
        - name: oauth-secret
          display-name: Service Principal OAuth Secret
          placeholder: dosexxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
          helper-text: OAuth Secret for M2M OAuth authentication.
          required: true
          visible-if:
            auth-mode: m2m
      - merge:
        - password
        - name: wif-token
          display-name: OIDC token (inline, for testing)
          helper-text: Paste a JWT for a one-off test. Use a token file in production.
          placeholder: "eyJhbGciOi..."
          visible-if:
            auth-mode: wif
      - name: wif-token-file-path
        display-name: OIDC token file path
        helper-text: Path to a file containing an OIDC JWT.
        placeholder: "/var/run/secrets/tokens/oidc-token"
        visible-if:
          auth-mode: wif
      - merge:
        - multi-level-schema
        - display-name: Enable multiple catalogs
      - name: catalog
        display-name: Default Catalog
        placeholder: default
        helper-text: Specify the default catalog to connect to.
        required: true
      - name: schema-filters
        type: schema-filters
        display-name: Catalogs and Schemas
        placeholder: >-
          If multiple catalogs enabled:
              E.x. catalog_1.schema, catalog_2\.*, catalog_3\.auth*

          Otherwise:
              E.x. schema_1,auth*
        helper-text: Optionally filter which schemas are visible.
      - advanced-options-start
      - merge:
          - additional-options
          - placeholder: IgnoreTransactions=0
      - default-advanced-options
init:
  - step: load-namespace
    namespace: metabase.driver.hive-like
  - step: load-namespace
    namespace: metabase.driver.databricks
  - step: register-jdbc-driver
    class: com.databricks.client.jdbc.Driver
