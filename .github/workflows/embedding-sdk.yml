name: SDK

on:
  workflow_call:
    inputs:
      plan:
        description: >-
          The CI test plan, as JSON. The caller builds it; the `embedding-sdk`
          workflow in it decides the jobs below. `{}` means there is no
          plan, and everything runs.
        type: string
        default: '{}'
    outputs:
      ok:
        description: >-
          Whether everything the plan asked of this workflow ran and passed.
          Empty when the roll-up job did not get to publish a verdict, so read
          it alongside this workflow's own result rather than instead of it.
        value: ${{ jobs.embedding-sdk-tests-result.outputs.ok }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-sdk-package:
    name: "Build Embedding SDK package"
    if: ${{ inputs.plan == '{}' || fromJSON(inputs.plan).workflows.embedding-sdk.jobs.build-sdk-package.run }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - name: Build Embedding SDK package
        run: |
          # Remove the matchers to not report false positives on every PR
          # unrelated to embedding (EMB-765)
          echo "::remove-matcher owner=tsc::"
          bun run build-embedding-sdk-package
      - name: Smoke test the packed SDK CLI
        run: node bin/embedding-sdk/test-sdk-package.mjs
      - name: Prepare Embedding SDK artifact
        uses: actions/upload-artifact@v7
        with:
          name: embedding-sdk-${{ github.event.pull_request.head.sha || github.sha }}
          path: resources/embedding-sdk

  embedding-sdk-cli-snippets-type-check:
    needs: build-sdk-package
    if: ${{ inputs.plan == '{}' || fromJSON(inputs.plan).workflows.embedding-sdk.jobs.embedding-sdk-cli-snippets-type-check.run }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Retrieve Embedding SDK dist artifact
        uses: actions/download-artifact@v8
        with:
          name: embedding-sdk-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ github.workspace }}/resources/embedding-sdk
      - name: Run frontend embedding SDK snippets type check
        run: bun run embedding-sdk:cli-snippets:type-check

  embedding-sdk-docs-snippets-type-check:
    needs: build-sdk-package
    if: ${{ inputs.plan == '{}' || fromJSON(inputs.plan).workflows.embedding-sdk.jobs.embedding-sdk-docs-snippets-type-check.run }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Retrieve Embedding SDK dist artifact
        uses: actions/download-artifact@v8
        with:
          name: embedding-sdk-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ github.workspace }}/resources/embedding-sdk
      - name: Run frontend embedding SDK snippets type check
        run: bun run embedding-sdk:docs-snippets:type-check

  embedding-sdk-api-documentation-generation-validation:
    needs: build-sdk-package
    if: ${{ inputs.plan == '{}' || fromJSON(inputs.plan).workflows.embedding-sdk.jobs.embedding-sdk-api-documentation-generation-validation.run }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Retrieve Embedding SDK dist artifact
        uses: actions/download-artifact@v8
        with:
          name: embedding-sdk-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ github.workspace }}/resources/embedding-sdk
      - name: Generate documentation to check for generation errors
        id: docs-generation
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          # SC2016: the '$a' and '$aEOF' are sed commands, not shell variables.
          # shellcheck disable=SC2016
          bun run embedding-sdk:docs:generate:pure --emit none 2>&1 \
          | tee /dev/stdout \
          | tee >( tail -n 10 \
          | sed '1s/^/output<<EOF\n/' \
                   | sed '$aEOF' \
                   >> "$GITHUB_OUTPUT" )
          exit "${PIPESTATUS[0]}"
      - name: Comment on PR if 'not included in the documentation' error happens
        uses: ./.github/actions/notify-pull-request
        with:
          remove-previous-comment: true
          add-new-comment: ${{ steps.docs-generation.outcome == 'failure' && contains(steps.docs-generation.outputs.output, 'not included in the documentation') }}
          message: "📝 Some exported types from `@metabase/embedding-sdk-react` reference other types that are not exported, i.e. internal types.<br><br>The internal type reference breaks API documentation generation for the SDK and also may unexpectedly increase the output size of the type declaration file.<br><br>Please check the CI logs to find the name of such type.<br><br>- If a type should be publicly available in the SDK, add a description to it or a TypeDoc annotation and export it from SDK.<br>- If a type is internal and should _not_ be publicly exposed, refactor types to prevent referencing other types that are not exported from SDK.<br><br>You can run `bun run embedding-sdk:docs:generate` locally to  verify that the issue has been resolved."
          include-log: true
      - name: Comment on PR if 'Failed to resolve link' error happens
        uses: ./.github/actions/notify-pull-request
        with:
          remove-previous-comment: true
          add-new-comment: ${{ steps.docs-generation.outcome == 'failure' && contains(steps.docs-generation.outputs.output, 'Failed to resolve link') }}
          message: "📝 A typedoc `{@link <TYPE_NAME>}` annotation is found that can't be resolved.<br><br>Most likely it happens when the referenced type is not exported. Please check the CI logs to find the name of such type.<br><br>- If a referenced in `{@link}` type should be publicly available in the SDK, add a description to it or a TypeDoc annotation and export it from SDK.<br>- If a type is internal and should _not_ be publicly exposed, change types to prevent unexported type reference in `{@link}` annotation.<br><br>You can run `bun run embedding-sdk:docs:generate` locally to verify that the issue has been resolved."
          include-log: true
      - name: Fail Job
        if: ${{ steps.docs-generation.outcome == 'failure' }}
        run: exit 1

  # See `Component e2e tests` in `enterprise/frontend/src/embedding-sdk-package/dev.md`
  embedding-sdk-component-tests:
    name: "SDK component tests"
    needs: build-sdk-package
    if: ${{ inputs.plan == '{}' || fromJSON(inputs.plan).workflows.embedding-sdk.jobs.embedding-sdk-component-tests.run }}
    uses: ./.github/workflows/embedding-sdk-component-tests.yml
    secrets: inherit
    with:
      plan: ${{ inputs.plan }}

  not-required-embedding-sdk-apps-compatibility-tests:
    name: "SDK e2e tests for compatibility with (host/sample) apps"
    needs: build-sdk-package
    if: ${{ inputs.plan == '{}' || fromJSON(inputs.plan).workflows.embedding-sdk.jobs.not-required-embedding-sdk-apps-compatibility-tests.run }}
    uses: ./.github/workflows/embedding-sdk-host-sample-apps-tests.yml
    secrets: inherit
    with:
      plan: ${{ inputs.plan }}

  embedding-sdk-tests-result:
    needs:
      # Every job the `embedding-sdk` plan names, so the roll-up below can see
      # each one's result.
      - build-sdk-package
      - embedding-sdk-cli-snippets-type-check
      - embedding-sdk-docs-snippets-type-check
      - embedding-sdk-api-documentation-generation-validation
      - embedding-sdk-component-tests
      - not-required-embedding-sdk-apps-compatibility-tests
    if: always() && !cancelled()
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.aggregate.outputs.ok }}
    steps:
      - uses: actions/checkout@v6
      - name: Roll the SDK results up
        id: aggregate
        uses: ./.github/actions/aggregate-results
        with:
          needs: ${{ toJSON(needs) }}
          plan: ${{ inputs.plan }}
          workflow: embedding-sdk
          # The host and sample apps are reported here but do not gate: they
          # test other people's apps against this SDK, and a break there is not
          # this pull request's to fix.
          unrequired: not-required-embedding-sdk-apps-compatibility-tests
