dataset_query:
  database: Search Harness
  stages:
  - native: |-
      SELECT engine AS "Engine", split_part(embedder, '/', 2) AS "Embedder", data_scale AS "Scale",
             count(DISTINCT scenario_id) FILTER (WHERE metric = 'ndcg@10') AS "n scenarios",
             round(avg(value) FILTER (WHERE metric = 'ndcg@10')::numeric, 3) AS "nDCG@10",
             round(avg(value) FILTER (WHERE metric = 'recall@10')::numeric, 3) AS "Recall@10",
             round(avg(value) FILTER (WHERE metric = 'mrr')::numeric, 3) AS "MRR",
             round(avg(value) FILTER (WHERE metric = 'zero_result_rate')::numeric, 3) AS "Zero-result rate",
             -- No coalesce: runs recorded before BL-15 lack the metric, and blank (unknown) must not read as "none dropped".
             round(avg(value) FILTER (WHERE metric = 'unscored_rate')::numeric, 3) AS "Unscored"
      FROM harness_scenario_metric
      WHERE corpus_id = {{corpus}}
        AND embedding_text = {{variant}}
        AND text_strategy = {{strategy}}
        [[AND (data_scale = {{scale}} OR data_scale IS NULL)]]
      GROUP BY 1, 2, 3
      ORDER BY 3, 5 DESC NULLS LAST
    template-tags:
    - default: baseline
      display-name: Embedding text
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000005
      name: variant
      required: true
      type: text
    - default: none
      display-name: Text strategy
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000006
      name: strategy
      required: true
      type: text
    - default: northwind-golden-v1
      display-name: Corpus
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000001
      name: corpus
      required: true
      type: text
    - display-name: Scale
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000002
      name: scale
      required: false
      type: number
    lib/type: mbql.stage/native
  lib/type: mbql/query
