  - changeSet:
      id: v65.0e9f98
      author: ranquild
      comment: Add dashboardcard_series.updated_at
      changes:
        - addColumn:
            tableName: dashboardcard_series
            columns:
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last updated
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: dashboardcard_series
            columnName: updated_at

  - changeSet:
      id: v65.9ri9ot
      author: ranquild
      comment: Add query_action.created_at
      changes:
        - addColumn:
            tableName: query_action
            columns:
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: query_action
            columnName: created_at

  - changeSet:
      id: v65.cqbc46
      author: ranquild
      comment: Add query_action.updated_at
      changes:
        - addColumn:
            tableName: query_action
            columns:
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last updated
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: query_action
            columnName: updated_at

  - changeSet:
      id: v65.eqlbau
      author: ranquild
      comment: Add sandboxes.created_at
      changes:
        - addColumn:
            tableName: sandboxes
            columns:
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: sandboxes
            columnName: created_at

  - changeSet:
      id: v65.kz5g0p
      author: ranquild
      comment: Add sandboxes.updated_at
      changes:
        - addColumn:
            tableName: sandboxes
            columns:
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last updated
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: sandboxes
            columnName: updated_at

  - changeSet:
      id: v65.1suf0c
      author: ranquild
      comment: Drop the index on analysis_finding.stale, which the jobs no longer read
      changes:
        - dropIndex:
            tableName: analysis_finding
            indexName: idx_analysis_finding_stale
      rollback:
        - sql:
            dbms: postgresql
            sql: CREATE INDEX idx_analysis_finding_stale ON analysis_finding(stale) WHERE stale = true
        - sql:
            dbms: mysql,mariadb,h2
            sql: CREATE INDEX idx_analysis_finding_stale ON analysis_finding(stale)

  - changeSet:
      id: v65.d291qd
      author: ranquild
      comment: Drop analysis_finding.stale, which change detection from updated_at replaces
      changes:
        - dropColumn:
            tableName: analysis_finding
            columnName: stale
      rollback:
        - addColumn:
            tableName: analysis_finding
            columns:
              - column:
                  name: stale
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity needs re-analysis due to upstream changes
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.dd3wgm
      author: ranquild
      comment: Add analysis_finding.seen_updated_at
      changes:
        - addColumn:
            tableName: analysis_finding
            columns:
              - column:
                  name: seen_updated_at
                  type: ${timestamp_type}
                  remarks: The latest updated_at of the entity and the rows it is made of when it was analyzed, or null to analyze it again
      rollback:
        - dropColumn:
            tableName: analysis_finding
            columnName: seen_updated_at

  - changeSet:
      id: v65.6auo21
      author: ranquild
      comment: Add analysis_finding.seen_count
      changes:
        - addColumn:
            tableName: analysis_finding
            columns:
              - column:
                  name: seen_count
                  type: int
                  remarks: The number of rows the entity is made of when it was analyzed
      rollback:
        - dropColumn:
            tableName: analysis_finding
            columnName: seen_count

  - changeSet:
      id: v65.320dcb
      author: ranquild
      comment: Create analysis_finding_status for re-analyzing the dependents of changed entities
      changes:
        - createTable:
            tableName: analysis_finding_status
            remarks: The version of each entity the findings of its transitive dependents were last analyzed from
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_type
                  type: varchar(254)
                  remarks: The type of the entity
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: int
                  remarks: The ID of the entity
                  constraints:
                    nullable: false
              - column:
                  name: seen_updated_at
                  type: ${timestamp_type}
                  remarks: The latest updated_at of the entity and the rows it is made of when its dependents were analyzed, or null to analyze them again
              - column:
                  name: seen_count
                  type: int
                  remarks: The number of rows the entity is made of when its dependents were analyzed
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: When the row was last written, which guards recording a version over a row written again meanwhile
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: analysis_finding_status

  - changeSet:
      id: v65.fn007h
      author: ranquild
      comment: Unique constraint to prevent duplicate analysis_finding_status entries
      changes:
        - addUniqueConstraint:
            tableName: analysis_finding_status
            columnNames: entity_type, entity_id
            constraintName: idx_unique_analysis_finding_status
      rollback:
        - dropUniqueConstraint:
            tableName: analysis_finding_status
            constraintName: idx_unique_analysis_finding_status
