      author: ranquild
      comment: >-
        Backfill report_card.public_uuid_prefix from the leading 8 characters of the (still plaintext) public_uuid, so
        existing public links keep resolving. Runs before EncryptPublicUuids, which then encrypts public_uuid
        itself. 8 = public-sharing.core/public-uuid-prefix-length.
      changes:
        - sql: >-
            UPDATE report_card SET public_uuid_prefix = SUBSTRING(public_uuid, 1, 8) WHERE public_uuid IS NOT NULL
      rollback:
        - sql: >-
            UPDATE report_card SET public_uuid_prefix = NULL

