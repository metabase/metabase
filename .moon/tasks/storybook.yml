# Storybook and the visual regression suites built on it: chromatic and loki.

tasks:
  build-storybook:
    script: NODE_OPTIONS=--max-old-space-size=8192 storybook build
    deps:
      - build-cljs
    inputs:
      - "@group(frontend)"
      - .storybook/**
    outputs:
      - storybook-static/**

  chromatic:
    script: NODE_OPTIONS=--max-old-space-size=8192 chromatic
    deps:
      - build-cljs
    options:
      cache: false

  storybook:
    script: storybook dev -p 6006
    deps:
      - build-cljs
    options:
      persistent: true
      cache: false
      runInCI: false
      outputStyle: stream

  storybook-embedding-sdk:
    script:
      IS_EMBEDDING_SDK=true
      storybook dev -c frontend/src/embedding-sdk-shared/.storybook
      -p 6006
    deps:
      - build-cljs
    options:
      persistent: true
      cache: false
      runInCI: false
      outputStyle: stream

  test-visual-loki:
    script: NODE_ENV=development loki test --chromeFlags='--headless --disable-gpu'
    options:
      cache: false

  test-visual-loki-approve-diff:
    script:
      ls .loki/difference | xargs -I _ find .loki/current -name _ | xargs -I _
      cp _ .loki/reference/
    options:
      cache: false

  test-visual-loki-ci:
    script:
      NODE_ENV=development
      loki test --chromeFlags='--headless --disable-gpu'
      --reactUri file:./storybook-static
      --verboseRenderer
    deps:
      - build-storybook
    options:
      cache: false

  test-visual-loki-prune:
    script:
      ls .loki/reference
      | grep -v "$(ls .loki/current)"
      | xargs -I {} rm .loki/reference/{}
    options:
      cache: false

  test-visual-loki-report:
    script:
      node frontend/test/generate-loki-report-json.js
      && reg-cli --from .loki/report.json
      --report .loki/report.html
    options:
      cache: false

  test-visual-loki-report-open:
    script:
      NODE_ENV=development
      loki test --chromeFlags='--headless --disable-gpu'
      || (echo "Visual test failed, opening report..."
      && node frontend/test/generate-loki-report-json.js
      && reg-cli --from .loki/report.json --report .loki/report.html
      && open-cli .loki/report.html)
    options:
      cache: false
