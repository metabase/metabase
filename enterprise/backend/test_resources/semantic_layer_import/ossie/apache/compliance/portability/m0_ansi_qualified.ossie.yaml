# M0 ladder rung -- one dataset, one field, one SUM metric.
# Variant: ANSI_SQL tag, QUALIFIED reference form (dataset.field). PRIMARY fixture.
# The qualified form is carried as primary at every rung per the open #486
# (qualified dataset.field only) decision; the bare form is a sibling variant
# (see m0_sum_bare.ossie.yaml) pending #343.
version: "0.2.0.dev0"
name: m0_sales
description: M0 baseline -- single dataset, single field, single SUM metric.
datasets:
  - name: sales
    source: samples.sales.orders
    fields:
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount
        datatype: Decimal
metrics:
  - name: total_amount
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(sales.amount)
    datatype: Decimal
