## Create the `seed` table for Data Studio seeds.
##
## A seed is a stably-named reference CSV that lives in the remote-sync git repo
## (`seeds/<name>.csv`); the repo is the source of truth. This row is instance-local
## tracking, NOT storage: `table_id` links the table this instance materialized the CSV
## into (nullable: re-derived on pull), and `csv_hash`/`last_synced_sha` are the
## reconciliation keys used to skip no-op re-materializations. The bytes are never
## stored here.

databaseChangeLog:
  - changeSet:
      id: v64.seed1
      author: qnkhuat
      comment: Create seed table for Data Studio seeds (git-synced reference CSVs)
      changes:
        - createTable:
            tableName: seed
            remarks: Instance-local tracking for a git-versioned reference CSV and the warehouse table it materializes into.
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(254)
                  remarks: Stable slug; becomes the materialized table name and is what dependents reference.
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: unique_seed_name
              - column:
                  name: origin
                  type: varchar(16)
                  defaultValue: git
                  remarks: Who owns this seed. 'git' seeds are authored in the repo and managed by sync (materialized on pull, pruned when their file is gone); 'upload' seeds are created in-app and never touched by sync.
                  constraints:
                    nullable: false
              - column:
                  name: csv_hash
                  type: varchar(64)
                  remarks: SHA-256 hex of the repo CSV last materialized here; a pull skips re-materializing when it matches.
                  constraints:
                    nullable: true
              - column:
                  name: table_id
                  type: int
                  remarks: The warehouse table this seed materialized into on this instance. NULL until (re)materialized.
                  constraints:
                    nullable: true
              - column:
                  name: target_db_id
                  type: int
                  remarks: Database the seed's sidecar targets; groups seeds in the UI and shows a failed seed (uploads-disabled db) under its intended db. NULL when the sidecar names a db that doesn't resolve on this instance.
                  constraints:
                    nullable: true
              - column:
                  name: schema_name
                  type: varchar(254)
                  remarks: Target schema within the database (Metabase has no schema id, so this is a plain name like metabase_table.schema). NULL means the database's default upload schema.
                  constraints:
                    nullable: true
              - column:
                  name: collection_id
                  type: int
                  remarks: The Library/Data collection the seed's table is published into.
                  constraints:
                    nullable: true
              - column:
                  name: entity_id
                  type: char(21)
                  remarks: Serdes portable identity.
                  constraints:
                    nullable: true
                    unique: true
                    uniqueConstraintName: unique_seed_entity_id
              - column:
                  name: last_synced_sha
                  type: varchar(40)
                  remarks: Git commit SHA the CSV was last synced from. NULL until first sync.
                  constraints:
                    nullable: true
              - column:
                  name: sync_error
                  type: ${text.type}
                  remarks: Error from the most recent failed materialization, NULL when the last one succeeded.
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  remarks: When the seed was created.
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  remarks: When the seed was last updated.
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: seed
            baseColumnNames: table_id
            referencedTableName: metabase_table
            referencedColumnNames: id
            constraintName: fk_seed_table_id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: seed
            baseColumnNames: collection_id
            referencedTableName: collection
            referencedColumnNames: id
            constraintName: fk_seed_collection_id
            onDelete: SET NULL
        - addForeignKeyConstraint:
            baseTableName: seed
            baseColumnNames: target_db_id
            referencedTableName: metabase_database
            referencedColumnNames: id
            constraintName: fk_seed_target_db_id
            onDelete: SET NULL
