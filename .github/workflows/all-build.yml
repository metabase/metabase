name: Build ALL Portal BI (Metabase OSS fork)

# Gera a imagem Docker do fork e publica no GitHub Container Registry (ghcr.io).
# Dispara a cada push no branch all-branding, ou manualmente em Actions → Run workflow.
on:
  push:
    branches:
      - all-branding
    paths-ignore:
      - "ALL-FORK.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Versão do Metabase em que este fork se baseia. Atualize ao migrar de versão.
  BASE_VERSION: v0.63.18.4

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Liberar espaço em disco no runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Definir versão e nome da imagem
        id: meta
        run: |
          VERSION="${BASE_VERSION}-all.${{ github.run_number }}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/portal-bi"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Imagem: $IMAGE:$VERSION"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push (edição OSS)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            MB_EDITION=oss
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ env.BASE_VERSION }}-all
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
