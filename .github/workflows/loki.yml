name: Loki Visual Regression Testing

on:
  workflow_call:
    inputs:
      skip:
        type: boolean
        default: false
      test-plan-artifact-id:
        description: "ID of this run's test-plan.json artifact, '' to run the full suite."
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-loki
  cancel-in-progress: true

jobs:
  story-selection:
    if: ${{ !inputs.skip && inputs.test-plan-artifact-id != '' }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
      test-plan-artifact-id: ${{ steps.selection.outputs.paths-file && inputs.test-plan-artifact-id || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            /package.json
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"
      - name: Prepare Loki story selection
        id: selection
        uses: ./.github/actions/prepare-test-selection
        with:
          suite: loki
          test-plan-artifact-id: ${{ inputs.test-plan-artifact-id }}

  visual-test:
    needs: story-selection
    # A missing job output compares equal to '0' in GitHub expressions,
    # so an empty selection is marked with a non-numeric value.
    if: ${{ !cancelled() && !inputs.skip && needs.story-selection.outputs.selection != 'empty' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    services:
      docker:
        image: docker:19.03.12
        options: --privileged
        ports:
          - 2376:2376
        env:
          DOCKER_TLS_CERTDIR: /certs
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /tmp/docker-certs:/certs/client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare frontend environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        run: NODE_ENV=development bun run build-pure:cljs

      - name: Prepare Loki story selection
        id: selection
        if: ${{ needs.story-selection.outputs.test-plan-artifact-id != '' }}
        uses: ./.github/actions/prepare-test-selection
        with:
          suite: loki
          test-plan-artifact-id: ${{ needs.story-selection.outputs.test-plan-artifact-id }}

      - name: Build Storybook
        env:
          STORYBOOK_STORY_PATHS_FILE: ${{ steps.selection.outputs.paths-file }}
        run: bun run build-storybook

      - name: Run Loki Visual Tests
        # All selected stories can have parameters.loki.skip set.
        run: bun run test-visual:loki --reactUri file:./storybook-static --verboseRenderer ${{ steps.selection.outputs.paths-file && '--passWithNoStories --requireReference' || '' }}

      - name: Generate Visual Report on Failure
        if: failure()
        run: bun run test-visual:loki-report

      - name: Upload Artifact
        id: artifact-upload-step
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: loki-report
          include-hidden-files: true
          path: .loki/
          if-no-files-found: ignore

  loki-tests-result:
    needs: [story-selection, visual-test]
    if: always() && !cancelled()
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
      - name: Check Loki job status
        uses: actions/github-script@v9
        env:
          needs: ${{ toJson(needs) }}
        with:
          script: | # js
            const needs = JSON.parse(process.env.needs);
            const jobs = Object.entries(needs).map(
              ([jobName, jobValues]) => ({
                name: jobName,
                result: jobValues.result
              }));

            // are all jobs skipped or successful?
            if (jobs.every(job => (job.result === 'skipped' || job.result === 'success'))) {
              console.log('All jobs are skipped or successful');
              process.exit(0);
            }

            // otherwise, something failed
            console.log('Some Loki jobs failed');
            jobs.forEach((job) => {
              if (job.result !== 'success') {
                console.log(`${job.name} - ${job.result}`);
              }
            });
            process.exit(1);
