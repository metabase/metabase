name: PR Env Destroy (Manual)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to destroy environment for'
        required: true
        type: string
      self_hosting:
        description: 'Self-hosting stack'
        type: boolean
        default: false

jobs:
  approve:
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    environment: pr-env-admin
    steps:
      - name: Approved
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "Destroying PR environment for PR #${PR_NUMBER}"

  destroy:
    needs: approve
    uses: ./.github/workflows/pr-env-destroy.yml
    secrets: inherit
    with:
      self_hosting: ${{ inputs.self_hosting }}
      pr_number: ${{ inputs.pr_number }}
