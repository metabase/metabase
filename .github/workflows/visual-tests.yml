name: Visual Tests

on:
  push:
    branches:
      - "master"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  files-changed:
    name: Check which files changed
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      frontend_visual_all: ${{ steps.changes.outputs.frontend_visual_all }}
    steps:
      - uses: actions/checkout@v6
      - name: Test which files changed
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-paths.yaml

  visual-test:
    name: visual-test-run
    needs: files-changed
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.files-changed.outputs.frontend_visual_all == 'true') }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare frontend environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        run: NODE_ENV=development bun run build-pure:cljs

      - name: Build Storybook
        run: bun run build-storybook

      - name: Run visual tests
        run: |
          echo "CPU cores: $(nproc)"
          bun run test-visual:docker

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-report
          path: |
            e2e-visual/report/
            e2e-visual/test-results/
          if-no-files-found: ignore
