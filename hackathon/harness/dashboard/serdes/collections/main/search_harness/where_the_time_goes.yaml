name: Where the time goes
description: |-
  Mean per stage. Only fixture data has a stage split: the real runner measures from outside over HTTP, so real runs show total latency as Other.

  **Stages (Embed / Store / Filter / Other)**: Where the time goes: turning the question into an embedding, looking it up, permission filtering, everything else. Real runs only see total time, shown as Other.

  **Latency**: Time from sending a search to getting results back, in milliseconds (ms). Lower is better.

  **Mean / median**: The average / the middle value.
entity_id: gG_k5UItW-WFmDe8deppE
created_at: '2026-09-23T14:18:20.247548Z'
creator_id: dev@metabase.local
display: bar
collection_id: gjR5SGM1RGd2H2jxbW8g3
parameters: []
parameter_mappings: []
dataset_query:
  database: Search Harness
  stages:
  - native: |-
      SELECT o.engine AS "Engine", s.stage AS "Stage", avg(s.ms) AS "Mean ms"
      FROM harness_latest_observation o
      CROSS JOIN LATERAL (VALUES
        (1, 'Embed', o.embed_ms), (2, 'Store', o.store_ms), (3, 'Filter', o.filter_ms),
        (4, 'Other', o.latency_ms - coalesce(o.embed_ms, 0) - coalesce(o.store_ms, 0) - coalesce(o.filter_ms, 0))
      ) AS s(ord, stage, ms)
      WHERE o.corpus_id = {{corpus}} AND o.error IS NULL AND s.ms IS NOT NULL
        AND o.embedding_text = {{variant}}
        [[AND o.data_scale = {{scale}}]]
        [[AND o.embedder = {{embedder}}]]
      GROUP BY 1, 2
      ORDER BY 1, min(s.ord)
    template-tags:
    - default: baseline
      display-name: Embedding text
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000005
      name: variant
      required: true
      type: text
    - default: northwind-golden-v1
      display-name: Corpus
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000001
      name: corpus
      required: true
      type: text
    - display-name: Scale
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000002
      name: scale
      required: false
      type: number
    - display-name: Embedder
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000003
      name: embedder
      required: false
      type: text
    lib/type: mbql.stage/native
  lib/type: mbql/query
