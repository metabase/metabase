## Custom viz plugins get an entity_id: their portable serialization identity, carried in custom_viz_plugin.yaml and
## tracked by remote sync's ledger, exactly as a data app's. The identifier stays a unique natural key (directory name,
## manifest name, display type). Backfill mirrors 20261019_osi_ai_context_entity_id: all three dialect variants in one
## changeset so every database records it, then NOT NULL and UNIQUE.

databaseChangeLog:
  - changeSet:
      id: x7mq2c
      author: chodorowicz
      comment: Add entity_id column to custom_viz_plugin table
      changes:
        - addColumn:
            tableName: custom_viz_plugin
            columns:
              - column:
                  name: entity_id
                  type: ${entity_id.type}
                  remarks: Random NanoID tag for unique identity.
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: custom_viz_plugin
            columnName: entity_id

  - changeSet:
      id: r4vd9k
      author: chodorowicz
      comment: Backfill NULL custom_viz_plugin.entity_id values
      changes:
        - sql:
            dbms: postgresql
            sql: UPDATE custom_viz_plugin SET entity_id = substr(replace(gen_random_uuid()::text, '-', ''), 1, 21) WHERE entity_id IS NULL;
        - sql:
            dbms: mysql,mariadb
            sql: UPDATE custom_viz_plugin SET entity_id = substr(replace(uuid(), '-', ''), 1, 21) WHERE entity_id IS NULL;
        - sql:
            dbms: h2
            sql: UPDATE custom_viz_plugin SET entity_id = substr(replace(cast(random_uuid() as varchar), '-', ''), 1, 21) WHERE entity_id IS NULL;
      rollback: []

  - changeSet:
      id: n8tw3f
      author: chodorowicz
      comment: entity_id is NOT NULL on custom_viz_plugin
      changes:
        - addNotNullConstraint:
            tableName: custom_viz_plugin
            columnName: entity_id
            columnDataType: ${entity_id.type}

  - changeSet:
      id: j2pk6s
      author: chodorowicz
      comment: entity_id is unique on custom_viz_plugin
      changes:
        - addUniqueConstraint:
            tableName: custom_viz_plugin
            columnNames: entity_id
            constraintName: uq_custom_viz_plugin_entity_id
      rollback:
        - dropUniqueConstraint:
            tableName: custom_viz_plugin
            constraintName: uq_custom_viz_plugin_entity_id
