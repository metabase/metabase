# M2 ladder rung: the core aggregate set as metrics (SUM, COUNT,
# COUNT DISTINCT, AVG, MIN, MAX). Variant: QUALIFIED reference form
# (dataset.field), carried as primary per #486.
version: "0.2.0.dev0"
name: m2_sales
description: "M2: core aggregate set, qualified reference form."
datasets:
  - name: sales
    source: samples.sales.orders
    fields:
      - name: amount
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: amount
        datatype: Decimal
      - name: order_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: order_id
        datatype: Integer
      - name: customer_id
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: customer_id
        datatype: Integer
metrics:
  - name: sum_amount
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(sales.amount)
    datatype: Decimal
  - name: count_orders
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(sales.order_id)
    datatype: Integer
  - name: distinct_customers
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(DISTINCT sales.customer_id)
    datatype: Integer
  - name: avg_amount
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: AVG(sales.amount)
    datatype: Decimal
  - name: min_amount
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: MIN(sales.amount)
    datatype: Decimal
  - name: max_amount
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: MAX(sales.amount)
    datatype: Decimal
