# A worktree checks out its own copy of a snippet, so a snippet name is unique per worktree
# rather than globally. A unique index on (name, worktree_id) would not do it: every main-app
# row has a NULL worktree_id, and all three app DBs treat NULLs in a unique index as distinct,
# so the main app would lose its uniqueness entirely. worktree_id_helper restates worktree_id
# with 0 for the main app -- generated by the database, like metabase_table.unique_table_helper,
# and read by nothing but the index.
#
# The constraint being replaced predates the flattened changelog -- it comes from
# migrations/initialization/metabase_{postgres,mysql,h2}.sql -- so it carries a
# database-assigned name and has to be dropped per dbms. Postgres and MySQL derive that name
# from the column, but H2's is positional (CONSTRAINT_4B on a fresh install), so H2 looks it
# up in INFORMATION_SCHEMA instead of naming it.

databaseChangeLog:
  - changeSet:
      id: v64.2026-08-05T13:00:00
      author: alxnddr
      comment: Add native_query_snippet.worktree_id_helper, a generated column restating worktree_id with 0 for the main app
      changes:
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE native_query_snippet ADD COLUMN worktree_id_helper INTEGER GENERATED ALWAYS AS (
                COALESCE(worktree_id, 0)
              ) STORED;
        # VIRTUAL rather than STORED: MySQL refuses a stored generated column whose base column carries an
        # ON DELETE CASCADE foreign key, which worktree_id does. A unique index over a virtual column is
        # supported on both MySQL and MariaDB.
        - sql:
            dbms: mysql,mariadb
            sql: >-
              ALTER TABLE native_query_snippet ADD COLUMN worktree_id_helper INTEGER GENERATED ALWAYS AS (
                COALESCE(worktree_id, 0)
              ) VIRTUAL;
        - sql:
            dbms: h2
            sql: >-
              ALTER TABLE native_query_snippet ADD COLUMN worktree_id_helper INTEGER GENERATED ALWAYS AS (
                COALESCE(worktree_id, 0)
              );
      rollback:
        - sql:
            sql: ALTER TABLE native_query_snippet DROP COLUMN worktree_id_helper;

  - changeSet:
      id: v64.2026-08-05T13:00:01
      author: alxnddr
      comment: Drop the global unique constraint on native_query_snippet.name - it is replaced by a per-worktree one below
      changes:
        - sql:
            dbms: postgresql
            sql: ALTER TABLE native_query_snippet DROP CONSTRAINT native_query_snippet_name_key;
        - sql:
            dbms: mysql,mariadb
            sql: ALTER TABLE native_query_snippet DROP INDEX `name`;
        - sql:
            dbms: h2
            sql: >-
              EXECUTE IMMEDIATE (
                SELECT 'ALTER TABLE NATIVE_QUERY_SNIPPET DROP CONSTRAINT "' || tc.CONSTRAINT_NAME || '"'
                FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS tc
                JOIN INFORMATION_SCHEMA.KEY_COLUMN_USAGE kcu ON kcu.CONSTRAINT_NAME = tc.CONSTRAINT_NAME
                WHERE tc.TABLE_NAME = 'NATIVE_QUERY_SNIPPET'
                  AND tc.CONSTRAINT_TYPE = 'UNIQUE'
                  AND kcu.COLUMN_NAME = 'NAME'
              );
      rollback:
        - addUniqueConstraint:
            tableName: native_query_snippet
            columnNames: name
            constraintName: uq_native_query_snippet_name

  - changeSet:
      id: v64.2026-08-05T13:00:02
      author: alxnddr
      comment: Add unique constraint on native_query_snippet(name, worktree_id_helper)
      changes:
        - addUniqueConstraint:
            tableName: native_query_snippet
            columnNames: name, worktree_id_helper
            constraintName: uq_native_query_snippet_name_worktree
      rollback:
        - dropUniqueConstraint:
            tableName: native_query_snippet
            constraintName: uq_native_query_snippet_name_worktree
