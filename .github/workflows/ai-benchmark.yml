name: AI Benchmark
run-name: "dispatch evals · ${{ github.event_name == 'pull_request' && format('smoke PR#{0}', github.event.pull_request.number) || (inputs.ref != '' && inputs.ref || (inputs.pr != '' && format('PR#{0}', inputs.pr) || 'master')) }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Metabase PR number (sets ref to the PR head)"
        required: false
        default: ""
      ref:
        description: >-
          Metabase branch, tag or sha (resolved to a full sha; overrides the PR head, and must sit on the PR's
          branch when both are given)
        required: false
        default: ""
      scope:
        description: "Scope"
        required: true
        type: choice
        options: [smoke, full, "all (EXPENSIVE)"]
        default: smoke
      sample:
        description: "Sample (0 = full suite)"
        required: false
        default: "5"
      evals_branch:
        description: "Evals branch"
        default: main
  workflow_call:
    inputs:
      pr:
        type: string
      ref:
        type: string
      scope:
        type: string
        default: smoke
      sample:
        required: false
        type: string
        default: "5"
      evals_branch:
        type: string
        default: main
      comment_id:
        type: string
        description: >-
          The id of the comment that was created by calling workflow, if any. It is passed through to the executing
          action so it can modify the comment according to its result.

concurrency:
  group: evals-dispatch-${{ github.run_id }}
  cancel-in-progress: true

jobs:

  resolve:
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve pr/ref to a full commit sha
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          REF: ${{ inputs.ref }}
          DEFAULT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$REF" ]]; then
            # Get corresponding sha for a ref.
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)
            echo "ref ${REF} -> ${SHA}"
          elif [[ -n "$PR" ]]; then
            SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha)
            echo "PR #${PR} head -> ${SHA}"
          else
            SHA="$DEFAULT_SHA"
            echo "neither pr nor ref given; using this run's commit -> ${SHA}"
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve a full commit sha (got '${SHA}')"
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  image:
    needs: [resolve]
    uses: ./.github/workflows/build-private-ee-docker-image.yml
    secrets:
      PR_ENV_IAM_ROLE: ${{ secrets.PR_ENV_IAM_ROLE }}
      PR_ENV_AWS_ACCOUNT_ID: ${{ secrets.PR_ENV_AWS_ACCOUNT_ID }}
    with:
      commit: ${{ needs.resolve.outputs.sha }}

  dispatch:
    needs: [resolve, image]
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
      - name: Dispatch eval-run
        env:
          GH_TOKEN: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}
          EVALS_BRANCH: ${{ inputs.evals_branch || 'main' }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          REF: ${{ needs.resolve.outputs.sha }}
          SCOPE: ${{ inputs.scope }}
          SAMPLE: ${{ inputs.sample }}
          COMMENT_ID: ${{ inputs.comment_id }}
        run: |
          gh api repos/metabase/evals/actions/workflows/eval-run.yml/dispatches \
            -f ref="$EVALS_BRANCH" \
            -f "inputs[pr]=$PR" \
            -f "inputs[ref]=$REF" \
            -f "inputs[surfaces]=all" \
            -f "inputs[scope]=$SCOPE" \
            -f "inputs[sample]=$SAMPLE" \
            -f "inputs[evals_branch]=$EVALS_BRANCH" \
            -f "inputs[comment_id]=$COMMENT_ID"
