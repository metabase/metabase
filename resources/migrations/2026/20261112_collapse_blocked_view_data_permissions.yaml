## Collapse redundant table-level view-data rows in data_permissions (#77130).
##
## A bug wrote one 'blocked' view-data row per table even when the db-level row was already 'blocked'. Two
## earlier attempts to collapse those rows (retired in 062/20260707_collapse_uniform_table_permissions.yaml)
## truncated and reloaded the table, and were too slow on the largest instances. This one leaves the other
## rows in place. Each statement pair runs in one transaction, so no instance sees a db-level row together
## with the table-level rows it replaces.
##
##   1. Where a group has no db-level view-data row for a database, all its table-level view-data rows there
##      are 'blocked', and they cover every active table: insert a db-level 'blocked' row.
##   2. Delete every table-level view-data row that has the same value as its db-level row, whatever the value.

databaseChangeLog:
  - changeSet:
      id: uhpmy6
      author: ranquild
      comment: Replace table-level view-data rows that repeat a db-level row, or are all blocked, with the db-level row
      changes:
        - sql:
            dbms: postgresql,h2
            sql: >-
              INSERT INTO data_permissions (group_id, perm_type, db_id, perm_value)
              SELECT agg.group_id, 'perms/view-data', agg.db_id, 'blocked'
              FROM (
                SELECT dp.group_id, dp.db_id,
                       MIN(dp.perm_value) AS min_value,
                       MAX(dp.perm_value) AS max_value,
                       COUNT(*) - COUNT(it.id) AS active_rows
                FROM data_permissions dp
                LEFT JOIN metabase_table it ON it.id = dp.table_id AND it.active = FALSE
                WHERE dp.perm_type = 'perms/view-data'
                  AND dp.table_id IS NOT NULL
                GROUP BY dp.group_id, dp.db_id
              ) agg
              JOIN (SELECT db_id, COUNT(*) AS n FROM metabase_table WHERE active = TRUE GROUP BY db_id) ac
                ON ac.db_id = agg.db_id
              WHERE agg.min_value = 'blocked'
                AND agg.max_value = 'blocked'
                AND agg.active_rows = ac.n
                AND NOT EXISTS (
                  SELECT 1 FROM data_permissions dbp
                  WHERE dbp.group_id = agg.group_id
                    AND dbp.db_id = agg.db_id
                    AND dbp.perm_type = 'perms/view-data'
                    AND dbp.table_id IS NULL);
              DELETE FROM data_permissions dp
              WHERE dp.perm_type = 'perms/view-data'
                AND dp.table_id IS NOT NULL
                AND EXISTS (
                  SELECT 1 FROM data_permissions dbp
                  WHERE dbp.group_id = dp.group_id
                    AND dbp.db_id = dp.db_id
                    AND dbp.perm_type = 'perms/view-data'
                    AND dbp.table_id IS NULL
                    AND dbp.perm_value = dp.perm_value);
        - sql:
            dbms: mysql,mariadb
            sql: >-
              INSERT INTO data_permissions (group_id, perm_type, db_id, perm_value)
              SELECT agg.group_id, 'perms/view-data', agg.db_id, 'blocked'
              FROM (
                SELECT dp.group_id, dp.db_id,
                       MIN(dp.perm_value) AS min_value,
                       MAX(dp.perm_value) AS max_value,
                       COUNT(*) - COUNT(it.id) AS active_rows
                FROM data_permissions dp
                LEFT JOIN metabase_table it ON it.id = dp.table_id AND it.active = FALSE
                WHERE dp.perm_type = 'perms/view-data'
                  AND dp.table_id IS NOT NULL
                GROUP BY dp.group_id, dp.db_id
              ) agg
              JOIN (SELECT db_id, COUNT(*) AS n FROM metabase_table WHERE active = TRUE GROUP BY db_id) ac
                ON ac.db_id = agg.db_id
              WHERE agg.min_value = 'blocked'
                AND agg.max_value = 'blocked'
                AND agg.active_rows = ac.n
                AND NOT EXISTS (
                  SELECT 1 FROM data_permissions dbp
                  WHERE dbp.group_id = agg.group_id
                    AND dbp.db_id = agg.db_id
                    AND dbp.perm_type = 'perms/view-data'
                    AND dbp.table_id IS NULL);
              DELETE dp FROM data_permissions dp
              JOIN data_permissions dbp
                ON dbp.group_id = dp.group_id
               AND dbp.db_id = dp.db_id
               AND dbp.perm_type = 'perms/view-data'
               AND dbp.table_id IS NULL
               AND dbp.perm_value = dp.perm_value
              WHERE dp.perm_type = 'perms/view-data'
                AND dp.table_id IS NOT NULL;
      rollback: # not necessary; the deleted rows repeated their db-level row
