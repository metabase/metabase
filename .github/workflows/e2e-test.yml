name: E2E Test
run-name: E2E Test - ${{ inputs.name }}

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      edition: # oss | ee
        required: false
        type: string
        default: ee
      specs:
        required: false
        default: ./e2e/test/scenarios/**/*.cy.spec.*
        type: string
      test-plan-artifact-id:
        description: "ID of this run's test-plan.json artifact, '' to use the default spec pattern."
        type: string
        default: ""
      snapshots-artifact:
        description: "Name of this run's default snapshots artifact, '' to generate all snapshots in this job."
        type: string
        default: ""
      tags:
        required: false
        type: string
      runner:
        required: false
        type: string
        default: ${{ vars.DEFAULT_RUNNER_KEY }}
      total_chunks: # number of chunks
        required: false
        type: number
      split_index: # index of the chunk
        required: false
        type: number

env:
  DISPLAY: "" # https://github.com/cypress-io/cypress/issues/4034
  TERM: xterm
  TZ: US/Pacific # to make Node match the instance tz
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HASH: ${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
  PR_NUMBER: ${{ github.event.pull_request.number || '' }}
  JOB_NAME: ${{ inputs.name }}
  # ci-conductor reporting (DEV-1999). Secret holds the base origin
  # (e.g. "https://conductor.<host>"); each consumer appends the path it needs
  # (the reporter POSTs to "/webhooks/failed-tests"). Callers pass
  # `secrets: inherit`; reporting no-ops when it's unset.
  CI_CONDUCTOR_BASE_URL: ${{ vars.CI_CONDUCTOR_BASE_URL }}
  # Shared secret sent as the `x-internal-secret` header to authenticate.
  CI_CONDUCTOR_WEBHOOK_SECRET: ${{ secrets.CI_CONDUCTOR_WEBHOOK_SECRET }}
  REPO_ID: ${{ github.event.repository.id }}
  # Commit + PR target branch under test, so conductor can tie failures to the
  # right code. On PRs the ambient GITHUB_SHA is the synthetic merge commit and
  # GITHUB_BASE_REF the target, so we pass the PR head sha / base ref explicitly
  # (falling back to push-event values). The reporter reads these. DEV-1999.
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}

jobs:
  e2e-tests:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    name: e2e-tests-${{ inputs.name }}-${{ inputs.edition }}
    env:
      MB_EDITION: ${{ inputs.edition }}
      # Absolute path for the quarantine failures file (DEV-2082). The after:spec
      # recorder runs in Cypress' plugins process, whose cwd differs from the
      # workspace where the gate step runs; an absolute path anchored to the
      # workspace makes both agree regardless of cwd.
      QUARANTINE_FAILURES_FILE: ${{ github.workspace }}/target/quarantine-failures.jsonl
      RERUN_ARTIFACT_BASE: failed-tests-${{ inputs.name }}-${{ inputs.edition }}
      # Cypress records video for every spec but the passing specs' videos are
      # deleted in after:spec so recording is ~5-10% slowdown per shard and almost
      # never yields an artifact. Failure screenshots are unaffected, and the
      # stress-test workflows have their own config and keep video.
      # Re-run attempts override this on the run steps below.
      CYPRESS_VIDEO: "false"
      # Sensitive env vars (tokens, secrets) starting with `CYPRESS_` are accessed via async `cy.env()`
      # Example: `cy.env(["FOO"]).then(({ FOO }) => ...)`
      # For non-sensitive config, use `Cypress.expose()` in cypress config instead (synchronous)
      CYPRESS_MB_ALL_FEATURES_TOKEN: ${{ secrets.STAGING_MB_ALL_FEATURES_TOKEN }}
      CYPRESS_MB_STARTER_CLOUD_TOKEN: ${{ secrets.STAGING_MB_STARTER_CLOUD_TOKEN }}
      CYPRESS_MB_PRO_CLOUD_TOKEN: ${{ secrets.STAGING_MB_PRO_CLOUD_TOKEN }}
      CYPRESS_MB_PRO_SELF_HOSTED_TOKEN: ${{ secrets.STAGING_MB_PRO_SELF_HOSTED_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}

      # Images pull in the background while the toolchain installs; "Wait for Docker containers" below
      # blocks on them just before Metabase starts.
      - name: Start Docker containers
        uses: ./.github/actions/e2e-prepare-containers
        with:
          mode: start
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          maildev: true
          openldap: true
          webhook: true
          snowplow: true
          metaplow: true
          postgres: true
          mysql: true
          mongo: true
          mocksaml: true

      - name: Setup python-runner
        if: ${{ inputs.name == 'python' }}
        uses: ./.github/actions/setup-python-runner
        with:
          metabase-automation-token: ${{ secrets.METABASE_AUTOMATION_USER_TOKEN }}

      - name: Retrieve uberjar artifact for ${{ inputs.edition }}
        uses: ./.github/actions/fetch-artifact
        with:
          commit: ${{ github.event.pull_request.head.sha || github.sha }}
          edition: ${{ inputs.edition }}
          extract-path: "target/uberjar"
          output-name: "metabase.jar"

      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend

      # The matrix builder sized these jobs for the planned specs, so the test plan download has to succeed.
      - name: Prepare E2E spec selection
        id: selection
        if: ${{ inputs.test-plan-artifact-id != '' }}
        uses: ./.github/actions/prepare-test-selection
        with:
          suite: e2e
          test-plan-artifact-id: ${{ inputs.test-plan-artifact-id }}
          require-download: true

      # Running the uberjar only needs a JDK. The Clojure CLI and the M2 cache are for compiling CLJS,
      # which "Prepare back-end environment" below sets up only when there is no pre-built CLJS.
      - name: Prepare JDK
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Wait for Docker containers
        uses: ./.github/actions/e2e-prepare-containers
        # Same services as "Start Docker containers": these inputs pick the ports to wait on.
        with:
          mode: wait
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          maildev: true
          openldap: true
          webhook: true
          snowplow: true
          metaplow: true
          postgres: true
          mysql: true
          mongo: true
          mocksaml: true

      # Metabase boots in the background while Cypress and the CLJS bundle are prepared. "Wait for
      # Metabase" blocks on it before anything talks to the backend.
      - name: Start Metabase
        run: |
          mkdir -p target
          rm -f target/metabase-start.exit
          nohup bash -c 'node e2e/runner/run_cypress_ci.js start; echo $? > target/metabase-start.exit' \
            > target/metabase-start.log 2>&1 < /dev/null &

      - name: Prepare Cypress environment
        id: cypress-prep
        uses: ./.github/actions/prepare-cypress

      - name: Resolve previous attempt
        if: ${{ github.run_attempt != '1' }}
        run: echo "RERUN_PREV_ATTEMPT=$((GITHUB_RUN_ATTEMPT - 1))" >> "$GITHUB_ENV"

      - name: Restore previously-failed specs
        if: ${{ github.run_attempt != '1' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.RERUN_ARTIFACT_BASE }}-attempt-${{ env.RERUN_PREV_ATTEMPT }}
          path: target/rerun

      - name: Get failed specs
        if: ${{ github.run_attempt != '1' }}
        run: |
          if [ -s target/rerun/failed-specs ]; then
            echo "Re-running only the specs that failed on attempt $RERUN_PREV_ATTEMPT:"
            cat target/rerun/failed-specs
            echo "specs=$(cat target/rerun/failed-specs)" >> "$GITHUB_ENV"
          else
            echo "No failed-spec list from attempt $RERUN_PREV_ATTEMPT; running the full suite."
          fi

      # run-tests.yml compiles this in parallel with the uberjar build. Downloading it is ~10x faster than compiling it here.
      # Callers without that job (stress tests, coverage shards, cross-run re-runs) fall through to compiling as before.
      - name: Download pre-built CLJS
        id: prebuilt-cljs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-cljs-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cljs_dev

      - name: Prepare back-end environment
        if: steps.prebuilt-cljs.outcome != 'success'
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        if: steps.prebuilt-cljs.outcome != 'success'
        run: bun run build-pure:cljs

      # Export this job's numeric GitHub job id as $JOB_ID for the Cypress runs
      # below (ci-conductor failed-tests reporting reads it in after:spec).
      # Snapshot generation is itself a Cypress run that fires after:spec, so
      # this must precede it. Placed late, not after checkout: the Actions jobs
      # API is eventually consistent, so the longer the job has been alive the
      # more reliably the lookup resolves. JOB_ID exported here persists to the
      # steps below. DEV-1999.
      - uses: ./.github/actions/resolve-job-id

      - name: Wait for Metabase
        timeout-minutes: 6
        run: |
          # run_cypress_ci.js gives up after 5 minutes, so the exit file always appears first.
          while [ ! -s target/metabase-start.exit ]; do sleep 1; done
          cat target/metabase-start.log
          exit "$(cat target/metabase-start.exit)"

      # The snapshot job runs alongside this one rather than ahead of it, so its artifact is often
      # ready by the time this job gets here. Waiting is capped at a little more than generating the
      # snapshots costs (~1 min), so a slow or failed snapshot job never delays this job by much.
      - name: Wait for database snapshots
        id: wait-snapshots
        if: ${{ inputs.snapshots-artifact != '' && inputs.edition == 'ee' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/github-script@v9
        env:
          SNAPSHOTS_ARTIFACT: ${{ inputs.snapshots-artifact }}
          MAX_WAIT_SECONDS: 90
        with:
          script: | # js
            const name = process.env.SNAPSHOTS_ARTIFACT;
            const deadline = Date.now() + Number(process.env.MAX_WAIT_SECONDS) * 1000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (true) {
              try {
                const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: context.runId,
                  name,
                  per_page: 1,
                });
                if (data.artifacts.some((artifact) => !artifact.expired)) {
                  console.log(`${name} is available`);
                  return;
                }
              } catch (error) {
                console.log(`Looking up ${name} failed, retrying: ${error.message}`);
              }
              if (Date.now() >= deadline) {
                core.setFailed(`${name} is not available yet; generating the snapshots in this job instead`);
                return;
              }
              await sleep(10_000);
            }

      - name: Download database snapshots
        id: snapshots
        if: ${{ steps.wait-snapshots.outcome == 'success' }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ inputs.snapshots-artifact }}
          path: e2e

      - name: Generate database snapshots
        if: ${{ steps.snapshots.outcome != 'success' }}
        env:
          CYPRESS_BROWSER: ${{ steps.cypress-prep.outputs.chrome-path }}
        run: node e2e/runner/run_cypress_ci.js snapshot

      # TEMPORARY (PR #86454): diagnose why the backend cannot reach maildev-ssl on localhost:465.
      - name: Diagnose SMTP containers
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set +e
          echo "::group::docker ps -a"; docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'; echo "::endgroup::"
          echo "::group::maildev-ssl logs"; docker logs --tail 100 metabase-e2e-maildev-ssl-1 2>&1; echo "::endgroup::"
          echo "::group::listening sockets"; sudo ss -ltnp | grep -E ':(465|1125|1180|1081) ' ; echo "::endgroup::"
          echo "::group::getent localhost"; getent ahosts localhost; echo "::endgroup::"
          for target in 127.0.0.1:465 localhost:465 '[::1]:465' 127.0.0.1:1125; do
            echo "::group::TCP $target"
            host=${target%:*}; host=${host#[}; host=${host%]}
            timeout 3 bash -c "</dev/tcp/$host/${target##*:}" && echo "TCP OK $target" || echo "TCP FAIL $target"
            echo "::endgroup::"
          done
          echo "::group::TLS 127.0.0.1:465"; timeout 5 openssl s_client -connect 127.0.0.1:465 -brief </dev/null 2>&1 | head -20; echo "::endgroup::"
          echo "::group::Java connect to localhost:465"
          cat > "$RUNNER_TEMP/Probe.java" <<'EOF'
          import java.net.*;
          public class Probe {
            public static void main(String[] a) throws Exception {
              for (InetAddress addr : InetAddress.getAllByName("localhost")) System.out.println("localhost -> " + addr);
              long t = System.nanoTime();
              try (Socket s = new Socket()) {
                s.connect(new InetSocketAddress("localhost", 465), 1000);
                System.out.println("connected to " + s.getRemoteSocketAddress() + " in " + (System.nanoTime() - t) / 1_000_000 + "ms");
              } catch (Exception e) {
                System.out.println("FAILED after " + (System.nanoTime() - t) / 1_000_000 + "ms: " + e);
              }
            }
          }
          EOF
          timeout 30 java "$RUNNER_TEMP/Probe.java"
          echo "::endgroup::"

      - name: Run auto-split Cypress tests on ${{ inputs.name }}
        id: split-e2e
        if: ${{ !inputs.specs }}
        env:
          SPLIT: ${{ inputs.total_chunks }}
          SPLIT_INDEX: ${{ inputs.split_index }}
          SPLIT_FILE: "./e2e/support/timings.json"
          SPLIT_OUTPUT_FILE: "newTimes.json"
          SPLIT_TIME_THRESHOLD: 0.01 # 1% threshold for changes
          # do not write cypress-split summary to github
          SPLIT_SUMMARY: false
          SPEC_PATH: ${{ env.specs || inputs.specs }}
          E2E_SPEC_PATHS_FILE: ${{ steps.selection.outputs.paths-file }}
          # Re-run attempts run only the previously-failed specs (env.specs), so record them.
          CYPRESS_VIDEO: ${{ env.specs && 'true' || 'false' }}
          CYPRESS_BROWSER: ${{ steps.cypress-prep.outputs.chrome-path }}
        shell: bash
        run: |
          echo "Running tests with specs: $SPEC_PATH"
          node e2e/runner/run_cypress_ci.js e2e \
            --expose grepTags="-@python+-@OSS" \
            --spec "$SPEC_PATH"
        # Keep this step continue-on-error because the quarantine logic controls whether it ultimately fails.
        continue-on-error: true

      - name: Run Tagged EE Cypress tests on ${{ inputs.name }}
        id: tagged-e2e
        if: ${{ inputs.specs }}
        shell: bash
        env:
          SPEC_PATH: ${{ env.specs || inputs.specs }}
          E2E_SPEC_PATHS_FILE: ${{ steps.selection.outputs.paths-file }}
          # Re-run attempts run only the previously-failed specs (env.specs), so record them.
          CYPRESS_VIDEO: ${{ env.specs && 'true' || 'false' }}
          CYPRESS_BROWSER: ${{ steps.cypress-prep.outputs.chrome-path }}
        run: |
          echo "Running tests with specs: $SPEC_PATH"
          node e2e/runner/run_cypress_ci.js e2e \
          --expose grepTags="${{ inputs.tags || '-@python+-@OSS' }}" \
          --spec "$SPEC_PATH"
        # Keep this step continue-on-error because the quarantine logic controls whether it ultimately fails.
        continue-on-error: true

      - name: Rewrite JUnit hook failures
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        shell: bash
        run: |
          if [ -d ./target/junit ]; then
            echo "fix-junit-hooks: invoking bun"
            bun e2e/support/fix-junit-hooks.ts ./target/junit
          else
            echo "No ./target/junit directory; nothing to process."
          fi

      # TEMPORARY (PR #86454): container state after the tests, in case maildev-ssl died mid-run.
      - name: Diagnose SMTP containers after tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        run: |
          set +e
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          docker logs --tail 50 metabase-e2e-maildev-ssl-1 2>&1
          timeout 3 bash -c '</dev/tcp/127.0.0.1/465' && echo "TCP OK 127.0.0.1:465" || echo "TCP FAIL 127.0.0.1:465"
          grep -i "smtp\|465" logs/test.log 2>/dev/null | tail -20

      - name: Quarantine gate
        # Only one of the two run steps executes; the other reports `skipped`. Only gate on actual failure.
        if: ${{ !cancelled() && (steps.split-e2e.outcome == 'failure' || steps.tagged-e2e.outcome == 'failure') }}
        continue-on-error: ${{ vars.QUARANTINE_ENGINE != 'ci-conductor' }}
        timeout-minutes: 3
        uses: ./.github/actions/quarantine-gate
        with:
          adapter: e2e
          test-suite: e2e
          enforce-quarantine: ${{ vars.QUARANTINE_ENGINE == 'ci-conductor' }}

      - name: Upload Cypress Artifacts upon failure
        uses: actions/upload-artifact@v7
        if: |
          !cancelled() && (steps.split-e2e.outcome == 'failure' || steps.tagged-e2e.outcome == 'failure')
        with:
          name: cypress-recording-${{ inputs.name }}-${{ inputs.edition }}-attempt-${{ github.run_attempt }}
          path: |
            ./cypress
            ./logs/test.log
          if-no-files-found: ignore

      - name: Upload Failed Tests
        uses: actions/upload-artifact@v7
        if: |
          !cancelled() && (steps.split-e2e.outcome == 'failure' || steps.tagged-e2e.outcome == 'failure')
        continue-on-error: true
        with:
          name: ${{ env.RERUN_ARTIFACT_BASE }}-attempt-${{ github.run_attempt }}
          path: ./cypress/test-results
          if-no-files-found: ignore

      - name: Extract chunk-specific changed timings
        id: extract-timings
        if: inputs.split_index >= 0 && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const oldTimingsPath = "./e2e/support/timings.json";
            const newTimingsPath = "./e2e/support/newTimes.json";

            if (!fs.existsSync(newTimingsPath)) {
              throw new Error(`newTimes.json not found - cypress-split may not have generated it`);
            }

            if (!fs.existsSync(oldTimingsPath)) {
              throw new Error(`Original timings file ${oldTimingsPath} not found`);
            }

            const oldTimings = fs.existsSync(oldTimingsPath)
              ? JSON.parse(fs.readFileSync(oldTimingsPath, "utf8"))
              : { durations: [] };

            const newTimings = fs.existsSync(newTimingsPath)
              ? JSON.parse(fs.readFileSync(newTimingsPath, "utf8"))
              : { durations: [] };

            const { extractChangedTimings } = require('${{ github.workspace }}/.github/scripts/extract-changed-timings.js');

            const result = extractChangedTimings({ oldTimings, newTimings });

            if (result.hasChanges) {
              core.setOutput('has-changes', 'true');
              fs.writeFileSync('chunkTimings.json', JSON.stringify(result.changedTimings, null, 2));
              console.log(`Extracted ${Object.keys(result.changedTimings).length} changed timings for chunk index ${{ inputs.split_index }}`);
            }

      - name: Upload Timing Data
        uses: actions/upload-artifact@v7
        if: steps.extract-timings.outcome == 'success' && steps.extract-timings.outputs.has-changes == 'true'
        with:
          name: timing-data-${{ inputs.name }}
          path: chunkTimings.json
          retention-days: 1 # gets merged immediately by parent workflow

      - name: Publish Summary
        if: failure()
        uses: actions/github-script@v9
        with:
          script: | #js
            const {
               generateReport,
               parseReport,
               formatSummary
             } = require("./.github/scripts/handle-mochawesome-report.js");

             const report = await generateReport();
             const results = parseReport(report);
             const summary = formatSummary(results);

             await core.summary.addRaw(summary).write();
