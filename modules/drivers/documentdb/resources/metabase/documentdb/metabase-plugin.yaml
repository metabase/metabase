info:
  name: Metabase DocumentDB Driver
  version: 1.0.0-SNAPSHOT
  description: Allows Metabase to connect to open-source DocumentDB databases.
driver:
  name: documentdb
  display-name: DocumentDB
  lazy-load: true
  connection-properties:
    - name: use-conn-uri
      type: section
      default: false
    - name: conn-uri
      type: password
      display-name: Paste your connection string
      placeholder: 'mongodb://username:password@localhost:10260/database?tls=true&authSource=admin'
      required: true
      visible-if:
        use-conn-uri: true
    - group:
        container-style: ["grid", "3fr 1fr"]
        fields:
          - merge:
              - host
              - default: localhost
                visible-if:
                  use-conn-uri: false
                required: true
          - merge:
              - port
              - default: 10260
                visible-if:
                  use-conn-uri: false
                required: true
    - merge:
        - dbname
        - visible-if:
            use-conn-uri: false
          required: true
    - merge:
        - user
        - visible-if:
            use-conn-uri: false
          required: true
    - merge:
        - password
        - name: pass
          visible-if:
            use-conn-uri: false
          required: true
    - name: authdb
      display-name: Authentication database
      default: admin
      visible-if:
        use-conn-uri: false
    - cloud-ip-address-info
    - group:
        container-style: ["component", "backdrop"]
        fields:
          - merge:
              - ssl
              - display-name: Use TLS
                default: true
                visible-if:
                  use-conn-uri: false
          - name: ssl-cert
            type: text
            display-name: Server TLS certificate chain (PEM)
            placeholder: Paste the server certificate chain to trust a self-signed DocumentDB Local certificate
            visible-if:
              ssl: true
          - name: tls-allow-invalid-hostnames
            type: boolean
            default: false
            display-name: Allow hostname mismatch in the TLS certificate
            visible-if:
              ssl: true
          - ssh-tunnel
    - advanced-options-start
    - merge:
        - additional-options
        - display-name: Additional connection string options (optional)
          placeholder: 'retryWrites=false&directConnection=true'
          visible-if:
            use-conn-uri: false
            advanced-options: true
    - default-advanced-options
init:
  - step: load-namespace
    namespace: metabase.driver.documentdb