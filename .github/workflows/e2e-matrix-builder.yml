name: E2E Matrix Builder

on:
  workflow_call:
    inputs:
      chunks:
        required: false
        type: number
        default: 30
      test-plan-artifact-id:
        description: "ID of this run's test-plan.json artifact, '' to run the full suite."
        required: false
        type: string
        default: ""
    outputs:
      matrix:
        value: ${{ jobs.build-matrix.outputs.matrix }}
      regularChunks:
        value: ${{ jobs.build-matrix.outputs.regularChunks }}
      hasTests:
        value: ${{ jobs.build-matrix.outputs.hasTests }}
      test-plan-artifact-id:
        description: "The test plan artifact ID when the matrix was built from a narrowed selection, otherwise ''."
        value: ${{ jobs.build-matrix.outputs.test-plan-artifact-id }}

jobs:
  build-matrix:
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.config }}
      regularChunks: ${{ steps.matrix.outputs.regularChunks }}
      hasTests: ${{ steps.matrix.outputs.hasTests }}
      test-plan-artifact-id: ${{ steps.selection.outputs.paths-file && inputs.test-plan-artifact-id || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            /.nvmrc
            /package.json
            e2e/runner/read-spec-plan.js
          sparse-checkout-cone-mode: false
      - name: Prepare Node + Bun environment
        if: ${{ inputs.test-plan-artifact-id != '' }}
        uses: ./.github/actions/prepare-node-bun
      - name: Prepare E2E spec selection
        id: selection
        if: ${{ inputs.test-plan-artifact-id != '' }}
        uses: ./.github/actions/prepare-test-selection
        with:
          suite: e2e
          test-plan-artifact-id: ${{ inputs.test-plan-artifact-id }}
      - name: Build e2e matrix
        uses: actions/github-script@v9
        id: matrix
        env:
          chunks: ${{ inputs.chunks }}
          E2E_SPEC_PATHS_FILE: ${{ steps.selection.outputs.paths-file }}
        with:
          script: | # js
            const { buildMatrix } = require('${{ github.workspace }}/.github/scripts/build-e2e-matrix.js');
            const { readSpecPlan } = require('${{ github.workspace }}/e2e/runner/read-spec-plan.js');
            const specFiles = readSpecPlan(process.env.E2E_SPEC_PATHS_FILE);
            const inputChunks = Number(process.env.chunks);
            const java = 25;
            const defaultRunner = "${{ vars.DEFAULT_RUNNER_KEY }}";
            const options = {
              java,
              defaultRunner,
            };
            const { config, regularChunks } = buildMatrix(options, specFiles, inputChunks);

            core.setOutput("regularChunks", JSON.stringify(regularChunks));
            core.setOutput("config", JSON.stringify({ include: config }));
            core.setOutput("hasTests", config.length > 0);

            console.log({ regularChunks });
            console.log("matrix config", config);
