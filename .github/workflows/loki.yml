name: Loki Visual Regression Testing

on:
  workflow_call:
    inputs:
      plan:
        description: >-
          The CI test plan, as JSON. The caller builds it; the `loki` workflow in
          it decides the jobs below. `{}` means there is no plan, and everything
          runs.
        type: string
        default: '{}'
      test-plan-artifact-id:
        description: "ID of this run's test-plan.json artifact, or '' to run the full suite."
        type: string
        default: ""
    outputs:
      ok:
        description: >-
          Whether everything the plan asked of this workflow ran and passed.
          Empty when the roll-up job did not get to publish a verdict, so read
          it alongside this workflow's own result rather than instead of it.
        value: ${{ jobs.loki-tests-result.outputs.ok }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}-loki
  cancel-in-progress: true

jobs:
  story-selection:
    if: >-
      ${{ (inputs.plan == '{}' || fromJSON(inputs.plan).workflows.loki.jobs.story-selection.run) &&
      inputs.test-plan-artifact-id != '' }}
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.loki-selection.outputs.selection }}
      test-plan-artifact-id: ${{ steps.loki-selection.outputs.paths-file && inputs.test-plan-artifact-id || '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            /.nvmrc
            /package.json
          sparse-checkout-cone-mode: false

      - name: Prepare Node + Bun environment
        uses: ./.github/actions/prepare-node-bun

      - name: Prepare Loki story selection
        id: loki-selection
        uses: ./.github/actions/prepare-test-selection
        with:
          suite: loki
          test-plan-artifact-id: ${{ inputs.test-plan-artifact-id }}

  visual-test:
    name: loki-run
    needs: story-selection
    # A missing job output compares equal to '0' in GitHub expressions,
    # so an empty selection is marked with a non-numeric value.
    if: >-
      ${{ !cancelled() && (inputs.plan == '{}' || fromJSON(inputs.plan).workflows.loki.jobs.visual-test.run) &&
      needs.story-selection.outputs.selection != 'empty' }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    services:
      docker:
        image: docker:19.03.12
        options: --privileged
        ports:
          - 2376:2376
        env:
          DOCKER_TLS_CERTDIR: /certs
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /tmp/docker-certs:/certs/client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Prepare frontend environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        run: NODE_ENV=development bun run build-pure:cljs

      - name: Prepare Loki story selection
        id: loki-selection
        if: ${{ needs.story-selection.outputs.test-plan-artifact-id != '' }}
        uses: ./.github/actions/prepare-test-selection
        with:
          suite: loki
          test-plan-artifact-id: ${{ needs.story-selection.outputs.test-plan-artifact-id }}

      - name: Build Storybook
        env:
          STORYBOOK_STORY_PATHS_FILE: ${{ steps.loki-selection.outputs.paths-file }}
        run: bun run build-storybook

      - name: Run Loki Visual Tests
        # Loki drops stories with parameters.loki.skip, and exits non-zero when that leaves the selection empty.
        run: bun run test-visual:loki --reactUri file:./storybook-static --verboseRenderer ${{ steps.loki-selection.outputs.paths-file && '--passWithNoStories --requireReference' || '' }}

      - name: Generate Visual Report on Failure
        if: failure()
        run: bun run test-visual:loki-report

      - name: Upload Artifact
        id: artifact-upload-step
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: loki-report
          include-hidden-files: true
          path: .loki/
          if-no-files-found: ignore

  loki-tests-result:
    name: visual-test
    needs:
      # Every job the `loki` plan names, so the roll-up below can see each
      # one's result.
      - story-selection
      - visual-test
    if: always() && !cancelled()
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.aggregate.outputs.ok }}
    steps:
      - uses: actions/checkout@v6
      - name: Roll the Loki results up
        id: aggregate
        uses: ./.github/actions/aggregate-results
        with:
          needs: ${{ toJSON(needs) }}
          plan: ${{ inputs.plan }}
          workflow: loki
