name: Random metareview

on:
  pull_request:
    types:
      - opened
      - ready_for_review

jobs:
  add_label:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5

    steps:
      - uses: tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a # v2.1.0
        id: generate-token
        with:
          app_id: ${{ secrets.METABASE_BOT_APP_ID }}
          private_key: ${{ secrets.METABASE_BOT_APP_PRIVATE_KEY }}

      - name: Add the metareview label to about 10% of pull requests
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: | #js
            const probability = 0.1;
            if (Math.random() >= probability) {
              console.log('Not selected for metareview');
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['metareview'],
            });
