name: Should run

# One question, one answer: did this commit touch the parts of the repo a job
# cares about? Callers whose whole job is asking that should use this. A job that
# needs several answers out of one diff — lint.yml, run-tests.yml — should call
# .github/actions/files-changed directly instead and map the `results` JSON to
# its own outputs, since a reusable workflow's outputs are fixed.

on:
  workflow_call:
    inputs:
      any-of:
        description: >
          Filter names from the filter file, comma- or newline-separated.
          `changed` is true when the commit matched at least one of them.
          `name: true` is accepted alongside a bare `name`. A name the filter
          file doesn't define fails the job rather than reporting false.
        type: string
        default: ""
      all-of:
        description: >
          Filter names, in the same forms, that must *all* have matched. Give
          both and the commit has to satisfy the OR and the AND together.
        type: string
        default: ""
      questions:
        description: >
          Several named questions of one diff, answered into the `answers` JSON:

            frontend:
              all-of: frontend_sources
            backend:
              any-of: backend_all, drivers
            docs: documentation

          Each name takes `any-of` and/or `all-of`; the last line is shorthand
          for a question that is only an `any-of`. Read the answers with
          fromJSON(needs.<job>.outputs.answers).frontend. Mutually exclusive
          with the top-level any-of/all-of.
        type: string
        default: ""
      filters:
        description: "Path to the paths-filter configuration, relative to the repo root."
        type: string
        default: .github/file-paths.yaml
      list-files:
        description: "Format for the `files` output: none, csv, shell, json or escape."
        type: string
        default: none
    outputs:
      changed:
        description: "'true' when the commit satisfied `any-of` and `all-of`."
        value: ${{ jobs.check.outputs.changed }}
      answers:
        description: "One JSON boolean per named question; `{}` unless `questions` was given."
        value: ${{ jobs.check.outputs.answers }}
      files:
        description: "Files matched by the named filters, in the `list-files` format."
        value: ${{ jobs.check.outputs.files }}
      results:
        description: "Every paths-filter output as a JSON object, for the odd extra lookup."
        value: ${{ jobs.check.outputs.results }}

jobs:
  check:
    name: Check which files changed
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      answers: ${{ steps.changes.outputs.answers }}
      files: ${{ steps.changes.outputs.files }}
      results: ${{ steps.changes.outputs.results }}
    steps:
      - uses: actions/checkout@v6
        with:
          # A local action is loaded out of the workspace, so this job has to
          # check out before it can reach files-changed. Everything it needs —
          # the action and the filter config — is under .github, and paths-filter
          # diffs refs rather than the worktree.
          sparse-checkout: .github
      - name: Test which files changed
        id: changes
        uses: ./.github/actions/files-changed
        with:
          any-of: ${{ inputs.any-of }}
          all-of: ${{ inputs.all-of }}
          questions: ${{ inputs.questions }}
          filters: ${{ inputs.filters }}
          list-files: ${{ inputs.list-files }}
