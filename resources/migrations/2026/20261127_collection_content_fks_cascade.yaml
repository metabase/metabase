## Delete what is in a Collection with it, so that deleting a remote sync worktree, which cascades to both, works on
## H2 and MySQL, which check a foreign key as soon as the Collection row is gone.

databaseChangeLog:
  - changeSet:
      id: ccf72f
      author: ranquild
      comment: Drop fk_card_collection_id, to add it again with ON DELETE CASCADE
      changes:
        - dropForeignKeyConstraint:
            baseTableName: report_card
            constraintName: fk_card_collection_id
      rollback:
        - addForeignKeyConstraint:
            baseTableName: report_card
            baseColumnNames: collection_id
            referencedTableName: collection
            referencedColumnNames: id
            constraintName: fk_card_collection_id
            onDelete: SET NULL
  - changeSet:
      id: ccfo9f
      author: ranquild
      comment: Delete the rows of report_card in a Collection with the Collection
      changes:
        - addForeignKeyConstraint:
            baseTableName: report_card
            baseColumnNames: collection_id
            referencedTableName: collection
            referencedColumnNames: id
            constraintName: fk_card_collection_id
            onDelete: CASCADE

