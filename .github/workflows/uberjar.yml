name: Build Uberjar

concurrency:
  group: uberjar-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Optional full-length commit SHA-1 hash"
        type: string
  workflow_call:
    inputs:
      commit:
        description: "Optional full-length commit SHA-1 hash"
        type: string

jobs:
  check-existing-artifacts:
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      ee_exists: ${{ steps.check-ee.outcome == 'success' }}
      oss_exists: ${{ steps.check-oss.outcome == 'success' }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Try to fetch existing EE artifact
        id: check-ee
        continue-on-error: true
        uses: ./.github/actions/fetch-artifact
        with:
          name: metabase-ee-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}-uberjar
          output-name: metabase-ee.jar

      - name: Try to fetch existing OSS artifact
        id: check-oss
        continue-on-error: true
        uses: ./.github/actions/fetch-artifact
        with:
          name: metabase-oss-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}-uberjar
          output-name: metabase-oss.jar

      - name: Decide if build is needed
        id: decide
        run: |
          EE_EXISTS="${{ steps.check-ee.outcome == 'success' }}"
          OSS_EXISTS="${{ steps.check-oss.outcome == 'success' }}"

          echo "EE exists: $EE_EXISTS"
          echo "OSS exists: $OSS_EXISTS"

          # Build only if artifacts don't exist for this commit hash
          # Since we build by hash, if artifacts exist for this hash, we don't need to rebuild
          if [[ "$EE_EXISTS" == "false" ]] || [[ "$OSS_EXISTS" == "false" ]]; then
            SHOULD_BUILD="true"
            echo "Will build: ee_exists=$EE_EXISTS, oss_exists=$OSS_EXISTS"
          else
            SHOULD_BUILD="false"
            echo "Skipping build: artifacts exist for this commit hash"
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

  # if this is on a release branch, we need to check the build requirements
  get-build-requirements:
    if: |
      !cancelled() &&
      contains(github.ref, 'release-x')
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    outputs:
      java_version: ${{ fromJson(steps.dependencies.outputs.result).java_version }}
      node_version: ${{ fromJson(steps.dependencies.outputs.result).node_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: release
      - name: Prepare build scripts
        run: cd ${{ github.workspace }}/release && yarn && yarn build
      - name: Get build dependencies
        uses: actions/github-script@v7
        id: dependencies
        with:
          script: | # js
            const { getBuildRequirements, getVersionFromReleaseBranch } = require('${{ github.workspace }}/release/dist/index.cjs');

            const version = getVersionFromReleaseBranch('${{ github.ref }}');
            const requirements = getBuildRequirements(version);

            return {
              java_version: requirements.java,
              node_version: requirements.node,
            };


  build:
    needs:
      [check-existing-artifacts, get-build-requirements]
    if: always() && !cancelled() && needs.check-existing-artifacts.outputs.should_build == 'true' && (needs.get-build-requirements.result == 'success' || needs.get-build-requirements.result == 'skipped')
    name: Build MB ${{ matrix.edition }}
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 20
    strategy:
      matrix:
        edition: ["ee", "oss"]
    env:
      MB_EDITION: ${{ matrix.edition }}
      INTERACTIVE: false
      SKIP_LICENSES: ${{ github.event_name == 'pull_request' }}  # faster builds for dev
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
        with:
          node-version: "${{ needs.get-build-requirements.outputs.node_version || '22' }}"
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
        with:
          java-version: "${{ needs.get-build-requirements.outputs.java_version || 21 }}"
      - name: Build
        run: ./bin/build.sh
      - name: Verify license files are present in uberjar
        if: ${{ env.SKIP_LICENSES != 'true' }}
        run: |
          echo "Checking for license files in uberjar..."
          unzip -l ./target/uberjar/metabase.jar | grep -q "license-backend-third-party.txt" || (echo "ERROR: license-backend-third-party.txt not found in uberjar" && exit 1)
          unzip -l ./target/uberjar/metabase.jar | grep -q "license-frontend-third-party.txt" || (echo "ERROR: license-frontend-third-party.txt not found in uberjar" && exit 1)
          echo "Both license files found in uberjar"
      - name: Launch uberjar
        run: >-
          java --add-opens java.base/java.nio=ALL-UNNAMED -jar ./target/uberjar/metabase.jar &
      - name: Wait for Metabase to start
        timeout-minutes: 5
        run: while ! curl -s 'http://localhost:3000/api/health' | grep '{"status":"ok"}'; do sleep 1; done
      - name: Prepare uberjar artifact
        uses: ./.github/actions/prepare-uberjar-artifact
        with:
          name: metabase-${{ matrix.edition }}-${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}-uberjar
