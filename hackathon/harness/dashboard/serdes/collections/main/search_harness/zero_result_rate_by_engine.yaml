dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH x AS (
        SELECT engine AS "Engine", split_part(embedder, '/', 2) AS "Embedder", avg(value) AS "Zero-result rate"
        FROM harness_scenario_metric
        WHERE corpus_id = {{corpus}} AND metric = 'zero_result_rate'
          AND embedding_text = {{variant}}
          AND text_strategy = {{strategy}}
          [[AND (data_scale = {{scale}} OR data_scale IS NULL)]]
        GROUP BY 1, 2
      )
      SELECT * FROM x
      ORDER BY 1, 2
    template-tags:
    - default: baseline
      display-name: Embedding text
