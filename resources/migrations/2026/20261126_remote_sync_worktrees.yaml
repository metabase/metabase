## Remote sync worktrees: checkouts of other branches whose content lives in the same tables as the main app, told
## apart by worktree_id, 1 for the default worktree that is the main app. Every table that can reach content remote
## sync syncs has the column. References between rows of these tables stay in one worktree, and their unique keys are
## unique per worktree.

databaseChangeLog:
  - changeSet:
      id: wtw01tb
      author: ranquild
      comment: Add remote_sync_worktree, a checkout of a remote sync branch whose content lives in the same tables as the main app
      changes:
        - createTable:
            tableName: remote_sync_worktree
            remarks: A checkout of a remote sync branch whose content lives in the same tables as the main app
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  remarks: Unique ID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: branch
                  type: varchar(254)
                  remarks: The remote sync branch the worktree checks out, empty for the default worktree
                  constraints:
                    nullable: false
              - column:
                  name: is_default
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: Whether this is the default worktree, the main app
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: int
                  remarks: The user who created the worktree
              - column:
                  name: created_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: The timestamp of when the worktree was created
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: ${timestamp_type}
                  defaultValueComputed: current_timestamp
                  remarks: The timestamp of when the worktree was last updated
                  constraints:
                    nullable: false
  - changeSet:
      id: wtw02df
      author: ranquild
      comment: Add the default worktree, the main app, which the new table gives id 1
      changes:
        - insert:
            tableName: remote_sync_worktree
            columns:
              - column:
                  name: branch
                  value: ''
              - column:
                  name: is_default
                  valueBoolean: true
      rollback:
        - delete:
            tableName: remote_sync_worktree
            where: is_default = TRUE
  - changeSet:
      id: wtw03wu
      author: ranquild
      comment: Add remote_sync_worktree_user, the worktree other than the default one a user has checked out
      changes:
        - createTable:
            tableName: remote_sync_worktree_user
            remarks: The worktree other than the default one a user has checked out, at most one per user
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  remarks: Unique ID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: worktree_id
                  type: int
                  remarks: The worktree the user has checked out
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: int
                  remarks: The user
                  constraints:
                    nullable: false
  - changeSet:
      id: wtw04wu
      author: ranquild
      comment: Let each user check out at most one worktree
      changes:
        - addUniqueConstraint:
            tableName: remote_sync_worktree_user
            columnNames: user_id
            constraintName: uq_remote_sync_worktree_user_user_id
  - changeSet:
      id: wtw05wu
      author: ranquild
      comment: Index the users of a worktree, which deleting the worktree deletes
      changes:
        - createIndex:
            tableName: remote_sync_worktree_user
            indexName: idx_remote_sync_worktree_user_worktree_id
            columns:
              - column:
                  name: worktree_id
  - changeSet:
      id: wtw06wu
      author: ranquild
      comment: Move the users of a deleted worktree back to the default one
      changes:
        - addForeignKeyConstraint:
            baseTableName: remote_sync_worktree_user
            baseColumnNames: worktree_id
            referencedTableName: remote_sync_worktree
            referencedColumnNames: id
            constraintName: fk_remote_sync_worktree_user_worktree_id
            onDelete: CASCADE
  - changeSet:
      id: wtw07wu
      author: ranquild
      comment: Delete the checkout of a deleted user
      changes:
        - addForeignKeyConstraint:
            baseTableName: remote_sync_worktree_user
            baseColumnNames: user_id
            referencedTableName: core_user
            referencedColumnNames: id
            constraintName: fk_remote_sync_worktree_user_user_id
            onDelete: CASCADE
