name: Test gate

# Decides whether a test suite should run, so each suite owns its own gating instead of the caller
# computing a `skip` input for it. The decision itself lives in .github/actions/test-gate; this
# workflow is the wrapper for suites that need nothing but the shared verdict. A suite that also
# has per-job decisions to make runs its own `gate` job over that action instead, so its outputs can
# be named after its jobs -- a reusable workflow's outputs have to be declared statically.
on:
  workflow_call:
    inputs:
      filters:
        description: >-
          Filter names from .github/file-paths.yaml, comma- or
          whitespace-separated. The suite runs when the diff matches any of them.
          Leave empty to decide on the overrides alone and skip the paths filter.
        type: string
        default: ''
      ignore-diff:
        description: >-
          Run regardless of the diff, skipping the paths filter. For a direct workflow_dispatch of
          the suite, which names the one thing to run. The force-skip overrides still apply.
        type: boolean
        default: false
    outputs:
      run:
        description: Whether the calling suite should run.
        value: ${{ jobs.should-run.outputs.run }}
      matched:
        description: >-
          Which of the requested filters the diff touched, as a JSON array, for suites whose jobs
          map to different filters. A force-run reports every requested filter.
        value: ${{ jobs.should-run.outputs.matched }}
      files:
        description: >-
          The changed files behind each requested filter, as a JSON object of filter name to array
          of paths. Every list is empty unless the paths filter ran.
        value: ${{ jobs.should-run.outputs.files }}
      force-run:
        description: Whether the suite should run in full, ignoring the diff.
        value: ${{ jobs.should-run.outputs.force-run }}
      verdict:
        description: force-run, force-skip, or defer.
        value: ${{ jobs.should-run.outputs.verdict }}

jobs:
  should-run:
    name: Decide whether to run
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      matched: ${{ steps.gate.outputs.matched }}
      files: ${{ steps.gate.outputs.files }}
      force-run: ${{ steps.gate.outputs.force-run }}
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      # The gate action and the filter definitions are the only things it reads from disk.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github
      - id: gate
        uses: ./.github/actions/test-gate
        with:
          filters: ${{ inputs.filters }}
          ignore-diff: ${{ inputs.ignore-diff }}
