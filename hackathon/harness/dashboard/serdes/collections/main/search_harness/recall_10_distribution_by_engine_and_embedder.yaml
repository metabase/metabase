name: Recall@10 distribution by engine and embedder
description: |-
  semantic tops up with appdb keyword hits when it finds fewer than semantic-search-min-results-threshold results.

  **Recall@10 (share found)**: 0 to 1: the share of right answers that appear in the first 10 results. Higher is better.

  **@10**: Only the first 10 results count, like the first page of search results.

  **Box plot**: The box holds the middle half of the questions, the line inside is the median, whiskers show the range, dots are outliers.

  **Scenario**: One test question plus its answer key. The golden corpus has 56.

  **Embedder**: The model that makes embeddings. Today `all-minilm`; `snowflake-arctic-embed2` is coming.

  **Top-up**: When semantic finds fewer than `semantic-search-min-results-threshold` results, it fills the list with appdb keyword hits. So "semantic" is not pure vector search; semantic-pure (top-up off) shows how much that matters.
