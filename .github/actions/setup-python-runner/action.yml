name: Setup Python Runner
description: Setup python-runner for tests
inputs:
  metabase-automation-token:
    description: Token for accessing the python-runner repository
    required: true
runs:
  using: composite
  steps:
    - name: Checkout metabase/python-runner-container
      uses: actions/checkout@v7
      with:
        repository: metabase/python-runner-container
        path: python-runner
        token: ${{ inputs.metabase-automation-token }}
        persist-credentials: false

    - name: Setup python-runner
      id: setup
      run: |
        echo "Starting python-runner..."
        cd python-runner
        make run-ci 1> ../python-runner.out.log 2> ../python-runner.err.log
        make logs 1>> ../python-runner.out.log 2>> ../python-runner.err.log &
      shell: bash

    - name: Print python-runner logs
      if: ${{ failure() && steps.setup.outcome == 'failure' }}
      run: |
        echo "::group::python-runner stdout"
        cat python-runner.out.log || true
        echo "::endgroup::"
        echo "::group::python-runner stderr"
        cat python-runner.err.log || true
        echo "::endgroup::"
      shell: bash
