name: Release Code Tests

on:
  push:
    branches:
      - "master"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  should-run:
    uses: ./.github/workflows/util.should-run.yml
    with:
      any-of: release_source

  release-type-check:
    needs: should-run
    if: needs.should-run.outputs.changed == 'true'
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: "release"
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: prepare dependencies in release directory
        run: bun install --cwd release --frozen-lockfile
      - name: Run frontend type-check
        run: bun run --cwd release type-check

  release-tests-unit:
    needs: should-run
    if: needs.should-run.outputs.changed == 'true'
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: "release"
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: prepare dependencies in release directory
        run: bun install --cwd release --frozen-lockfile
      - name: Run release unit tests
        run: bun run --cwd release test:unit

  ci-conductor-tests:
    needs: should-run
    if: needs.should-run.outputs.changed == 'true'
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: "release/ci-conductor"
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ci-conductor dependencies
        run: bun install --cwd release/ci-conductor --frozen-lockfile
      - name: Type-check ci-conductor
        run: bun run --cwd release/ci-conductor type-check
      - name: Run ci-conductor unit tests
        run: bun run --cwd release/ci-conductor test

  release-test-build:
    needs: should-run
    if: needs.should-run.outputs.changed == 'true'
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: "release"
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: 'package.json'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: prepare dependencies in release directory
        run: bun install --cwd release --frozen-lockfile
      - name: Build release bundle
        run: bun run --cwd release build
      - name: Smoke test release bundle
        run: node release/dist/index.cjs
