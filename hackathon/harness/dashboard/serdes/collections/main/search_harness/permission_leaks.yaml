dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH x AS (
        SELECT engine AS "Engine", split_part(embedder, '/', 2) AS "Embedder",
               count(*) AS "Scenarios checked", sum(value)::int AS "Leaks",
               string_agg(scenario_id, ', ') FILTER (WHERE value > 0) AS "Leaking scenarios"
        FROM harness_scenario_metric
        WHERE corpus_id = {{corpus}} AND metric = 'permission_leak'
          AND embedding_text = {{variant}}
          AND text_strategy = {{strategy}}
          [[AND (data_scale = {{scale}} OR data_scale IS NULL)]]
        GROUP BY 1, 2
      )
      SELECT * FROM x
      -- Say why the card is empty rather than showing nothing: some corpora have no leak-check questions.
      UNION ALL
      SELECT 'this corpus has no leak-check questions', NULL, 0, NULL, NULL WHERE NOT EXISTS (SELECT 1 FROM x)
      ORDER BY 4 DESC NULLS LAST, 1, 2
