## Fixes of the remote sync worktree schema: what is in a Collection is deleted with it, so that deleting a worktree,
## which cascades to both, works on H2 and MySQL; sandboxes and collection permissions are shared across worktrees,
## like data permissions; the logs of a worktree are deleted with it; and the Postgres planner gets statistics for
## worktree_id.

databaseChangeLog:
  - changeSet:
      id: ccf72f
      author: ranquild
      comment: Drop fk_card_collection_id, to add it again with ON DELETE CASCADE
      changes:
        - dropForeignKeyConstraint:
            baseTableName: report_card
            constraintName: fk_card_collection_id
      rollback:
        - addForeignKeyConstraint:
            baseTableName: report_card
            baseColumnNames: collection_id
            referencedTableName: collection
            referencedColumnNames: id
            constraintName: fk_card_collection_id
            onDelete: SET NULL
  - changeSet:
      id: ccfo9f
      author: ranquild
      comment: Delete the rows of report_card in a Collection with the Collection
      changes:
        - addForeignKeyConstraint:
            baseTableName: report_card
            baseColumnNames: collection_id
            referencedTableName: collection
            referencedColumnNames: id
            constraintName: fk_card_collection_id
            onDelete: CASCADE

