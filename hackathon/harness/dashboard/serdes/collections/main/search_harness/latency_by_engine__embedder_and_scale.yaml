dataset_query:
  database: Search Harness
  stages:
  - native: |-
      SELECT engine AS "Engine", split_part(embedder, '/', 2) AS "Embedder", CASE WHEN data_scale IS NULL THEN '235 (golden)' WHEN data_scale >= 1000 THEN (data_scale / 1000) || 'k'
                  ELSE data_scale::text END AS "Corpus size",
             count(*) FILTER (WHERE error IS NULL) AS "n (query × iteration)",
             round((percentile_cont(0.5)  WITHIN GROUP (ORDER BY latency_ms) FILTER (WHERE error IS NULL))::numeric, 1) AS "p50 ms",
             round((percentile_cont(0.95) WITHIN GROUP (ORDER BY latency_ms) FILTER (WHERE error IS NULL))::numeric, 1) AS "p95 ms",
             round((percentile_cont(0.99) WITHIN GROUP (ORDER BY latency_ms) FILTER (WHERE error IS NULL))::numeric, 1) AS "p99 ms",
             count(*) FILTER (WHERE error IS NOT NULL) AS "Errors"
      FROM harness_latest_observation
      WHERE (corpus_id = {{corpus}} OR corpus_id LIKE 'scale-%') AND run_id NOT IN (SELECT run_id FROM harness_run_concurrency WHERE overlapped)
        AND embedding_text = {{variant}}
        AND text_strategy = {{strategy}}
      GROUP BY 1, 2, 3, data_scale
      ORDER BY coalesce(data_scale, 235), array_position(ARRAY['semantic', 'semantic-pure', 'semantic-vector', 'sqlite-vec1', 'sqlite-vec1-pure', 'lucene', 'lucene-pure', 'appdb', 'in-place'], engine), 2
    template-tags:
    - default: baseline
      display-name: Embedding text
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000005
      name: variant
      required: true
      type: text
    - default: none
      display-name: Text strategy
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000006
      name: strategy
      required: true
      type: text
    - default: northwind-golden-v1
      display-name: Corpus
      id: 8f7c0a5e-1b2a-4c55-9d1e-000000000001
      name: corpus
      required: true
      type: text
    lib/type: mbql.stage/native
  lib/type: mbql/query
