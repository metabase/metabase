name: Profile Backend

# The only on-demand entry point for the backend test suites. Dispatching this workflow runs one
# suite against the ref you dispatch on, under clj-async-profiler, and attaches a flamegraph to
# each job.
#
# The suite workflows below are called unchanged: services, matrix legs, test args and quarantine
# gating are whatever the normal CI run uses, because they are the same jobs. They declare nothing
# for this feature beyond treating a `workflow_dispatch` as a profiling run, and reading `tests` off
# `github.event.inputs`, which inside a called workflow is this dispatch's payload.
#
# The suite is gated like any other run: dispatched on master or a release branch it runs in full;
# anywhere else it runs only if the ref's diff from master touches the backend, and semantic-search
# runs its Postgres-latest smoke leg alone.
#
# Renaming `tests` means updating its readers -- `grep -rn github.event.inputs.tests .github/`.
# Nothing enforces that, deliberately: a stale name reads as empty, which profiles each leg's usual
# set instead of the tests you named, on the run you are watching. It cannot affect a normal CI
# run, where the reference is empty either way.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to profile.'
        type: choice
        required: true
        options:
          - backend
          - app-db
          - drivers
          - semantic-search
      tests:
        description: 'Optional: profile only these tests, comma- or space-separated, e.g. metabase.query-processor-test/some-test. Bare namespaces work too. Blank profiles each leg''s usual set.'
        type: string
        required: false
        default: ''

# These jobs gate on `inputs.suite` -- this workflow's own input. Only the called workflows reach
# for `github.event.inputs.*`, because `inputs` there is their own `workflow_call` signature.
jobs:
  backend:
    if: ${{ inputs.suite == 'backend' }}
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  app-db:
    if: ${{ inputs.suite == 'app-db' }}
    uses: ./.github/workflows/app-db.yml
    secrets: inherit

  drivers:
    if: ${{ inputs.suite == 'drivers' }}
    uses: ./.github/workflows/drivers.yml
    secrets: inherit

  semantic-search:
    if: ${{ inputs.suite == 'semantic-search' }}
    uses: ./.github/workflows/semantic-search.yml
    secrets: inherit
