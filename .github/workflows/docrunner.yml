name: Docrunner
run-name: "Docrunner for #${{ inputs.issue || github.event.issue.number }}"

# A writer reads a GitHub issue, then adds the label `Docrunner`. Docrunner writes the docs change and opens a draft PR.
# A second job takes the screenshots that the change needs, and pushes them to the PR.
# Prompt templates: dev/bot/docrunner-agent.md and dev/bot/docrunner-screenshots-agent.md.
# For a label run, claude-code-action stops if the person who added the label cannot write to the repo.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number"
        required: true
        type: string
      dry_run:
        description: "Dry run: upload the results as an artifact. Do not open a PR, push, or comment"
        required: false
        default: false
        type: boolean

permissions: {}

# Each label on an issue starts this workflow. A run for another label gets its own group: in a shared group,
# a new pending run cancels the older pending run, and that run can be the Docrunner run.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'Docrunner')
    && format('docrunner-{0}', inputs.issue || github.event.issue.number)
    || format('docrunner-other-{0}', github.run_id) }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  ISSUE: ${{ inputs.issue || github.event.issue.number }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # The JSON schema of the docs agent also uses this regex, thus it has no backslash.
  IMAGE_PATH_RE: '^docs/([A-Za-z0-9_-]+/)*images/[A-Za-z0-9_-][A-Za-z0-9_.-]*[.]png$'
  DOCRUNNER_MODEL: claude-opus-5-5
  DOCRUNNER_MAX_TURNS: "100"
  SCREENSHOTS_MODEL: claude-sonnet-5-5
  SCREENSHOTS_MAX_TURNS: "150"
  # The bot posts text from the agents, and no person reviews it first. `sanitize` makes this text safer:
  # - A URL that is not on github.com/metabase or metabase.com goes in a code span, thus it is not a link.
  #   First, the filter removes each backslash before `:` or `/`, and escapes each `&` before an entity,
  #   because Markdown can hide a URL with them. A browser reads `\` as `/` in a URL, thus `/\host` and `\\host`
  #   are URLs to other sites. An allowed URL with `..`, `%2e`, or `\` also goes in a code span, because a browser
  #   opens `https://github.com/metabase/../x` as `https://github.com/x`.
  # - A closing keyword before a GitHub URL puts the URL in a code span. A zero-width space after the `#` of a
  #   closing keyword (for example `Fixes #123`) stops the reference. Thus a merge does not close that issue.
  # - A zero-width space after each `@` stops the mentions, also in code spans.
  SANITIZE_JQ: |
    def sanitize:
      gsub("\\\\(?=[:/])"; "")
      | gsub("&(?=#?[A-Za-z0-9]+;)"; "&amp;")
      | gsub("(?<![A-Za-z0-9_/\\\\:.@-])(?<u>(?:https?:|[/\\\\]{2}|www\\.)[^\\s<>()\\[\\]\"'`]+)";
          if (.u | test("^https://(?:github\\.com/metabase/|(?:[a-z0-9-]+\\.)*metabase\\.com(?:[/?#]|$))"; "i"))
            and (.u | test("/[.][.]|%2e|\\\\"; "i") | not)
          then .u else "`\(.u)`" end; "i")
      | gsub("(?<k>\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s*:?\\s*)(?<u>https://github\\.com/[^\\s<>()\\[\\]\"'`]+)";
          "\(.k)`\(.u)`"; "i")
      | gsub("(?<k>\\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\\s*:?\\s*)(?<r>(?:[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#)(?=[0-9])";
          "\(.k)\(.r)\u200b"; "i")
      | gsub("(?<a>^|[^A-Za-z0-9_])@(?<n>[A-Za-z0-9])"; "\(.a)@\u200b\(.n)");

jobs:
  docrunner:
    name: Write the docs change
    if: >-
      github.repository == 'metabase/metabase' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.label.name == 'Docrunner' && github.event.issue.state == 'open'))
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      status: ${{ steps.status.outputs.status }}
      images: ${{ steps.status.outputs.images }}
      pr_number: ${{ steps.pr.outputs.pull-request-number }}
      pr_branch: ${{ steps.pr.outputs.pull-request-branch }}
    steps:
      # The `runner` context is not available in job-level `env`. Thus the first step of each job sets `T` (temporary
      # files) and `OUT` (the files for the artifact) for all the steps after it, also the `always()` steps.
      - name: Set the paths
        run: printf 'T=%s\nOUT=%s\n' "$RUNNER_TEMP/docrunner" "$RUNNER_TEMP/docrunner/out" >> "$GITHUB_ENV"

      - name: Check the issue
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$ISSUE" =~ ^[0-9]+$ ]]; then
            echo "::error::The issue must be a number."
            exit 1
          fi
          mkdir -p "$T"
          gh api -H "Accept: application/vnd.github.full+json" \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE" > "$T/issue.json"
          if jq -e '.pull_request' "$T/issue.json" > /dev/null; then
            echo "::error::#$ISSUE is a pull request. Docrunner reads issues only."
            exit 1
          fi

      # No `ref`: an `issues` run gets the default branch, and a dispatch run gets the branch of the run.
      # Thus a test on a branch uses the prompt templates of that branch.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find an open docrunner PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:docrunner/issue-$ISSUE" \
            --jq '.[0].html_url // ""')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then
            echo "This issue has an open docrunner PR: $url"
          fi

      # The agent gets only the text that the writer saw:
      # - Rendered HTML has no HTML comments. `visible` also removes the `alt` and `title` attributes, because the
      #   page does not show them. Text in a closed `<details>` block still gets to the agent.
      # - The writer read the issue, then added the label. Comments and timeline links from after that time do not
      #   get to the agent. If the issue body changed after that time, Docrunner stops. For a dispatch, the cutoff
      #   is the start of this step.
      # - The linked PRs come from the visible HTML and from the timeline. A person who writes a PR can put any text
      #   in it. Thus Docrunner uses only PRs from people who can write to the repo, the same rule that
      #   claude-code-action uses for the person who adds the label.
      - name: Write the context for the agent
        if: steps.existing.outputs.url == ''
        env:
          GH_TOKEN: ${{ github.token }}
          LABELED_AT: ${{ github.event.issue.updated_at }}
          VISIBLE_JQ: 'def visible: gsub("\\s(?:alt|title)=\"[^\"]*\""; "");'
        run: |
          accept="Accept: application/vnd.github.full+json"
          mkdir -p .docrunner/prs
          cutoff="${LABELED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          echo "Cutoff: $cutoff"

          edited=$(gh api graphql -F number="$ISSUE" -f owner="$GITHUB_REPOSITORY_OWNER" -f name="${GITHUB_REPOSITORY#*/}" \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) { issue(number: $number) { lastEditedAt } } }' \
            --jq '.data.repository.issue.lastEditedAt // ""')
          if [[ "$edited" > "$cutoff" ]]; then
            echo "Docrunner did not run, because a person changed the issue body after the label was added ($edited). Read the issue again." > "$T/reason.md"
            echo "::error::The issue body changed after the cutoff."
            exit 1
          fi

          gh api -H "$accept" --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" \
            | jq -s 'add // []' > "$T/all-comments.json"
          jq --arg c "$cutoff" '[.[] | select(.updated_at <= $c)]' "$T/all-comments.json" > "$T/comments.json"
          late=$(jq --arg c "$cutoff" '[.[] | select(.updated_at > $c)] | length' "$T/all-comments.json")
          echo "Comments from after the cutoff, not used: $late"

          {
            jq -r "$VISIBLE_JQ"' .body_html // "" | visible' "$T/issue.json"
            jq -r "$VISIBLE_JQ"' .[].body_html // "" | visible' "$T/comments.json"
          } > "$T/body.html"
          # A PR that says "Closes #N" shows only on the timeline.
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/timeline" \
            | jq -s -r --arg repo "$GITHUB_REPOSITORY" --arg c "$cutoff" 'add // [] | .[]
                | select(.event == "cross-referenced" and .created_at <= $c) | .source.issue // empty
                | select(.html_url // "" | startswith("https://github.com/\($repo)/pull/"))
                | .number' > "$T/timeline-refs.txt" || true
          # GitHub renders a full PR link, and a reference like `#12345` to a PR, as a link to `.../pull/<number>`.
          # A reference to an issue links to `.../issues/<number>`.
          { { cat "$T/timeline-refs.txt"
              grep -oE 'github\.com/metabase/metabase/pull/[0-9]+' "$T/body.html" | grep -oE '[0-9]+$'
            } | awk '!seen[$0]++' | head -20 > "$T/refs.txt"; } || true

          prs=()
          while read -r n; do
            [ "${#prs[@]}" -lt 5 ] || break
            [ "$n" != "$ISSUE" ] || continue
            gh api -H "$accept" "repos/$GITHUB_REPOSITORY/pulls/$n" > "$T/pr.json" 2> /dev/null < /dev/null || continue
            author=$(jq -r 'select(.user.type == "User") | .user.login' "$T/pr.json")
            perm=""
            if [ -n "$author" ]; then
              perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$author/permission" --jq '.permission' 2> /dev/null < /dev/null || true)
            fi
            if [ "$perm" != admin ] && [ "$perm" != write ]; then
              echo "Not used: #$n. The author cannot write to the repo."
              continue
            fi
            # The shell has `pipefail`: without the `if`, one failed call stops the step.
            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$n/files" < /dev/null | jq -s 'add // []' > "$T/files.json"; then
              echo "Not used: #$n. Docrunner could not get its changed files."
              continue
            fi
            {
              jq -r "$VISIBLE_JQ"' "# Pull request #\(.number): \(.title)\n\nURL: \(.html_url)\nState: \(.state)\(if .merged then ", merged" else "" end)\nBase branch: \(.base.ref)\n\n## Description (rendered HTML)\n\n\(.body_html // "" | visible)\n\n## Changed files\n"' "$T/pr.json"
              jq -r '.[] | "### \(.filename) (\(.status), +\(.additions) -\(.deletions))\n\n" +
                (if .patch == null then "No text patch.\n"
                 elif .changes <= 2000 then "~~~~~diff\n\(.patch)\n~~~~~\n"
                 else "The patch is not included: \(.changes) changed lines.\n" end)' "$T/files.json"
            } > ".docrunner/prs/$n.md"
            prs+=("#$n")
          done < "$T/refs.txt"

          {
            jq -r "$VISIBLE_JQ"' "# Issue #\(.number): \(.title)\n\nURL: \(.html_url)\nState: \(.state)\nLabels: \([.labels[].name] | join(", "))\n\n## Issue body (rendered HTML)\n\n\(.body_html // "" | visible)\n"' "$T/issue.json"
            jq -r "$VISIBLE_JQ"' .[] | "## Comment by \(.user.login) on \(.created_at)\n\n\(.body_html // "" | visible)\n"' "$T/comments.json"
            if [ "$late" -gt 0 ]; then
              printf '## Comments that are not included\n\n%s comments were added or changed after the label was added. This file does not include them.\n\n' "$late"
            fi
            echo "## Linked pull requests"
            echo
            if [ "${#prs[@]}" -gt 0 ]; then
              echo "${prs[*]}. See the files in \`.docrunner/prs/\`."
            else
              echo "None."
            fi
          } > .docrunner/context.md
          echo "Linked PRs: ${prs[*]:-none}"

      # While a skill is active, Claude Code uses its `allowed-tools` as allow rules, also in dontAsk mode. Thus each
      # grant of docs-write and docs-review must be a rule that the agent step already permits or denies:
      # `Edit(docs/**/*.md)`, or a Bash rule (the Bash deny is stronger than a grant). `hooks` can run commands.
      # Claude Code does not expand an `@` import in a skill (tested with 2.1.150 and 2.1.322). Thus each skill links to
      # the style guide, and the agent reads it. A link that does not resolve gives no error, thus this step checks it.
      # The agent needs no other skill, thus this step removes the other skills and the commands. A new skill
      # cannot change what the agent can do. "Restore the skills" puts them back after the agent.
      - name: Check the docs skills
        if: steps.existing.outputs.url == ''
        run: |
          find .claude/skills -mindepth 1 -maxdepth 1 ! -name docs-write ! -name docs-review ! -name _shared \
            -exec rm -rf -- {} +
          rm -rf .claude/commands
          errors=()
          for skill in docs-write docs-review; do
            f=".claude/skills/$skill/SKILL.md"
            if [ ! -f "$f" ]; then
              errors+=("\`$f\` does not exist.")
              continue
            fi
            # The front matter: the lines between the first two `---` lines.
            front=$(awk 'NR == 1 { if ($0 != "---") exit; next } $0 == "---" { exit } { print }' "$f")
            if grep -qE '^hooks:' <<< "$front"; then
              errors+=("\`$f\` has \`hooks\`.")
            fi
            # The value of `allowed-tools`: on the same line, or a list on the next lines. An unknown grant fails.
            grants=$(awk '/^allowed-tools:/ { on = 1; sub(/^allowed-tools:/, ""); print; next }
                          on && /^[^[:space:]-]/ { on = 0 }
                          on { print }' <<< "$front" \
              | grep -oE '[A-Za-z_][A-Za-z0-9_]*(\([^)]*\))?' || true)
            while IFS= read -r g; do
              case "$g" in
                '' | 'Edit(docs/**/*.md)' | Bash | 'Bash('*')') ;;
                *) errors+=("\`$f\` grants \`$g\`. Docrunner permits only \`Edit(docs/**/*.md)\` and Bash rules.") ;;
              esac
            done <<< "$grants"
            # A relative link starts at the folder of the skill.
            links=$(grep -oE '\]\(\.\./_shared/[^)#]+' "$f" | cut -c3- || true)
            if [ -z "$links" ]; then
              errors+=("\`$f\` has no link to the style guide in \`.claude/skills/_shared/\`.")
            fi
            while IFS= read -r link; do
              if [ -n "$link" ] && [ ! -f ".claude/skills/$skill/$link" ]; then
                errors+=("\`$f\` links to \`$link\`, but that file does not exist.")
              fi
            done <<< "$links"
          done
          if [ "${#errors[@]}" -gt 0 ]; then
            {
              echo "Docrunner did not run, because a docs skill is not safe, or a file of it is missing:"
              echo
              printf -- '- %s\n' "${errors[@]}"
            } > "$T/reason.md"
            cat "$T/reason.md"
            echo "::error::A docs skill did not pass the checks."
            exit 1
          fi
          echo "The docs skills pass the checks."

      # Tool rules (see https://code.claude.com/docs/en/permissions):
      # - dontAsk denies each call that no allow rule permits. Reads are permitted only in the working folder,
      #   because no rule allows a bare Read, Glob, or Grep. Thus no reads of /proc or of the home folder.
      # - The Bash deny removes the shell. On Linux, Claude Code leaves out Glob and Grep by default, and 2.1.119 and
      #   later give them back when Bash is denied. The action installs 2.1.322 (tested). Do not name Glob or Grep in
      #   --allowedTools: a bare allow rule permits searches outside the working folder. "Find the status" fails the
      #   run if the agent did not have them.
      # - `Agent` and `Workflow` start subagents, and `SendMessage` sends messages to other agents. Deny them.
      # - The Skill tool loads only docs-write and docs-review: in dontAsk mode, a skill with `allowed-tools` loads only
      #   if an allow rule names it. "Check the docs skills" removes the other skills, and checks the grants of these two.
      #   Do not deny Skill: a deny is stronger than the allow rules, and then no skill loads.
      # - `Edit(docs/**/*.md)` controls the Edit and Write tools. The agent can write only Markdown files in `docs/`.
      #   Thus it cannot write a config file that a later step runs, for example `docs/.prettierrc.mjs`.
      # - The `Edit` denies: `docs/**/*.md` also matches Claude Code files. Claude Code loads a nested `CLAUDE.md`
      #   or skill during the session, when the agent reads a file in that folder. A `CLAUDE.md` can import a file
      #   with `@`, and a skill can have `hooks`. "Check the docs skills" cannot see a file from the agent.
      # - `Read(./.git/**)`: the action puts the job token in `.git/config`.
      - name: Run the docs agent
        id: claude
        if: steps.existing.outputs.url == ''
        continue-on-error: true
        timeout-minutes: 30
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Read and follow `dev/bot/docrunner-agent.md`.
          claude_args: |
            --model ${{ env.DOCRUNNER_MODEL }}
            --max-turns ${{ env.DOCRUNNER_MAX_TURNS }}
            --permission-mode dontAsk
            --allowedTools "Edit(docs/**/*.md),Skill(docs-write),Skill(docs-review)"
            --disallowedTools "Bash,NotebookEdit,WebFetch,WebSearch,Agent,Workflow,SendMessage,Monitor,Read(//proc/**),Read(./.git/**),Edit(docs/**/CLAUDE.md),Edit(docs/**/CLAUDE.local.md),Edit(docs/**/AGENTS.md),Edit(docs/**/.claude/**)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["status","title","body","images"],"properties":{"status":{"type":"string","enum":["done","no-change"]},"title":{"type":"string"},"body":{"type":"string"},"images":{"type":"array","maxItems":10,"items":{"type":"object","additionalProperties":false,"required":["path","shows","steps"],"properties":{"path":{"type":"string","pattern":"${{ env.IMAGE_PATH_RE }}"},"shows":{"type":"string"},"steps":{"type":"string"}}}}}}'

      - name: Remove the token from the git remote
        if: always() && steps.claude.outcome != 'skipped'
        run: |
          git remote set-url origin "https://github.com/$GITHUB_REPOSITORY.git"
          git config --unset-all "http.https://github.com/.extraheader" || true

      # The tool rules do not let the agent write in `.claude/`, thus this restores only what "Check the docs skills" removed.
      - name: Restore the skills
        if: always() && steps.claude.outcome != 'skipped'
        run: git checkout -- .claude

      # The tool rules permit only Markdown files in `docs/`. This step makes sure of it, because a later step can run
      # code from a file in the workspace (prettier loads a JS config). `--others` without `--exclude-standard` also
      # lists ignored files, thus a `.gitignore` from the agent cannot hide a file.
      - name: Remove files that are not Markdown
        if: always() && steps.claude.outcome != 'skipped'
        run: |
          git checkout -- docs ':(exclude)docs/*.md'
          git ls-files -z --others -- docs | while IFS= read -r -d '' f; do
            case "$f" in
              *.md) ;;
              *) printf 'Removed: %q\n' "$f"; rm -f -- "$f" ;;
            esac
          done

      # This rule does not depend on the prompt.
      - name: Remove changes to generated files
        if: always() && steps.claude.outcome != 'skipped'
        run: |
          grep -E '^/?docs/[^[:space:]]+[[:space:]]+#[[:space:]]*auto-generated' .github/CODEOWNERS \
            | awk '{ sub(/^\//, "", $1); print $1 }' \
            | while read -r path; do
                git checkout -- "$path" 2> /dev/null || true
                git clean -fdq -- "$path"
              done

      # The docs-write skill says to run prettier. The agent has no shell, thus the workflow runs it.
      # 3.3.3 is the version in bun.lock. `--config`: prettier uses only the config of the repo root, and does not
      # look for a config in the folders of the files.
      - name: Format the changed Markdown files
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        run: |
          mapfile -t files < <(git ls-files --modified --others --exclude-standard -- 'docs/*.md')
          if [ "${#files[@]}" -gt 0 ]; then
            npx --yes prettier@3.3.3 --config .prettierrc --write -- "${files[@]}"
          fi

      - name: Find the status
        id: status
        if: always() && steps.check.outcome == 'success'
        env:
          EXISTING_URL: ${{ steps.existing.outputs.url }}
          AGENT_OUTCOME: ${{ steps.claude.outcome }}
          RESULT: ${{ steps.claude.outputs.structured_output }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          mkdir -p "$OUT"
          changed=$(git ls-files --modified --others --exclude-standard -- 'docs/*.md')

          if [ -n "$EXISTING_URL" ]; then
            status=exists
          elif [ "$AGENT_OUTCOME" != success ] || ! jq -e 'type == "object"' <<< "$RESULT" > /dev/null 2>&1; then
            status=failed
          elif [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ] && ! jq -e \
              '(["Glob", "Grep"] - [.[] | select(.type == "system" and .subtype == "init") | .tools[]?]) == []' \
              "$EXEC_FILE" > /dev/null 2>&1; then
            # The prompt tells the agent to search with Glob and Grep. See the tool rules at "Run the docs agent".
            status=failed
            echo "Docrunner failed: the agent did not have the Glob and Grep tools, thus it could not search the docs." > "$T/reason.md"
            echo "::error::The agent session did not have the Glob and Grep tools."
          elif [ "$(jq -r '.status' <<< "$RESULT")" = no-change ]; then
            status=no-change
            jq -r "$SANITIZE_JQ"' .body // "" | sanitize' <<< "$RESULT" > "$T/agent-body.md"
          elif [ -z "$changed" ]; then
            status=no-change
            {
              echo "Docrunner did not change a Markdown file in \`docs/\` that it can commit. It removes all changes to generated files."
              echo
              echo "The notes of the agent:"
              echo
              jq -r "$SANITIZE_JQ"' .body // "" | sanitize' <<< "$RESULT"
            } > "$T/agent-body.md"
          else
            status=done
          fi

          images='[]'
          if [ "$status" = done ]; then
            # The JSON schema checks each path and the count. "Check the screenshots" checks each path again before the push.
            # The screenshots job uses `index`.
            images=$(jq -c '.images // [] | unique_by(.path) | to_entries | map(.value + {index: (.key + 1)})' <<< "$RESULT")
            # `.[0:200]` counts characters, not bytes, thus it does not cut a character in two.
            title=$(jq -r "$SANITIZE_JQ"' .title // "" | gsub("\\s+"; " ") | sub("^ "; "") | sub(" $"; "") | sanitize | .[0:200]' <<< "$RESULT")
            if [ -z "$title" ]; then
              title="docs: draft for #$ISSUE"
            fi
            # The prompt tells the agent to load both docs skills, and the skills tell it to read the style guide. If the
            # agent did not, it is not an error, but the writer must know about it.
            missing=""
            for s in docs-write docs-review; do
              if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ] || ! jq -e --arg s "$s" \
                  'any(.[] | select(.type == "assistant") | .message.content[]?;
                       .type == "tool_use" and .name == "Skill" and .input.skill == $s)' "$EXEC_FILE" > /dev/null 2>&1; then
                missing="${missing:+$missing and }\`$s\`"
              fi
            done
            if [ -z "$EXEC_FILE" ] || [ ! -f "$EXEC_FILE" ] || ! jq -e \
                'any(.[] | select(.type == "assistant") | .message.content[]?;
                     .type == "tool_use" and .name == "Read" and (.input.file_path // "" | endswith("_shared/metabase-style-guide.md")))' \
                "$EXEC_FILE" > /dev/null 2>&1; then
              missing="${missing:+$missing and }the style guide"
            fi
            {
              jq -r "$SANITIZE_JQ"' .body | sanitize' <<< "$RESULT"
              if [ "$images" != '[]' ]; then
                printf '\n## Images\n\nThe `screenshots` job tries to add these images in a second commit. Examine each image.\n\n'
                jq -r "$SANITIZE_JQ"' .[] | "- `\(.path)`: \(.shows | gsub("\\s+"; " ") | sanitize)\n  - Steps: \(.steps | gsub("\\s+"; " ") | sanitize)"' <<< "$images"
              fi
              if [ -n "$missing" ]; then
                printf '\n## Skills\n\nDocrunner did not load %s. Examine the style of the change.\n' "$missing"
              fi
              printf '\n---\n\nResolves #%s\n\n' "$ISSUE"
              printf 'Check the backport label. For a feature that is only on `master`, change it to `no-backport`.\n\n'
              printf 'Docrunner made this draft. Run: %s\n' "$RUN_URL"
            } > "$T/pr-body.md"
            echo "title=$title" >> "$GITHUB_OUTPUT"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Status: $status"

          # The files for the artifact.
          echo "$status" > "$OUT/status.txt"
          if jq -e . <<< "$RESULT" > /dev/null 2>&1; then
            jq . <<< "$RESULT" > "$OUT/agent-result.json"
          fi
          for f in pr-body.md agent-body.md reason.md; do
            if [ -f "$T/$f" ]; then cp "$T/$f" "$OUT/$f"; fi
          done
          if [ -d .docrunner ]; then cp -R .docrunner "$OUT/context"; fi
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then cp "$EXEC_FILE" "$OUT/transcript.json"; fi
          git diff -- 'docs/*.md' > "$OUT/changes.diff"
          git ls-files -z --others --exclude-standard -- 'docs/*.md' \
            | while IFS= read -r -d '' f; do git diff --no-index -- /dev/null "$f" >> "$OUT/changes.diff" || true; done

      # The transcript helps to tune the prompt. For a dry run, the diff and the result JSON are the output.
      - name: Upload the results
        if: always() && steps.status.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: docrunner-issue-${{ env.ISSUE }}
          path: ${{ runner.temp }}/docrunner/out/
          retention-days: 30
          if-no-files-found: ignore

      # The write token exists only after the agent step.
      - name: Make the write token
        id: token
        if: always() && steps.check.outcome == 'success' && inputs.dry_run != true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.METABASE_BOT_APP_ID }}
          private-key: ${{ secrets.METABASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # The app token, not GITHUB_TOKEN: a PR from GITHUB_TOKEN does not start CI.
      # `docs/*.md`: in a pathspec, `*` also matches `/`. Thus this is all Markdown files in `docs/`, and no other file.
      # A draft PR gets no code owner request. GitHub requests @metabase/tech-writers when it is ready for review.
      - name: Open the draft PR
        id: pr
        if: steps.status.outputs.status == 'done' && inputs.dry_run != true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.token.outputs.token }}
          branch: docrunner/issue-${{ env.ISSUE }}
          base: master
          draft: true
          add-paths: docs/*.md
          sign-commits: true
          commit-message: |
            ${{ steps.status.outputs.title }}

            Docrunner draft for #${{ env.ISSUE }}.
          title: ${{ steps.status.outputs.title }}
          body-path: ${{ runner.temp }}/docrunner/pr-body.md
          labels: |
            Type:Documentation
            single-backport
          assignees: ${{ github.event.sender.login }}

      - name: Report on the issue
        if: always() && steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STATUS: ${{ steps.status.outputs.status || 'failed' }}
          IMAGES: ${{ steps.status.outputs.images }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          EXISTING_URL: ${{ steps.existing.outputs.url }}
        run: |
          f="$T/comment.md"
          case "$STATUS" in
            done)
              if [ -n "$PR_URL" ]; then
                echo "Docrunner opened a draft PR: $PR_URL" > "$f"
                if [ -n "$IMAGES" ] && [ "$IMAGES" != '[]' ]; then
                  printf '\nThe screenshots job adds the images to the PR in a second commit.\n' >> "$f"
                fi
              else
                echo "Docrunner wrote a change, but it could not open the PR. Run: $RUN_URL" > "$f"
              fi
              ;;
            exists)
              {
                echo "Docrunner did not run, because this issue has an open docrunner PR: $EXISTING_URL"
                printf '\nTo run Docrunner again, close that PR, then add the label `Docrunner` again.\n'
              } > "$f"
              ;;
            no-change)
              {
                if [ -s "$T/agent-body.md" ]; then
                  printf '_Docrunner wrote this comment. A person did not review it._\n\n'
                  cat "$T/agent-body.md"
                  printf '\n---\n\n'
                fi
                printf 'Docrunner made no change. Run: %s\n' "$RUN_URL"
              } > "$f"
              ;;
            *)
              {
                if [ -s "$T/reason.md" ]; then cat "$T/reason.md"; else echo "Docrunner failed."; fi
                printf '\nRun: %s\n' "$RUN_URL"
              } > "$f"
              ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = issues ] && [ "$STATUS" != done ] && [ "$STATUS" != exists ]; then
            printf '\nTo run Docrunner again, add the label `Docrunner` again.\n' >> "$f"
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" -F body=@"$f" > /dev/null

          # Remove the label, so that a person can add it again.
          if [ "$GITHUB_EVENT_NAME" = issues ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$ISSUE/labels/Docrunner" > /dev/null || true
          fi

      # `continue-on-error` keeps the agent step green. This step makes a failed run red in the list of runs.
      - name: Fail the job if Docrunner failed
        if: always() && steps.status.outputs.status == 'failed'
        run: |
          echo "::error::Docrunner failed. See the agent step and the artifact."
          exit 1

  screenshots:
    name: Take the screenshots
    needs: docrunner
    if: >-
      needs.docrunner.outputs.status == 'done' &&
      needs.docrunner.outputs.images != '' &&
      needs.docrunner.outputs.images != '[]' &&
      (inputs.dry_run == true || needs.docrunner.outputs.pr_number != '')
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      IMAGES: ${{ needs.docrunner.outputs.images }}
      PR_NUMBER: ${{ needs.docrunner.outputs.pr_number }}
      PR_BRANCH: ${{ needs.docrunner.outputs.pr_branch }}
      MB_URL: http://localhost:3000
    steps:
      # The same `T` and `OUT` as in the docrunner job.
      - name: Set the paths
        run: printf 'T=%s\nOUT=%s\n' "$RUNNER_TEMP/docrunner" "$RUNNER_TEMP/docrunner/out" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The agent gets the image list, not the issue text.
      - name: Write the image list
        run: |
          mkdir -p .docrunner/shots "$OUT"
          jq '[.[] | {index, path, shows, steps}]' <<< "$IMAGES" > .docrunner/images.json
          cp .docrunner/images.json "$OUT/images.json"

      # metabase-enterprise-head is the build of master. The license token turns on the paid features.
      # The PR environments use the same token. The image runs in prod mode, thus it checks the token on
      # token-check.metabase.com, and a staging token (for example STAGING_MB_ALL_FEATURES_TOKEN) does not work.
      # Only this step gets the token. `--env NAME` without a value copies it from the environment, thus it is not in
      # the command line. Metabase does not return a setting from an env var through the API, thus the browser
      # cannot show the token.
      - name: Start Metabase
        env:
          MB_PREMIUM_EMBEDDING_TOKEN: ${{ secrets.PR_ENV_MB_PREMIUM_EMBEDDING_TOKEN }}
        run: |
          args=(--env MB_CHECK_FOR_UPDATES=false --env MB_ANON_TRACKING_ENABLED=false)
          if [ -n "$MB_PREMIUM_EMBEDDING_TOKEN" ]; then
            args+=(--env MB_PREMIUM_EMBEDDING_TOKEN)
          else
            echo "::warning::The secret PR_ENV_MB_PREMIUM_EMBEDDING_TOKEN is empty. Metabase starts without paid features."
          fi
          docker run --detach --name metabase --publish 127.0.0.1:3000:3000 "${args[@]}" \
            metabase/metabase-enterprise-head:latest
          for _ in $(seq 1 90); do
            if curl --silent --fail "$MB_URL/api/health" | grep -q '"ok"'; then break; fi
            sleep 5
          done
          curl --silent --show-error --fail "$MB_URL/api/health"
          echo

          setup_token=$(curl --silent --show-error --fail "$MB_URL/api/session/properties" | jq -r '."setup-token"')
          password="Docs-$(openssl rand -hex 16)"
          session=$(jq -n --arg t "$setup_token" --arg p "$password" \
              '{token: $t, user: {email: "docs-writer@example.com", password: $p, first_name: "Docs", last_name: "Writer"},
                prefs: {site_name: "Metabase", site_locale: "en"}}' \
            | curl --silent --show-error --fail -X POST "$MB_URL/api/setup" \
                -H "Content-Type: application/json" --data @- \
            | jq -r '.id')
          echo "::add-mask::$session"

          # Wait for the first sync of the Sample Database.
          synced=false
          for _ in $(seq 1 24); do
            if curl --silent --fail -H "X-Metabase-Session: $session" "$MB_URL/api/database" \
                | jq -e '.data[]? | select(.is_sample and .initial_sync_status == "complete")' > /dev/null; then
              synced=true
              break
            fi
            sleep 5
          done
          if [ "$synced" != true ]; then
            echo "::warning::The first sync of the Sample Database is not complete after 2 minutes. Screenshots can show missing data."
          fi

          # The feature names are not secret. The token is.
          features=$(curl --silent --show-error --fail -H "X-Metabase-Session: $session" "$MB_URL/api/session/properties" \
            | jq -r '[."token-features" // {} | to_entries[] | select(.value == true) | .key] | sort | join(", ")')
          if [ -n "$features" ]; then
            echo "Paid features: $features"
          else
            echo "::warning::The license token gives no paid features. Screenshots of paid features are not possible."
          fi

          # The browser starts logged in. The agent does not get the password.
          jq -n --arg s "$session" \
            '{cookies: [{name: "metabase.SESSION", value: $s, domain: "localhost", path: "/", expires: -1,
                         httpOnly: true, secure: false, sameSite: "Lax"}], origins: []}' > "$T/storage-state.json"

      # --allowed-origins "does not serve as a security boundary and does not affect redirects" (Playwright MCP README).
      # Thus the browser also sends all requests to a proxy that does not exist, except requests to localhost.
      - name: Install Playwright MCP
        run: |
          npm install --prefix "$T/playwright-mcp" --no-save --no-audit --no-fund @playwright/mcp@0.0.83
          "$T/playwright-mcp/node_modules/.bin/playwright" install --with-deps chromium

          jq -n '{
            browser: {
              browserName: "chromium",
              isolated: true,
              launchOptions: {
                headless: true,
                proxy: {server: "http://127.0.0.1:9", bypass: "localhost,127.0.0.1,[::1]"}
              },
              contextOptions: {viewport: {width: 1440, height: 900}, deviceScaleFactor: 2}
            },
            network: {allowedOrigins: ["http://localhost:3000"]}
          }' > "$T/playwright.json"

          jq -n --arg cli "$T/playwright-mcp/node_modules/@playwright/mcp/cli.js" \
                --arg config "$T/playwright.json" \
                --arg state "$T/storage-state.json" \
                --arg outdir "$T/playwright-output" \
            '{mcpServers: {playwright: {type: "stdio", command: "node",
               args: [$cli, "--config", $config, "--storage-state", $state, "--output-dir", $outdir]}}}' > "$T/mcp.json"

      # No shell, no file edits, and no Playwright tool that runs code or uploads files.
      - name: Run the screenshot agent
        id: claude
        continue-on-error: true
        timeout-minutes: 30
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Read and follow `dev/bot/docrunner-screenshots-agent.md`.
          claude_args: |
            --model ${{ env.SCREENSHOTS_MODEL }}
            --max-turns ${{ env.SCREENSHOTS_MAX_TURNS }}
            --permission-mode dontAsk
            --mcp-config ${{ runner.temp }}/docrunner/mcp.json
            --strict-mcp-config
            --allowedTools "mcp__playwright__browser_navigate,mcp__playwright__browser_navigate_back,mcp__playwright__browser_snapshot,mcp__playwright__browser_click,mcp__playwright__browser_hover,mcp__playwright__browser_type,mcp__playwright__browser_fill_form,mcp__playwright__browser_press_key,mcp__playwright__browser_select_option,mcp__playwright__browser_drag,mcp__playwright__browser_wait_for,mcp__playwright__browser_resize,mcp__playwright__browser_handle_dialog,mcp__playwright__browser_take_screenshot"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,Skill,WebFetch,WebSearch,Agent,Workflow,SendMessage,Monitor,Read(//proc/**),Read(./.git/**),mcp__playwright__browser_evaluate,mcp__playwright__browser_run_code_unsafe,mcp__playwright__browser_file_upload,mcp__playwright__browser_drop,mcp__playwright__browser_tabs"
            --json-schema '{"type":"object","additionalProperties":false,"required":["images"],"properties":{"images":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["index","saved","note"],"properties":{"index":{"type":"integer"},"saved":{"type":"boolean"},"note":{"type":"string"}}}}}}'

      # Use only the list from the first job, not the files in the workspace: the agent can write files there.
      # Rules: only paths from the list, only docs/**/images/*.png, only PNG files of 3 MB or less, and only images that
      # the agent confirmed.
      - name: Check the screenshots
        id: check
        if: always()
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          max=$((3 * 1024 * 1024))
          rm -rf "$OUT/shots" "$OUT/all-shots"
          mkdir -p "$OUT/shots" "$OUT/all-shots"
          if jq -e 'type == "object"' <<< "$RESULT" > /dev/null 2>&1; then
            jq . <<< "$RESULT" > "$OUT/agent-result.json"
          else
            echo '{}' > "$OUT/agent-result.json"
          fi
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then cp "$EXEC_FILE" "$OUT/transcript.json"; fi

          results='[]'
          while IFS= read -r item; do
            i=$(jq -r '.index' <<< "$item")
            dest=$(jq -r '.path' <<< "$item")
            src=".docrunner/shots/$i.png"
            saved=$(jq -r --argjson i "$i" '[.images[]? | select(.index == $i) | .saved][0] // false' "$OUT/agent-result.json")
            note=$(jq -r --argjson i "$i" '[.images[]? | select(.index == $i) | .note][0] // "" | gsub("\\s+"; " ")' "$OUT/agent-result.json")
            reason=""
            if [ -f "$src" ] && [ ! -L "$src" ]; then cp "$src" "$OUT/all-shots/$i.png"; fi
            if ! [[ "$dest" =~ $IMAGE_PATH_RE ]]; then
              reason="the path is not in docs/**/images/*.png"
            elif [ ! -f "$src" ] || [ -L "$src" ]; then
              reason="no screenshot"
            elif [ "$saved" != true ]; then
              reason="the agent did not confirm the screenshot"
            elif [ "$(file --brief --mime-type "$src")" != image/png ]; then
              reason="the file is not a PNG"
            elif [ "$(stat -c %s "$src")" -gt "$max" ]; then
              reason="the file is larger than 3 MB"
            fi
            if [ -z "$reason" ]; then cp "$src" "$OUT/shots/$i.png"; fi
            results=$(jq -c --argjson i "$i" --arg p "$dest" --arg r "$reason" --arg n "$note" \
              '. + [{index: $i, path: $p, saved: ($r == ""), reason: $r, note: $n}]' <<< "$results")
          done < <(jq -c '.[] | {index, path}' <<< "$IMAGES")

          jq . <<< "$results" > "$OUT/screenshots.json"
          count=$(jq '[.[] | select(.saved)] | length' <<< "$results")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Screenshots that pass the checks: $count of $(jq length <<< "$results")"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docrunner-screenshots-issue-${{ env.ISSUE }}
          path: ${{ runner.temp }}/docrunner/out/
          retention-days: 30
          if-no-files-found: ignore

      - name: Make the write token
        id: token
        if: always() && inputs.dry_run != true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.METABASE_BOT_APP_ID }}
          private-key: ${{ secrets.METABASE_BOT_APP_PRIVATE_KEY }}
          # This job writes only to the PR. For a PR, the label and comment endpoints accept `pull-requests: write`.
          permission-contents: write
          permission-pull-requests: write

      # One commit through the API, on top of the PR branch: GitHub signs it, and no git command runs in the
      # workspace that the agent used.
      - name: Push the screenshots to the PR
        id: push
        if: steps.check.outputs.count > 0 && steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$PR_BRANCH" --jq '.object.sha')
          base_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head" --jq '.tree.sha')
          entries='[]'
          while IFS= read -r item; do
            i=$(jq -r '.index' <<< "$item")
            dest=$(jq -r '.path' <<< "$item")
            jq -n --rawfile content <(base64 -w0 "$OUT/shots/$i.png") '{content: $content, encoding: "base64"}' > "$T/blob.json"
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs" --input "$T/blob.json" --jq '.sha')
            entries=$(jq -c --arg p "$dest" --arg s "$sha" '. + [{path: $p, mode: "100644", type: "blob", sha: $s}]' <<< "$entries")
          done < <(jq -c '.[] | select(.saved)' "$OUT/screenshots.json")

          tree=$(jq -n --arg b "$base_tree" --argjson t "$entries" '{base_tree: $b, tree: $t}' \
            | gh api "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')
          commit=$(jq -n --arg m "docs: add screenshots for #$ISSUE" --arg t "$tree" --arg p "$head" \
              '{message: $m, tree: $t, parents: [$p]}' \
            | gh api "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$PR_BRANCH" -f sha="$commit" -F force=false > /dev/null
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

      # optimize-images.yml starts only when a PR gets a label, and only for a PR with `Type:Documentation`.
      # `|| true`: if a person removed the label, the DELETE gives 404. The next call adds the label again.
      - name: Start the image optimization
        if: steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/Type%3ADocumentation" > /dev/null || true
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=Type:Documentation" > /dev/null

      - name: Report on the PR
        if: always() && steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          f="$T/pr-comment.md"
          {
            if [ -f "$OUT/screenshots.json" ]; then
              echo "Docrunner screenshots. The notes are from the agent, and a person did not review them:"
              echo
              jq -r "$SANITIZE_JQ"' .[] | if .saved
                then "- Added `\(.path)`. \(.note | sanitize)"
                else "- Not added: `\(.path)` (\(.reason)). \(.note | sanitize)" end' "$OUT/screenshots.json"
              echo
              if [ -n "$SHA" ]; then
                echo "Commit: $SHA. Examine each image: the state, the crop, and the size."
              else
                echo "Docrunner pushed no image."
              fi
            else
              echo "The Docrunner screenshots job failed."
            fi
            echo
            echo "Run: $RUN_URL"
          } > "$f"
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$f" > /dev/null

      - name: Fail the job if the screenshot agent failed
        if: always() && steps.claude.outcome == 'failure'
        run: |
          echo "::error::The screenshot agent failed. See the agent step and the artifact."
          exit 1
