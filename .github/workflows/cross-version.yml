name: Cross-Version Migration Tests

on:
  workflow_call:
    inputs:
      digest:
        type: string
        required: false
        default: ""
        description: "HEAD image digest. Ensures we test against the image built for the current commit."

  workflow_dispatch:
    inputs:
      source_version:
        description: "Source version (e.g., v1.58.6 or HEAD)"
        required: true
        type: string
      target_version:
        description: "Target version (e.g., v1.58.7 or HEAD)"
        required: true
        type: string

jobs:
  generate-test-matrix:
    if: inputs.source_version == '' && github.repository == 'metabase/metabase'
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      awaiting-release: ${{ steps.set-matrix.outputs.awaiting-release }}
    steps:
      - name: Require HEAD digest
        if: inputs.digest == ''
        run: |
          echo "::error::inputs.digest is empty and required to test the current commit's Docker image"
          exit 1

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            release
            .github
            cross-version
            resources/migrations

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Generate version matrix
        id: set-matrix
        uses: actions/github-script@v9
        env:
          AWS_S3_STATIC_BUCKET: ${{ vars.AWS_S3_STATIC_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          script: | # js
            const { execFileSync } = require('child_process');
            const { getSupportedMajors } = require('${{ github.workspace }}/release/dist/index.cjs');
            const { buildCrossVersionMatrix, excludeBlockedDowngrades } = require('${{ github.workspace }}/.github/scripts/build-cross-version-matrix');

            // run against all supported versions
            const supportedMajors = await getSupportedMajors();
            console.log("supported majors:", supportedMajors);

            const pending = {};
            for (const major of supportedMajors) {
              try {
                const output = execFileSync('cross-version/pending-changesets.sh', [String(major)], { encoding: 'utf8' });
                const changesets = output
                  .split('\n')
                  .filter(Boolean)
                  .map((line) => line.split(' '))
                  .filter(([, status]) => status !== 'missing');
                if (changesets.length > 0) {
                  pending[major] = changesets;
                }
              } catch (error) {
                core.warning(`Could not check v${major} for unreleased migrations: ${error.message}`);
              }
            }

            const blockedMajors = Object.keys(pending).map(Number);
            const { config } = buildCrossVersionMatrix(supportedMajors);
            const gatedConfig = excludeBlockedDowngrades(config, blockedMajors);

            if (blockedMajors.length > 0) {
              const skipped = config.filter((entry) => !gatedConfig.includes(entry));
              core.warning(`Skipping ${skipped.map((e) => `${e.source} → ${e.target}`).join(', ')}: master has migrations that these releases do not have yet`);
              await core.summary
                .addHeading('Cross-version downgrades skipped until release', 3)
                .addTable([
                  [{ data: 'Major', header: true }, { data: 'Changeset', header: true }, { data: 'Status', header: true }],
                  ...Object.entries(pending).flatMap(([major, changesets]) =>
                    changesets.map(([id, status]) => [`v${major}`, id, status])),
                ])
                .addList(skipped.map((e) => `${e.source} → ${e.target}`))
                .write();
            }

            const awaitingRelease = Object.entries(pending).flatMap(([major, changesets]) =>
              changesets
                .filter(([, status]) => status === 'awaiting-release')
                .map(([id, , file]) => ({ major: Number(major), id, file })));
            core.setOutput("awaiting-release", JSON.stringify(awaitingRelease));

            const matrix = JSON.stringify({ include: gatedConfig });
            core.setOutput("matrix", matrix);
            console.log("matrix:", matrix);

  notify-release-needed:
    needs: generate-test-matrix
    if: needs.generate-test-matrix.outputs.awaiting-release != '[]'
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            release
            .github

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Ask on Slack for a release of majors with unreleased migrations
        uses: actions/github-script@v9
        env:
          CHANGESETS: ${{ needs.generate-test-matrix.outputs.awaiting-release }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_RELEASE_CHANNEL: ${{ vars.SLACK_RELEASE_CHANNEL }}
        with:
          script: | # js
            const { findSlackMessage, sendSlackMessage } = require('${{ github.workspace }}/release/dist/index.cjs');

            const { owner, repo } = context.repo;
            const channelName = process.env.SLACK_RELEASE_CHANNEL;
            const changesets = JSON.parse(process.env.CHANGESETS);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            const commits = new Map();
            for (const { major, id, file } of changesets) {
              const branch = `release-x.${major}.x`;
              const { data } = await github.rest.repos.listCommits({ owner, repo, sha: branch, path: file, per_page: 100 });
              const commit = data.at(-1);
              if (!commit) {
                core.warning(`No commit on ${branch} has ${file}`);
                continue;
              }

              const key = `${major}:${commit.sha}`;
              if (!commits.has(key)) {
                const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: commit.sha });
                commits.set(key, { major, branch, sha: commit.sha, prs: prs.filter((pr) => pr.merged_at && pr.base.ref === branch), ids: [] });
              }
              commits.get(key).ids.push(id);
            }

            for (const { major, branch, sha, prs, ids } of commits.values()) {
              const commitUrl = `https://github.com/${owner}/${repo}/commit/${sha}`;

              const existing = await findSlackMessage({ channelName, text: commitUrl }).catch(console.error);
              if (existing) {
                console.log(`Already asked for a release of ${commitUrl}`);
                continue;
              }

              const prLinks = prs.map((pr) => `<${pr.html_url}|#${pr.number}>`).join(', ') || 'no PR found';
              const message = [
                `:warning: *v${major} needs a release.*`,
                `Commit <${commitUrl}|${sha.slice(0, 10)}> (${prLinks}) added ${ids.map((id) => `\`${id}\``).join(', ')} to \`${branch}\`, but no v${major} release has it yet.`,
                `Cross-version downgrades from master to versions older than v${major} are skipped until a release has it. <${runUrl}|Run>`,
              ].join('\n');

              console.log(message);
              await sendSlackMessage({ channelName, message }).catch(console.error);
            }

  test:
    needs: generate-test-matrix
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJson(needs.generate-test-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare Cypress environment
        uses: ./.github/actions/prepare-cypress

      - name: Download pre-built CLJS
        id: prebuilt-cljs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-cljs-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cljs_dev

      - name: Prepare back-end environment
        if: steps.prebuilt-cljs.outcome != 'success'
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        if: steps.prebuilt-cljs.outcome != 'success'
        run: bun run build-pure:cljs

      - name: Run cross-version test
        env:
          CURRENT_VERSION: ${{ vars.CURRENT_VERSION }}
          HEAD_DIGEST: ${{ inputs.digest }}
          CYPRESS_KEEP_VIDEOS: "true"
        run: |
          cd cross-version
          ./test.sh --source "${{ matrix.source }}" --target "${{ matrix.target }}"

      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-recording-${{ matrix.source }}-${{ matrix.target }}
          path: |
            ./cypress
            ./logs/test.log
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure()
        run: |
          for f in cross-version/logs/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

  # Manual test for workflow_dispatch
  test-manual:
    if: inputs.source_version != ''
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare Cypress environment
        uses: ./.github/actions/prepare-cypress

      - name: Download pre-built CLJS
        id: prebuilt-cljs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-cljs-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cljs_dev

      - name: Prepare back-end environment
        if: steps.prebuilt-cljs.outcome != 'success'
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        if: steps.prebuilt-cljs.outcome != 'success'
        run: bun run build-pure:cljs

      - name: Run cross-version test
        env:
          CURRENT_VERSION: ${{ vars.CURRENT_VERSION }}
          CYPRESS_KEEP_VIDEOS: "true"
        run: |
          cd cross-version
          ./test.sh --source "${{ inputs.source_version }}" --target "${{ inputs.target_version }}"

      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-recording-${{ inputs.source_version }}-${{ inputs.target_version }}
          path: |
            ./cypress
            ./logs/test.log
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure()
        run: |
          for f in cross-version/logs/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
