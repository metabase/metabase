    text: |-
      # Search engine comparison: start here

      **What this is.** We run several search engines inside one Metabase instance. Each searches the same hand-made
      catalogue of 235 Metabase items (cards, dashboards, tables, metrics… for a made-up outdoor retailer) and gets the same
      56 questions. For every question a person decided in advance which items are the right answers, and how right they are.
      We record what each engine returned and how fast, and score it. Every card on this dashboard is computed live from
      those recordings.

      **How to use it.** Read the verdict below, then open the tab for the question you're asked:
      **Latency**: how fast is each engine, and how does that grow with catalogue size? · **Quality**: which engine finds the right answers, and is the gap real? ·
      **By category**: which kinds of question does each engine handle or fail? · **Model vs engine**: does the embedding
      model matter? · **Agreement & zeros**: do engines find the same things, and how often do they come back empty? ·
      **Embedding text**: does embedding more of each item's text help? · **Text strategy**: does rewriting the catalogue's descriptions help? · **Drill-down**: one question, every engine's
      actual results side by side. If a number surprises you, look there first.
      Every tab opens with *How to read this tab* and ends with the terms it uses; the **Glossary** tab has them all.

      **Filters.** *Corpus*: `northwind-golden-v1` is the hand-labelled test set this verdict is about; `northwind-sql-v1` asks
      60 questions about SQL cards; the `scale-*` catalogues are timing-only (see the Glossary for each).
      *Embedder*, *Embedding text* and *Text strategy* pick which runs to show. *Scale* narrows quality cards to one size tier (the golden set has
      no tier and always shows); the Latency tab always shows every size.
