# TEST PLAN SYNTAX
#  - overrides ALWAYS take precedence over workflow level settings
#  - IF workflow condition matches, THEN check job conditions
#  - default: `condition: all` for skip and run blocks
#    for example: a label `skip-all` AND this is a PR == this job is skipped
#  - optionally can specify `condition: any` in which case if any of label,
#    event, branch, or path matches skip/run will execute
#  - if run and skip both match, run ALWAYS takes precedence and the job/workflow will run
#  - force-skip ALWAYS takes precedence over run and skips the job or workflow
#  - a workflow condition can only hold jobs back, never compel one to run, so it
#    must be at least as wide as the widest job under it or it will mask one
#  - `ignore-overrides:` in a run or skip block lists overrides that block sits
#    out. It is not a condition -- it never makes the block match or fail to
#    match -- it says the named override has no effect here, so the job is
#    decided from its own conditions as it would be on an ordinary run. That is
#    how a job says "I cannot run here at all", as opposed to "I have nothing to
#    do": a pull-request-only job on a push would otherwise be force-run by the
#    protected-branch override and fail. Naming an override anywhere makes the
#    run work the diff out even though the override settled everything else,
#    so a `paths:` condition beside it still has an honest answer.
#
# CALLS
#  - a job whose body is `uses:` names the workflow it calls with `calls`
#  - conditions on that job are the `if:` on the call, and gate the whole of
#    the called workflow: nothing in it runs when the call does not happen
#  - a called workflow may still carry a top-level block of its own, for a
#    condition its jobs share; put a condition on the caller when it is the
#    caller that knows whether entering the workflow is worth it at all
#  - a called workflow whose jobs report a required check must be entered on
#    every run, or the check never reports and the PR sits pending. Leave the
#    calling job unconditional there and let the plan skip the jobs inside it.
#
# NOT LISTED HERE
#  - the job that builds the plan, and the `*-result` jobs that check it
#    afterwards. Neither can be governed by the plan -- one runs before there
#    is a plan to consult, the other has to run whatever the plan said.
#  - `sync` still lists drivers-tests-result, loki-tests-result,
#    e2e-tests-result and embedding-sdk-tests-result, because those four have
#    no `verify` step yet and so do not look like plan machinery. Each is a
#    case the plan cannot check on its own: `mage driver-decisions`, the loki
#    story selection and the e2e matrix all narrow further than the plan can
#    see, and the SDK result job deliberately leaves the not-required host-app
#    job out of its `needs`. Leave them unlisted until verify can allow for it.

overrides:
  # The global verdict from run-tests.yml's `should-run` job, in the same
  # order, since the order is the rule: force-run is checked before force-skip.
  - id: protected-branch
    reason: master and release branches test everything
    run:
      condition: any
      branch:
        - master
        - release-x.*

  - id: force-run-label
    reason: the ci:run-all label asks for everything
    run:
      labels:
        - ci:run-all

  - id: skip-label
    reason: the ci:skip label holds the whole run back
    skip:
      labels:
        - ci:skip

workflows:
  run-tests:
    jobs:
      upload-affected-tests-stats:
        run:
          # don't run if this isn't a PR
          ignore-overrides:
            - protected-branch
          event:
            - pull_request
      uberjar:
        calls: uberjar
      containerize:
        calls: containerize-jar
      e2e-cljs:
        run:
          paths:
            - e2e_all
      backend-tests:
        calls: backend
      semantic-search-tests:
        calls: semantic-search
      app-db-tests:
        calls: app-db
      driver-tests:
        calls: drivers
      frontend-tests:
        calls: frontend
      loki-tests:
        calls: loki
      e2e-tests:
        calls: e2e-tests
      sdk-tests:
        calls: embedding-sdk
      build-scripts-tests:
        calls: build-scripts
      bundle-size:
        calls: bundle-size

  uberjar:
    jobs:
      setup:
      build:

  containerize-jar:
    jobs:
      containerize:
      verify-docker-pull-amd64:
        force-skip:
          event:
            - pull_request
            - workflow_dispatch
      verify-docker-pull-arm:
        force-skip:
          event:
            - pull_request
            - workflow_dispatch

  backend:
    run:
      condition: any
      paths:
        - backend_all
        - project_backend_checks
        - project_migration_checks
        - project_ratchet_checks
    jobs:
      project-checks:
        run:
          condition: any
          paths:
            - project_backend_checks
            - project_migration_checks
            - project_ratchet_checks
      project-tests:
        run:
          condition: any
          paths:
            - project_backend_checks
            - project_migration_checks
            - project_ratchet_checks
      be-linter-clj-kondo:
        run:
          paths:
            - backend_all
      be-linter-eastwood:
        run:
          paths:
            - backend_all
      be-linter-eastwood-test:
        run:
          condition: any
          branch:
            - master
            - release-x.*
          labels:
            - ci:run-all
      be-linter-eastwood-test-changed:
        run:
          # it diffs against the pull request's base, so a push has nothing
          # for it to lint
          ignore-overrides:
            - protected-branch
          paths:
            - backend_all
          event:
            - pull_request
      be-tests:
        run:
          paths:
            - backend_all
      be-check:
        run:
          paths:
            - backend_all
      be-cljfmt:
        run:
          paths:
            - backend_all

  semantic-search:
    run:
      paths:
        - backend_all
    jobs:
      semantic-search-tests-h2:
        run:
          labels:
            - ci:run-semantic-search-tests
      semantic-search-tests-mariadb:
        run:
          labels:
            - ci:run-semantic-search-tests
      semantic-search-tests-mysql:
        run:
          labels:
            - ci:run-semantic-search-tests
      semantic-search-tests-postgres:
      semantic-search-tests-appdb-mode:
        run:
          labels:
            - ci:run-semantic-search-tests

  app-db:
    run:
      paths:
        - backend_all
    jobs:
      app-db-matrix:
      be-tests-mariadb:
      be-tests-mysql:
      be-tests-postgres:

  drivers:
    run:
      paths:
        - backend_all
    jobs:
      determine-driver-skips:
      be-tests-athena-ee:
      be-tests-bigquery-cloud-sdk-ee:
      be-tests-bigquery-transforms-python-ee:
      be-tests-clickhouse-ee:
      be-tests-druid-jdbc-ee:
      be-tests-databricks-ee:
      be-tests-h2:
      be-tests-h2-oss:
      be-tests-mysql-mariadb:
      be-tests-mongo:
      be-tests-mongo-ssl:
      be-tests-mongo-sharded-cluster-ee:
      be-tests-oracle:
      be-tests-postgres:
      be-tests-presto-jdbc-ee:
      be-tests-redshift-ee:
      be-tests-snowflake-ee:
      be-tests-sparksql-ee:
      be-tests-sqlite-ee:
      be-tests-sqlserver:
      login-to-ecr:
      be-tests-vertica-ee:
      drivers-tests-result:

  frontend:
    run:
      condition: any
      paths:
        - frontend_all
        - e2e_all
        - ci_scripts
        - custom_viz_all
    jobs:
      fe-lint:
        # The lint covers the e2e specs as well as the app.
        run:
          condition: any
          paths:
            - frontend_all
            - e2e_all
      fe-type-check:
        run:
          paths:
            - frontend_all
      fe-tests-unit:
        run:
          paths:
            - frontend_all
      fe-tests-timezones:
        run:
          paths:
            - frontend_all
      fe-tests-ci-scripts:
        run:
          paths:
            - ci_scripts
      fe-custom-viz:
        run:
          paths:
            - custom_viz_all

  loki:
    run:
      paths:
        - frontend_loki_all
    jobs:
      story-selection:
      visual-test:
      loki-tests-result:

  e2e-tests:
    run:
      paths:
        - e2e_all
    jobs:
      changed-specs:
        run:
          # It narrows the run to the specs a pull request's diff touched, so
          # it needs a diff to read, and has nothing to say when the run is
          # meant to cover everything anyway.
          ignore-overrides:
            - protected-branch
            - force-run-label
          event:
            - pull_request
        force-skip:
          labels:
            - ci:run-all
      e2e-matrix-builder:
        calls: e2e-matrix-builder
      reset-e2e-test-comment:
        run:
          # no pull request on a push, so no comment to take off
          ignore-overrides:
            - protected-branch
          event:
            - pull_request
      e2e-tests:
        calls: e2e-test
      collect-timings:
        run:
          branch:
            - master
      e2e-tests-result:

  e2e-matrix-builder:
    jobs:
      build-matrix:

  e2e-test:
    jobs:
      e2e-tests:

  embedding-sdk:
    run:
      condition: any
      paths:
        - embedding_sdk_components
        - frontend_sources
        - embedding_documentation
        - embedding_sdk_ci
        - embedding_sdk_host_sample_apps
    jobs:
      build-sdk-package:
        run:
          condition: any
          paths:
            - embedding_sdk_components
            - frontend_sources
            - embedding_documentation
            - embedding_sdk_ci
            - embedding_sdk_host_sample_apps
      embedding-sdk-cli-snippets-type-check:
        run:
          paths:
            - frontend_sources
      embedding-sdk-docs-snippets-type-check:
        run:
          paths:
            - embedding_documentation
      embedding-sdk-api-documentation-generation-validation:
        run:
          paths:
            - frontend_sources
      embedding-sdk-component-tests:
        calls: embedding-sdk-component-tests
        run:
          paths:
            - embedding_sdk_components
      not-required-embedding-sdk-apps-compatibility-tests:
        calls: embedding-sdk-host-sample-apps-tests
        run:
          paths:
            - embedding_sdk_host_sample_apps
      embedding-sdk-tests-result:

  embedding-sdk-component-tests:
    jobs:
      sdk-component-tests:
      decide-target-ref:
      sdk-component-tests-backward-compatibility:

  embedding-sdk-host-sample-apps-tests:
    jobs:
      get-sample-apps-data:
      e2e-sample-apps-tests:
      e2e-shoppy-tests:
        # The shoppy suites only run against master.
        run:
          branch:
            - master
      e2e-shoppy-synthetic-tests:
        run:
          branch:
            - master
      e2e-host-apps-tests:

  build-scripts:
    jobs:
      test-embedder-plugin:
        run:
          paths:
            - embedder_plugin
      test-build-scripts:
        run:
          paths:
            - build_scripts

  bundle-size:
    jobs:
      bundle-size-check:
