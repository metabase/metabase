    text: |-
      ## The verdict

      *Numbers quoted here are from runs 20260923-154430-7f2163 (all-minilm), 20260923-155004-12e37a (arctic),
      20260923-154059-044bd9 (semantic-pure), 20260923-180253-b809c0 (semantic-vector), 20260923-202630-5b5dc1 (sqlite-vec1),
      20260923-191515-da3f42 (lucene), 20260923-154552-0f1b87 (context text), 20260923-155756-94d8c0 (1k items),
      20260923-175722-e82939 (10k items, clean re-time), 20260923-174357-3004e3 and 20260923-203908-4e3f15 (10k, sqlite-vec1 and lucene). The cards are live: if*
      Runs in view *(bottom of this tab) lists newer runs, trust the cards over this text.*

      1. **semantic is the best engine we have on these questions.** Question by question it beats appdb by a wide margin
         (+0.29 on the 0–1 ranking score) and in-place by a smaller one (+0.11). Both gaps hold across the 95% range, but
         in-place still wins 14 of the 52 questions, so "better on balance", not "better everywhere". See the card below.
      2. **appdb fails silently when the words don't match.** It returns nothing for about half the questions that have
         a right answer: paraphrases, typos, other languages (*Agreement & zeros*).
      3. **semantic's lead comes almost entirely from its embeddings.** Switching the appdb top-up off (semantic-pure)
         makes no measurable difference here, and switching its keyword part off as well (semantic-vector) changes ranking
         quality by only −0.03 ± 0.02 (3 better, 42 same, 7 worse; run 20260923-180253-b809c0).
      4. **Of the things we can change inside semantic, the embedding model matters most, but only for questions in
         another language.** snowflake-arctic-embed2 lifts those from 0.17 to 0.68, a proven gain. Typos look better too
         (0.59 → 0.78), but 5 questions can't prove it. Everywhere else the two models are indistinguishable, so overall the
         gain isn't proven. arctic also returns something on no-answer questions more often (*Model vs engine*). It looked
         slower too, but it ran on a separate instance, so that isn't proven.
      5. **Embedding more context (collection, table, chart type) didn't help** (*Embedding text*).
      6. **At our size speed barely matters; at 10,000 items it does, and semantic (pgvector) is the slowest at the median.** On the golden set
         (235 items) appdb is about 2.5× faster than semantic and in-place in the same run, but every engine answers a
         typical search in under 40 ms. At 1,000 items typical searches stay under 50 ms, though semantic's slow ones (p95)
         reach 160 ms. At 10,000 items a typical semantic search takes about 290 ms and the slow ones 870 ms, against
         appdb's 67 / 161 ms and in-place's 163 / 382 ms (*Latency*; a clean run with nothing else on the machine). From 1k
         to 10k items semantic's typical search got about 6× slower; each size ran on its own instance, but a 6× jump is far
         beyond what the machine alone explains. semantic's time includes its appdb top-up, so part of it may be appdb's.
         The other stores at 10k (typical / slow, exclusive runs): lucene 238 / 953 ms (run 20260923-203908-4e3f15) and
         sqlite-vec1 222 / 1,084 ms (run 20260923-174357-3004e3), against pgvector's 292 / 866 ms. lucene uses an approximate
         (HNSW) index; the other two are exact. Store against store, vector-only, sqlite-vec1 is about 27% faster at the median
         on verified identical candidate sets (overlap 1.000 at limit 1000); the slow tails are within noise. Index size at 10k:
         lucene 50 MB, pgvector 117 MB, sqlite-vec1 156 MB.
      7. **The three stores tie on quality; pgvector's small edge is its keyword part.** On the golden set (all-minilm,
         nDCG@10): semantic on pgvector 0.601, sqlite-vec1 0.581, lucene 0.579 (lucene-pure identical, run
         20260923-200842-0f90cf). Vector-only, the stores are indistinguishable: semantic-vector vs sqlite-vec1-pure
         −0.002 ± 0.032, vs lucene −0.004 ± 0.030. pgvector's +0.025 ± 0.023 over its own vector-only mode is its Postgres
         keyword part; lucene's keyword part ran on H2 here, so it is probably understated.
      8. **The biggest lever isn't the engine: describe undocumented cards.** Writing a one-sentence description into cards
         that have none took semantic search on held-out questions from 0.40 to 0.93–0.97 nDCG@10 (+0.43 to +0.54), with
