dataset_query:
  database: Search Harness
  stages:
  - native: |-
      WITH m AS (
        SELECT engine, embedder, data_scale, embedding_text, text_strategy, scenario_id, tags, value
        FROM harness_scenario_metric
        WHERE corpus_id = {{corpus}} AND metric = 'ndcg@10' AND engine NOT IN ('appdb', 'in-place')
          AND embedding_text = {{variant}}
          AND text_strategy = {{strategy}}
          [[AND (data_scale = {{scale}} OR data_scale IS NULL)]]
      ), d AS (
        SELECT o.engine, o.embedder, o.data_scale, o.tags, b.value AS before, o.value AS after, o.value - b.value AS delta
        FROM m o
        JOIN m b ON b.engine = o.engine AND b.scenario_id = o.scenario_id AND b.embedding_text = o.embedding_text
                AND b.text_strategy = o.text_strategy AND b.data_scale IS NOT DISTINCT FROM o.data_scale AND b.embedder = 'ollama/all-minilm'
        WHERE o.embedder <> 'ollama/all-minilm'
      ), t AS (
        SELECT d.*, 'all questions' AS category, 0 AS ord FROM d
        UNION ALL
        SELECT d.*, u.c, array_position(ARRAY['paraphrase', 'concept', 'exact-name', 'rare-token', 'typo', 'cross-lingual', 'ambiguous', 'empty-expected'], u.c) FROM d CROSS JOIN unnest(d.tags) AS u(c)
        WHERE u.c IN ('paraphrase', 'concept', 'exact-name', 'rare-token', 'typo', 'cross-lingual', 'ambiguous', 'empty-expected')
      ), s AS (
        SELECT engine, embedder, data_scale, category, ord, count(*) AS n,
               avg(before) AS before, avg(after) AS after, avg(delta) AS mean,
               1.96 * stddev_samp(delta) / sqrt(count(*)) AS ci,
               count(*) FILTER (WHERE delta > 1e-9) AS wins,
               count(*) FILTER (WHERE abs(delta) <= 1e-9) AS ties,
               count(*) FILTER (WHERE delta < -1e-9) AS losses
        FROM t
        GROUP BY 1, 2, 3, 4, 5
      )
      SELECT category AS "Question type",
             CASE WHEN n < 5 THEN 'too few questions'
                  WHEN mean - ci > 0 THEN 'other model better'
                  WHEN mean + ci < 0 THEN 'all-minilm better'
                  ELSE 'no proven difference' END AS "Verdict",
             round(before::numeric, 2) AS "nDCG@10 with all-minilm", round(after::numeric, 2) AS "nDCG@10 with the other model",
             round(mean::numeric, 3) AS "Avg. difference", round(ci::numeric, 3) AS "± 95% CI",
             wins AS "Other model better", ties AS "Tie", losses AS "Other model worse", n AS "n questions",
             engine AS "Engine", split_part(embedder, '/', 2) || ' vs all-minilm' AS "Comparison", data_scale AS "Scale"
      FROM s
      ORDER BY data_scale, array_position(ARRAY['semantic', 'semantic-pure', 'semantic-vector', 'sqlite-vec1', 'sqlite-vec1-pure', 'lucene', 'lucene-pure', 'appdb', 'in-place'], engine), embedder, ord
