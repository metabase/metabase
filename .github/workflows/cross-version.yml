name: Cross-Version Migration Tests

on:
  workflow_call:
    inputs:
      digest:
        type: string
        required: false
        default: ""
        description: "HEAD image digest. Ensures we test against the image built for the current commit."

  workflow_dispatch:
    inputs:
      source_version:
        description: "Source version (e.g., v1.58.6 or HEAD)"
        required: true
        type: string
      target_version:
        description: "Target version (e.g., v1.58.7 or HEAD)"
        required: true
        type: string
      grace_period:
        description: "Time (in days) before a migration targeting a release version is expected to exist in that release branch."
        required: false
        type: string
        default: 3

jobs:
  generate-test-matrix:
    if: inputs.source_version == '' && github.repository == 'metabase/metabase'
    runs-on: ${{ vars.SLIM_RUNNER_KEY }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      oldest-target: ${{ steps.set-matrix.outputs.oldest-target }}
    steps:
      - name: Require HEAD digest
        if: inputs.digest == ''
        run: |
          echo "::error::inputs.digest is empty and required to test the current commit's Docker image"
          exit 1

      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            release
            .github

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Generate version matrix
        id: set-matrix
        uses: actions/github-script@v9
        env:
          AWS_S3_STATIC_BUCKET: ${{ vars.AWS_S3_STATIC_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        with:
          script: | # js
            const { getSupportedMajors } = require('${{ github.workspace }}/release/dist/index.cjs');
            const { buildCrossVersionMatrix } = require('${{ github.workspace }}/.github/scripts/build-cross-version-matrix');

            // run against all supported versions
            const supportedMajors = await getSupportedMajors();
            console.log("supported majors:", supportedMajors);

            const { config } = buildCrossVersionMatrix(supportedMajors);
            const matrix = JSON.stringify({ include: config });
            core.setOutput("matrix", matrix);
            core.setOutput("oldest-target", `v1.${Math.min(...supportedMajors)}.x`);
            console.log("matrix:", matrix);

  test:
    name: cross-verison test ${{ matrix.source }} → ${{ matrix.target }} 
    needs: generate-test-matrix
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJson(needs.generate-test-matrix.outputs.matrix) }}
      fail-fast: false
    env:
      QUARANTINE_FAILURES_FILE: ${{ github.workspace }}/target/quarantine-failures.jsonl
      CROSS_VERSION_JUNIT_FILE: ${{ github.workspace }}/target/cross-version-junit/cross-version.xml
      CI_CONDUCTOR_BASE_URL: ${{ vars.CI_CONDUCTOR_BASE_URL }}
      CI_CONDUCTOR_WEBHOOK_SECRET: ${{ secrets.CI_CONDUCTOR_WEBHOOK_SECRET }}
      CI_CONDUCTOR_TEST_SUITE: cross-version-${{ matrix.source }}-${{ matrix.target }}
      REPO_ID: ${{ github.event.repository.id }}
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
      # Number of days we don't fail a cross version test that is missing a migration that was recently merged to master
      # but targets a different version. For example: a migration for v63 is added to master but master is on v66. Cross
      # version tests will fail until that is backported and released on v63 but we should give people time to do that.
      GRACE_PERIOD: 3

    steps:
      - uses: actions/checkout@v7

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare Cypress environment
        uses: ./.github/actions/prepare-cypress

      - name: Download pre-built CLJS
        id: prebuilt-cljs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-cljs-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cljs_dev

      - name: Prepare back-end environment
        if: steps.prebuilt-cljs.outcome != 'success'
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        if: steps.prebuilt-cljs.outcome != 'success'
        run: bun run build-pure:cljs

      - uses: ./.github/actions/resolve-job-id

      - name: Run cross-version test
        id: run-test
        env:
          CURRENT_VERSION: ${{ vars.CURRENT_VERSION }}
          HEAD_DIGEST: ${{ inputs.digest }}
          CYPRESS_KEEP_VIDEOS: "true"
        run: |
          cd cross-version
          ./test.sh --source "${{ matrix.source }}" --target "${{ matrix.target }}"
        continue-on-error: true

      - name: Report results to ci-conductor
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        uses: ./.github/actions/report-failures-to-ci-conductor
        env:
          JEST_JUNIT_OUTPUT_DIR: ${{ github.workspace }}/target/cross-version-junit
          JEST_JUNIT_OUTPUT_NAME: cross-version.xml
        with:
          adapter: frontend
          test-suite: ${{ env.CI_CONDUCTOR_TEST_SUITE }}

      - name: Quarantine gate
        if: ${{ !cancelled() && steps.run-test.outcome == 'failure' }}
        timeout-minutes: 3
        uses: ./.github/actions/quarantine-gate
        with:
          adapter: e2e
          test-suite: ${{ env.CI_CONDUCTOR_TEST_SUITE }}
          enforce-quarantine: "true"

      - name: Notify Slack about migrations that need a backport or a release
        continue-on-error: true
        if: >-
          github.ref_name == 'master' &&
          steps.run-test.outputs.skipped == 'true' &&
          steps.run-test.outputs.unreleased_migrations != '' &&
          matrix.target == needs.generate-test-matrix.outputs.oldest-target
        uses: actions/github-script@v9
        env:
          UNRELEASED_MIGRATIONS: ${{ steps.run-test.outputs.unreleased_migrations }}
          NOTIFY_AFTER_HOURS: 24
          REPEAT_AFTER_HOURS: 24
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: 'engineering-ci'
        with:
          script: | # js
            const { getRecentSlackMessages, sendSlackMessage } = require('${{ github.workspace }}/release/dist/index.cjs');
            const { notifyOverdueChangesets } = require('${{ github.workspace }}/.github/scripts/notify-unreleased-migrations');

            await notifyOverdueChangesets({
              context,
              migrations: JSON.parse(process.env.UNRELEASED_MIGRATIONS),
              notifyAfterHours: Number(process.env.NOTIFY_AFTER_HOURS),
              repeatAfterHours: Number(process.env.REPEAT_AFTER_HOURS),
              gracePeriodDays: Number(process.env.GRACE_PERIOD),
              channelName: process.env.SLACK_CHANNEL,
              getRecentSlackMessages,
              sendSlackMessage,
            });

      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-recording-${{ matrix.source }}-${{ matrix.target }}
          path: |
            ./cypress
            ./logs/test.log
          if-no-files-found: ignore

      - name: Show logs on failure
        if: ${{ !cancelled() && steps.run-test.outcome == 'failure' }}
        run: |
          for f in cross-version/logs/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

  # Manual test for workflow_dispatch
  test-manual:
    if: inputs.source_version != ''
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 30
    env:
      GRACE_PERIOD: ${{ inputs.grace_period }}

    steps:
      - uses: actions/checkout@v7

      - name: Prepare release scripts
        uses: ./.github/actions/prepare-release-scripts

      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend

      - name: Prepare Cypress environment
        uses: ./.github/actions/prepare-cypress

      - name: Download pre-built CLJS
        id: prebuilt-cljs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: e2e-cljs-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/cljs_dev

      - name: Prepare back-end environment
        if: steps.prebuilt-cljs.outcome != 'success'
        uses: ./.github/actions/prepare-backend

      - name: Compile CLJS
        if: steps.prebuilt-cljs.outcome != 'success'
        run: bun run build-pure:cljs

      - name: Run cross-version test
        env:
          CURRENT_VERSION: ${{ vars.CURRENT_VERSION }}
          CYPRESS_KEEP_VIDEOS: "true"
        run: |
          cd cross-version
          ./test.sh --source "${{ inputs.source_version }}" --target "${{ inputs.target_version }}"

      - name: Upload Cypress Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-recording-${{ inputs.source_version }}-${{ inputs.target_version }}
          path: |
            ./cypress
            ./logs/test.log
          if-no-files-found: ignore

      - name: Show logs on failure
        if: failure()
        run: |
          for f in cross-version/logs/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
