## The dependency jobs find changed entities by comparing the version of an entity, a counter that every update of it
## moves, plus the counters of the rows it is made of, with the version its status row last recorded, instead of
## reading stale flags that every write had to set. The status rows lose the flag and the retry state.
## result_metadata_status and analysis_finding_status record the version each entity was last processed from, as
## dependency_status does, and analysis_finding keeps only the findings.

databaseChangeLog:
  - changeSet:
      id: v65.k4w2ns
      author: ranquild
      comment: Delete the dependency_status rows marked stale, since an entity without a row is processed again
      changes:
        - delete:
            tableName: dependency_status
            where: stale = TRUE
      rollback: # the deleted rows are recreated when the job processes their entities

  - changeSet:
      id: v65.nuaq4b
      author: ranquild
      comment: Drop the index on dependency_status.stale, which the jobs no longer read
      changes:
        - dropIndex:
            tableName: dependency_status
            indexName: idx_dependency_status_stale
      rollback:
        - sql:
            dbms: postgresql
            sql: CREATE INDEX idx_dependency_status_stale ON dependency_status(stale) WHERE stale = true
        - sql:
            dbms: mysql,mariadb,h2
            sql: CREATE INDEX idx_dependency_status_stale ON dependency_status(stale)

  - changeSet:
      id: v65.dngxhg
      author: ranquild
      comment: Drop dependency_status.stale, which change detection from versions replaces
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: stale
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: stale
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity needs dependency recalculation
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.brqkb7
      author: ranquild
      comment: Drop dependency_status.fail_count, which the jobs no longer use since they don't retry
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: fail_count
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: fail_count
                  type: int
                  defaultValueNumeric: 0
                  remarks: Number of consecutive failed dependency calculation attempts
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.drkztr
      author: ranquild
      comment: Drop dependency_status.next_retry_at, which the jobs no longer use since they don't retry
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: next_retry_at
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: next_retry_at
                  type: ${timestamp_type}
                  remarks: Earliest time at which a failed entity can be retried (null means immediately processable)

  - changeSet:
      id: v65.mhlfsd
      author: ranquild
      comment: Drop dependency_status.terminal, which the jobs no longer use since they don't retry
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: terminal
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: terminal
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity has exceeded max retries and should not be retried until modified
                  constraints:
                    nullable: false

  - changeSet:
      id: v65.u3r8zm
      author: ranquild
      comment: Drop dependency_status.unresolved_tables, since a table a native query names is recorded once the query changes again
      changes:
        - dropColumn:
            tableName: dependency_status
            columnName: unresolved_tables
      rollback:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: unresolved_tables
                  type: ${boolean.type}
                  defaultValueBoolean: false
                  remarks: True when the entity names tables that match no synced table, recomputed after each sync
                  constraints:
                    nullable: false
  - changeSet:
      id: v65.hvb1yr
      author: ranquild
      comment: Add dependency_status.entity_version
      changes:
        - addColumn:
            tableName: dependency_status
            columns:
              - column:
                  name: entity_version
                  type: bigint
                  remarks: The version of the entity, its own and its parts' counters summed, its dependencies were computed from, or null to compute them again
      rollback:
        - dropColumn:
            tableName: dependency_status
            columnName: entity_version

  - changeSet:
      id: v65.nfvzyv
      author: ranquild
      comment: Record version 1, the version of every entity not made of other rows after the upgrade, as the version the remaining dependency_status rows were computed from
      changes:
        - update:
            tableName: dependency_status
            columns:
              - column:
                  name: entity_version
                  valueNumeric: 1
            where: entity_type NOT IN ('dashboard', 'action', 'table')
      rollback: # the column is dropped by the rollback of the changeset adding it

