semantic_models:
  # ---- dimension table -------------------------------------------------
  - name: customers
    model: ref('dim_customers')
    entities:
      - name: customer          # the shared key both fact tables point to
        type: primary
        expr: customer_id
    dimensions:
      - name: customer_name
        type: categorical
      - name: segment
        type: categorical

  # ---- fact table 1: invoices (grain: one invoice) ---------------------
  - name: invoices
    model: ref('fct_invoices')
    defaults:
      agg_time_dimension: invoice_date   # becomes metric_time for its measures
    entities:
      - name: invoice
        type: primary
        expr: invoice_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: invoice_date
        type: time
        type_params: {time_granularity: day}
      - name: status
        type: categorical
    measures:
      - name: invoice_amount
        agg: sum
        expr: amount

  # ---- fact table 2: time entries (grain: one timesheet line) ----------
  - name: time_entries
    model: ref('fct_time_entries')
    defaults:
      agg_time_dimension: entry_date     # also becomes metric_time
    entities:
      - name: time_entry
        type: primary
        expr: entry_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: entry_date
        type: time
        type_params: {time_granularity: day}
      - name: is_billable
        type: categorical
    measures:
      - name: hours
        agg: sum
